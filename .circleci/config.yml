# Javascript Node CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
#
version: 2
jobs:
  build:
    docker:
      # specify the version you desire here
      - image: circleci/node:8.12
      
      # Specify service dependencies here if necessary
      # CircleCI maintains a library of pre-built images
      # documented at https://circleci.com/docs/2.0/circleci-images/
      # - image: circleci/mongo:3.4.4

    working_directory: ~/repo

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "package.json" }}
          # fallback to using the latest cache if no exact match is found
          - v1-dependencies-

      - run: yarn install

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}
        
      # run tests!
      - run: yarn test

  # deploy to /api/build
  deploy:
    docker:
        # specify the version you desire here
      - image: circleci/node:8.12

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - build-dependencies-{{ checksum "package.json" }}
          # fallback to using the latest cache if no exact match is found
          - build-dependencies-

      - run: yarn install

      - save_cache:
          paths:
            - node_modules
          key: build-dependencies-{{ checksum "package.json" }}

      - run:
          name: Build version based on branch
          command: |
            if [ $CIRCLE_BRANCH = 'beta' ]; then yarn build:beta; | 
            elif [ $CIRCLE_BRANCH = 'master' ]; then yarn build:prod; |
            elif [ $CIRCLE_BRANCH = 'alpha' ]; then yarn build; fi

      - run:
           name: Add Mashpia.com to known_hosts
           command: ssh-keyscan -H mashpia.com >> ~/.ssh/known_hosts

      - run:
          name: Send build/* Over SSH to dev/build
          command: |
            scp -r build/* mashpia@mashpia.com:dev/build

      - run:
          name: Run correct deploy script on server
          command: |
            if [ $CIRCLE_BRANCH = 'beta' ]; then ssh mashpia@mashpia.com "./dev/deploy-beta.sh"; | 
            elif [ $CIRCLE_BRANCH = 'master' ]; then ssh mashpia@mashpia.com "./dev/deploy-master.sh"; |
            elif [ $CIRCLE_BRANCH = 'alpha' ]; then ssh mashpia@mashpia.com "./dev/deploy-alpha.sh"; fi
            

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: (alpha|beta|master)