# Javascript Node CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
#
version: 2
jobs:
  build:
    docker:
      # specify the version you desire here
      - image: circleci/node:8.12
      
      # Specify service dependencies here if necessary
      # CircleCI maintains a library of pre-built images
      # documented at https://circleci.com/docs/2.0/circleci-images/
      # - image: circleci/mongo:3.4.4

    working_directory: ~/repo

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "package.json" }}
          # fallback to using the latest cache if no exact match is found
          - v1-dependencies-

      - run: yarn install

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package.json" }}
        
      # run tests!
      - run: yarn test

  # deploy to /api/build
  deploy_development:
    docker:
        # specify the version you desire here
      - image: circleci/node:8.12

    steps:
      - checkout

      - run: ls -al

      # Download and cache dependencies
      - restore_cache:
          keys:
          - build-dependencies-{{ checksum "package.json" }}
          # fallback to using the latest cache if no exact match is found
          - build-dependencies-

      - run: yarn install

      - save_cache:
          paths:
            - node_modules
          key: build-dependencies-{{ checksum "package.json" }}

      - run: yarn build

      - run:
           name: Add Mashpia.com to known_hosts
           command: ssh-keyscan -H mashpia.com >> ~/.ssh/known_hosts

      - run:
          name: Send build/* Over SSH to dev/build
          command: |
            scp -r build/* mashpia@mashpia.com:dev/build

      - run:
          name: Run deploy script on server
          command: |
            ssh mashpia@mashpia.com "./dev/deploy-build.sh"

workflows:
  version: 2
  build-development:
    jobs:
      - build
      - deploy_development:
          requires:
            - build
          filters:
            branches:
              only: development