<!DOCTYPE html>
<html>
<head>
    <title>60M Report</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"/>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
      crossorigin="anonymous"></script>
    <style>
      body {
        margin: 20px;
      }
      th, td {
        vertical-align: middle !important;
        text-align: center !important;
      }
      .loading {
        font-size: larger;
      }
      .error {
        color: red;
        font-size: large;
      }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
<script type="text/babel">
    const { useState, useEffect, useMemo } = React
    const { createRoot } = ReactDOM

    const Report = () => {
        const [data, setData] = useState([])
        const [schools, setSchools] = useState([])
        const [loading, setLoading] = useState(false)
        const [error, setError] = useState(null)

        const raffles = {
            444: '#1',
            445: '#2',
            446: '#3',
        }

        // Compute totals using useMemo to prevent unnecessary recalculations
        const schoolTotals = useMemo(() => {
            const computedTotals = {}
            Object.entries(data).forEach(([school, grades]) => {
                Object.entries(grades).forEach(([grade, subs]) => {
                    Object.entries(subs).forEach(([sub, more]) => {
                        Object.entries(more).forEach(([last, users]) => {
                            Object.entries(users).forEach(([first, other]) => {
                                Object.entries(other).forEach(([user_id, user]) => {
                                    if (!computedTotals[school]) computedTotals[school] = 0
                                    computedTotals[school]++
                                })
                            })
                        })
                    })
                })
            })
            return computedTotals
        }, [data, schools])

        useEffect(() => {
            async function fetchData() {
                try {
                    // changed to return all raffles in one fetch call
                    const result = await fetch('get60m.php', {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    })
                    const data = await result.json()
                    setData(data.info)
                    setSchools(data.schools)
                    setLoading(false)
                } catch (error) {
                    setError(error)
                    setLoading(false)
                }
            }
            fetchData();
        }, [])

        if (loading) {
            return <div className="loading">Loading...</div>
        }

        if (error) {
            return <div className="error">Error: {error.message}</div>
        }

        return (
            <div>
                <h1>60M Report</h1>
                <h2>Schools</h2>
                <table className="table table-striped" style={{ width: '50%' }}>
                    <thead>
                        <tr>
                            <th>School</th>
                            <th>Count</th>
                        </tr>
                    </thead>
                    <tbody>
                        {Object.entries(schoolTotals).map(([school, count]) => (
                            <tr key={school}>
                                <td>{school}</td>
                                <td>{count}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
                <h2>Users</h2>
                <table className="table table-striped">
                    <thead>
                        <tr>
                            <th>Eligible Raffles</th>
                            <th>School</th>
                            <th>Grade</th>
                            <th>Serial</th>
                            <th>First</th>
                            <th>Last</th>
                        </tr>
                    </thead>
                    <tbody>
                        {Object.entries(data).map(([school, grades]) => (
                            Object.entries(grades).map(([grade, subs]) => (
                                Object.entries(subs).map(([sub, more]) => (
                                    Object.entries(more).map(([last, users]) => (
                                        Object.entries(users).map(([first, other]) => (
                                            Object.entries(other).map(([user_id, user]) => (
                                                <tr key={user_id}>
                                                    <td>{user.raffles.map(r => raffles[r]).join(', ')}</td>
                                                    <td>{schools[user.school_id]}</td>
                                                    <td>{grade + (sub ? '-' + sub : '')}</td>
                                                    <td>{user.user_serial}</td>
                                                    <td>{first}</td>
                                                    <td>{last}</td>
                                                </tr>
                                            ))
                                        ))
                                    ))
                                ))
                            ))
                        ))}
                    </tbody>
                </table>
            </div>
        )
    }

    // Render the app
    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<Report />);
</script>
</html>
