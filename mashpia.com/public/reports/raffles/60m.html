<!DOCTYPE html>
<html>
<head>
    <title>60M Report</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"/>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
      crossorigin="anonymous"></script>
    <style>
      body {
        margin: 20px;
      }
      th, td {
        vertical-align: middle !important;
        text-align: center !important;
      }
      .loading {
        font-size: larger;
      }
      .error {
        color: red;
        font-size: large;
      }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
<script type="text/babel">
    const { useState, useEffect } = React
    const { createRoot } = ReactDOM

    const Report = () => {
        const [data, setData] = useState([])
        const [loading, setLoading] = useState(false)
        const [error, setError] = useState(null)

        useEffect(() => {
            setLoading(true)
            // get a few raffles asynchronously
            const raffles = [444, 445, 446]
            const promises = raffles.map(raffle_id => fetch(`get60m.php?raffle_id=${raffle_id}`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                },
            }))
            Promise.all(promises)
                .then(responses => responses.map(response => response.json()))
                .then(results => {
                    setData(results)
                    setLoading(false)
                })
                .catch(error => {
                    setError(error)
                    setLoading(false)
                })
        }, [])

        if (loading) {
            return <div className="loading">Loading...</div>
        }

        if (error) {
            return <div className="error">Error: {error.message}</div>
        }

        return (
            <div>
                <h1>60M Report</h1>
                {/* show school name, grade, serial, first, last for students that passed any 60M flag in the past year */}
                <table className="table table-striped">
                    <thead>
                        <tr>
                            <th>Raffle</th>
                            <th>School</th>
                            <th>Grade</th>
                            <th>Serial</th>
                            <th>First</th>
                            <th>Last</th>
                        </tr>
                    </thead>
                    <tbody>
                        {data.map((raffle) => (
                            Object.entries(raffle).map(([user_id, user]) => (
                                <tr key={user_id}>
                                    <td>{user.raffle_name}</td>
                                    <td>{user.school_name}</td>
                                    <td>{user.class_grade + (user.class_sub ? '-' + user.class_sub : '')}</td>
                                    <td>{user.user_serial}</td>
                                    <td>{user.first}</td>
                                    <td>{user.last}</td>
                                </tr>
                            ))
                        ))}
                    </tbody>
                </table>
            </div>
        )
    }
</script>
</html>
