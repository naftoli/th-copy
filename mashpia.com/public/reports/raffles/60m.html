<!DOCTYPE html>
<html>
<head>
    <title>60M Report</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"/>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
      crossorigin="anonymous"></script>
    <style>
      body {
        margin: 20px;
      }
      th, td {
        vertical-align: middle !important;
        text-align: center !important;
      }
      .loading {
        font-size: larger;
      }
      .error {
        color: red;
        font-size: large;
      }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
<script type="text/babel">
    const { useState, useEffect, useMemo } = React
    const { createRoot } = ReactDOM

    const Report = () => {
        const [data, setData] = useState([])
        const [loading, setLoading] = useState(false)
        const [error, setError] = useState(null)
            
        // Compute totals using useMemo to prevent unnecessary recalculations
        const schoolTotals = useMemo(() => {
            const computedTotals = {}
            Object.entries(data).forEach(([user_id, user]) => {
                const schoolId = user.school_id
                if (!computedTotals[schoolId]) computedTotals[schoolId] = 0
                computedTotals[schoolId]++
            })
            console.log(computedTotals)
            return computedTotals
        }, [data])

        const schools = useMemo(() => {
            const computedSchools = {}
            Object.entries(data).forEach(([user_id, user]) => {
                const schoolId = user.school_id
                if (!computedSchools[schoolId]) computedSchools[schoolId] = user.school_name
            })
            return computedSchools
        }, [data])

        const raffles = useMemo(() => {
            const computedRaffles = {}
            Object.entries(data).forEach(([user_id, user]) => {
                const raffleId = user.raffle_id
                if (!computedRaffles[raffleId]) computedRaffles[raffleId] = user.raffle_name
            })
            return computedRaffles
        }, [data])

        useEffect(() => {
            const fetchRaffles = async () => {
                try {
                    // get a few raffles asynchronously
                    const raffle_ids = [444, 445, 446]
                    const promises = raffle_ids.map(raffle_id => 
                        fetch(`get60m.php?raffle_id=${raffle_id}`, {
                            method: 'GET',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                        })
                    )

                    const responses = await Promise.all(promises)
                    const results = await Promise.all(responses.map(r => r.json()))
                    const info = {}
                    results.forEach(result => {
                        Object.entries(result).forEach(([raffle_id, users]) => {
                            Object.entries(users).forEach(([user_id, user]) => {
                                if (!info[user_id]) info[user_id] = user
                                if (!info[user_id]['raffles']) info[user_id]['raffles'] = [raffle_id]
                                else info[user_id]['raffles'].push(raffle_id)
                            })
                        })
                    })
                    console.log(info)
                    setData(info)
                    setLoading(false)
                } catch (error) {
                    setError(error)
                    setLoading(false)
                }
            }

            fetchRaffles()
        }, [])

        if (loading) {
            return <div className="loading">Loading...</div>
        }

        if (error) {
            return <div className="error">Error: {error.message}</div>
        }

        return (
            <div>
                <h1>60M Report</h1>
                <h2>Schools</h2>
                <table className="table table-striped">
                    <thead>
                        <tr>
                            <th>School</th>
                            <th>Count</th>
                        </tr>
                    </thead>
                    <tbody>
                        {Object.entries(schoolTotals).map(([school_id, count]) => (
                            <tr key={school_id}>
                                <td>{schools[school_id]}</td>
                                <td>{count}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
                <h2>Users</h2>
                <table className="table table-striped">
                    <thead>
                        <tr>
                            <th>Raffle</th>
                            <th>School</th>
                            <th>Grade</th>
                            <th>Serial</th>
                            <th>First</th>
                            <th>Last</th>
                        </tr>
                    </thead>
                    <tbody>
                        {Object.entries(data).map(([user_id, user]) => (
                            <tr key={user_id}>
                                <td>{user.raffles.map(r => raffles[r]).join(', ')}</td>
                                <td>{schools[user.school_id]}</td>
                                <td>{user.class_grade + (user.class_sub ? '-' + user.class_sub : '')}</td>
                                <td>{user.user_serial}</td>
                                <td>{user.first}</td>
                                <td>{user.last}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </div>
        )
    }

    // Render the app
    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<Report />);
</script>
</html>
