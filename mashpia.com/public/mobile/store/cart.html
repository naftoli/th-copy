        <style>
            body { position: relative; padding-bottom: 0px; }
            img#cart-img{height: 52px;}
            #page-title{
                font-size: 25px;font-weight: 700;color: #fff;text-align: center;
                width: auto;display: block;padding: 5px 0px;transition: .25s;
            }
            @media (min-width: 525px){
                #page-title{font-size: 40px;padding: 10px 0px;}
            }

            .balance > div { display: inline-block; }
            .media-body { display: block; }
            #balance-box { margin-right: 5%; }
            #balance { display: none; }
            #balance-display { font-size: 2em;}

            .store-image-overlay img { 
                max-width: 100%; max-height: 150px; border: 1px solid;
            }
            .store-image-overlay {
                width: 40%; max-width: 150px;
                height: 100%; float: left; margin-right: 10px;
            }
            .cart-item {
                padding: 8px; margin: 8px; width: 450px;
                border-bottom: 1px solid #ccc;
            }
            .store-item .item-title {
                font-size: 1.1em; font-family: Raleway, sans-serif;
                display: block;   text-transform: uppercase;
                color: #0e0e0e; text-decoration: none;
            }
            /* .store-item input {
                width: 50px;
                display: inline-block;
            } */
            .product-price { font-size: 1.15em; font-weight: bold; font-family: Raleway, sans-serif; }
            .content { margin-bottom: 25px; }

            div#cart { display: flex; flex-wrap: wrap; justify-content: space-around; margin-top: 15px; }
            #empty-cart { display: none; margin-top: 15px; }
            .alert h1 { margin: 0px; text-align: center; }

    <body class="page-goals">
        <header class="navbar" id="top" role="banner">
            <div class="span12" style="max-width:1024px;width:100%;margin:0 auto;float:none;text-align: center;">
                <span id="page-title">STORE CART</span>
            </div>
        </header>
        
        <div class="container">
            <div class="content">
        
                <div class="personalImg"></div>
                
                <div class="alert alert-warning" role="alert" dir="ltr" style="min-height: 92px;">
                    <div class="media">
                        <div class="pull-right">
                            (<span id="cartQty">0</span>)<!--<i class="fa fa-shopping-cart fa-4x"></i>--> <img id="cart-img" src="../img_new/cart-color-brown-svg.svg"/>
                        </div>
                        <div class="media-body">
                            <div class="balance">
                                <p>Loading Balance...</p>
                            </div>
                        </div>
                    </div>
                </div>
        
                <div id="main">
                    <div class="row">
                        <div class="col-xs-12">
                            <button id="back" class="btn btn-primary center-block pull-left">
                                <b><span class='glyphicon glyphicon-arrow-left'></span> BACK</b>
                            </button>
                            <button type="submit" id="purchase" class="btn btn-primary center-block">
                                <b><span class='glyphicon glyphicon-shopping-cart'></span> PURCHASE</b>
                            </button>
                        </div>
                        <div class="col-xs-12">
                            <div class="alert alert-danger" id='empty-cart'>
                                <h1>Cart is Empty</h1>
                            </div>
                            <div id="cart"></div>
                            <script id="cartTpl" type="text/x-handlebars-template">
                                {{#each items}}
                                    <div class="cart-item">
                                        <figure class="store-image-overlay">
                                            <img class="store-image img-responsive" onerror="handleImageError(this)" src="/v2/images/imgsrepo/{{this.image}}" />
                                        </figure>
                                        <div class="store-item" style="line-height: 1.6" id="{{@key}}">
                                            <div class="item-title">{{this.name}}</div>
                                            <div class="product-price">{{this.price}} Mile(s) each</div>
                                            {{#if this.onlyOne}}
                                            <div class="product-price">Qty: {{this.qty}}</div>
                                            <div class="onePerUser">Only one per Soldier</div>
                                            {{else}}
                                                <div class="content-h2">
                                                    <label for='qty-{{@key}}'>Qty: </label>
                                                    <div class="input-group">
                                                        <input type="number" class='form-control' id='qty-{{@key}}' size="2" value="{{this.qty}}" />
                                                        <span class="input-group-btn">
                                                            <button class="btn btn-default update" data-key="{{@key}}" type="button">
                                                                <span class="glyphicon glyphicon-refresh"></span>
                                                                Update
                                                            </button>
                                                        </span>
                                                    </div>
                                                </div>
                                            {{/if}}
                                            <div style="padding-top: 10px">
                                                <button class="btn btn-default del" data-key="{{@key}}">
                                                    <span class="glyphicon glyphicon-trash"></span>
                                                    <span class="ln-delete"><b>REMOVE</b></span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                {{/each}}
                            </script>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </body>
    <script src="/mobile/js/authenticate.js" defer></script>
    <script>
        document.addEventListener("DOMContentLoaded", function(event) {
            var url = location.href.toString();
            var pos = url.indexOf('='); 
            var user = url.substring(pos+1);
            
            if (user.indexOf('#') != -1) {
                // remove anything trailing after user_id
                var pos2 = (user.indexOf('#'));
                user = user.substring(0,pos2);
            }
            
            if (user.indexOf('&') != -1) {
                // remove anything trailing after user_id
                var pos2 = (user.indexOf('&'));
                user = user.substring(0,pos2);
            }
            
            authenticate( user );
        
            if( localStorage.getItem("login") == "user" ){
                $( "#mainLink" ).attr('href', '/mobile/reg/medals/?id=' + user);
            }
            
            $.post('../reg/ajax/getPhoto.php', { user_id : user }, function( success ) {
                var info = $.parseJSON( success );
                var html = '<a href="../reg/medals/index.html?id=' + user +'">';
                if (info.mobile_pic) html += '<img onerror="handleProfileError(this)" id="userImg" src="https://mashpia.com/mobile/reg/' + info.mobile_pic + '">';
                else if (info.thumb) html += '<img onerror="handleProfileError(this)" id="userImg" src="https://mashpia.com/thumbs/' + info.thumb + '">';
                else if (info.photo) html += '<img onerror="handlefProfileError(this)" id="userImg" src="https://mashpia.com/file_view.php?id=' + info.photo + '">';
                else html += '<img id="userImg" src="/mobile/reg/images/profile-photo-default.jpg">';
                html += '</a>';
                $(".personalImg").append( html );
                // set the USER ID for bug reports
                $(".bug-report img").data("user_id", user);
            });
            
            var bal = 0;
            var cart = [];
            var originalBal = 0;

            $.post('ajax/getBalance.php', { user : user }, function( success ) {
                var info = $.parseJSON(success);
                var html = '<div id="balance-box">';
                html += 	"Available <strong>Store</strong> Miles: <br /><span id='balance'></span><span id='balance-display'></span>";
                html += '</div><div id="data-box">'
                html += 	"Total Miles Earned: " + info.tpoints.toLocaleString( navigator.language ) + "<br />";
                html += 	"Total Miles Earned this Year: " + info.earned.toLocaleString( navigator.language ) + "<br />";
                html += '</div>'
                $(".balance").html(html);
                originalBal = info.available;
                setupCart();
                calcBalance();
            });
                    
            function setupCart() {
                if (window.localStorage) {
                    cart = JSON.parse( localStorage.getItem('storeCart' + user) );
                } else {
                    // need to update browser so that localStorage will work
                    alert("You need to update your browser to the latest version in order for this site to work properly.");
                }
                
                // Grab the template script
                var tplScript = $("#cartTpl").html();
        
                // Compile the template
                var tpl = Handlebars.compile( tplScript );

                // Pass our data to the template
                var html = tpl( { items : cart } );
                
                // Add the compiled html to the page
                $("#cart").html( html );

                if ( cart.length === 0 )
                    $('#empty-cart').show();
            }
                    
            function calcBalance() {
                var cartQty = 0;
                var totalPrice = 0;
                for (var c in cart) {
                    var item = cart[c];
                    cartQty += item.qty;
                    totalPrice += item.qty * item.price;
                }
                $("#cartQty").text(cartQty);
                bal = originalBal - totalPrice;
                $('#balance').text( bal );
                $("#balance-display").text( bal.toLocaleString( navigator.language ) );
            }
            
            function checkBal(key, qty) {
                if ( qty > 0 ) {
                    var item = cart[key];
                    var extra = qty - item.qty;
                    if (extra > 0) {
                        if ((extra * item.price) > bal) {
                            alert('You do not have enough miles for this.');
                            return false;
                        }
                    }
                    return true;
                } else {
                    alert("You cannot purchase negative amounts.");
                    return false;
                }
            }
            
            $(document).on('click', '.update', function() {
                var key = this.dataset.key
                var input = $( this ).parent().parent().find( 'input' );
                var val = parseInt( input.val(), 10 );
                // make sure val is greater than 0 
                if ( val < 0 ) {
                    alert("You cannot purchase negative amounts.");
                    input.val( 0 );
                    return false;
                }
                // make sure there's enough stock and that it's not one per child
                var item = cart[key];
                var curQty = item.qty;
                if (val > curQty && val > item.available) {
                    alert('There are only ' + item.available + ' of this item in stock.');
                    input.val(curQty);
                    return false;
                }
                if (val > 1 && item.onlyOne == 1) {
                    alert('You can only purchase one of this prize.');
                    input.val(curQty);
                    return false;
                }
                
                if ( checkBal( key, val ) ) {
                    item.qty = val; item.stock -= val;
                    calcBalance();
                    if (!window.localStorage) {
                        alert("You need to update your browser to the latest version in order for this feature to work.");
                    } else {
                        localStorage.setItem('storeCart' + user, JSON.stringify( cart ));
                        alert('Updated. Remember to click "PURCHASE" at the top of your cart.');
                    }
                    //Cookies.set('cart' + user, cart);
                } else {
                    input.val(item.qty);
                }
            });
            
            $(document).on('click', '.del', function() {
                var key = this.dataset.key;
                cart.splice( key, 1 );
                
                calcBalance();
                if (!window.localStorage) {
                    alert("You need to update your browser to the latest version in order for this feature to work.");
                } else {
                    localStorage.setItem('storeCart' + user, JSON.stringify( cart ));
                    
                    $(this).parent().parent().parent().remove();
                    setupCart();
                    if ( cart.length === 0 ) $('#empty-cart').show();
                }
            });
            
            $("#purchase").click( function() {
                if (!cart.length) {
                    alert('You have nothing left in your cart!');
                    location.href = "index.html?id=" + user;
                    return;
                }
                $.post('ajax/purchase.php', { cart : JSON.stringify(cart), user : user }, function( error ) {
                    if (error == 0) {
                        alert('Your purchase has been successful.');
                        localStorage.removeItem('storeCart' + user);
                        location.href = "index.html?id=" + user;
                        return;
                    } else {
                        alert(error);
                        return;
                    } 
                });
            });
            
            $("#back").click( function() {
                location.href = "index.html?id=" + user;
            });
        });

        function handleImageError( img ) {
            // console.log( img.src );
            if( img.src.indexOf('imgs/v/w/150/src/') > 0 ) {
                img.src = img.src.replace('imgs/v/w/150/src/', 'images/imgsrepo/')
            } else {
                img.src = '/v2/images/imgsrepo/default.png';
            }
        }

        function handleProfileError( img ) {
            img.src = '/mobile/reg/images/profile-photo-default.jpg';
        }
    </script>
</html>
