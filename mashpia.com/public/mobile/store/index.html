		}

		h1 {
			font-weight: 300
		}

			font-size: 24px
		}

		header.navbar {
			background: #e92d41
		}

		.page-goals header.navbar h1 {
			font-size: 40px;
			font-weight: 700;
			color: #fff;
			text-align: center;
			width: auto;
			display: block;
			margin: 15px auto
		}

		.span12 {
			width: 100%;
			float: left
		}

		.span3 {
			width: 25%;
			float: left
		}

		.footer {
			text-align: center;
			display: table;
			margin-left: auto;
			margin-right: auto;
			float: none;
			max-width: 1024px;
			margin: auto;
		}

		.footer .span3 {
			background-color: #4258a2;
		}

		.footer .span3 span {
			padding: 5px;
			color: white;
			font-size: 18px;
			font-family: font1
		}

		.footer .menu-item {
			width: 120px;
			height: 80px;
			margin: 0 auto
		}

		.footer .span3 img {
			width: 60px;
			vertical-align: text-bottom
		}

		.footer .span3.active {
			background-color: #343862;
		}

		@media screen and (max-width:1024px) {
			.footer {
				border-radius: 0
			}
		}

		@media screen and (max-width:900px) {
			.footer .menu-item {
				width: 120px;
				height: 80px
			}

			.footer .span3 img {
				width: 60px
			}
		}

		@media screen and (max-width:767px) {
			.footer .menu-item {
				width: 120px;
				height: 80px
			}

			.footer .span3 img {
				width: 60px
			}

			.footer .span3 span {
				font-size: 18px
			}
		}

		@media screen and (max-width:639px) {
			.footer .menu-item {
				width: 110px;
				height: 60px
			}

			.footer .span3 img {
				width: 50px
			}

			.footer .span3 span {
				font-size: 16px
			}
		}

		@media screen and (max-width:479px) {
			.footer .menu-item {
				width: 70px;
				height: 40px

			.footer .span3 img {
				width: 30px
			}

			.footer .span3 span {
				font-size: 8px
			}
		}

			width: 50px;
			height: 50px;
			left: 1%;
			top: 1%;
			border-radius: 50%;
			position: absolute
		}

			display: inline-block;
			font-family: FontAwesome;
			font-style: normal;
			font-weight: 400;
			line-height: 1;
			-webkit-font-smoothing: antialiased;
			-moz-osx-font-smoothing: grayscale
		}

		.media .fa {
			margin-top: -10px;
			margin-right: 10px
		}

		.hebrew {
			font-family: Arial !important;

		}

		#cartQty {
			color: white;
		}

		#data-box {
			color: white;
		}

		/* --- Custom Prize Card Styles --- */
		.product.light {
			width: 100%;
			min-width: unset;
			min-height: 420px;
			margin: 12px;
			padding: 14px 8px 8px 8px;
			box-sizing: border-box;
			background: #fff;
			border-radius: 12px;
			box-shadow: 0 2px 8px rgba(27,43,81,0.10), 0 1.5px 4px rgba(27,43,81,0.08);
			transition: box-shadow 0.2s;
			border: 1px solid #e6e6e6;
			display: flex;
			flex-direction: column;
			align-items: center;
			position: relative;
		}
		@media (max-width: 600px) {
			.product.light {
				width: 98vw;
				max-width: 340px;
				margin: 8px auto;
			}
		}
		.figure-hover-overlay {
			width: 150px;
			height: 150px;
			max-width: 150px;
			max-height: 150px;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #f7f8fa;
			border-radius: 8px;
			padding: 8px;
			margin-bottom: 10px;
			margin-top: 10px;
			border: 1px solid #e6e6e6;
		}
		.figure-hover-overlay img {
			max-width: 140px;
			max-height: 140px;
			border-radius: 6px;
		}
		.block-name {
			margin-top: 8px;
			margin-bottom: 6px;
		}
		.product-name {
			font-size: 1.1em;
			font-weight: 600;
			color: #1b2b51;
			text-decoration: none;
			display: block;
			margin-bottom: 2px;
		}
		.product-price {
			font-size: 1em;
			color: #e92d41;
			font-weight: 700;
			margin-bottom: 6px;
		}
		.product-cart {
			margin-top: 10px;
			width: 100%;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
		}
		.add-to-cart-btn {
			background: #e92d41;
			color: #fff;
			border: none;
			border-radius: 6px;
			padding: 6px 14px 6px 10px;
			font-size: 0.98em;
			font-weight: 600;
			cursor: pointer;
			display: flex;
			align-items: center;
			transition: none;
			box-shadow: 0 1px 3px rgba(27,43,81,0.07);
			width: auto;
			max-width: 200px;
			text-align: center;
			justify-content: center;
			align-self: center;
		}
		.add-to-cart-btn:hover, .add-to-cart-btn:focus {
			background: #e92d41;
			color: #fff;
		}
		.add-to-cart-btn .fa {
			margin-right: 7px;
			font-size: 1.1em;
			color: #fff;
		}
		.product-new {
			background: #4258a2;
			color: #fff;
			font-size: 0.85em;
			font-weight: 600;
			border-radius: 4px;
			padding: 2px 7px;
			position: absolute;
			top: 10px;
			left: 10px;
			z-index: 2;
		}
		.onePerUser {
			color: #e92d41;
			font-size: 0.95em;
			font-weight: 500;
			margin-top: 6px;
		}
		.description {
			color: #4258a2;
			font-size: 0.98em;
			margin-top: 8px;
			margin-bottom: 0;
			min-height: 38px;
		}
		@media (max-width: 600px) {
			.product.light {
				min-height: 180px;
				padding: 6px 4px 8px 4px;
				width: 100%;
				max-width: 100%;
			}
			.figure-hover-overlay {
				width: 70px;
				height: 70px;
				padding: 4px;
			}
			.figure-hover-overlay img {
				max-width: 60px;
				max-height: 60px;
			}
		}
		.content {
			max-width: 1024px;
			margin: auto;
		}
		@media (max-width: 900px) {
			.product.light {
				width: 180px;
			}
		}
		.balance {
			width: 100%;
			flex-basis: 100%;
			margin-bottom: 18px;
		}
		.checkout-now-btn {
			background: #4258a2;
			color: #fff;
			border: none;
			border-radius: 6px;
			padding: 6px 14px 6px 10px;
			font-size: 0.98em;
			font-weight: 600;
			cursor: pointer;
			display: flex;
			align-items: center;
			transition: none;
			box-shadow: 0 1px 3px rgba(27,43,81,0.07);
			margin-top: 8px;
			width: auto;
			max-width: 200px;
			text-align: center;
			justify-content: center;
			align-self: center;
		}
		.checkout-now-btn:hover, .checkout-now-btn:focus {
			background: #2d3a6a;
			color: #fff;
		}
		.add-to-cart-btn,
		.checkout-now-btn {
			width: auto;
			max-width: 200px;
			align-self: center;
		}
		.price-badge {
			display: inline-block;
			background: #e92d41;
			color: #fff;
			font-size: 1em;
			font-weight: 700;
			border-radius: 16px;
			padding: 4px 14px;
			margin-bottom: 8px;
			margin-top: 2px;
		}
		.onePerUser-badge {
			position: absolute;
			top: 35px;
			left: -35px;
			background: #4258a2;
			color: #fff;
			font-size: 0.85em;
			font-weight: 700;
			padding: 4px 32px;
			border-radius: 4px;
			transform: rotate(-45deg);
			box-shadow: 0 1px 4px rgba(27, 43, 81, 0.10);
			z-index: 3;
			pointer-events: none;
			letter-spacing: 0.5px;
		}
	</style>

<script src="/mobile/js/authenticate.js" defer></script>
<script>
	if (localStorage.getItem('locallang') == 'he' || Cookies.get('lang') == 'he') {
		$(".bug-report").hide()
	}
</script>
<script>
	document.addEventListener("DOMContentLoaded", function (event) {
		var url = location.href.toString();
		var pos = url.indexOf('=');
		var user = url.substring(pos + 1);

		if (user.indexOf('#') != -1) {
			// remove anything trailing after user_id
			var pos2 = (user.indexOf('#'));
			user = user.substring(0, pos2);
		}

		if (user.indexOf('&') != -1) {
			// remove anything trailing after user_id
			var pos2 = (user.indexOf('&'));
			user = user.substring(0, pos2);
		}

		authenticate(user);
		$.post('ajax/checkReg.php', { user_id: user }, function(reg) {
			if (reg == 0) {
				alert('This child is not yet registered for CTH, you will be redirected to the registration page.')
				window.location.href = '/mobile/reg/parent_detail.html'
			}
		})

		if (localStorage.getItem("login") == "user") {
			$("#mainLink").attr('href', '/mobile/reg/medals/?id=' + user);
		}

		$("#missionsLink").attr('href', '../missionsNew.html?id=' + user);
		$("#goalsLink").attr('href', '../goalsNew.html?id=' + user);
		$("#rankLink").attr('href', '../reg/rank.html?id=' + user);
		$("#scanMenu").attr('href', '../store/scan.html?id=' + user);
		$("#auctionMenu").attr('href', '../auction/index.html?id=' + user);

		$.post('../reg/ajax/getPhoto.php', { user_id: user }, function (success) {
			var info = $.parseJSON(success);
			var html = '<a href="../reg/medals/index.html?id=' + user + '">';
			if (info.mobile_pic) html += '<img onerror="handleProfileError(this)" id="userImg" src="https://mashpia.com/mobile/reg/' + info.mobile_pic + '">';
			else if (info.thumb) html += '<img onerror="handleProfileError(this)" id="userImg" src="https://mashpia.com/thumbs/' + info.thumb + '">';
			else if (info.photo) html += '<img onerror="handleProfileError(this)" id="userImg" src="https://mashpia.com/file_view.php?id=' + info.photo + '">';
			else html += '<img id="userImg" src="/mobile/reg/images/profile-photo-default.jpg">';
			html += '</a>';
			$(".personalImg").append(html);
			// set the USER ID for bug reports
			$(".bug-report img").data("user_id", user);
		});

		var bal = 0;
		var cart = [];
		var cartQty = 0;
		var totalPrice = 0;
		var originalBal = 0;
		var separator = '|';
		var float_element = "";
		var availibleStoreHTML = "Available <strong>Store</strong> Miles: <br /><span id='balance'></span><span id='balance-display'></span>"
		var totalmilesText = "Total Miles Earned: ";
		var totalmilesYearText = "Total Miles Earned this Year: ";

		if (localStorage.getItem("locallang") == "he") {
			$("#img-cart").removeClass('pull-right').addClass('pull-left');
			float_element = 'style="float:right;direction:rtl; margin-right:8px;"';
			availibleStoreHTML = "נקודות שנשארו <strong>בחנות</strong> : <br /><span id='balance'></span><span id='balance-display'></span>";
			totalmilesText = "סך הנקודות שנצברו  : ";
			var totalmilesYearText = "סך הנקודות שנצברו השנה: ";
			var data_box_css = 'style="float:right;direction:rtl; margin-right:40px; margin-top: 20px;"';
		}
		$.post('ajax/getBalance.php', {
			user: user,
			points_beta: new URLSearchParams(window.location.search).get('points_beta') || "0"
		}, function (success) {
			var info = $.parseJSON(success);
			var html = '<div id="balance-box" ' + float_element + '>';
			html += availibleStoreHTML;//"Available <strong>Store</strong> Miles: <br /><span id='balance'></span><span id='balance-display'></span>";
			html += '</div><div id="data-box" ' + data_box_css + '>'
			html += totalmilesText + info.tpoints.toLocaleString(navigator.language) + "<br />";
			html += totalmilesYearText + info.earned.toLocaleString(navigator.language) + "<br />";
			html += '</div>'
			$(".balance").html(html);
			originalBal = info.available;
			initCart();
			calcBalance();
		});

		var allPrizes = [];
		var currentSort = 'amount-asc';

		function renderPrizes() {
			var sortedPrizes = allPrizes.slice();
			if (currentSort === 'amount-asc') {
				sortedPrizes.sort(function(a, b) {
					var pointsA = parseInt(a.points, 10);
					var pointsB = parseInt(b.points, 10);
					if (pointsA !== pointsB) return pointsA - pointsB;
					return a.prize_name.localeCompare(b.prize_name);
				});
			} else if (currentSort === 'amount-desc') {
				sortedPrizes.sort(function(a, b) {
					var pointsA = parseInt(a.points, 10);
					var pointsB = parseInt(b.points, 10);
					if (pointsA !== pointsB) return pointsB - pointsA;
					return a.prize_name.localeCompare(b.prize_name);
				});
			} else if (currentSort === 'alpha-asc') {
				sortedPrizes.sort(function(a, b) {
					return a.prize_name.localeCompare(b.prize_name) || (parseInt(a.points, 10) - parseInt(b.points, 10));
				});
			} else if (currentSort === 'alpha-desc') {
				sortedPrizes.sort(function(a, b) {
					return b.prize_name.localeCompare(a.prize_name) || (parseInt(a.points, 10) - parseInt(b.points, 10));
				});
			}

			if (sortedPrizes.length == 0) {
				$('#no-prizes-message').text(data.message);
				$('#no-prizes').show();
			}

			var html = '';
			for (var i = 0; i < sortedPrizes.length; i++) {
				var prize = sortedPrizes[i];
				html += '<div class="col-xs-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 text-center product">\
					<article class="product light">';
				if (parseInt(prize.num_per_user) > 0) {
					html += '<div class="onePerUser-badge">Only ' + parseInt(prize.num_per_user) + ' per Soldier</div>';
				}	
				// New label
				if (new Date(prize.created).getTime() > new Date().getTime() - (30 * 24 * 60 * 60 * 1000)) {
					html += '<div class="product-new">new</div>';
				}
				html += '<div class="price-badge">' + parseInt(prize.points, 10).toLocaleString(navigator.language) + ' Mile' + (prize.points > 1 ? 's' : '') + '</div>';
				html += '<figure class="figure-hover-overlay">';
				if (prize.image_id != 0) {
					html += '<img class="img-responsive" onerror="handleImageError( this )" src="/v2/imgs/v/w/150/src/' + prize.image_id + '" alt="" title="">';
				} else {
					html += '<img class="img-responsive" src="/v2/images/imgsrepo/default.png" alt="" title="">';
				}
				html += '</figure>';
				html += '<div class="block-name">\
					<div class="product-name">' + prize.prize_name + '</div>';
				if (prize.prize_description && prize.prize_description.trim() !== '') {
					html += '<p class="description clearfix">' + prize.prize_description + '</p>';
				}
				html += '</div>';
				html += '<div class="product-cart" id="' +
					prize.prize_id + separator + prize.points + separator + prize.image_id + separator +
					prize.prize_name + separator + prize.num_per_user + separator + prize.prize_count + '">\
					<button class="add-to-cart-btn"><i class="fa fa-shopping-cart"></i> Add to Cart</button>\
					<button class="checkout-now-btn">Checkout Now</button>\
				</div>';
				html += '</article>\
				</div>';
			}
			$("#main").html(html);
		}

		// Fetch prizes and initialize
		$.post('ajax/getPrizes.php', { user: user }, function (data) {
			// Flatten and store all prizes
			allPrizes = [];
			for (var amount in data.prizes) {
				for (var p in data.prizes[amount]) {
					var prize = data.prizes[amount][p];
					allPrizes.push(prize);
				}
			}
			renderPrizes();
		});

		// Sorting control event
		$('#sort-select').on('change', function() {
			currentSort = $(this).val();
			renderPrizes();
		});

		var toggle_dropdown = true;

		$(document).on('click', ".panel-heading", function () {
			var c = $(this).parent().attr('class');
			var parent = $(this).parent();
			if (c.indexOf('open') > 0 && toggle_dropdown) {
				parent.removeClass('open');
				parent.find('.collapse').removeClass('in');
				parent.find('.collapse').css({ "height": '0px' });

				toggle_dropdown = false;
				setTimeout(function () {
					parent.find('.collapse .panel-body').css({ "display": "none" });
					toggle_dropdown = true;
				}, 300);
			} else if (toggle_dropdown) {
				parent.addClass('open');
				parent.find('.collapse').addClass('in');
				parent.find('> .collapse .panel-body').css({ "display": 'block' });
				parent.find('> .collapse').css({ "height": parent.find('.collapse').children()[0].scrollHeight });
				parent.siblings().removeClass('open');
				parent.siblings().find('.collapse').removeClass('in');
				parent.siblings().find('.collapse').css({ "height": '0px' });

				toggle_dropdown = false;
				setTimeout(function () {
					parent.siblings().find('.collapse .panel-body').css({ "display": 'none' });
					toggle_dropdown = true;
				}, 300);
			}
		});

		function initCart() {
			if (!window.localStorage) {
				// need to update browser so that sessionStorage will work
				alert("You need to update your browser to the latest version in order for this site to work properly.");
			} else {
				if (localStorage.getItem('storeCart' + user)) {
					cart = JSON.parse(localStorage.getItem('storeCart' + user));
					for (var c in cart) {
						var item = cart[c];
						cartQty += item.qty;
						totalPrice += item.qty * item.price;
					}
					$("#cartQty").text(cartQty);
				}
			}
			var cartCookie = Cookies.get('cart' + user);
			if (cartCookie !== undefined) {
				cart = JSON.parse(cartCookie);
				for (var c in cart) {
					var item = cart[c];
					cartQty += item.qty;
					totalPrice += item.qty * item.price;
				}
				$("#cartQty").text(cartQty);
			}
		}

		function calcBalance() {
			bal = originalBal - totalPrice;
			$('#balance').text(bal);
			$("#balance-display").text(bal.toLocaleString(navigator.language));
		}

		$(document).on('click', '.product-cart', function () {
			// get prize id and add to cart
			var prizeInfo = $(this).attr('id');
			var info = prizeInfo.split(separator);
			var id = parseInt(info[0]);
			var price = parseInt(info[1]);
			var image = info[2];
			var prizeName = info[3];
			var numPerUser = parseInt(info[4]);
			var stock = parseInt(info[5]);
			var available = stock;
			var found = false;

			// see if user has enough points for this
			var curBal = parseInt($("#balance").text());
			if (curBal - price < 0) {
				alert('You do not have enough points to add this prize.');
				return false;
			}

			for (var c in cart) {
				var item = cart[c];
				// see if item exists
				if (item.prize == id) {
					found = true;
					// make sure it's not only one per child
					if (item.numPerUser > 0 && item.qty >= item.numPerUser) {
						alert('You can only purchase ' + item.numPerUser + ' of this prize.');
						return false;
					}	
					if (item.stock == 0) {
						alert('Sorry there are no more left in stock.');
						return false;
					}
					item.qty++;
					item.stock--;
					totalPrice += item.price;
					break;
				}
			}

			if (!found) {
				if (stock > 0) {
					cart.push({
						prize: id,
						name: prizeName,
						price: price,
						image: image, 
						qty: 1,
						stock: --stock,
						numPerUser: numPerUser,
						available: available
					});
					totalPrice += price;
				} else {
					alert('Sorry there are no more left in stock.');
					return false;
				}
			}

			cartQty++;
			if (!window.localStorage) {
				// need to update browser so that sessionStorage will work
				alert("You need to update your browser to the latest version in order for this feature to work.");
			} else {
				localStorage.setItem('storeCart' + user, JSON.stringify(cart));
			}
			//Cookies.set('cart' + user, cart);
			$("#cartQty").text(cartQty);

			calcBalance();
		});

		$(document).on('click', '.checkout-now-btn', function (e) {
			e.preventDefault();
			e.stopPropagation();
			window.location.href = 'cart.html?id=' + user;
		});

		$("#cart-img").click(function () {
			location.href = "cart.html?id=" + user;
		});
	});

	function handleImageError(img) {
		// console.log( img.src );
		if (img.src.indexOf('imgs/v/w/150/src/') > 0) {
			img.src = img.src.replace('imgs/v/w/150/src/', 'images/imgsrepo/')
		} else {
			img.src = '/v2/images/imgsrepo/default.png';
		}
	}

	function handleProfileError(img) {
		img.src = '/mobile/reg/images/profile-photo-default.jpg';
	}
</script>

</html>
