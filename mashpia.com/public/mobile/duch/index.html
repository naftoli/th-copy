<script>
    var id

    // options for the loading spinner....
    var opts = {
        lines: 8, // The number of lines to draw

        radius: 26, // The radius of the inner circle

    document.addEventListener("DOMContentLoaded", function () {
        $(function () {
            var url = location.toString();
            id = url.substring(url.indexOf('=') + 1);
            var str = id;
            // get the date from the URL
            var d = id.indexOf('&d');
            if (d > 0) {
                id = id.substring(0, d);
            }
            // make sure that the user is logged in
            authenticate(id);

            $("#back-to-missions").click(function() {
                window.location.href = '/mobile/missionsNew.html?id=' + id;
            });

            if (Cookies.get('naftoli')) {
                $('.print').show();
                $('.email').show();
            }

            $.post('/mobile/reg/ajax/getPhoto.php', { user_id: id }, function (success) {
                let info = $.parseJSON(success);
                let html = '<a href="medals/index.html?id=' + id + '">';
                if (info.mobile_pic) html += '<img id="userImg" src="/mobile/reg/' + info.mobile_pic + '">';
                else if (info.thumb) html += '<img id="userImg" src="/thumbs/' + info.thumb + '">';
                else if (info.photo) html += '<img id="userImg" src="/file_view.php?id=' + info.photo + '">';
                html += '</a>';
                $(".personalImg").append(html);
            });

            // use regex to determine desktop or mobile
            var desktop = $(window).width() >
                767; // all devices this small are mobile. As well as the folowing regex
            if (/Android|webOS|iPhone|iPod|iPad|BlackBerry|BB|PlayBook|IEMobile|Windows Phone|Kindle|Silk|Opera Mini/i
                .test(navigator.userAgent)) { // look for common mobile names in userAgent
                desktop = false;
            }
            console.log({
                "desktop": desktop
            });
        });

    }); // end on page loaded listener

    function generateDuch() {
        const dateRange = document.getElementById('date-range').value;
        const hebrewMonth = document.getElementById('hebrew-month').value;
        let startDate = document.getElementById('start-date').value;
        let endDate = document.getElementById('end-date').value;
        let start, end

        if (dateRange) {
            end = getFutureDateString();
            start = getFutureDateString(end, -(dateRange - 2)); // -2 because we include start and end date in total number of days
        }  
        if (hebrewMonth) {
            const dates = heMonths[hebrewMonth].split(' - ');
            start = getFutureDateString(new Date(dates[0]));
            end = getFutureDateString(new Date(dates[1]));
        }  
        if (startDate && endDate) {
            start = getFutureDateString(new Date(startDate), 1);
            end = getFutureDateString(new Date(endDate), 1);
        } 
        
        if (!start || !end) {
            alert('Please select a date range or a hebrew month');
            return;
        }

        console.log({ start, end });

        new Spinner(opts).spin(document.getElementById('spinner'));
        // get the duch page
        const url = 'getDuch.php?id=' + id + '&start=' + start + '&end=' + end;
        $.get(url, function(html) {
            $("#spinner").empty();
            $('#main').html(html);
            $("#main").addClass("animated fadeIn");
            $("#buttons").show();
        });
    }

    /**
     * Returns a string YYYY-MM-DD
     * @param {Date} baseDate - The starting date object (default: today)
     * @param {number} daysToAdd - Number of days to add (negative to subtract)
     */
    function getFutureDateString(baseDate = new Date(), daysToAdd = 0) {
        // Clone the date so we don't mutate the original
        const copy = new Date(baseDate);
        
        // Add the days
        copy.setDate(copy.getDate() + daysToAdd);
        
        // Format to YYYY-MM-DD
        const year = copy.getFullYear();
        const month = String(copy.getMonth() + 1).padStart(2, '0');
        const day = String(copy.getDate()).padStart(2, '0');
        
        return `${year}-${month}-${day}`;
    }

    function emailToOhel() {
        new Spinner(opts).spin(document.getElementById('spinner'));
        // create form and submit it
        const form = document.createElement('form');
        form.method = 'post';
        form.action = '/api/print/duch';
		// submit to a hidden iframe so the request runs in the background
		var bgFrame = document.getElementById('bg-submit-frame');
		if (!bgFrame) {
			bgFrame = document.createElement('iframe');
			bgFrame.name = 'bg-submit-frame';
			bgFrame.id = 'bg-submit-frame';
			bgFrame.style.width = '0';
			bgFrame.style.height = '0';
			bgFrame.style.border = '0';
			bgFrame.style.position = 'absolute';
			bgFrame.style.left = '-9999px';
			document.body.appendChild(bgFrame);
		}
		form.target = 'bg-submit-frame';
        form.enctype = 'application/x-www-form-urlencoded';

        const elements = [
            { name: 'school_id', value: school_id },
            { name: 'user_ids', value: user_id },
            { name: 'start', value: start },
            { name: 'end', value: end },
            { name: 'from_mobile', value: 1 }, 
            { name: 'email', value: 1 }
        ];
        const besuros_tovos = document.getElementById('besuros_tovos').value;
        if (besuros_tovos) {
            elements.push({ name: 'besuros_tovos', value: besuros_tovos });
        }
        elements.forEach(element => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = element.name;
            input.value = element.value;
            form.appendChild(input);
        });
        document.body.appendChild(form);
		form.submit();
        $("#spinner").empty();
    }

    function printDuch() {
        // var target = document.getElementById('spinner');
        // new Spinner(opts).spin(target);
        // create form and submit it
        const form = document.createElement('form');
        form.method = 'post';
        form.action = '/api/print/duch';
        form.target = '_blank';
        form.enctype = 'application/x-www-form-urlencoded';

        const elements = [
            { name: 'school_id', value: school_id },
            { name: 'user_ids', value: user_id },
            { name: 'start', value: start },
            { name: 'end', value: end },
            { name: 'from_mobile', value: 1 }
        ];
        const besuros_tovos = document.getElementById('besuros_tovos').value;
        if (besuros_tovos) {
            elements.push({ name: 'besuros_tovos', value: besuros_tovos });
        }
        elements.forEach(element => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = element.name;
            input.value = element.value;
            form.appendChild(input);
        });
        document.body.appendChild(form);
        form.submit();
        // $("#spinner").empty();        
    }
