    <style>
        html,
        body,
        span,
        p,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        div,
        button,
        i,
        input {
            color: #1b2b51;
        }

        .footer.media-group .menu-item {
            padding: 0px;
        }

        #wpContent {
            width: 94%;
            float: left;
            margin: 3%;
        }

        #logged-in-footer,
        #myshliach-footer,
        #logged-out-footer {
            position: fixed;
            bottom: 0px;
            z-index: 9999;
            display: none;
        }

        body {
            /*margin-bottom: 100px;*/
        }

        .footer .span3 span {
            color: #6fb84a !important;
        }

        .disabled {
            opacity: 0.4;
        }

        .mazalTov {
            font-size: 26px;
            padding-top: 10px;
            text-align: center;
            color: #3155a1;
            line-height: 1.1;
        }

        .heDate {
            padding: 10px;
            font-size: 25px;
            width: auto;
            font-style: italic;
            text-align: center;
        }

        .b-t-description span {
            font-size: 1.8em;
        }

        .bottom-border {
            border-bottom: 2px solid #4160ac;
            clear: both;
        }

        .date {
            text-align: center;
            font-size: 1.5em;
        }

        .raffle {
            padding-bottom: 10%;
        }

        .image {
            background-position: center;
            background-size: cover;
            border-radius: 5px;
            height: 8vh;
            width: 8vh;
        }

        .winner .image {
            float: left;
            margin: 0 15px 0 5px;
        }

        .weekly-raffle .image {
            margin: 5px auto;
            display: inline-block;
        }

        .weekly-raffle {
            display: flex;
            align-items: center;
        }

        .weekly-raffle>p {
            display: inline-block;
            padding: 10px 15px 0px;
            font-size: 1.5em;
            font-style: italic;
        }

        .raffle-info {
            width: 49%;
            display: inline-block;
            text-align: center;
            font-size: 2em;
            margin-top: 10px;
        }

        /* Glyph, by Harry Roberts */
        hr.style-eight {
            overflow: visible;
            /* For IE */
            padding: 0;
            border: none;
            border-top: medium double #333;
            color: #333;
            text-align: center;
            width: 90%;
        }

        hr.style-eight:after {
            content: "§";
            display: inline-block;
            position: relative;
            top: -0.7em;
            font-size: 1.5em;
            padding: 0 0.25em;
            background: white;
            font-family: Helvetica;
            font-style: italic;
        }

        .loader {
            border-left: 1.1em solid #ccc;
        }

        .winners {
            margin-top: 15px;
        }

        .boys,
        .girls {
            display: inline-block;
            width: 50%;
            vertical-align: top;
            padding: 0px 2%;
        }

        .boys {
            border-right: 1px solid #ccc;
        }

        .girls {
            border-left: 1px solid #ccc;
            margin-left: -1px;
        }

        div#raffle-navigation {
            display: flex;
        }

        div#previous,
        div#next {
            flex-grow: 1;
            padding: 5px 15px;
        }

        div#previous:hover,
        div#next:hover {
            cursor: pointer;
        }

        div#next {
            text-align: right;
        }

        #raffle-navigation a {
            color: #1b2b51;
            font-size: 1.3em;
            text-transform: capitalize;
        }

        hr.new-prize {
            height: 1px;
            margin: 5px;
            border-top: 1px solid #ddd;
        }

        span#main-title {
            color: white !important;
        }

        .header-custom {
            position: relative;
            background-color: #1d2654;
            color: #4160ac;
            font-family: 'Exo', sans-serif;
            background-image: url(/mobile/img_new/TH_pattern.png);
            background-repeat: repeat;
        }

        .wrap1 {
            border: none !important;
        }

        .container .body {
            border: none !important;
        }

        .media-group {
            border: none !important;
            font-family: Exo !important;
        }

        .footer .span3 span {
            color: #4160ac !important;
            font-family: Exo !important;
        }
    </style>
