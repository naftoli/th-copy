        <script>
            $(function() {            	
            	$('input').iCheck({
		            checkboxClass: 'icheckbox_square-blue',
		            radioClass: 'iradio_square-blue',
		            increaseArea: '20%' // optional
		        });
		        
            	//$("#childSelect").hide();
            	//$("#regInfo").hide();
				
				var url = location.toString();
				var pos = url.indexOf('='); 
				var id = url.substring( pos+1 );
				
				var edit = false;
				var pos2 = id.indexOf('&');
				if (pos2 !== -1) {
					id = id.substr(0, pos2);
					edit = true;
				}
				
				var admin_id = Cookies.get('admin');
				if (!admin_id) {
					location.href = "/mobile";
				}
				
				$.post('/mobile/reg/ajax/checkAuth.php', { user_id : id, admin_id : admin_id }, function( success ) {
					if (success == 0) {
						location.href = "/mobile";
					}
				});
				
				var year;
				$.ajax({
					type : "POST",
					url : "ajax/getYear.php",
					async : false, 
					success : function( info ) {
						year = info;
					}
				});
				
				$.post('ajax/getChidonUser.php', { user : id, year : year }, function( success ) {
					if (success != 0) {
						var info = $.parseJSON(success);
						var admin = info.admin;
						var user = info.user;
						var chidon = info.chidon;
						
						if (chidon.th_chidon_id) $("#chidon_reg_id").val(chidon.th_chidon_id);
						
						$("#school").val(user.school_id);
						/*
						if (chidon.grade) $("#grade").val(chidon.grade);
						else $("#grade").val(user.class_grade);
						
						if (chidon.book) $("#book").val(chidon.book);
						else {
							var book;
							switch (parseInt(user.class_grade)) {
								case 4:
								case 8:
									book = 1;
									break;
								case 5:
									book = 2;
									break;
								case 6:
									book = 3;
									break;
								case 7:
									book = 4;
									break;
							}
							$("#book").val(book);
						}
						*/						
						//$("#pname").val(admin.first + ' ' + admin.last);
						//$("#pemail").val(admin.admin_email);
						$("#fcell").val(admin.admin_phone_mobile);
						$("#mcell").val(admin.admin_phone_mobile2);
						$("#phone").val(admin.admin_phone_home);
						$("#email").val(admin.admin_email);
						$("#fname").val(user.first);
						$("#lname").val(user.last);
						$("#hfname").val(user.first_he);
						$("#hlname").val(user.last_he);
