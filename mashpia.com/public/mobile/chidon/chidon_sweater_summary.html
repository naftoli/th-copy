    {
        return s && s[0].toUpperCase() + s.slice(1);
    }

        let l = arr.length;
        if (!l) return ifEmpty;
        if (l<2) return arr[0];
        if (l<3) return arr.join(` ${conjunction} `);
        arr = arr.slice();
        arr[l-1] = `${conjunction} ${arr[l-1]}`;
        return arr.join(", ");
    }

                    }

                if (purchases.sweater_bubby) {
                    const type = 'bubby'
                    html += "<div>Sweater Type: Bubby<br />"
                    html += `Sweater Size: ${purchases.sweater_bubby}<br />`
                    // html += `Sweater Size: <select name='sweater_bubby' class='sweater' id="${type}">`
                    //

                    //     if (sweaters[type][size].qty < 1) {

                    //         if (purchases.sweater_bubby == sizes[size]) html += ' selected '

                    //     } else {

                                <input type="text" size="14" name="country" class="country" placeholder="country" style="margin-top: 5px;" /><br />

                    html += '<hr style="width: 90%; border-top: 1px solid #2c539e; margin-bottom: 15px;" /></div>'

                    //     } else {

                    //         if (purchases.sweater_zaidy == sizes[size]) html += ' selected '
                    //         html += `>${capitalize(size)} - only ${sweaters[type][size].qty} left</option>`
                    //     }
                    // }
                    //
                    // html += '</select><br />'
                    html += `Cost: $25<br />`
                    totalCost += 25

                    if (parseInt(purchases.sweater_zaidy_ship)) {
                        toUpdate++
                        toUpdateDetails[type] = true
                        totalCost += 10
                        html += `Shipping Fee: $10<br />Shipping To: ${purchases.sweater_zaidy_ship_addr}<br />`
                        html += `Please Enter Full Shipping Address:
                                <input type="text" size="30" name="address" class="address" placeholder="address line 1" style="margin-bottom: 5px;" /><br />
                                <input type="text" size="14" name="city" class="city" placeholder="city" />
                                <input type="text" size="1" name="state" class="state" placeholder="state" />

                html += `Total Cost for Purchases: $${totalCost} <br />

                        <span id="form-completion-status"></span>`

                html += '</div>'

                $("#purchaseInfo").append(html)

                // update cookies / cart regarding sweater balance
                Cookies.set('extra_balance', balance)
                if (localStorage) localStorage.setItem('extra_balance', balance)

                // if already confirmed disable all selects / inputs
                $.post('ajax/checkConfirmation.php', { field: 'confirmed_sweaters', admin: Cookies.get('admin') }, function(result) {
                    if (parseInt(result) == 1) {
                        confirmed = true
                        $("select").attr('disabled', true)
                        $("input").attr('disabled', true)

        $(document).on('change', '.sweater', function () {
            const info = $(this).val().split(':')
            const size = info[0]
            const qty = info[1]
            const type = $(this).attr('id')
            if (qty < 1) {
                alert('This size is sold out, please make sure to choose a different size.')
                return false
            } else {
                $.post('ajax/updateSweaterSize.php', { admin: Cookies.get('admin'), type: type, size: size }, function(result) {
                    console.log(result)
                    const res = JSON.parse(result)
                    if (res.success) alert('Size Updated.')
                    else alert('Error updating size.')
                })
            }
        })

        $(document).on('click', '.update', function () {
            const type = $(this).data('type')
            const address = $(this).parent().find('.address').val()
            const city = $(this).parent().find('.city').val()
            const state = $(this).parent().find('.state').val()
            const zip = $(this).parent().find('.zip').val()
            const country = $(this).parent().find('.country').val()
            if ( !(address && city && state && zip && country) ) {
                alert('You must fill in all address fields.')
                if (!address) $(this).parent().find('.address').focus()
                else if (!city) $(this).parent().find('.city').focus()
                else if (!state) $(this).parent().find('.state').focus()
                else if (!zip) $(this).parent().find('.zip').focus()
                else if (!country) $(this).parent().find('.country').focus()
                return false
            } else {
                const fullAddress = address + ' ' + city + ', ' + state + ' ' + zip + ' ' + country
                $.post('ajax/updateSweaterAddress.php', { admin: Cookies.get('admin'), type: type, address: fullAddress }, function(result) {
                    console.log(result)
                    const res = JSON.parse(result)
                    if (res.success) {
                        updated++
                        updatedTypes[type] = true
                        $(`#${type}-status`).html('<span class="success">Updated</span>')
                    }
                    else $(`#${type}-status`).html('<span class="warning">Error updating</span>') 
                }).fail(function () { $(`#${type}-status`).html('<span class="warning">Error updating</span>') })
            }
        })

        $("#continue").click( function () {
            if (!confirmed) {
                const fields = ['address', 'city', 'state', 'zip', 'country']
                let missingFeild = false
                for (let field of fields) {
                    if (!missingFeild) {
                        const elem = "." + field
                        $(elem).each(function () {
                            if ($(this).val() == '') {
                                alert('You must fill in all ' + field + ' fields!')
                                missingFeild = true
                                return false
                            }
                        })
                    }
                }
                // make sure all addresses were updated
                missingUpdates = Object.keys(toUpdateDetails).filter(function(type){ return !updatedTypes[type] })
                if (missingUpdates.length > 0) {
                // if (toUpdate > updated) {
                    missingUpdates.forEach(function(type) {
                        $(`#${type}-status`).html('<span class="warning">Not updated</span>')
                    })

                        sweaters before continuing.
                    </div>`)
                    return false
                }
                if (!missingFeild) {
                    $.post('ajax/confirmation.php', {
                        field: 'confirmed_sweaters',

                    }, function (result) {
                        const res = JSON.parse(result)

                        } else {

                        }
