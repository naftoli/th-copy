<script>
    $(function () {
        $.post('ajax/getPurchases.php', { admin: Cookies.get('admin') }, function(result) {
            const res = JSON.parse(result)
            const transactions = res.transactions
            const purchases = res.purchases
            const children = res.children
            const prizes = res.prizes
            const chidondrive = res.chidondrive
            const coupon_code = res.coupon

            let html = '<br />'

            // is there transactions
            // let noTransactionsFound = true
            // let admin_id, family
            // for (id in transactions) {
            //     admin_id = id
            //     family = transactions[id][0].last
            //     noTransactionsFound = false
            //     break
            // }
            // if (noTransactionsFound) $("#update").text("Pay for Chidon")
            // else {
            //     html += `Family ${family}<br />
            //              Family ID: ${admin_id}`
            // }
            //
            // html += '<h4>Registration</h4>'
            // for (id in children) {
            //     const child = children[id]
            //     html += `${child.th_chidon_id} ${child.first} ${children[id].date_paid ? 'REGISTERED' : 'NOT YET REGISTERED'}<br />`
            // }

            let school
            for (id in children) {
                school = children[id].school_name
                break
            }

            html += '<div style="font-size: 18px; line-height: 1.5; margin-bottom: 20px;"><b>Sweaters & Extra Celebration Boxes</b><br /><br />'
            if (purchases.length == 0) {
                html += 'No sweater or celebration box purchases were found.<br />'
            }

            if (purchases.sweater_mother) {
                html += "Sweater Type: Mother<br />"
                html += `Sweater Size: ${purchases.sweater_mother}<br />`
                html += `Paid: $25<br />`
                if (parseInt(purchases.sweater_mother_ship)) {
                    html += `Shipping Fee: $10<br />Shipping Address: ${purchases.sweater_mother_ship_addr}<br />`
                } else {
                    html += `Shipping Address: ${school}<br />`
                }
            }

            if (purchases.sweater_father) {
                html += "Sweater Type: Father<br />"
                html += `Sweater Size: ${purchases.sweater_father}<br />`
                html += `Paid: $25<br />`
                if (parseInt(purchases.sweater_father_ship)) {
                    html += `Shipping Fee: $10<br />Shipping Address: ${purchases.sweater_father_ship_addr}<br />`
                } else {
                    html += `Shipping Address: ${school}<br />`
                }
            }

            if (purchases.sweater_bubby) {
                html += "Sweater Type: Bubby<br />"
                html += `Sweater Size: ${purchases.sweater_bubby}<br />`
                html += `Paid: $25<br />`
                if (parseInt(purchases.sweater_bubby_ship)) {
                    html += `Shipping Fee: $10<br />Shipping Address: ${purchases.sweater_bubby_ship_addr}<br />`
                } else {
                    html += `Shipping Address: ${school}<br />`
                }
            }

            if (purchases.sweater_zaidy) {
                html += "Sweater Type: Zaidy<br />"
                html += `Sweater Size: ${purchases.sweater_zaidy}<br />`
                html += `Paid: $25<br />`
                if (parseInt(purchases.sweater_zaidy_ship)) {
                    html += `Shipping Fee: $10<br />Shipping Address: ${purchases.sweater_zaidy_ship_addr}<br />`
                } else {
                    html += `Shipping Address: ${school}<br />`
                }
            }

            if (parseInt(purchases.celeb_box_add)) {
                html += '<h4>Celebration Boxes</h4>'
                html += '1 Extra Celebration Box - $20<br />'
                if (parseInt(purchases.celeb_box_add_ship)) {
                    html += '$10 Shipping<br />'
                    html += purchases.celeb_box_add_addr + "<br />"
                }
            }

            html += '</div>'

            $("#purchaseInfo").append(html)
        })

        $("#update").click( function( e ) {
            e.preventDefault()
            // alert("Please note: Even if you are just making edits WHEN YOU GET TO THE PAYMENT SECTION, YOU MUST PUT IN YOUR CREDIT CARD. " +
            //     "Your card will only be charged if you add a  purchase that you have not yet paid for. " +
            //     "If you are just making edits your card will not be charged.")
            // Cookies.set('chidon_admin', Cookies.get('admin'))
            // location.href = 'http://chidondrive.com/site/enrollNew.html'
            location.href = 'chidon_edit_sweaters.html'
        })

        $("#confirmation").click( function() {
            $.post('ajax/confirmation.php', { field: 'confirmed_sweaters', admin: Cookies.get('admin') }, function(result) {
                const res = JSON.parse(result)
                if (res.success) alert('Confirmed.')
                else {
                    alert(res.error)
                    console.log(res.sql)
                }
            })
        })
    });
</script>
