        $(document).on('change', '.sweater', function () {
            const info = $(this).val().split(':')
            const size = info[0]
            const qty = info[1]
            const type = $(this).attr('id')
            if (qty < 1) {
                alert('This size is sold out, please make sure to choose a different size.')
                return false
            } else {
                $.post('ajax/updateSweaterSize.php', { admin: Cookies.get('admin'), type: type, size: size }, function(result) {
                    console.log(result)
                    const res = JSON.parse(result)
                    if (res.success) alert('Size Updated.')
                    else alert('Error updating size.')
                })
            }
        })

        $(document).on('click', '.update', function () {
            const type = $(this).data('type')
            const address = $(this).parent().find('.address').val()
            const city = $(this).parent().find('.city').val()
            const state = $(this).parent().find('.state').val()
            const zip = $(this).parent().find('.zip').val()
            const country = $(this).parent().find('.country').val()
            if ( !(address && city && state && zip && country) ) {
                alert('You must fill in all address fields.')
                if (!address) $(this).parent().find('.address').focus()
                else if (!city) $(this).parent().find('.city').focus()
                else if (!state) $(this).parent().find('.state').focus()
                else if (!zip) $(this).parent().find('.zip').focus()
                else if (!country) $(this).parent().find('.country').focus()
                return false
            } else {
                const fullAddress = address + ' ' + city + ', ' + state + ' ' + zip + ' ' + country
                $.post('ajax/updateSweaterAddress.php', { admin: Cookies.get('admin'), type: type, address: fullAddress }, function(result) {
                    console.log(result)
                    const res = JSON.parse(result)
                    if (res.success) alert('Address Updated.')
                    else alert("Error updating address.")
                })
            }
        })

                } else {
                    alert(res.error)
                    console.log(res.sql)
                }
            })
        })

        $("#continue").click( function () {
            const fields = ['address', 'city', 'state', 'zip', 'country']
            let missing = false
            for (let field of fields) {
                if (!missing) {
                    const elem = "." + field
                    $(elem).each(function () {
                        if ($(this).val() == '') {
                            alert('You must fill in all ' + field + ' fields!')
                            missing = true
                            return false
                        }
                    })
                }
            }
            if (!missing) location.href = 'confirmation.html'
        })
