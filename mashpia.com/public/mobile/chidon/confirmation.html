  <link rel="stylesheet" href="cropper/dist/cropper.css">
  <link rel="stylesheet" href="cropper/avatar/css/main.css">
  <style>
    html,
    body,
    span,
    p,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    div,
    button,
    i,
    input {
      color: #1b2b51;
    }

    .btn-primary {
      background-color: #2b529e;
      border-color: #2b529e;
    }

    .control-label {
      padding-top: 3%;
    }

    label {
      vertical-align: middle;
    }

    .xtra {
      font-size: 14px;
      padding: 6px;
    }

    .form-control {
      border-radius: 5px !important;
      border: 1px solid #b1b1b1 !important;
      margin: 3px;
    }

    hr {
      margin-bottom: 0;
    }

    .btn-primary.active,
    .btn-primary.focus,
    .btn-primary:active,
    .btn-primary:focus,
    .btn-primary:hover,
    .open > .dropdown-toggle.btn-primary {
      background-color: #2b529e !important;
    }

    .check-accept span {
      font-size: 14px;
      font-family: font3;
      line-height: 1.2;
    }

    #instructions {
      font-size: 18px;
      line-height: 1.5;
      background-color: lightgrey;
      padding: 10px;
      border: 1px solid darkgrey;
    }

    a:link {
      text-decoration: none;
    }
  </style>
</head>

<body>
<div class="container login-page" id="crop-avatar">
  <div class="login-header">
    <span class="span12">Chidon Confirmation</span>
  </div>
  <div class="span12 body">
    <div class="login-box">
      <div class="login-box-body">
        <div id="regInfo">
          <div class="row">
            <div class="col-sm-12" id="instructions">
              Thank you for reviewing your Chidon Registration details. Please note that by clicking confirm here, all changes will be finalized.
            </div>
          </div>
          <br />
          <div class="row">
            <div class="col-sm-12" id="confirmInfo" style="font-size: 18px; line-height: 1.5;">

            </div>
          </div>
          <div class="row">
            <div class="col-sm-12" id="payment" style="font-size: 18px; line-height: 1.5;">
              Total Payment: $<span id="total"></span><br />

            </div>
          </div>
          <div class="row">
            <div class="col-sm-12">
              <a href="chidon_sweater_summary.html">
                <button id="back" class="btn btn-primary btn-block">Back</button>
              </a>
              <br />
              <button id="confirm" class="btn btn-primary btn-block">Confirm</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="../../bootstrap/js/bootstrap.min.js" type="text/javascript"></script>
<script src="/mobile/reg/plugins/iCheck/icheck.min.js" type="text/javascript"></script>
<script src="js/js.cookie.js" type="text/javascript"></script>
<script>
  // wrap ajax calls in promise
  function getAjax(url, data) {
    return new Promise((resolve, reject) => {
      $.post(url, data, function (result) {
        resolve(JSON.parse(result))
      })
    })
  }

  let balance = 0
  let paid = false

  $(function () {
    getAjax('ajax/getRegInfo.php', { admin: Cookies.get('admin') })
      .then(res => {
        const info = res.info
        let reg = 0
        let extra = 0
        for (id in info) {
          const child = info[id]
          reg += parseFloat(child.balance)
        }
        balance = reg + extra
        if (balance) {
          let html = ''
          html += `Balance owing from Registration: $${reg}<br />`
          html += `Balance owing from Extra Purchases: $${extra}<br />`
          html += `Please use the form below to pay for what's owed.<br /><br />`
          $("#confirmInfo").append(html)
          $("#total").text(balance)
          $("#payment").show()
        }
      })
      .catch(error => {
        alert('There was an error.')
        console.log(error)
      })

    $("#confirmation").click( function() {
      if (balance || extra) {
        if (!paid) {
          alert('You must pay the amount owing before you can confirm!')
          return false
        }
      }
      $.post('ajax/confirmation.php', { field: 'confirmed_chidon_5781', admin: Cookies.get('admin') }, function(result) {
        const res = JSON.parse(result)
        if (res.success) {
            alert('Confirmed.')
            location.reload()
        } else {
            alert(res.error)
            console.log(res.sql)
        }
      })
    })
  })
</script>

</body>
