						<div class="row">
							<div class="col-xs-10" style="padding: 5px; padding-bottom: 0; margin-left: 30px;">
	                          <label class="check-accept">

	                              <span>&nbsp;&nbsp;I would like to sponsor a child’s chidon trip.</span>

	                      </div>
						</div>
						<div class="row sponsorInfo" style="display: none">

							<div class="col-sm-3">
							  <select class="form-control" name="trips" id="trips">

						</div>
                    	<div class="row">
							<!--
	                        <div class="col-xs-12">
	                          <div class="form-group has-feedback" id="divcreditcard">
	                            <select id="cardtype" name="cardtype" class="selectpicker show-tick form-control"  data-style="btn-default">
	                                <option data-icon="fa fa-credit-card" selected disabled>&nbsp;&nbsp;Credit Card</option>

	                          <label class="check-accept">
	                              <input type="checkbox" name="accept" id="accept" class="minimal-red" /> 
	                              <span>&nbsp;&nbsp;I understand that the cost per child is $250. Thanks to our sponsors and kind donors
								  the cost has been reduced to $136.</span>
	                          </label>
	                      </div>
	                  </div>-->
					  <!--<div class="row">
	                      <div class="col-xs-10" style="padding: 5px; padding-bottom: 0; margin-left: 30px;">
	                          <label class="check-accept">
	                              <input type="checkbox" name="waiver" id="waiver" class="minimal-red" />

								  $<span id="amount">136</span>.</span>

	                      <div class="col-xs-12">
	                          <button type="submit" id="btn_create"  class="btn btn-primary btn-block H8">
	                              <b>Pay</b>
	                          </button>

        <script src="bootstrap/js/bootstrap.min.js" type="text/javascript"></script>
		<script src="/mobile/reg/plugins/iCheck/icheck.min.js" type="text/javascript"></script>
		<script type="text/javascript" src="../js/spin.js"></script>
		<script src="js/js.cookie.js" type="text/javascript"></script>
		
        <script>
            $(function() {
    			$('input').iCheck({
		            checkboxClass: 'icheckbox_square-blue',
		            radioClass: 'iradio_square-blue',
		            increaseArea: '20%' // optional
		        });
		        
		        var url = decodeURI(location.toString());
				var pos = url.indexOf('='); 
				var str = url.substring( pos+1 );
				var pos2 = str.indexOf('&');
				var pos3 = str.indexOf('=');
				var id = str.substring( 0, pos2 );
				var name = str.substring( pos3+1 );
				$("#name").text(name);
				
				var admin_id = Cookies.get('admin');
				if (!admin_id) {
					//location.href = "/mobile";
				}
				
				$.post('/mobile/reg/ajax/checkAuth.php', { user_id : id, admin_id : admin_id }, function( success ) {
					if (success == 0) {
						//location.href = "/mobile";
					}
				});
				
				var year;
				$.ajax({
					type : "POST",
					url : "ajax/getYear.php",
					async : false, 
					success : function( info ) {
						year = info;
					}
				});
				
				// set amount
				var amount;
				recalc();
				
				var html = '';
				for (var i = 1; i <= 10; i++) {
					html += "<option value='" + i + "'>" + i + "</option>";
				}
				$("#trips").append(html);
				
				$("#payment").change( function() {
					recalc();
				});
				
				$("#sponsor").on('ifChecked', function() {
					$(".sponsorInfo").show();
					recalc();
				});
				
				$("#sponsor").on('ifUnchecked', function() {
					$(".sponsorInfo").hide();
					recalc();
				});
				
				$("#trips").change( function() {
					recalc();
				});
				
				function recalc() {
					amount = parseInt($("#payment").val());
					if ($("#sponsor:checked").length) {
						var num = parseInt($("#trips").val());
						amount += num * amount;
					} 
					$("#total").text('$' + amount);
					$("#amount").text(amount);
				}
				
				$("#btn_create").click( function() {
					if (!$("#agree").is(":checked")) {
						alert('You must indicate your agreement to the charge.');
						return false;
					}
					
					var ccnum = $("#cardnumber").val();
					var exp = $("#expiration").val();
					var zip = $("#zip").val();
					
					if (ccnum == '' || exp == '' || zip == '') {
						alert("All fields are required.");
						return false;
					}
					
					var sponsor = 0;
					if ($("#sponsor:checked").length) sponsor = 1;
			        
			        //$("#btn_create").attr('disabled', 'disabled');
			        //alert(amount); return false;
					$("#spinner").siblings('div').css('opacity',0.1);
					var opts = {
						lines: 10, // The number of lines to draw
						length: 26, // The length of each line
						width: 12, // The line thickness
						radius: 26, // The radius of the inner circle
						scale: 1, // Scales overall size of the spinner
						corners: 1, // Corner roundness (0..1)
						color: 'grey', // #rgb or #rrggbb or array of colors
						opacity: 0.5, // Opacity of the lines
						rotate: 0, // The rotation offset
						direction: 1, // 1: clockwise, -1: counterclockwise
						speed: 1, // Rounds per second
						trail: 60, // Afterglow percentage
						fps: 20, // Frames per second when using setTimeout() as a fallback for CSS
						zIndex: 2e9, // The z-index (defaults to 2000000000)
						className: 'spinner', // The CSS class to assign to the spinner
						top: '50%', // Top position relative to parent
						left: '50%', // Left position relative to parent
						shadow: true, // Whether to render a shadow
						hwaccel: true, // Whether to use hardware acceleration
						position: 'absolute' // Element positioning
					};
					var target = document.getElementById('spinner');
					new Spinner(opts).spin(target);
			
					$.post('ajax/processPayment.php', {
						admin : admin_id, 
						number : ccnum, 
						expiry : exp, 
						zip : zip, 
						amount : amount, 
						reg_id : id, 
						year : year,
						sponsor : sponsor, 
						numTrips : parseInt($("#trips").val()),
						sponsorBaseAmount : parseInt($("#payment").val())
			        }, function( success ) {
						$("#spinner").siblings('div').css('opacity',1);
						$("#spinner").empty();
			        	if ( success == 1 ) {
							$("#btn_create").attr('disabled', 'disabled');
							alert("Wait! Your enrollment is not yet confirmed. Your Chidon coordinator will be in touch with you to confirm that all of your information is correct.");
							location.href = "https://mashpia.com/mobile";
			        	} else {
			        		alert( success );
			        		return false;
			        	}
			        });	
			    });		
            });
        </script>
