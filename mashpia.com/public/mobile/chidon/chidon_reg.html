<div class="container login-page" id="crop-avatar">
    <div class="login-header">
        <span class="span12">Chidon Reg Info</span>

    <div class="span12 body">
        <div class="login-box">

                <div id="regInfo">

                        <div class="col-sm-12" id="instructions">

                            If the balance is incorrect, please email zelda@tzivoshashem.org with a screenshot of this page.

                    </div>
                    <div class="row">
                        <div class="col-sm-12" id="purchaseInfo">

                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-12">
                            <a href="chidon_purchases.html">
                                <button id="continue" class="btn btn-primary btn-block">Continue</button>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

</div>
<script src="../../bootstrap/js/bootstrap.min.js" type="text/javascript"></script>
<script src="/mobile/reg/plugins/iCheck/icheck.min.js" type="text/javascript"></script>
<script src="js/js.cookie.js" type="text/javascript"></script>
<script>
    // wrap ajax calls in promise
    function getAjax(url, data) {
        return new Promise((resolve, reject) => {
            $.post(url, data, function (result) {
                resolve(JSON.parse(result))
            })
        })
    }

    $(function () {
        getAjax('ajax/getPurchases.php', { admin: Cookies.get('admin') })
            .then(res => {
                const children = res.children
                const transactions = res.transactions

                getAjax('ajax/getRegInfo.php', { admin: Cookies.get('admin') })
                    .then(res => {
                        const info = res.info
                        let total = 0

                        let html = '<br /><div style="font-size: 18px; line-height: 1.5;">'

                        html += '<b>Registration Info</b><br /><br />'
                        let family_id
                        for (let id in children) {
                            family_id = info[children[id].th_chidon_id].admin_id
                            break
                        }
                        html += `Family ID: ${family_id}<br /><br />`

                        for (let id in children) {
                            const child = children[id]
                            html += `Chidon ID: ${child.th_chidon_id} <br />Name: ${child.first} `
                            html += "<br />Registration Status: "
                            if (!child.date_paid) {
                                html += '<span style="color: red">NOT REGISTERED</span>'
                                // $("#update").show()
                            } else {
                                // check if there's actual payment
                                const admin_id = child.parent_id
                                if (!transactions[admin_id]) {
                                    html += '<span style="color: red">REGISTERED BUT NO PAYMENT FOUND (' + children[id].date_paid + ')</span>'
                                } else {
                                    html += 'REGISTERED (' + children[id].date_paid + ')'
                                }
                            }
                            // more info
                            if (info[child.th_chidon_id]) {
                                const child_info = info[child.th_chidon_id]
                                html += `<br />Registration Fee: $${child_info.reg_fee}`
                                if (parseInt(child_info.chidon_drive) > 0) {
                                    html += `<br />Chidon Drive Total Raised: $${child_info.chidon_drive}`
                                    html += `<br />Chidon Drive Subsidy: $${child_info.subsidy}`
                                }
                                if (parseInt(child_info.coupon) > 0) html += `<br />Coupon: $${child_info.coupon} - ${child_info.coupon_reason}`
                                html += `<br />Paid: $${child_info.paid}`
                                html += `<br />Registration Balance: $${child_info.balance}`
                                html += '<br /><br />'
                                total += parseFloat(child_info.balance)
                            } else {
                                html += '<br /><br />'
                            }
                        }
                        if (total) html += '<span style="color: red">'
                        html += '<b>Total Registration Balance: $' + total + '</b>'
                        if (total) html += '</span>'
                        html += '<br /><br />'

                        $("#purchaseInfo").append(html)

                        // if already confirmed disable all selects / inputs
                        // $.post('ajax/checkConfirmation.php', { field: 'confirmed_chidon_5781', admin: Cookies.get('admin') }, function(result) {
                        //     if (parseInt(result) == 1) {
                        //         $("button").attr('disabled', true)
                        //         // $("#confirmation").text('Already Confirmed')
                        //         location.href = 'confirmation.html'
                        //     }
                        // })
                    })
                    .catch(error => {
                        alert('There was an error.')
                        console.log(error)
                    })
            })
            .catch(error => {
                alert('There was an error.')
                console.log(error)
            })

        // $("#confirmation").click( function() {
        //     $.post('ajax/confirmation.php', { field: 'confirmed_reg', admin: Cookies.get('admin') }, function(result) {
        //         const res = JSON.parse(result)
        //         if (res.success) {
        //             alert('Confirmed.')
        //             location.reload()
        //         } else {
        //             alert(res.error)
        //             console.log(res.sql)
        //         }
        //     })
        // })
    });
</script>
