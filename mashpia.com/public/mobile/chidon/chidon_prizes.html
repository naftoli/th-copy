<body>
<div class="container login-page" id="crop-avatar">
    <div class="login-header">
        <span class="span12">Chidon Prizes</span>
    </div>
    <div class="span12 body">
        <div class="login-box">
            <div class="login-box-body">
                <div id="regInfo">
                    <div class="row">
                        <div class="col-sm-12" style="font-size: 18px; line-height: 1.5">

                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-12" id="children">

                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-12" id="prizes">

                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-12">
                            <button id="confirmation" class="btn btn-primary btn-block">Confirm Prizes</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="bootstrap/js/bootstrap.min.js" type="text/javascript"></script>
<script src="/mobile/reg/plugins/iCheck/icheck.min.js" type="text/javascript"></script>
<script src="js/js.cookie.js" type="text/javascript"></script>
<script>
    let prizes = []
    let children = []
    let cart = {}
    let currentUser = 0

    const addToCart = (user_id, itemToAdd) => {
        // check that item isn't already in cart
        let add = true
        if (cart[user_id]) {
            for (item of cart[user_id]) {
                if (item.prize_id == itemToAdd.prize_id) {
                    add = false
                    break
                }
            }
        }
        if (add) {
            if (!cart[user_id]) cart[user_id] = []
            // make sure child has enough money to add
            const cap = children[currentUser].option == 'C' ? 200 : 100
            let total = 0
            for (item of cart[user_id]) {
                total += parseInt(item.price)
            }
            if ((total + parseInt(itemToAdd.price)) > cap) {
                alert('You do not have enough money to add this prize!')
                return false
            }
            cart[user_id].push(itemToAdd)
            return true
        }
    }

    const removeFromCart = (user_id, itemToRemove) => {
        for (let i in cart[user_id]) {
            const item = cart[user_id][i]
            if (item.prize_id == itemToRemove.prize_id) {
                cart[user_id].splice(i, 1)
                break
            }
        }
    }

    const modifyCart = (user_id, prize_id, he_name) => {
        for (item of cart[user_id]) {
            if (item.prize_id == prize_id) {
                item.he_name = he_name
            }
        }
    }

    const setupChildren = () => {
        let html = "<select name='child' id='child' class='form-control btn btn-primary'>";
        for (let id in children) {
            const child = children[id]
            // only show children that can choose prizes
            if (parseInt(child.shabbaton_expert) == 1 || parseInt(child.shabbaton_trophy) == 1) {
                if (child.paid > 25) html += `<option value=${id}>${child.first}</option>`
            }
        }
        html += "</select><br /><br />"
        $("#children").append(html)

        // set current user to first child
        for (let id in children) {
            currentUser = id
            break
        }
    }

    const setupPrizes = () => {
        $("#prizes").empty()
        const total = children[currentUser].option == 'C' ? 200 : 100
        let html = `<div style='font-size: 18px; margin-bottom: 20px;'>You can choose up to $${total} worth of prizes.</div>`
        // loop through prizes checking off the ones that the child already chose
        for (prize_id in prizes) {
            const prize = prizes[prize_id]
            html += `<div style="height: 85px;">
                        <input type="checkbox" id="prize_${prize_id}" name="prize_${prize_id}" class='prize'"
                        data-info="${prize_id}:${prize.price}:${prize.prize_name}:${prize.he_name ? prize.he_name : ''}"`
            // check cart if prize was chosen
            if (cart[currentUser]) {
                for (let item of cart[currentUser]) {
                    if (parseInt(item.prize_id) == prize_id) html += " checked='checked'"
                }
            }
            html += ` />
                        <img src="http://mashpia.com${prize.prize_picture}" style="float: right; height: 70px;" />
                        ${prize.prize_name}<br />`
            if (prize.size) html += `Size: ${prize.size}<br />`
            if (prize.color) html += `Color: ${prize.color}<br />`
            html += `<b>Price: $${prize.price}</b><br />`

            // add box for name if it's tefillin or leather sefer
            if (prize.prize_name.includes('Tefillin') || prize.prize_name.includes('Leather')) {
                html += `<input type="text" class="he_name" name="he_${prize_id}" data-id="${prize_id}" style="width: 200px;"`
                // check cart if prize was chosen
                if (cart[currentUser]) {
                    for (let item of cart[currentUser]) {
                        if (parseInt(item.prize_id) == prize_id) html += ` value='${item.he_name}'`
                    }
                }
                html += ` />`
            }

            html += `
                    </div>
                `
        }
        $("#prizes").append(html)
    }

    $(document).on('change', '#child', function () {
        const child = $(this).val()
        currentUser = child
        setupPrizes()
    })

    $(document).on('click', '.prize', function () {
        const info = $(this).data('info')
        const details = info.split(':')
        const item = {
            prize_id: details[0],
            price: details[1],
            prize_name: details[2],
            he_name: details[3] ? details[3] : null
        }
        console.log(item)
        const checked = $(this).is(":checked")
        if (checked) {
            if (!addToCart(currentUser, item)) {
                $(this).attr('checked', false)
            }
        } else {
            removeFromCart(currentUser, item)
        }
    })

    $(document).on('blur', '.he_name', function () {
        const he = $(this).val()
        const prize_id = $(this).data('id')
        modifyCart(currentUser, prize_id, he)
    })

    $("#confirmation").click( function () {
        $.post('ajax/savePrizes.php', { admin: Cookies.get('admin'), cart: cart }, function (result) {
            const res = JSON.parse(result)
            console.log(res)
            if (res.success) {
                alert('Saved.')
            } else {
                console.log(res.info)
                alert(res.error)
            }
        })
    })

    $(function () {
        // get children prizes
        $.post('ajax/getPurchases.php', { admin: Cookies.get('admin') }, function(result) {
            const info = JSON.parse(result)

            children = info.children
            setupChildren()

            const user_prizes = info.prizes
            // init cart for each user with prizes already chosen
            for (let user_id in user_prizes) {
                const items = user_prizes[user_id]
                for (let item of items) {
                    addToCart(user_id, item)
                }
            }

            $.post('/chidonOld/chidon_drive/ajax/chidon_prizes.php', function(result) {
                prizes = JSON.parse(result)
                setupPrizes()
            })
        })
    })
</script>
