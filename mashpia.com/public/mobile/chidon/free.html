<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Mobile Web Site</title>
        <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
        <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet" type="text/css" />
        <link href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css" rel="stylesheet" type="text/css" />
    	<link href="/mobile/reg/plugins/iCheck/all.css" rel="stylesheet" type="text/css" />
		<link href="css/style.css" type="text/css" rel="stylesheet" />
		<link href="css/responsive.css" type="text/css" rel="stylesheet" />
		<script src="js/jquery-1.9.1.min.js"></script>
		<style>
			.btn-primary {
				background-color: #2b529e;
    			border-color: #2b529e;
			}
			.control-label {
				padding-top: 4%;
			}
			.check-accept span {
				font-size: 18px;
				line-height: normal;
			}
			#total {
				color: red;
				font-weight: bold;
			}
			.form-control {
				border-radius: 5px !important;
				border: 1px solid #b1b1b1 !important;
				margin: 3px;
			}
			.btn-primary.active, .btn-primary.focus, .btn-primary:active, .btn-primary:focus, .btn-primary:hover, .open>.dropdown-toggle.btn-primary {
				background-color: #2b529e !important;
			}
			.login-box-body .form-group {
				border: 0 !important;
			}
		</style>
	</head>
	<body>
        <div class="container login-page">
            <div class="login-header">
                <span class="span12">Shabbaton Enrollment</span>
            </div>
            <div class="span12 body">
				<div id="spinner"></div>
				<!--
                <div class="logo">
                    <img src="chidon.jpg" style="max-width: 250px" class="img-responsive center-block">
                </div>
				-->
                <div class="login-box">
                    <div class="login-box-body">
						<div class="row">
							<div class="col-xs-12" style="font-size: 20px; padding: 20px; font-weight: bold;">		
								Enroll <span id="name"></span> for Shabbaton.
							</div>
						</div>
	                  <div class="row">
	                      <div class="col-xs-12">
	                          <button type="submit" id="btn_create"  class="btn btn-primary btn-block H8">
	                              <b>Enroll</b>
	                          </button>
	                      </div><!-- /.col -->
	                  </div>  
                	</div>
                </div>
            </div>
        </div>
        <script src="bootstrap/js/bootstrap.min.js" type="text/javascript"></script>
		<script src="/mobile/reg/plugins/iCheck/icheck.min.js" type="text/javascript"></script>
		<script type="text/javascript" src="../js/spin.js"></script>
		<script src="js/js.cookie.js" type="text/javascript"></script>
		
        <script>
            $(function() {
    			$('input').iCheck({
		            checkboxClass: 'icheckbox_square-blue',
		            radioClass: 'iradio_square-blue',
		            increaseArea: '20%' // optional
		        });
		        
		        var url = decodeURI(location.toString());
				var pos = url.indexOf('='); 
				var str = url.substring( pos+1 );
				var pos2 = str.indexOf('&');
				var pos3 = str.indexOf('=');
				var id = str.substring( 0, pos2 );
				var name = str.substring( pos3+1 );
				$("#name").text(name);
				
				var admin_id = Cookies.get('admin');
				if (!admin_id) {
					//location.href = "/mobile";
				}
				
				$.post('/mobile/reg/ajax/checkAuth.php', { user_id : id, admin_id : admin_id }, function( success ) {
					if (success == 0) {
						//location.href = "/mobile";
					}
				});
				
				var year;
				$.ajax({
					type : "POST",
					url : "ajax/getYear.php",
					async : false, 
					success : function( info ) {
						year = info;
					}
				});
				
				$("#btn_create").click( function(e) {			        
			        //$("#btn_create").attr('disabled', 'disabled');
			        //alert(amount); return false;
					e.preventDefault();
			        $.post('ajax/enroll_shabbaton.php', {
						admin : admin_id, 
			        	reg_id : id, 
			        	year : year
			        }, function( success ) {
			        	if ( success == 1 ) {
							alert("Your registration is being processed. You will receive a confirmation email from your Chidon Coordinator once your information is fully processed.");
							location.href = "https://mashpia.com/mobile";
			        	} 
			        });	
			    });		
            });
        </script>
        <script>
		  (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
		  (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
		  m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
		  })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
		  ga('create', 'UA-71974937-1', 'auto');
		  ga('send', 'pageview');
		</script>
	</body>
</html>
