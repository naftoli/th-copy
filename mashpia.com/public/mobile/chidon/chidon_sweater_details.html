<script>
    let cart = []

    const addToCart = item => {
        if (!cart.includes(item)) {
            cart.push(item)
            return true
        }
        return false
    }

    const removeFromCart = item => {
        for (let idx in cart) {
            if (cart[idx].id == item.id) {
                cart.splice(idx, 1)
                return true
            }
        }
        return false
    }

    const purchaseSweaters = cart => {

    }

    $("#confirmation").click(function () {

    })

    function capitalize(s)
    {
        return s && s[0].toUpperCase() + s.slice(1);
    }

    $(function () {
        // get sweaters / extra celeb box
        $.post('ajax/getPurchases.php', { admin: Cookies.get('admin') }, function (result) {
            const info = JSON.parse(result)

            $.post('/chidonOld/chidon_drive/ajax/sweaterInfo.php', function (result) {
                const sweaters = JSON.parse(result)
                const types = ['mother', 'father', 'bubby', 'zaidy']
                const sizes = {
                    'Adult XS': 'xs',
                    'Adult Small': 'small',
                    'Adult Medium': 'medium',
                    'Adult Large': 'large',
                    'Adult XL': 'xl'
                }
                let html = '<div style="font-size: 18px; line-height: 1.8;">'
                for (let type of types) {
                    html += `<input type='checkbox' name='sweater_${type}' class='sweater' value='sweater_${type}'`
                    // check if user has already purchased this sweater
                    const purchases = info.purchases
                    let purchased = 'sweater_' + type
                    let purchased_size = ''
                    if (purchases[purchased]) {
                        purchased_size = purchases[purchased]
                        console.log(type + ':' + purchased_size)
                        html += ' checked '
                    }
                    html += `/> ${capitalize(type)} Sweater <select name="sweater-size" class="sweater-size">`
                    for (let size in sizes) {
                        if (sweaters[type][size].qty < 1) {
                            html += `<option value="${type}:${sizes[size]}:0"`
                            if (purchased_size == sizes[size]) html += ' selected '
                            html += `>${capitalize(size)} - SOLD OUT</option>`
                        } else {
                            html += `<option value="${type}:${sizes[size]}:${sweaters[type][size].qty}"`
                            if (purchased_size == sizes[size]) html += ' selected '
                            html += `>${capitalize(size)} - only ${sweaters[type][size].qty} left</option>`
                        }
                    }
                    html += '</select><br />'
                    html += `<div style="margin-left: 30px;"><input type="checkbox" name="sweater_${type}_shipping" class="sweater_${type}_shipping" value="sweater_${type}_shipping"`
                    if (parseInt(purchases[`sweater_${type}_ship`])) html += ' checked '
                    html += `/> Ship to: <input type='text' size='30' name="sweater_${type}_ship_addr" class="sweater_${type}_ship_addr"`
                    if (purchases[`sweater_${type}_ship_addr`]) {
                        let val = purchases[`sweater_${type}_ship_addr`]
                        html += `value="${val}"`
                    }
                    html += ` /> (+$10)</div><hr style="border-top: 1px solid #2c539e; width: 75%; padding-bottom: 10px;" />`
                }
                html += '<br /></div>'
                $("#sweaters").empty()
                $("#sweaters").append(html)
            })
        })
    })
</script>
