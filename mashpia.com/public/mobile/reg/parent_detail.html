<script>
    document.addEventListener("DOMContentLoaded", function () {
        const now = new Date()
        const midnight = new Date('2023-12-21T00:00:00')
        if (now.getTime() < midnight.getTime()) $(".heyTeves").show()

        if (localStorage.getItem("locallang") == 'he' || Cookies.get('lang') == 'he') $("#news-link").hide();

        // allow parents to swipe to open a child's account.
        function setSwiper() {
            $("#children .row").each(function () {
                var h = new Hammer(this);
                var id = $(this).find("table td:last-child").attr('id');
                h.on("swipe", function () {
                    location.href = "medals/?id=" + id;
                });
            });
            translate(); // on mobile\js\translation\parent-detail\parent_detail.js
        }

        // make sure we have a cookie
        var admin = Cookies.get('admin');
        if (!admin) {
            window.location = "index.html";
        }

        // remove any shipping cookies
        Cookies.remove('shipping');
        Cookies.remove('shipOpt');
        Cookies.remove('destination');

        // find out if we should show link for chidon registration
        $(".chidon_reg").click(function () {
            Cookies.set('chidon_admin', admin)
            location.href = '/chidonOld/chidon_drive/site/enrollment/enrollNew.html'
        })

        // get the current year
        var year;
        $.ajax({
            type: "POST",
            url: "/mobile/chidon/ajax/getYear.php",
            async: false,
            success: function (info) {
                year = info;
            }
        });

        // load children
        var parent_id;
        var allChildren = []
        var childrenToRegister = [];
        $.post('ajax/getChildren.php', {
            admin: admin
        }, function (success) {
            if (success == -1) {
                window.location = "index.html";
            } else {
                var data = $.parseJSON(success);
                var parent = data.parent;
                var children = data.children;
                allChildren = children

                parent_id = parent.id;
                $("#family_id").text(parent_id)

                var father = parent.father;
                var mother = parent.mother;

                if (father)
                    $(".father").text(father.toUpperCase());
                if (mother)
                    $(".mother").text(mother.toUpperCase());

                var fatherPic = parent.fatherPic;
                var motherPic = parent.motherPic;

                if (fatherPic != '' && fatherPic != null) {
                    $("#father").attr('src', fatherPic);
                }
                var w = $("#father").width();
                //var newW = w * 1.1;
                //$("#father").width( newW );
                //$("#father").height( newW );

                if (motherPic != '' && motherPic != null) {
                    $("#mother").attr('src', motherPic);
                }
                //$("#mother").width( newW );
                //$("#mother").height( newW );

                //set auction button link
                //for (var c in children) {
                //	$("#auction").attr('href', '/mobile/auction/category2.html?id=' + c);
                //	break;
                //}
                if (parent.gear > 0) $(".gear").show()
                else $(".gear").hide()

                // sepearate registered and un-registered
                var registred_children = {};
                var unregistered_children = {};

                for (var c in children) {
                    var child = children[c]

                    if (child.chidonRegistered && parseInt(child.chidonSchoolConfirmed)) {
                        $(".subsidy").show()
                    }

                    if (child.schoolRegistered && child.schoolTypeRegistered && !child.user_registered) {
                        unregistered_children[c] = child;
                        childrenToRegister.push({
                            id: c,
                            reg: 0,

                            anash: child.anashkinder,
                            shliach: child.myshliach
                        });
                    } else {

                    }
                }

                Cookies.set('toRegister', childrenToRegister);

                // Grab the template script
                console.log(parent)
                var tplScript = $("#childrenTpl").html();

                // Compile the template
                var tpl = Handlebars.compile(tplScript);

                // Pass our data to the template
                var registered_html = tpl({
                    children: registred_children
                });
                var unregistered_html = tpl({
                    children: unregistered_children
                });
                // put the registered kids first
                var html = registered_html + unregistered_html;
                if ($.trim(html) === '') {
                    $("#no-children").show();
                } else {
                    // Add the compiled html to the page
                    $(".chilrens").append(html);
                    setSwiper();
                    $(".year").text(year);

        $(document).on('click', '.report-card', async function () {
            const tracks = ['maven', 'pro', 'expert', 'genius']
            const learningTime = {
                'Yesod': 10,
                'Yediah': 20,
                'Havonah': 30,
                'Iyun': 45
            }

            const id = $(this).parent().parent().parent().attr('id')
            const child = allChildren[id]
            console.log(child)
            const res = await fetch('/chidonTests/api/reportCards/?user_id=' + id + '&class_id=' + child.class_id + '&school_id=' + child.school_id)
            const report_card_info = await res.json()
            const report_card = report_card_info[0]
            const learning_info = await fetch('/chidonTests/api/reportCards/getTotalLimmud.php?id=' + id)
            const learned = await learning_info.json()
            let time_learned = 0
            for (let i = 0; i < learned.length; i++) {
                time_learned += parseInt(learned[i])
            }

            $("#child-name").text(child.first + ' ' + child.last)
            $("#child-school").text(child.school)
            $("#child-grade").text(child.grade)
            $("#child-track").text(report_card.currentTrack)
            $("#child-highest-track").text(report_card.highestTrackPassed == null ? '' : report_card.highestTrackPassed)
            $("#child-learning-commitment").text(learningTime[report_card.currentTrack])
            $("#child-actual-learning").text(time_learned)

            let html = ''
            if (report_card.tests && report_card.tests[1]) {
                html += `
            <table class="table">
                <thead>
                    <tr>
                        <th>Test #</th>
                        <th>Questions<br/>/Mark</th>
                        <th>Yesod</th>
                        <th>Yediah</th>
                        <th>Havonah</th>
                        <th>Iyun</th>
                    </tr>
                </thead>
                <tbody>
            `
                let totals = {
                    'maven': 0,
                    'pro': 0,
                    'expert': 0,
                    'genius': 0
                }
                let actualTests = 0
                for (let i = 1; i <= 3; i++) {
                    if (report_card.tests[i]) {
                        if (i > 1  && child['show_report_card_'+i] == 0) continue
                        actualTests++
                        let test = report_card.tests[i]
                        html += '<tr><td rowspan="2" style="text-align: center; vertical-align: middle">' + i + '</td><td>Answered Correctly</td>'
                        for (let track of tracks) {
                            if (report_card.highestTrack == track) html += '<td style="font-weight: bold">'
                            else html += '<td>'
                            html += report_card.scores[i][track] + ' / ' + report_card.questions[track] + '</td>'
                        }
                        html += '</tr><tr><td>Mark</td>'
                        for (let track of tracks) {
                            if (report_card.highestTrack == track) html += '<td style="font-weight: bold">'
                            else html += '<td>'
                            html += (test[track] ? test[track] : '') + '%</td>'
                            totals[track] += test[track] ? test[track] : 0
                        }
                        html += '</tr>'
                    }
                }
                html += '<tr><td>Needed Avg</td><td></td>'
                for (let track of tracks) {
                    if (report_card.highestTrack == track) html += '<td style="font-weight: bold">'
                    else html += '<td>'
                    html += report_card.avgs[track] + '%</td>'
                }
                html += '</tr>';
                // if (actualTests > 1) {
                    html += '<tr><th>Total Avg</th><th></th>'
                    for (let track of tracks) {
                        html += '<th>' + Math.round(totals[track] / actualTests) + '%</th>'
                    }
                    html += '</tr>'
                // }
                html += '<tr><th colspan="2">Reward</th><th>Sweater & Gift</th><th>Sweater, Gift & Prizes</th>' +
                  '<th>Sweater, Gift, Prizes & Regional Trip</th><th>Sweater, Gift, Prizes, Regional Trip & Trophy Contestant</th></tr>'
                html += '</tbody></table>'
            } else {
                html += '<h5>No test marks are available yet.</h5>'
            }
            $("#report-card-table").html(html)

            $("#reportCard").modal('show')
        })
    });
