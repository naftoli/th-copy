  // JavaScript example
  function isPackagedApp() {
      const userAgent = navigator.userAgent;
      
      // Check for webview indicators
      const webviewIndicators = [
          /wv/,           // Android WebView
          /Version\/.*Mobile\/.*Safari/,  // iOS WebView
          /Electron/,     // Electron
          /Cordova/,      // Cordova
          /Capacitor/,    // Capacitor
      ];
      
      return webviewIndicators.some(pattern => pattern.test(userAgent));
  }

        html += '<tr><th>Total Avg</th><th></th>'
        for (let track of tracks) {
          html += '<th class="' + track + '">' + Math.round(totals[track] / actualTests) + '%</th>'
        }
        html += '</tr>'
        // }
        html += '<tr><th colspan="2">Reward</th><th>Sweater & Gift</th><th>Sweater, Gift & Prizes</th>' +
          '<th>Sweater, Gift, Prizes & Regional Trip</th>'
        if (showIyun) html += '<th class="genius">Sweater, Gift, Prizes, Regional Trip & Trophy Contestant</th>'
        html += '</tr>'
        html += '</tbody></table>'
      } else {
        html += '<h5>No test marks are available yet.</h5>'
      }

      $("#report-card-table").html(html)
      if (showIyun) $(".genius").show()
      $("#reportCard").modal('show')
    })
  });
</script>
