    <script>
        document.addEventListener("DOMContentLoaded", function () {

            if (localStorage.getItem("locallang") == 'he' || Cookies.get('lang') == 'he') $("#news-link").hide();

            // allow parents to swipe to open a child's account.
            function setSwiper() {
                $("#children .row").each(function () {
                    var h = new Hammer(this);
                    var id = $(this).find("table td:last-child").attr('id');
                    h.on("swipe", function () {
                        location.href = "medals/?id=" + id;
                    });
                });

                translate(); // on mobile\js\translation\parent-detail\parent_detail.js


            }

            // make sure we have a cookie
            var admin = Cookies.get('admin');
            if (!admin) {
                window.location = "index.html";
            }

            // remove any shipping cookies
            Cookies.remove('shipping');
            Cookies.remove('shipOpt');
            Cookies.remove('destination');

            // get the current year
            var year;
            $.ajax({
                type: "POST",
                url: "/mobile/chidon/ajax/getYear.php",
                async: false,
                success: function (info) {
                    year = info;
                }
            });

            // load children
            var parent_id;
            var childrenToRegister = [];
            $.post('ajax/getChildren.php', {
                admin: admin
            }, function (success) {
                if (success == -1) {
                    window.location = "index.html";
                } else {
                    var data = $.parseJSON(success);
                    var parent = data.parent;
                    var children = data.children;

                    parent_id = parent.id;
                    var father = parent.father;
                    var mother = parent.mother;

                    if (father)
                        $(".father").text(father.toUpperCase());
                    if (mother)
                        $(".mother").text(mother.toUpperCase());

                    var fatherPic = parent.fatherPic;
                    var motherPic = parent.motherPic;

                    if (fatherPic != '' && fatherPic != null) {
                        $("#father").attr('src', fatherPic);
                    }
                    var w = $("#father").width();
                    //var newW = w * 1.1;
                    //$("#father").width( newW );
                    //$("#father").height( newW );

                    if (motherPic != '' && motherPic != null) {
                        $("#mother").attr('src', motherPic);
                    }
                    //$("#mother").width( newW );
                    //$("#mother").height( newW );

                    //set auction button link
                    //for (var c in children) {
                    //	$("#auction").attr('href', '/mobile/auction/category2.html?id=' + c);
                    //	break;
                    //}

                    // sepearate registered and un-registered
                    var registred_children = {};
                    var unregistered_children = {};

                    for (var c in children) {
                        var child = children[c]

                        if (child.chidonRegistered && parseInt(child.chidonSchoolConfirmed)) {
                            $(".subsidy").show()
                        }

                        if (child.schoolRegistered && child.schoolTypeRegistered && !child.user_registered) {
                            unregistered_children[c] = child;
                            childrenToRegister.push({
                                id: c,
                                reg: 0,
                                reviewed: 0,
                                anash: child.anashkinder,
                                shliach: child.myshliach
                            });
                        } else {
                            registred_children[c] = child;
                        }
                    }

                    Cookies.set('toRegister', childrenToRegister);

                    // Grab the template script
                    console.log(parent)
                    var tplScript = $("#childrenTpl").html();

                    // Compile the template
                    var tpl = Handlebars.compile(tplScript);

                    // Pass our data to the template
                    var registered_html = tpl({
                        children: registred_children
                    });
                    var unregistered_html = tpl({
                        children: unregistered_children
                    });
                    // put the registered kids first
                    var html = registered_html + unregistered_html;
                    if ($.trim(html) === '') {
                        $("#no-children").show();
                    } else {
                        // Add the compiled html to the page
                        $(".chilrens").append(html);
                        setSwiper();
                        $(".year").text(year);
                    }
                }
            });

            $.post('ajax/checkAdminInfo.php', {
                admin: admin,
                onlyEmail: true
            }, function (result) {
                result = JSON.parse(result);
                if (!result.success && !localStorage.getItem('email_notified')) {
                    localStorage.setItem('email_notified', true);
                    location.href = "edit_profile.html";
                }
            });

            $(document).on('click', ".re_register", function () {
                var id = $(this).parent().parent().parent().attr('id');
                if (window.location.protocol == 'https:') location.href = "/mobile/registration/?user_id=" + id;
                else location.href = "https:" + window.location.hostname + "/mobile/registration/?user_id=" + id;
            });

            $(document).on('click', '.notify', function () {
                // send to form
                window.open('https://www.thechidon.com/registration-notification/', '_blank')
            })

            $(document).on('click', '.del', function () {
                var del = confirm('Are you sure you want to delete this child from your profile?');
                //alert( del );
                if (del) {
                    var id = $(this).parent().parent().attr('id');
                    $.post('ajax/delChild.php', {
                        child: id,
                        parent: admin
                    }, function (success) {
                        if (success) {
                            alert(i18next.t('AlertReCPr'));
                            location.href = "parent_detail.html";
                        } else {
                            alert(i18next.t('AlertDEChp'));
                        }
                    });
                }
            });

            $(document).on('click', '.chidonPhoto', function () {
                var id = $(this).parent().parent().parent().parent().attr('id');
                location.href = "upload_photo.html?id=" + id;
            });

            $(document).on('click', '.invitation', function () {
                var id = $(this).attr('id')
                window.open('/chidonOld/invitations/index.html?id=' + id, '_blank')
            })

            $(document).on('click', '.shabbaton', function() {
                Cookies.set('chidon_admin', admin)
                location.href = 'https://chidondrive.com/site/enroll_5782.html';
            });

            $(document).on('click', '.shabbatonConfirm', function() {
                let url = "/mobile/chidon/chidon_purchases.html";
                location.href = url;
            });

            $(document).on('click', '.confirm_chidon', function () {
                location.href = '/mobile/chidon/confirmation_intro.html'
            })

            $(document).on('click', '.chidondrive', function () {
                if (location.href.includes('mashpia.com')) location.href =
                    "https://chidondrive.com/site/login.html";
                else location.href = "/chidonOld/chidon_drive/site/login.html";
            });

            $(document).on('click', '.noSchoolShabbaton', function () {
                alert(i18next.t('AlertOpRe'));
            });

            $(document).on('click', '.story', function () {
                location.href =
                    "https://docs.google.com/a/tzivoshashem.org/forms/d/1fhls5odH69pWlzpp3RGtSfVCg_G9heh0VjOqHl44Mug/edit";
