<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tzivos Hashem | Raffle 5 Page</title>
    <link rel="stylesheet" href="css/all.css" as="style" onload="this.rel='stylesheet'">
    <link href="../fonts/stylesheet.css" rel="stylesheet">
    <link rel="stylesheet" href="/styles/admin/loader.css">
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,300i,400,400i,600,600i,700"
        rel="stylesheet">
    <script src='https://cdnjs.cloudflare.com/ajax/libs/axios/0.20.0/axios.min.js'></script>
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js" type="text/javascript"></script>
    </script>
    <script src="raffle5.js"></script>
    <script defer src="https://use.fontawesome.com/releases/v5.0.9/js/all.js"
        integrity="sha384-8iPTk2s/jMVj81dnzb/iFR2sdA7u06vHJyyLlAd4snFpCl/SnyUjRrbdJsw1pGIl"
        crossorigin="anonymous"></script>
    <style>
        html,
        body,
        span,
        p,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        div,
        button,
        i,
        input {
            color: #1b2b51;
        }

        html,
        body {
            height: 100%;
            width: 100%;
            display: flex;
        }

        body>div {
            width: 100%;
        }

        p,
        h2 {
            color: #1b2b51;
        }

        .rafflesContainer {
            flex: 1;
            padding: 30px;
            max-width: 700px;
            margin: auto;
        }

        .item {
            position: relative;
            /* float: left; */
        }

        .item .raffleFlagContainer,
        .smallRaffleFlagContainer {
            position: relative;
            margin-bottom: 10px;
        }

        .item .raffleFlagContainer img {
            height: 50px;
        }

        .smallRaffleFlagContainer img {
            height: 35px;
            width: 35px;
        }

        .item .raffleFlagContainer h2 {
            font-size: 25px;
            position: absolute;
            top: 0;
            left: 15px;
            margin: 15px 0;
        }

        svg {
            transform: rotate(-90deg) scale(1, -1);
        }

        .circle_animation {
            stroke-dasharray: 687.5;
            stroke-dashoffset: 687.5;
        }

        .circle_animation_background {
            stroke-dasharray: 0;
            stroke-dashoffset: 0;
        }

        .background_circle {
            z-index: -1;
            position: absolute;
            left: 0;
            top: 0;
        }

        .raffleID .circle_animation {
            -webkit-animation: raffleID 1s ease-out forwards;
            animation: raffleID 1s ease-out forwards;
        }

        .css .circle_animation {
            -webkit-animation: css 1s ease-out forwards;
            animation: css 1s ease-out forwards;
        }

        @-webkit-keyframes raffleID {
            to {
                stroke-dashoffset: 80;
            }
        }

        @keyframes raffleID {
            to {
                stroke-dashoffset: 80;
            }
        }

        /* @-webkit-keyframes css {
			to {
				stroke-dashoffset: 160;
			}
			}

			@keyframes css {
			to {
				stroke-dashoffset: 160;
			}
			} */

        .headerRaffleInfo,
        .raffleDetails {
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* TODO: remove this for large screens. add transform: scale(1.2); to svg */
            align-items: center;
        }

        .headerRaffleInfo {
            margin-top: 140px;
        }

        .raffleDetails p {
            margin: 0 auto;
            text-align: center;
            font-size: 18px;
        }

        .daysLeft {
            font-weight: 600;
            color: #e92d41;
            text-transform: uppercase;
        }

        .details {
            font-size: 14px !important;
        }

        .detailsBold {
            color: #ffd942;
        }

        .winnerCount {
            font-size: 17px;
            text-transform: uppercase;
        }

        .prizeDetails {
            position: absolute;
            width: 100%;
            align-items: center;
            top: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: -1;
        }

        .prizeDetails p {
            margin: 0;
            font-size: 16px;
        }

        .prizeDetails img {
            height: 120px;
            margin-top: 10px;
        }

        #whoWonTop {
            padding-top: 70px;
            margin-bottom: 90px;
        }

        #seeWhoWon {
            margin: 15px 0;
            display: flex;
            justify-content: center;
            border-radius: 4px;
            padding: 4px;
            text-transform: uppercase;
            color: white;
            background: #e92d41;
            border: 1px solid #c01f40;
            text-decoration: none;
            font-size: 14px;
        }

        #trackRecordContainer h2:first-child {
            color: #1b2b51;
            font-weight: 900;
            text-align: center;
            margin: 0;
            font-size: 20px;
        }

        #trackRecordContainer div {
            display: flex;
            justify-content: center;
            margin-top: 2px;
        }

        .raffleInfo {
            width: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: auto;
            position: relative;
        }

        .smallRaffleFlagContainer {
            position: absolute;
            width: 100%;
            display: flex;
            align-items: center;
            bottom: 0;
            left: 0;
            height: 10%;
            margin-bottom: 0;
            justify-content: center !important;
            z-index: 1;
            align-items: center;
            height: 100px;

        }

        .smallRaffleFlagContainer h2 {
            font-size: 20px;
            margin: 0;
            margin-top: 18px;
            font-family: Baloo;
            margin-left: -20px;
        }

        .parsha {
            font-weight: 600;
            color: #1b2b51;
            text-transform: uppercase;
            margin-bottom: 0;
            text-align: center;
            font-size: 16px;
        }

        .whoWonNav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
        }

        .whoWonNav h2 {
            flex: 2;
            text-transform: uppercase;
            text-align: center;
            margin: 15px auto;
        }

        .whoWonNav p {
            font-size: 12px;
            min-width: 40px;
            color: #585858;
            margin: 0;
            max-width: 30%;
        }

        .whoWonNav div:first-child {
            min-width: 40px;
        }

        #trackRecordContainer {
            margin-top: 30px;
        }

        #parsha-header {
            text-align: center;
            display: flex;
            justify-content: center;
            border-radius: 4px;
            padding: 4px;
            text-transform: uppercase;
            color: white;
            background: #e92d41;
            border: 1px solid #c01f40;
            text-decoration: none;
            margin-top: 0;
            font-weight: bold;
            margin-left: -16px;
            margin-right: -16px;
            font-size: 16px;
        }

        #parshaPrizeContainer {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }

        #parshaPrizeContainer p {
            color: #1b2b51;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 0;
            width: 100% !important;
            text-align: center;
            max-width: none;
        }

        #parshaPrizeContainer img {
            height: 40px;
            width: 40px;
            margin: auto;
        }

        #parshaFlagContainer {
            display: flex;
            justify-content: center;
            position: relative;
        }

        #parshaFlagContainer img {
            height: 30px;
            width: 30px;
        }

        #parshaFlagContainer h2 {
            position: absolute;
            color: #1b2b51;
            font-size: 20px;
            margin-left: 5px;
        }

        #parshaContainer {
            border: 1px solid #b3b3b0;
            border-top: none;
            border-radius: 5px;
            padding: 0 15px;
            margin-bottom: 20px;
        }

        #namesContainer {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
        }

        #namesContainer>.column>div>p {
            margin: 0;
            font-size: 12px;
        }

        #namesContainer>.column>div>p:first-child {
            margin: 0;
            font-size: 14px;
        }

        #namesContainer>.column>div {
            margin: 8px 0;
        }

        #namesContainer h2 {
            font-size: 20px;
            margin: 0
        }

        #circleText {
            width: 100px;
            height: 100px;
            z-index: 1;
            position: absolute;
            fill: transparent;
            transform: rotate(180deg);
            bottom: 0;
        }

        #circleText textPath {
            color: #1b2b51;
            fill: black;
            font-size: 7px;
        }

        div#boys {
            margin-right: 10px;
        }

        .loader {
            border-top: 1.1em solid #e92d41;
            /* border-right: 1.1em solid #e92d41;
            border-bottom: 1.1em solid #e92d41; */
            /* border-left: 1.1em solid #e92d41; */
        }

        .missionMarathonHeader {
            background: #e92d41;
            display: flex;
            justify-content: space-between;
            padding: 10px;
            align-items: center;
            position: fixed;
            width: 100%;
            z-index: 2;
            height: 70px;
            box-sizing: border-box;
        }

        #page-title {
            color: white;
            font-size: 40px;
            font-weight: 700;
            padding: 0px;
            transition: .25s;
            text-transform: uppercase;
            font-family: "Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        @media (max-width: 450px) {
            #page-title {
                font-size: 22px;
            }
        }


        #userImg {
            border-radius: 100%;
            border: 2px solid white;
            height: 50px;
            width: 50px;
        }

        #bugReport {
            height: 35px;
            width: 35px;
        }

        .navRaffleFlagContainer {
            background: #343862;
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            z-index: 2;
        }

        .navRaffleFlagContainer>div {
            max-width: 1024px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .navRaffleFlagContainer>div>* {
            flex: 1 1 auto;
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        .flagImg {
            height: 50px;
        }

        .activeFlagLink {
            background: #4358a2;
        }

        .trackRecordCanvas {
            width: 100px;
            height: 100px;
            box-sizing: border-box;
            margin: 0;
            z-index: 1;
        }

        .trackRecordContainer {
            display: flex;
        }

        .trackRecord {
            position: relative;
            display: flex;
            flex-direction: column;
            margin: 5px;
            box-sizing: border-box;
        }

        .winningCircle {
            background: #ffd942;
            width: 100px;
            height: 100px;
            border-radius: 100%;
            position: absolute;
            z-index: 0;
            bottom: 0;
            left: 0;
        }

        #raffle5Doughnut {
            z-index: 1;
        }

        @media (min-width: 615px) {
            .winningCircle {
                width: 150px;
                height: 150px;
            }

            #circleText {
                width: 150px;
                height: 150px;
            }

            .trackRecordCanvas {
                width: 150px;
                height: 150px;
            }

            .raffleInfo {
                width: 150px;
            }

            .smallRaffleFlagContainer {
                height: 150px;
            }

            .smallRaffleFlagContainer h2 {
                font-size: 28px;
                margin-top: 32px;
                margin-left: -32px;
            }

            .smallRaffleFlagContainer img {
                height: 55px;
                width: 55px;
            }
        }

        @media (min-width: 1000px) {
            .winningCircle {
                width: 180px;
                height: 180px;
            }

            #circleText {
                width: 180px;
                height: 180px;
            }

            .trackRecordCanvas {
                width: 180px;
                height: 180px;
            }

            .raffleInfo {
                width: 180px;
            }

            .smallRaffleFlagContainer {
                height: 180px;
            }

            .smallRaffleFlagContainer h2 {
                font-size: 30px;
                margin-top: 35px;
                margin-left: -35px;
            }

            .smallRaffleFlagContainer img {
                height: 60px;
                width: 60px;
            }
        }
    </style>
</head>

<body onload="init()">

    <div>
        <div class="missionMarathonHeader">
            <div class="personalImg"></div>
            <div>
                <span id="page-title">MISSION MARATHON</span>
            </div>
            <a href="/helpdesk/?p=open">
                <img id="bugReport" src="/mobile/img_new/tools-color-white-svg.svg" data-category="Medal Board"
                    alt="bug-report">
            </a>
        </div>
        <div class="outerNavContainer">
            <div class="navRaffleFlagContainer">
                <div>
                    <a href="#" id="flagLink5">
                        <img class="flagImg" src="/mobile/reg/images/5-flag.png" data-category="Medal Board"
                            alt="bug-report">
                    </a>
                    <a href="#" id="flagLink60">
                        <img class="flagImg" src="/mobile/reg/images/60-flag.png" data-category="Medal Board"
                            alt="bug-report">
                    </a>
                    <a href="#" id="flagLink180">
                        <img class="flagImg" src="/mobile/reg/images/180-flag.png" data-category="Medal Board"
                            alt="bug-report">
                    </a>
                </div>
            </div>
        </div>

        <div class="rafflesContainer">
            <div class="headerRaffleInfo">
                <div id="raffleID" class="item raffleID">
                    <canvas id="raffle5Doughnut"></canvas>
                </div>
                <div class="raffleDetails">
                    <p class="detailsBold"><i>Did you know?</i></p>
                    <p>There are <span class="winnerCount">185 winners</span> of the 5 Flag raffle every week!</p>
                    <p class="detailsBold">That's 7,770 winners each year!</p>
                    <p class="details">Fill out missions 5 or more times a week to qualify.</p>
                </div>
            </div>
            <a href="#whoWonTop" id="seeWhoWon">See who won!</a>

            <div id="trackRecordContainer">
                <h2>How is your 5-Flag track record?</h2>
            </div>

            <div id="whoWonTop">
                <div id="whoWonContainer">
                    <div class="whoWonNav">
                        <p id="previousWinnerParsha"></p>
                        <h2>Past Winners</h2>
                        <p id="nextWinnerParsha"></p>
                    </div>
                    <div id="parshaContainer">
                        <p id="parsha-header">פרשת </p>
                        <div class="whoWonNav">
                            <div></div>
                            <div id="parshaPrizeContainer"></div>
                            <div id="parshaFlagContainer"></div>
                        </div>
                        <div id="namesContainer">
                            <div class="column" id="boys">
                                <h2>Boys</h2>
                            </div>
                            <div class="column" id="girls">
                                <h2>Girls</h2>
                            </div>
                        </div>
                    </div>
                    <!-- TODO: Add animations -->
                    <!-- TODO: Updatee for full screens -->
                    <!-- <div style="min-height: 400px;" id="raffles">
                    <div class="loader"></div>
                </div> -->
                </div>
            </div>
        </div>

        <div class="span12"
            style="position: fixed;width: 100%;bottom:0px; z-index: 1000; background: #4258a2;display:flex;">
            <div class="span12 footer">
                <div class="span3">
                    <a href="/mobile/reg/parent_detail.html" id="mainLink">
                        <div class="menu-item">
                            <div class="span12">
                                <img src="/mobile/img_new/boy-color-white.svg">
                            </div>
                            <div class="span12">
                                <span>Accounts</span>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="span3">
                    <a href="#" id="missionsLink">
                        <div class="menu-item">
                            <div class="span12">
                                <img src="/mobile/img_new/square-check-color-white.svg">
                            </div>
                            <div class="span12">
                                <span>Missions</span>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="span3">
                    <a href="#" id="rankLink">
                        <div class="menu-item">
                            <div class="span12">
                                <img src="/mobile/img_new/achievements-color-white.svg">
                            </div>
                            <div class="span12">
                                <span>Achievements</span>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="span3">
                    <a href="#" id="storeLink">
                        <div class="menu-item">
                            <div class="span12">
                                <img src="/mobile/img_new/cart-color-white.svg">
                            </div>
                            <div class=" span12">
                                <span>Rewards</span>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
