<script>
    async function getChildren(admin) {
        let result = await $.post('../../chidonOld/chidon_drive/ajax/getChildren.php', { admin })
        let info = JSON.parse(result);
        return info
    }

    async function getTracks(children) {
        let result = await $.post('../../chidonOld/chidon_drive/ajax/getTracks.php', { children })
        let tracks = JSON.parse(result)
        return tracks
    }

    function checkKhkEligibility(child) {
        if (parseInt(child.grade) === 8 && (child.track === 'havonah' || child.track === 'iyun')) return true
        else return false
    }

    function checkFields() {
        let allChecked = true
        $(".child").each( function() {
            if (! $(this).find('.agree').is(":checked")) {
                alert('You have not indicated your acceptance of all fundraising goals.')
                allChecked = false
                return false
            }
        })
        return allChecked
    }

    function getTotalGoal() {
        let total = 0
        $(".child").each( function() {
            let amount = $(this).find('.difference').text()
            total += parseInt(amount)
        })
        return total
    }

    $( async function() {
        if (localStorage.getItem('locallang') == 'he' || Cookies.get('lang') == 'he') {
            $(".bug-report").hide()
        }

        let fees = {
            yesod: 70,
            yediah: 180,
            havonah: 370,
            iyun: 370,
            khk: 500
        }

        let admin = Cookies.get('admin')
        if (! admin) {
            alert('You need to login first.')
            location.href = '../index.html'
        }

        let result = await getChildren(Cookies.get('admin'))
        if (! result.success) {
            alert(result.error)
            return false
        }
        children = result.children

        result = await getTracks(children)
        if (! result.success) {
            alert(result.error)
            return false
        }
        let tracks = result.tracks

        // update children with track info
        for (let child of children) {
            let khk = checkKhkEligibility(child)
            if (khk) child.track = 'khk'
            else child.track = tracks[child.user_id]
        }

        let registered = children.filter(child => child.date_paid)
        let eligible = children.filter(child => child.track && !child.date_paid && parseInt(child.schoolConfirmed))
        let schoolNotConfirmed = children.filter(child => !parseInt(child.schoolConfirmed))

        if (schoolNotConfirmed) {
            alert("You have some child(ren) that may not show up because the school has not yet confirmed their information.")
        }

        if (!eligible.length && registered.length) {
            alert("All eligible children have already been enrolled.")
        }
        else if (!schoolNotConfirmed.length && !eligible.length && !registered.length) {
            alert("It seems like you don't have any child(ren) that are eligible this year.")
        }

        let html = ''
        for (let child of eligible) {
            if (child.track) {
                let half = fees[child.track] / 2
                let difference = fees[child.track] >= 370 ? half - 100 : half
                html += `<div class="child" id="${child.user_id}"><b>Mazel Tov! ${child.first} has passed the ${child.track} track!</b><br /><br />`
                html += `The full cost is $${fees[child.track]}.<br />`
                html += `We generally charge the parents a minimum of 50% which is $${half}.<br /><br />`
                html += `I need a greater subsidy and would like to pay:
                        $<input type='number' name='payment' class='payment' style="width: 60px;" />.<br /><br />`
                html += `<input type='checkbox' name='agree' class='agree' /> I will do my best to fundraise a minimum of
                        $<span class='difference'>${difference}</span>
                        during the fundraiser on Sunday, 24 Adar 2 / March 27 to help tzivos hashem cover my costs.<br /><hr /></div>`
            }
        }
        html += `<b>The total amount that we ask of you to fundraise is: <b>$<span id="goal"></span></b>.<br /><br />`
        html += `<button style="padding: 10px; font-size: 18px;" id="subsidy">Apply for Subsidy</button>`
        $("#children").append(html)

        let totalGoal = getTotalGoal()
        $("#goal").text(totalGoal)

        $(document).on('blur', '.payment', function () {
            let amount = $(this).val()
            let user = $(this).parent().attr('id')
            let filtered = children.filter(child => parseInt(child.user_id) === parseInt(user))
            let child = filtered[0]
            let fullAmount
            switch (child.track) {
                case 'yesod':
                case 'yediah':
                    fullAmount = fees[child.track]
                    break
                case 'havonah':
                case 'iyun':
                    fullAmount = 270
                    break
                case 'khk':
                    fullAmount = 400
                    break
            }
            let total = fullAmount - parseInt(amount)
            $(this).parent().find('.difference').text(total)
            $("#goal").text(getTotalGoal())
        })

        $("#subsidy").click( function () {
            // check fields
            if (checkFields()) {
                let info = []
                $(".child").each( function () {
                    let user_id = $(this).attr('id')
                    let payment = $(this).find('.payment').val()
                    info.push({user_id, payment})
                })
                $.post('ajax/updateSubsidy.php', { info }, function (result) {
                    let res = JSON.parse(result)
                    if (res.success) alert(res.msg)
                    else alert(res.error)
                })
            }
        })
    })
</script>
