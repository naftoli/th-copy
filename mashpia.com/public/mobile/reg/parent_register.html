	<script>
		document.addEventListener("DOMContentLoaded", function (event) {
			$(document).ready(function () {
				//get info
				var admin =
					$(function () {
						$('input').iCheck({
							checkboxClass: 'icheckbox_square-aero',
							radioClass: 'iradio_square-aero',
							increaseArea: '20%' // optional
						});
					});
				//$('#phone').inputmask("(999) 999-9999");  //static mask
				//$('#zip').inputmask("99999");

				$("#email").keyup(function (event) {
					if (/[a-zA-Z0-9-_ ]/.test(String.fromCharCode(event.keyCode)) || event.keyCode === 8) {
						validateEmail();
					}
				});

				function validateEmail() {
					var email = $("#email").val();
					var email_error = $("#divemail + .invalid-feedback");
					var email_container = $("#divemail");
					// validate the email client side...
					if (!email.match(/^[_.0-9a-zA-Z-]+@([0-9a-zA-Z][0-9a-zA-Z.-]+.)+[a-zA-Z]{2,6}$/i)) {
						email_error.text("Invalid E-mail Address.");
						email_container.addClass("invalid");
						return false;
					}

					$.post("ajax/validateEmail.php", { admin_id: Cookies.get('admin_id'), email: email }, function (response) {
						response = JSON.parse(response);
						if (!response.valid) {
							email_error.text(response.message);
							email_container.addClass("invalid");
						} else {
							email_error.text("");
							email_container.removeClass("invalid");
						}
					});
				}

				function isAlphabetic(sText) {
					var ValidChars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
					var IsAlphabetic = false;
					var Char;
					for (i = 0; i < sText.length; i++) {
						Char = sText.charAt(i);
						if (ValidChars.indexOf(Char) != -1) {
							IsAlphabetic = true;
							break;
						}
					}
					return IsAlphabetic;
				}

				$('#regForm').submit(function (e) {
					e.preventDefault();
					var pwd = $("#pwd").val();
					var repwd = $("#repwd").val();
					if (pwd != repwd) {
						alert('Your passwords do not match.');
						return false;
					}

					var father = $("#father").val();
					var mother = $("#mother").val();
					var lastname = $("#lastname").val();
					var email = $("#email").val();
					var address = $("#address").val();
					var city = $("#city").val();
					var state = $("#state").val();
					var zip = $("#zip").val();
					var country = $("#country").val();
					if (country == 'United States') {
						country = 'USA';
					}
					var phone = $("#phone").val();
					var phone2 = $("#phone2").val();
					var username = email;
					var fatherPic = null;
					var motherPic = null;

					/*
					if (father == '' && mother == '') {
						alert("You must enter father's or mother's name.");
						return false;
					}
					*/
					/*
			if (lastname == '' || email == '' || address == '' || city == '' || state == '' || zip == '' 
				|| country == '' || phone == '' || username == '' || pwd == '') {
				alert('You must fill in all the fields.');
				*/
					if (lastname == '' || email == '' || phone == '' || phone2 == '' || username == '' || pwd == '') {
						alert('Not all mandatory fields have been filled out. Please fill out and try again.');
						return false;
					}

					if (father == '' && mother == '') {
						alert("You must enter at least one parent's first name.");
						return false;
					}

					if ((father != '' && father.length < 3) || (mother != '' && mother.length < 3) || lastname.length < 3) {
						alert("Names must contain at least 3 characters.");
						return false;
					}

					if (phone.length < 9 || isAlphabetic(phone)) {
						alert("Father's phone number must be at least 9 digits and cannot contain alphabetic characters.");
						return false;
					}

					if (phone2.length < 9 || isAlphabetic(phone2)) {
						alert("Mother's phone number must be at least 9 digits and cannot contain alphabetic characters.");
						return false;
					}

					var reg = /^([A-Za-z0-9_\-\.])+\@([A-Za-z0-9_\-\.])+\.([A-Za-z]{2,4})$/;
					if (reg.test(email) != true) {
						alert("Invalid email address.");
						return false;
					}
					/*
					if ( !$("#terms").is(":checked") ) {
						alert('You must agree to terms.');
						return false;
					}
					*/
					$.post('ajax/createParent.php', {
						father: father,
						mother: mother,
						fatherPic: fatherPic,
						motherPic: motherPic,
						lastname: lastname,
						email: email,
						address: address,
						city: city,
						state: state,
						zip: zip,
						country: country,
						phone: phone,
						phone2: phone2,
						username: username,
						pwd: pwd
					}, function (success) {
						if (success == -1) {
							if (localStorage.getItem('locallang') == 'he' || Cookies.get('lang') == 'he')
								alert('שם משתמש או כתובת דוא"ל זה כבר בשימוש. בבקשה נסה שוב');
							else
								alert('This username or email address is already being used. Please try again.');
							return;
						}
						else if (success == 1) {
							if (localStorage.getItem('locallang') == 'he' || Cookies.get('lang') == 'he')
								alert('החשבון שלך נוצר. כעת אתה יכול להתחבר באמצעות שם המשתמש / הסיסמה שלך');
							else
								alert('Your account has been created. You can now login with your username / password.');
							window.location = "/mobile/reg";
						} else {
							if (localStorage.getItem('locallang') == 'he' || Cookies.get('lang') == 'he')
								alert('הייתה בעיה ביצירת חשבון הורים. בבקשה נסה שוב. אם בעיה זו נמשכת אנא צור קשר לצבאות ה ');
							else
								alert('There was a problem creating a parent account. Please try again. If this problem persists please contact Tzivos Hashem.');
							return;
						}
					});
				});
			});
		});
	</script>
