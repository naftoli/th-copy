            .logo img.img-responsive.center-block {padding: 2%;}
            .login-box{ margin-top: 0px; }
            body{background-color: #fff}
			.input-group .input-group-addon, .form-control{border-radius: 5px;}
			.input-group .form-control{width: 99%;} /* border radius not working. so just keep it 1% from the edge....*/
			/*New styles with image*/
			.login-box-body .form-group, .body .logo img, .login-box-body .btn-primary, .input-group-addon img {transition: .25s}
			.input-group-addon img { max-height: 40px;}
			@media (max-width: 640px) { .input-group-addon img { max-height: 25px;}}
        </style>

    <body>
    <div class="container forgot-page">
        <div class="login-header">
            <span data-key="parentsLogin" class="span12 i18n">PARENT'S LOGIN</span>
            <div style="float: right;">
                <button id="en" class="translate">English</button>
                <button id="he" class="translate">עִברִית</button>
            </div>            
        </div>
        <div class="span12 body">
            <div class="logo">
                <img src="/mobile/img_new/TH%20Logo-colorful-svg.svg" alt="logo" class="img-responsive center-block">
            </div>
            <div class="form-group no-border error-box" style="font-weight: bold; text-align: center;">
                <span class="color-red"><b data-key="Oops" class="i18n">Oops!</b></span>
                <span class="color-grey i18n" data-key="forgotMyUsername">I Forgot my username / password.</span><br />
                <span data-key="PleaseSendMePassword" class="i18n">Please send me a password reset link.</span><br />
                <small style='font-size: .6em; font-weight: normal;' data-key="PleaseSendMePassword2"
                    class="i18n">(Please note that we will <strongs>only</strong> send an email if we <strong>have your
                            email address</strong> on file)</small>
            </div>
            <div class="login-box">
                <div class="login-box-body" style="margin-bottom: 50px;">
                    <form action="" id="forgotForm">
                        <div class="form-group has-feedback" id="divemail">
                            <div class="input-group">
                                <span class="input-group-addon"><img src="/mobile/img_new/mail-color-gray-svg.svg" /></span>
                                <input id="forgot" name="forgot" type="email" data-key="YourEmail" class="form-control" placeholder="Your Email" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-xs-12" style="position: relative;">
                                <div class="check_mark" style="display: none;"><img src="img/check-mark.png"></div>
                                <button type="submit" id="send" class="btn btn-primary btn-block H8"><b data-key="SEND"
                                        class="i18n">SEND My User / Pass</b></button>
                            </div><!-- /.col -->
                        </div>
                        <div class="row" id="error-block" style="display:none;margin-top: 10px;">
                            <div class="col-sm-12 error-box">
                                <picture>
                                    <source srcset="img/webp/error.webp" type="image/webp">
                                    <img src="img/error.png" alt="" width="8%">
                                </picture>
                                <span class="color-red"><b data-key="Oops2" class="i18n">oops!</b></span>
                                <span class="color-grey" data-key="PleaseReEnter" class="i18n">Please re-enter
                                    your</span>
                                <span class="color-red" data-key="PleaseReEnterEnter" class="i18n">email.</span><br>
                                <span class="color-grey" data-key="SorryWeCouldntFind" class="i18n">Sorry we couldn't
                                    find that information.</span><br>
                                <span class="color-grey" data-key="PleaseContact" class="i18n">Please contact </span>
                                <span style="color:#2b529e" data-key="ch_email" class="i18n">cth@tzivoshashem.org</span>
                            </div>
                        </div>
                    </form>
                    <div class="row">
                        <div class="col-xs-12" style="margin-top: 5px;">
                            <a href="index.html" style="padding-top: 3%;" data-key="CANCEL" class="i18n btn btn-primary btn-block H8"><b>CANCEL</b></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
        
        <script src="../js/translation/forgot/forgot.js"></script>

        <script>
            document.addEventListener("DOMContentLoaded", function(event) {
                $(function () {
                    $('input').iCheck({
                        checkboxClass: 'icheckbox_square-aero',
                        radioClass: 'iradio_square-aero',
                        increaseArea: '20%' // optional
                    });
                });
                $(document).ready(function(){
                    $('.error-box').show();
                    $( "#forgotForm" ).submit(function( event ) {
                        // Stop form from submitting normally
                        event.preventDefault();

                        // Get some values from elements on the page:
                        var $form = $( this ),
                                email = $form.find( "input[name='forgot']" ).val(),
                                url = $form.attr( "action" );
                                
                        $.post('/api/auth/forgot', { email: email }, function( data ) {
                            if ( data.success ) {
                                alert( data.data );
                                $('.check_mark').show();
                                $("#send").html("SENT");
                                setTimeout( function() {
                                    window.location.href = "http://mashpia.com/mobile/reg";
                                }, 1000);
                            } else {
                                $('#error-block').show();
                                $form.find( "input[name='forgot']" ).val('');
                                $form.find( "input[name='forgot']" ).focus();
                            }
                        });
                    });
                });
            });
        </script>

          ga('send', 'pageview');
