	<script>
		var cookies_all = "";
		var cookie_admin = "";
		var cookie__ga = "";
		var cookie__gid = "";
	
		function findGetParameter(parameterName) {
			var result = null,
			tmp = [];
			var items = location.search.substr(1).split("&");
			for (var index = 0; index < items.length; index++) {
				tmp = items[index].split("===");
				if (tmp[0] === parameterName) result = decodeURIComponent(tmp[1]);
			}
			
			return result;
		}

		function findCookieParameter(allCookies, parameterName) {
			var result = null,
			tmp = [];
			var items = allCookies.substr(1).split("; ");
			for (var index = 0; index < items.length; index++) {
				tmp = items[index].split("=");
				if (tmp[0] === parameterName) result = decodeURIComponent(tmp[1]);
			}
			
			return result;
		}	
		
	document.addEventListener("DOMContentLoaded", function(event) {
		$(document).ready(function(){
			cookies_all = findGetParameter("cookies");
			
			if (cookies_all) {
				cookie_admin = findCookieParameter(cookies_all, "admin");
				cookie__ga = findCookieParameter(cookies_all, "_ga");
				cookie__gid = findCookieParameter(cookies_all, "_gid");	
				Cookies.set('admin', cookie_admin);	
				Cookies.set('_ga', cookie__ga);	
				Cookies.set('_gid', cookie__gid);
			}
				
			$(".newOnly .remember input").on('ifChecked', function() {
				alert('You will be assigned to the school called "Anash Kinder".');
				$("#school").val('269').change();
				$("#school").attr('disabled', true);
			});	
			$(".newOnly .remember input").on('ifUnchecked', function() {
				$("#school").attr('disabled', false);
			});
		});
		
		 //-------------------
		var $input = $('#imagechild');
		$("#imagechild").fileinput({
		    showPreview: false,
			showCancel: false,
			showUploadedThumbs: false,
		    showcaption: false,
			showUpload: false,
			showRemove: false,
			uploadAsync : false,
			allowedFileExtensions : ['jpg', 'png','gif'],
			uploadUrl: "server.php", // your upload server url
			minFileCount: 1,
			maxFileCount: 5,
				uploadExtraData: function() {   // pour le futur...
				return {
					action: 'inputimg'
				};
			} 
		}).on("filebatchselected", function(event, files) {
		    // trigger upload method immediately after files are selected
		    $input.fileinput("upload").on('filebatchuploadsuccess', function(event, data, previewId, index) {
		    var form = data.form, files = data.files, extra = data.extra,
		        response = data.response, reader = data.reader;
				$("#imgchild").attr('src',response[0]);
			});
		});
						
	    $(function () {
	        $('#dob').datetimepicker();
	        $('#dob').data("DateTimePicker").format('MM/DD/YYYY');
	        $('#dob').data("DateTimePicker").options({showClose:true});
	        
	        $.post('ajax/getSchools.php', function( success ) {
	        	var schools = $.parseJSON( success );
	        	var html = "<option value='0'>School</option>";
	        	for ( var i in schools ) {
					for ( var s in schools[i] ) {
						html += "<option value='" + s + "'>" + schools[i][s] + "</option>";
					}
				}
				$("#school").empty();
	        	$("#school").append( html );
	        	$("#school").selectpicker('refresh');
	        });
	        
	        $("#school").change( function() {
	        	var id = $(this).val();
				if (id == 61 || id == 269) {
					var url = "re_register2.html?school=" + id;
					if ($("#noSchool").is(":checked")) url += "&noSchool=1";
					if (cookies_all)
						location.href = url + "?cookies===" + cookies_all;
					else
						location.href = url;
				}
	        	$.post('ajax/getGrades.php', { school : id }, function( success ) {
	        		var grades = $.parseJSON( success );
	        		var html = "<option value='0' selected disabled>Class</option>";
	        		for (var g in grades) {
	        			html += "<option value='" + g + "'>" + grades[g] + "</option>";
	        		}
	        		$("#classe").empty();
	        		$("#classe").append( html );
	        		$("#classe").selectpicker('refresh');
	        	});
	        	$("#lastname").empty();
	    		$("#lastname").append("<option value='0' selected disabled>Last Name</option>");
	    		$("#lastname").selectpicker('refresh');;
	        });
	        
	        $("#classe").change( function() {
	        	$.post('ajax/getNames.php', { school : $("#school").val(), grade : $("#classe").val() }, function( success ) {
	        		var names = $.parseJSON( success );
	        		var html = "";
	        		for (var n in names) {
	        			html += "<option value='" + names[n] + "'>" + names[n] + "</option>";
	        		}
	        		$("#lastname").empty();
	        		$("#lastname").append( html );
	        		$("#lastname").selectpicker('refresh');
	        	});
	        });
	        
	        $("#addForm").submit( function(e) {
	        	e.preventDefault();
	        	var school = $("#school").val();
	        	var grade = $("#classe").val();
	        	var last = $("#lastname").val();
	        	var dob = $("#dob").val();
	        	
	        	if (school == 0) {
	        		alert("You must choose a school.");
	        		return false;
	        	} else if (grade == null) {
	        		alert("You must choose a class.");
	        		return false;
	        	} else if (last == '') {
	        		alert("You must choose a last name.");
	        		return false;
	        	} else if (dob == '') {
	        		alert("You must choose a dob.");
	        		return false;
	        	}
	        	
	        	var admin = Cookies.get('admin');
	        	if (admin == undefined) {
	        		admin = Cookies.get('admin_id');
	        	}
	        	//alert( admin );
						
				var tuitionSchools;
				$.ajax({
					type : 'POST', 
					async : false,
					url : 'ajax/getTuitionSchools.php',
					dataType : 'json',
					success : function( schools, textStatus, jqXHR ) {
						tuitionSchools = schools;
					}
				});
						
	        	$.post('ajax/addChild2.php', { 
	        		school : school, 
	        		grade : grade, 
	        		last : last, 
	        		dob : dob, 
	        		admin : admin
	        	}, function( success ) {
	        		if (success > 1) {
						var tuition = tuitionSchools.indexOf(school);
						if (tuition == -1) {
							alert("Your child has been added to your account.");
							if (addChild) location.href = "addchild2.html";
							else location.href = "parent_detail.html";
						} else { 
							alert("Your child has been added to your account!\nThe registration fee has already been paid for through your child’s school, so no additional payment is needed.\nWishing you lots of Nachas as you watch your child grow as a Chayol in Tzivos Hashem.");
