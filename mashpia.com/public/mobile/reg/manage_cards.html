<script src="/cards/card.js"></script>
<script>
    function getCards() {
        $.ajax({
            url: 'ajax/card_management.php',
            type: 'POST',
            data: {
                action: 'get_cards'
            },
            success: function (data) {
              const result = JSON.parse(data)
              if (result.success) { 
                if (result.profiles.length) {
                  // build html
                  let html = ''
                  let i = 0
                  for (let profile of result.profiles) {
                    html += `
                      <div class='card' data-type='${profile.payment.creditCard.cardType.toLowerCase()}'>
                        <div class="card-header">
                          <div class="card-title">Credit Card ${i + 1}</div>
                          <div class="card-chip"></div>
                        </div>
                        <div class="card-body">
                          <div class="card-number">${profile.payment.creditCard.cardNumber}</div>
                          <div class="card-type">${profile.payment.creditCard.cardType}</div>
                          <div class="card-expiry">
                            <span class="expiry-label">Valid Thru: ${profile.payment.creditCard.expirationDate}</span>
                            <input type="month" 
                                class="form-control expiryDate" 
                                name="expiryDate" 
                                value="${profile.payment.creditCard.expirationDate}" />
                          </div>
                        </div>
                        <div class="card-actions" id='${profile.customerPaymentProfileId}'>
                          <button class="btn btn-danger delete">Delete</button><br />
                          <button class="btn btn-primary update">Update Expiry</button>
                        </div>
                      </div>
                    `
                    i++
                  }
                  $('#cardsContainer').empty();
                  $('#cardsContainer').html(html);
                } else {
                  let html = 'You have no cards in your account. Please add one.'
                  $('#cardsContainer').empty();
                  $('#cardsContainer').html(html);
                }
              } else {
                alert(result.error)
              }
            }
        });
    }

    function deleteCard(id) {
        $.ajax({
            url: 'ajax/card_management.php',
            type: 'POST',
            data: {
                profile_id: id,
                action: 'delete_card'
            },
            success: function (data) {
              const result = JSON.parse(data)
              if (result.success) { 
                getCards();
              } else {
                alert(result.error)
              }
            }
        });
    }

    function updateCard(id, cardInfo) {
        $.ajax({
            url: 'ajax/card_management.php',
            type: 'POST',
            data: {
                profile_id: id,
                cardInfo: cardInfo,
                action: 'update_card'
            },
            success: function (data) {
              const result = JSON.parse(data)
              if (result.success) { 
                getCards();
              } else {
                alert(result.error)
                console.log(result.response)
              }
            }
        });
    }

    function addCard(cardInfo) {
        $.ajax({
            url: 'ajax/card_management.php',
            type: 'POST',
            data: {
                action: 'add_card', 
                data: cardInfo
            },
            success: function (data) {
              const result = JSON.parse(data)
              if (result.success) { 
                getCards();
              } else {
                alert(result.error)
                console.log(result.response)
              }
            }
        });
    }

    window.onload = function () {
        getCards();

        // Format card number as user types
        $(document).on('input', '.new-number', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            // Add space after every 4 digits
            value = value.replace(/(\d{4})(?=\d)/g, '$1 ');
            // Limit length including spaces
            value = value.substring(0, 19); // 16 digits + 3 spaces
            e.target.value = value;
        });

        // Format expiry date as user types
        $(document).on('input', '.new-expiry', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2, 4);
            }
            e.target.value = value.substring(0, 5);
        });

        $(document).on('click', '.delete', function () {
          const conf = confirm('Are you sure you want to delete this card?')
          if (! conf) return
          deleteCard($(this).parent().attr('id'));
        });

        $(document).on('click', '.update', function () {
          const expiryDate = $(this).parent().parent().find('.expiryDate').val()
          const cardNumber = $(this).parent().parent().find('.card-number').text()
          const card = { cardNumber, expiryDate }
          updateCard($(this).parent().attr('id'), card)
        });

        $(document).on('click', '.add', function (e) {
          e.preventDefault();

          // Get the form element
          const form = $(this).closest('form')[0];

          // Check HTML5 validation
          if (!form.checkValidity()) {
            form.reportValidity();
            return;
          }
          
          // get the card info and remove spaces from card number
          const cardNumber = $(this).parent().find('.new-number').val().replace(/\s/g, '');
          const ccv = $(this).parent().find('.new-ccv').val().replace(/\D/g, '');
          const expiryDate = $(this).parent().find('.new-expiry').val();

          // Validate expiry date
          const expiryParts = expiryDate.split('/');
          if (expiryParts.length !== 2) {
            alert('Please enter expiry date in MM/YY format');
            return;
          }

          const month = parseInt(expiryParts[0]);
          const year = parseInt('20' + expiryParts[1]);
          
          // Create date objects for comparison
          const today = new Date();
          const expiry = new Date(year, month - 1); // month is 0-based in JS
          
          // Move to the last day of the expiry month
          expiry.setMonth(expiry.getMonth() + 1, 0);
          
          // Compare with today
          if (expiry < today) {
            alert('Card has expired');
            return;
          }
          
          // Additional validation for card number and CVV based on card type
          let isValid = true;
          let errorMessage = '';
          
          // Determine card type and validate accordingly
          if (cardNumber.startsWith('34') || cardNumber.startsWith('37')) {
            // American Express
            if (cardNumber.length !== 15) {
              isValid = false;
              errorMessage = 'American Express cards must be 15 digits';
            }
            if (ccv.length !== 4) {
              isValid = false;
              errorMessage = 'American Express cards require a 4-digit CVV';
            }
          } else {
            if (cardNumber.length !== 16) {
              isValid = false;
              errorMessage = 'Card number must be 16 digits';
            }
            if (ccv.length !== 3) {
              isValid = false;
              errorMessage = 'CVV must be 3 digits';
            }
          }

          if (!isValid) {
            alert(errorMessage);
            return;
          }
          
          // Convert YY to YYYY format for API
          const fullYear = '20' + expiryParts[1];
          const apiExpiryDate = expiryParts[0] + '/' + fullYear;

          const card = { 
            cardNumber: cardNumber,
            expiryDate: apiExpiryDate,
            ccv: ccv 
          };
          addCard(card);
        });
    }
  </script>
