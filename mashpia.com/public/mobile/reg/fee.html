  <body class="skin-blue sidebar-mini">
  <div class="container fee-page page5">
      <div class="login-header">
          <span class="span12">RECRUITMENT FEE</span>

			<div class="row">
					<div class="col-xs-12">
						<div class="chilrens" id="children">

			<div id="spinner"></div>
			
      <form id="feeForm" action="" method="post">
      <div class="register-box">
          <div class="register-box-body">
                    <div class="row">
                        <div class="col-xs-12">

                        <div class="col-xs-12">

                  <div class="row">
                      <div class="col-xs-12">

                              <input type="checkbox" name="accept" id="accept" class="minimal-red">

                      </div>
                  </div>
                  
                  <div class="row">
                      <div class="col-xs-12">

<script>
document.addEventListener("DOMContentLoaded", function(event) {
	var admin = Cookies.get('admin');
	if (!admin) {
		window.location = "index.html";
	}
	
	var ship = 0;
	var shipOpt = 0;
	var destination = 0;
	$(".shipFee").hide();
	
	if (Cookies.get('shipping') !== undefined) {
			ship = parseInt(Cookies.get('shipping'));
			if (Cookies.get('myshliach') !== undefined) {
				if (ship == 25) {
					shipOpt = 1;
					$("#xtra").text(ship);
					$(".shipFee").show();
				}
				var dest = Cookies.get('myshliach');
				switch (dest) {
					case 2:
						destination = 'Canada';
						break;
					case 3:
						destination = 'International';
						break;
				}
			} else if (Cookies.get('anashkinder') !== undefined) {
				shipOpt = Cookies.get('shipOpt');
				destination = Cookies.get('destination');
				$("#xtra").text(ship);
				$(".shipFee").show();
			}
	}
	
	var url = location.toString();
	var pos = url.indexOf('='); 
	var str = url.substring( pos+1 );
	var newChild = false;
	var id, pos2;
	
	pos2 = str.indexOf('&');
	if (pos2 != -1) {
		//new child
		newChild = true;
		id = str.substring(0, pos2);
	} else {
		id = str;
	}
	/*
	Date.prototype.getJulian = function() {
    return Math.floor((this / 86400000) - (this.getTimezoneOffset()/1440) + 2440587.5);
	}
	var today = new Date(); //set any date
	var julian = today.getJulian(); //get Julian counterpart
	alert(julian);	
	var fee = 50;
	if (julian > 2458011) fee = 55;
	*/
	var amount = 0;
	var numChildren = 0;
	var childrenRegister = {};
	var toRegister = Cookies.getJSON('toRegister');
	//var childrenLA = 0;
	//var children45 = 0;
	//var children40 = 0;
	//var schools45 = [54,48,81,61,269,7,263,58,2,21,37,4,49,192];
	//var schools40 = [66,112];
	
	var year;
  $.ajax({
    type : "POST",
    url : "/mobile/chidon/ajax/getYear.php",
    async : false, 
    success : function( info ) {
      year = info;
    }
  });
  
	if (!newChild) {
		$(".year").text( year );
		$.post('ajax/getChildrenToRegister.php', { admin: admin, year : year }, function( success ) {
			if ( success == -1 ) {
				window.location = "index.html";
			} else {
				var data = $.parseJSON( success );
				children = data.children;
				
				//alert(JSON.stringify(toRegister));
				for (var i in toRegister) {
					var child = toRegister[i];
					for (var c in children) {
						if (child.id == c) {
							if (child.reg) {
								childrenRegister[c] = children[c];
								numChildren++;
								//if (julian < 2457665 && children[c].school_id == 162) childrenLA++;
								//if (julian < 2457665 && schools45.indexOf(parseInt(children[c].school_id)) != -1) children45++;
								//if (schools40.indexOf(parseInt(children[c].school_id)) != -1) children40++;
								//if (parseInt(children[c].school_id) == 61) children45++;
							}
						}
					}
				}

				if (numChildren === 0) {
					alert('You have not selected any child to register!');
					//location.href = "parent_detail.html";
				}
				
				// Grab the template script
				var tplScript = $("#childrenTpl").html();
		
				// Compile the template
				var tpl = Handlebars.compile( tplScript );
	
				// Pass our data to the template
				var html = tpl( { children : childrenRegister } );
				
				// Add the compiled html to the page
				$(".chilrens").append( html );
				
				calcFee();
			}
		});
	} else {
		numChildren = 1;
		calcFee();
	}
	
	/*
	//find out amount to charge
	$.ajax({
		type : "POST", 
		url : 'ajax/getAmount.php', 
		data : { user_id : id }, 
		async : false, 
		success : function( num ) {
		amount = num * numChildren;
		$("#amount").text( amount );
	});
	*/
	
	$(document).on('click', ".del", function(e) {
		e.preventDefault();
		var child = $(this).parent().parent().parent().attr('id');
		$("#r" + child).remove();
		numChildren--;
		if (numChildren === 0) {
			alert('You have not selected any child to register!');
			location.href = "parent_detail.html";
			return;
		}
		var notFound = true;
		for (var i in toRegister) {
			if (notFound && child == toRegister[i].id) {
				toRegister.splice(i,1);
				notFound = false;
			}
		}
		Cookies.set('toRegister', toRegister);
		
		// check if any anashkinder children remain or have all been removed
		// do same thing for myshliach international children
		if (ship > 0) {
			if (Cookies.get('anashkinder')) {
				var anash = false;
				//console.log(toRegister);
				for (var i in toRegister) {
					if (toRegister[i].reg && toRegister[i].anash) {
						anash = true;
						break;
					}
				}
				if (!anash) {
					// remove shipping charges
					ship = 0;
					$(".shipFee").remove();
					Cookies.remove('shipping');
					Cookies.remove('anashkinder');
					Cookies.remove('shipOpt');
				}
			} else if (Cookies.get('myshliach')) {
				var shliach = false;
				for (var i in toRegister) {
					if (toRegister[i].reg && toRegister[i].shliach) {
						shliach = true;
						break;
					}
				}
				if (!shliach) {
					// remove shipping charges
					ship = 0;
					$(".shipFee").remove();
					Cookies.remove('shipping');
					Cookies.remove('myshliach');
				}
			}
		}
		
		for (var c in childrenRegister) {
			if (child == c) {
				delete childrenRegister[c];
			}
		}
		calcFee();
	});
	
	function calcFee() {
		//console.log(childrenRegister);
		/*
		var rest = numChildren;

        if (!$("#participate").is(":checked")) {
