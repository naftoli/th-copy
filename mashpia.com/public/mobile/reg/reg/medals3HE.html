    <style>
        body {
            margin-bottom: 100px;
        }

        @media(max-width:650px) {
            body {
                margin-bottom: 55px;
            }
        }

        #gold {
            padding-top: 4%;
        }

            #gold img {
                width: 26%;
                height: 26%;
                margin-left: 10%;
                margin-right: 10%;
            }

        #backs img {
            opacity: 0.3;
        }

        #userImg {
            border-radius: 50%;
            width: 100%;
            height: 100%;
            border: 2px solid #31559f;
        }

        .personalImg {
            width: 50px;
            height: 50px;
            left: 1%;
            top: 1%;
            border-radius: 50%;
            position: absolute;
        }

        .panel-heading {
            background-color: #f68829 !important;
            border: none;
            font-size: 20px;
        }

        .panel a {
            color: white;
        }

            .panel a:hover, a:active, a:visited, a:link {
                text-decoration: none;
            }

        .medalInfo {
            float: right;
            width: 70%;
            padding-top: 1%;
        }

        .progress {
            margin-bottom: 5px !important;
        }

        .progressText {
            position: absolute;
            display: block;
            width: 95%;
            color: black;
            text-align: center;
            font-family: 'digi';
            font-size: 14px;
        }

        .progress .text {
            font-family: 'digi';
            color: #fff;
            font-weight: normal;
        }

        .progressMedalText {
            position: absolute;
            width: 60%;
            color: black;
            text-align: center;
            font-family: 'digi';
            font-size: 14px;
            font-weight: normal;
        }

        i.glyphicon {
            transition: transform .3s ease-in-out;
            transition: -moz-transform .3s ease-in-out;
            transition: -webkit-transform .3s ease-in-out;
        }

        hr {
            margin: 10px 0 !important;
        }

        .levelText {
            font-weight: bold !important;
            margin: 0 auto;
            line-height: 1.1;
            font-size: 24px !important;
            width: 95%;
        }

        .header-yellow #page-title {
            font-size: 25px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            width: auto;
            display: block;
            padding: 5px 0px;
            transition: .25s;
        }

        .header-yellow {
            min-height: 48px;
        }

        @media (min-width: 525px) {
            .header-yellow #page-title {
                font-size: 40px;
                padding: 10px 0px;
            }
        }
    </style>

        <div class="span12" style="position: fixed;width: 100%;bottom:0px;z-index:9999;">
