    <script>
        function switchCamera() {
            if (window.rearCamera) {
                initVideo(false);
            } else {
                initVideo(true);
            }
        }

        initVideo(true);

        function initVideo(rearCamera) {
            window.rearCamera = rearCamera;

            'use strict';
            var video = document.querySelector('video'),
                canvas;

            if (rearCamera) {
                video.style.transform = '';
            } else {
                video.style.transform = 'scaleX(-1)';
            }

            // use MediaDevices API
            // docs: https://developer.mozilla.org/en-US/docs/Web/API/MediaDevices/getUserMedia
            if (navigator.mediaDevices) {
                var constraints;
                if (rearCamera)
                    constraints = {
                        advanced: [{
                            facingMode: "environment"
                        }]
                    };
                else constraints = true;

                // stop current streaming
                if (window.mediaStream)
                    window.mediaStream.stop();

                // access the web cam
                navigator.mediaDevices.getUserMedia({
                    video: constraints
                })
                    // permission granted:
                    .then(function (stream) {
                        // video.src = window.URL.createObjectURL(stream);
                        // Older browsers may not have srcObject
                        if ("srcObject" in video) {
                            video.srcObject = stream;
                        } else {
                            // Avoid using this in new browsers, as it is going away.
                            video.src = window.URL.createObjectURL(stream);
                        }
                        video.onloadedmetadata = function (e) {
                            video.play();
                        };
                        window.mediaStream = stream.getTracks()[0]; // create the stream tracker
                        //video.addEventListener('click', takeSnapshot);
                    })
                    // permission denied:
                    .catch(function (error) {
                        console.log(error);
                        document.body.textContent = i18next.t('CameraError') + error.name;
                    });
            }
        };

        /**
         *  generates a still frame image from the stream in the <video>
         *  appends the image to the <body>
         */
        function takeSnapshot() {

            var video = document.querySelector('video'),
                canvas;
            var img = document.querySelector('img') || document.createElement('img');

            //alert('video.offsetWidth: ' + video.offsetWidth + ', video.offsetHeight: ' + video.offsetHeight);

            var context;
            var width = 600,
                height = 600 * video.offsetHeight / video.offsetWidth;
            //alert('2 video.offsetWidth: ' + video.offsetWidth + ', video.offsetHeight: ' + video.offsetHeight);
            hideCameraView();

            canvas = canvas || document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            context = canvas.getContext('2d');
            if (!window.rearCamera) {
                context.translate(width, 0);
                context.scale(-1, 1);
            }
            context.drawImage(video, 0, 0, width, height);
            var image = canvas.toDataURL("image/png");
            window.uploadedimage = canvas.toDataURL();

            console.log("base64data 2 yra: " + image);
            $.ajax({
                type: "POST",
                url: "saveImage.php",
                data: {
                    imgBase64: image,
                    type: '.png'
                },
                success: function (data) {
                    //alert(data); //will alert ok
                    var input = document.getElementById('avatar-input2');
                    input.value = data;
                    $('#avatar-input2').trigger('change');

                }
            }).done(function (o) {
                console.log('saved');
            });
        }
    </script>

                if (tmp[0] === parameterName) result = decodeURIComponent(tmp[1]);
            }
            return result;

                if (f.value) { //for IE5 ~ IE10
                    var form = document.createElement('form'),
                        ref = f.nextSibling;
                    form.appendChild(f);
                    form.reset();
                    ref.parentNode.insertBefore(f, ref);
