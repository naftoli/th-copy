<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title data-key="Title" class="i18n">Tzivos Hashem | Leaderboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro" rel="stylesheet">
    <script defer src="https://use.fontawesome.com/releases/v5.0.9/js/all.js" integrity="sha384-8iPTk2s/jMVj81dnzb/iFR2sdA7u06vHJyyLlAd4snFpCl/SnyUjRrbdJsw1pGIl" crossorigin="anonymous"></script>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css" integrity="sha384-9gVQ4dYFwwWSjIDZnLEWnxCjeSWFphJiwGPXr1jddIhOegiu1FwO5qRGvFXOdJZ4" crossorigin="anonymous">
    <link rel="stylesheet" href="/mobile/css/bug_report.css"/>
    <!-- Animation Libraries -->
    <link rel="stylesheet" type="text/css" href="/mobile/css/lib/animate.css" />
    <link rel="stylesheet" type="text/css" href="css/loader.css" />
    <!-- CSS for the page -->
    <link rel="stylesheet" type="text/css" media="screen" href="main.css" />
    <link rel="stylesheet" type="text/css" media="screen" href="css/leaderboard.css" />
    <!-- Bug Report -->
    <link rel="stylesheet" href="/mobile/css/bug_report.css"/>
    <script src="/mobile/js/bug_report.js?v=2.0" defer></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://unpkg.com/i18next@19.6.3/dist/umd/i18next.min.js"></script>
    <script src="../js/translation/leaderboard/leaderboard_index.js"></script>    
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <!-- <div class="navbar-brand personalImg"></div> -->
        <span class="navbar-text navbar-title mx-auto i18n" data-key="Leaderboard">
            Leaderboard
        </span>
    </nav>
    <div style="float: right;">
        <button id="en" class="translate">English</button>
        <button id="he" class="translate">עִברִית</button>
    </div>

    <div class="personalImg"></div>
    <div class="bug-report">
        <img src="/mobile/img_new/tools-color-white-svg.svg" data-category="Medal Board" alt="bug-report" />
    </div>

    <section id="top-nav">
        <div class="row nav-row">
            <div class="col-4 active">
                <a href="" id="leaderBoardLink">
                    <img src="/mobile/img_new/leaderboard-color-orange-svg.svg">
                    <span class="i18n" data-="Leaderboard">Leaderboard</span>
                </a>
            </div>
            <div class="col-4">
                <a href="rank.html" id="rankBoardLink">
                    <img src="/mobile/img_new/trophy-color-orange-svg.svg">
                    <span class="i18n" data-="RankBoard">Rank Board</span>
                </a>
            </div>
            <div class="col-4">
                <a href="medals.html" id="medalBoardLink">
                    <img src="/mobile/img_new/medals-color-orange-svg.svg">
                    <span class="i18n" data-="MedalBoard">Medal Board</span>
                </a>
            </div>
        </div>
    </section>

    <section id="filters">
        <button id="filterButton" type="button" class="btn btn-branding" data-toggle="modal" data-target="#filtersModalContainer">
            <span class="i18n" data-key="FilterLeaderboard"> Filter Leaderboard </span>
        </button>

        
        <h2 id="user_position"></h2>
        <div class="modal fade" id="filtersModalContainer" tabindex="-1" role="dialog" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title i18n" data-key="FilterLeaderboard" id="exampleModalLongTitle">Filter Leaderboard</h5>
                        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                            <img src="/mobile/img_new/x-color-white-svg.svg" height="16" width="16" />
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="filter">
                            <span id="LocationHeader" class="filter-title">
                                <i class="fas fa-globe"></i> <span class="i18n" data-key="Location">Location:</span>
                            </span>
                            <div id="LocationOptions" class="filter-options">
                                <label class="filter-option">
                                    <input type="radio" name="location" id="location" value="army" checked />
                                    <span class="i18n" data-key="Army">Army</span>
                                </label>
                                <label class="filter-option">
                                    <input type="radio" name="location" id="location" value="base" />
                                    <span class="i18n" data-key="Base">Base</span>
                                </label>
                                <label class="filter-option">
                                    <input type="radio" name="location" id="location" value="platoon" />
                                    <span class="i18n" data-key="Platoon">Platoon</span>
                                </label>



                            </div>
                        </div>
                        <div class="filter">
                            <span id="GenderHeader" class="filter-title">
                                <i class="fas fa-users"></i> <span class="i18n" data-key="Gender">Gender</span>:
                            </span>
                            <div id="GenderOptions" class="filter-options">
                                <label class="filter-option">
                                    <input type="radio" name="gender" id="gender" value="" checked />
                                    <span class="i18n" data-key="All">All</span>
                                </label>
                                <label class="filter-option">
                                    <input type="radio" name="gender" id="gender" value="M" />
                                    <span class="i18n" data-key="Boys">Boys</span>
                                </label>
                                <label class="filter-option">
                                    <input type="radio" name="gender" id="gender" value="F" />
                                    <span class="i18n" data-key="Girls">Girls</span>
                                </label>
                            </div>
                        </div>
                        <div class="filter">
                            <span id="RankHeader" class="filter-title">
                                <i class="fas fa-trophy"></i> Rank:
                            </span>
                            <div id="RankOtions" class="filter-options">
                                <select class="form-control" id="rank">
                                    <option value="" class="i18n" data-key="AllRanks">All Ranks</option>
                                    <option value="1" class="i18n" data-key="Private">Private</option>
                                    <option value="2" class="i18n" data-key="Sergeant">Sergeant</option>
                                    <option value="3" class="i18n" data-key="SergeantMajor">Sergeant Major</option>
                                    <option value="4" class="i18n" data-key="SecondLieutenant">Second Lieutenant</option>
                                    <option value="5" class="i18n" data-key="FirstLieutenant">First Lieutenant</option>
                                    <option value="6" class="i18n" data-key="Captain">Captain</option>
                                    <option value="7" class="i18n" data-key="Major">Major</option>
                                    <option value="8" class="i18n" data-key="Colonel">Colonel</option>
                                    <option value="9" class="i18n" data-key="General">General</option>
                                    <option value="10" class="i18n" data-key="1General">1* General</option>
                                    <option value="11" class="i18n" data-key="2General">2* General</option>
                                    <option value="12" class="i18n" data-key="3General">3* General</option>
                                    <option value="13" class="i18n" data-key="4General">4* General</option>
                                    <option value="14" class="i18n" data-key="5General">5* General</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-branding i18n" data-key="Close" data-dismiss="modal">Close</button>
                        <button class="btn btn-branding i18n" data-key="UpdateLeaderboard" id="update-leaderboard">Update Leaderboard</button>
                    </div>
                </div>
            </div>
        </div>




    </section>





    <section id="leaderboard">
    </section>

    <footer>
        <div class="row nav-row">
            <div class="col-3">
                <a href="../reg/parent_detail.html" id="mainLink" class="menu-item">
                    <img src="/mobile/img_new/boy-color-green-svg.svg" />
                    <span class="i18n" data-key="Accounts">Accounts</span>
                </a>
            </div>
            <div class="col-3">
                <a href="../missionsNew.html" id="missionsLink" class="menu-item">
                    <img src="/mobile/img_new/square-check-color-purple-svg.svg" />
                    <span class="i18n" data-key="Missions">Missions</span>
                </a>
            </div>
            <div class="col-3 active">
                <a href="../reg/rank.html" id="rankLink" class="menu-item">
                    <img src="/mobile/img_new/achievements-color-orange-svg.svg" />
                    <span class="i18n" data-key="Achievements">Achievements</span>
                </a>
            </div>
            <div class="col-3">
                <a href="../store/" id="storeLink" class="menu-item">
                    <img src="/mobile/img_new/cart-color-red-svg.svg" />
                    <span class="i18n" data-key="Rewards">Rewards</span>
                </a>
            </div>
        </div>
    </footer>

    <!-- Jquery, Popper.js and Bootstrap CDN's -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.0/umd/popper.min.js" integrity="sha384-cs/chFZiN24E4KMATLdqdvsezGxaGsi4hLGOzlXwp5UZB1LY//20VyM2taTB4QvJ" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/js/bootstrap.min.js" integrity="sha384-uefMccjFJAIv6A+rW+L4AHf99KvxDjWSu1z9VI8SKNVmz4sk7buKt/6v9KI65qnm" crossorigin="anonymous"></script>
    <!-- Our JavaScript code -->
    <script src="/mobile/js/js.cookie.js"></script>

    <script src="main.js"></script>
