                background: #ffffff;

                display: flex;

            .store-item {

            .quantity-section {
                display: flex;

                gap: 12px;
                margin-bottom: 16px;
                flex-wrap: wrap;
            }
            
            .quantity-input-group {
                display: flex;
                align-items: center;
                background: #f8f9fa;
                border-radius: 6px;
                border: 1px solid #dee2e6;
                overflow: hidden;
            }
            
            .quantity-input-group input {
                border: none;
                background: transparent;
                padding: 8px 12px;
                width: 60px;
                text-align: center;
                font-weight: 500;
                color: #495057;
            }
            
            .quantity-input-group input:focus {
                outline: none;
                background: #ffffff;

            .update-btn {
                background: #4258a2;
                color: white;

                border-radius: 6px;
                font-size: 0.9em;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s ease;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            
            .remove-btn:hover {
                background: #c82333;
                transform: translateY(-1px);
            }
            
            .btn-icon {
                font-size: 0.9em;

            .content { margin-bottom: 25px; }

            div#cart { 
                display: flex; 
                flex-direction: column; 
                align-items: center; 
                margin-top: 15px; 
                gap: 8px;

            #empty-cart { 
                display: none; 
                margin-top: 15px;

                padding: 40px 20px;
            }
            
            .alert h1 { margin: 0px; text-align: center; }
            
            /* Responsive adjustments */
            @media (max-width: 480px) {
                .cart-item {
                    margin: 12px 4px;
                    padding: 16px;
                }
                
                .cart-item-content {
                    gap: 12px;
                }
                
                .store-image-overlay {
                    width: 80px;
                    height: 80px;
                }
                
                .item-title {
                    font-size: 1.1em;
                }
                
                .quantity-section {
                    flex-direction: column;
                    align-items: stretch;
                }
                
                .quantity-input-group {
                    justify-content: center;
                }
            }
            
            /* Empty cart styling */
            #empty-cart {
                background: #f8f9fa;
                border: 2px dashed #dee2e6;
                border-radius: 12px;
                color: #6c757d;
            }
            
            #empty-cart h1 {
                color: #6c757d;
                font-size: 1.5em;
                font-weight: 500;
            }
            
            /* Loading state for cart items */
            .cart-item.loading {
                opacity: 0.7;
                pointer-events: none;
            }
            
            /* Success animation for updates */
            .cart-item.updated {
                animation: successPulse 0.6s ease-in-out;
            }
            
            @keyframes successPulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.02); }
                100% { transform: scale(1); }

            @media (max-width: 480px) {

                flex-direction: column;
                gap: 8px;
                max-width: 100%;
                padding: 0;
              }
              .auction-nav-btn {
                width: 100%;
                justify-content: center;
              }

            </div>
        </div>

    <script>
        document.addEventListener("DOMContentLoaded", async function(event) {
            var url = location.href.toString();
            var pos = url.indexOf('='); 
            var user = url.substring(pos+1);
    		
    		if (user.indexOf('#') != -1) {
    			var p = user.indexOf('#');
    			user = user.substring(0, p);
    		}
            

            
            authenticate( user );
            if( localStorage.getItem("login") == "user" ){
                $( "#mainLink" ).attr('href', '/mobile/reg/medals/?id=' + user);
            }
    		
			if (Cookies.get('kiosk')) {
				// disable account menu item
				$("#mainLink").attr('href', '');
			}
            
            $.post('../reg/ajax/getPhoto.php', { user_id : user }, function( success ) {
                var info = $.parseJSON( success );
                var html = '<a href="/mobile/reg/medals/index.html?id=' + user +'">';
                if (info.mobile_pic) html += '<img id="userImg" src="https://mashpia.com/mobile/reg/' + info.mobile_pic + '">';
                else if (info.thumb) html += '<img id="userImg" src="https://mashpia.com/thumbs/' + info.thumb + '">';
                else if (info.photo) html += '<img id="userImg" src="https://mashpia.com/file_view.php?id=' + info.photo + '">';
                html += '</a>';
                $(".personalImg").append( html );
            });

            var bal = 0;
            var cart = [];
            var cartQty = 0;
            var totalPrice = 0;
            var originalBal = 0;
            var separator = '|';

            const auction_id = await fetch('ajax/getAuctionId.php').then(response => response.json()).then(data => data.auction_id);

            var float_element = "";
            var availibleStoreHTML = "Available <strong>Auction</strong> Miles: <br /><span id='balance'></span><span id='balance-display'></span>"
            var totalmilesText = "Total Miles Earned: ";
            var totalmilesYearText = "Total Miles Earned this Year: ";

            if (localStorage.getItem("locallang") == "he") {
                $("#img-cart").removeClass('pull-right').addClass('pull-left');
                float_element = 'style="float:right;direction:rtl; margin-right:8px;"';
                availibleStoreHTML = "נקודות שנשארו <strong>בחנות</strong> : <br /><span id='balance'></span><span id='balance-display'></span>";
                totalmilesText = "סך הנקודות שנצברו  : ";
                var totalmilesYearText = "סך הנקודות שנצברו השנה: ";
                var data_box_css = 'style="float:right;direction:rtl; margin-right:40px; margin-top: 20px;"';
            }
            $.post('ajax/getBalance.php', {
                admin: Cookies.get('admin'),
                user: user,
                auction: auction_id,
                points_beta: new URLSearchParams(window.location.search).get('points_beta') || "0"
            }, function (success) {
                var info = $.parseJSON(success);
                let html = '<div id="balance-box" ' + float_element + '>';
                html += availibleStoreHTML;//"Available <strong>Store</strong> Miles: <br /><span id='balance'></span><span id='balance-display'></span>";
                html += '</div><div id="data-box" ' + data_box_css + '>'
                html += totalmilesText + info.tpoints.toLocaleString(navigator.language) + "<br>";
                html += totalmilesYearText + info.earned.toLocaleString(navigator.language) + "<br>";
                html += '</div></div>'
                $(".balance").html(html);
                originalBal = info.available;
                setupCart();
                calcBalance();
            });
            
                    
            function setupCart() {
    			if (window.localStorage) {
    				cart = JSON.parse( localStorage.getItem('auctionCart' + user) );
    			} else {
    				// need to update browser so that sessionStorage will work
    				alert("You need to update your browser to the latest version in order for this site to work properly.");
    			}
    			
                // Check if cart is empty
                if (!cart || cart.length === 0) {
                    $('#empty-cart').show();
                    $('#cart').empty();
                    return;
                }
                
                $('#empty-cart').hide();
                
                // Grab the template script
                var tplScript = $("#cartTpl").html();
        
                // Compile the template
                var tpl = Handlebars.compile( tplScript );

                // Pass our data to the template
                var html = tpl( { items : cart } );
                
                // Add the compiled html to the page
                $("#cart").empty().append( html );
            }
                    
            function calcBalance() {
                var cartQty = 0;
                var totalPrice = 0;
                for (var c in cart) {
                    var item = cart[c];
                    cartQty += item.qty;
                    totalPrice += item.qty * item.price;
                }
                $("#cartQty").text(cartQty);
                bal = originalBal - totalPrice;
                $("#balance").text(bal);
                $("#balance-display").text(bal.toLocaleString(navigator.language));
            }
    		
    		function checkBal(key, qty) {
    			var bal = parseInt($("#balance").text());
    			var item = cart[key];
    			var extra = qty - item.qty;
    			if (extra > 0) {
    				if ((extra * item.price) > bal) {
    					alert('You do not have enough miles for this.');
    					return false;
    				}
    			}
    			return true;
    		}
            
            $(document).on('click', '.update', function() {
                // after deadline alert and return
				//alert('We are sorry but the auction deadline has past. You can no longer put in tickets for the auction.');
				//return false;

                var key = parseInt($(this).data('key'));
                var val = parseInt($('#qty-' + key).val());
                var item = cart[key];
    			if (checkBal(key, val)) {
    				item.qty = val;
    				// Update the Qty text in the DOM
    				$(this).closest('.store-item').find('.product-price').each(function() {
    					var text = $(this).text();
    					if (text.startsWith('Qty:')) {
    						$(this).text('Qty: ' + val);
    					}
    				});
    				calcBalance();
    				if (!window.localStorage) {
    					alert("You need to update your browser to the latest version in order for this feature to work.");
    				} else {
    					localStorage.setItem('auctionCart' + user, JSON.stringify( cart ));
    					alert('Updated. Remember to click "SAVE" at the very top of your cart.');
    				}
    			} else {
    				$('#qty-' + key).val(item.qty);
    			}
            });
            
            $(document).on('click', '.del', function() {
                // after deadline alert and return
				//alert('We are sorry but the auction deadline has past. You can no longer put in tickets for the auction.');
				//return false;

                var key = parseInt($(this).data('key'));
                cart.splice(key,1);
                calcBalance();
                if (!window.localStorage) {
    				alert("You need to update your browser to the latest version in order for this feature to work.");
    			} else {
    				localStorage.setItem('auctionCart' + user, JSON.stringify( cart ));
    				var row = $(this).parent().parent().parent().parent();
    				row.next('hr').remove();
    				row.remove();
    				
    				// Check if cart is now empty
    				if (cart.length === 0) {
    					$('#empty-cart').show();
    				}
    				//if (!cart.length) location.href = "index.html?id=" + user;
    			}
            });
            
			$("#purchase").click( function() {
                // after deadline alert and return
				//alert('We are sorry but the auction deadline has past. You can no longer put in tickets for the auction.');
				//return false;
    			
				// Prevent double-submission
				if ($("#purchase").attr('data-processing') === 'true') {
					return false;
				}
				
    			if (!cart.length) {
    				alert('You have nothing left in your cart!');
    				location.href = "index.html?id=" + user;
                    return;
    			}
				
				$("#purchase").attr('data-processing', 'true');
				$("#purchase").attr('disabled', true);
				
    			//alert('Not ready yet.');
				$.post('ajax/purchaseTickets.php', { cart : JSON.stringify(cart), user : user, auction : auction_id }, function( error ) {
                    if (error == 0) {
                        //alert('Your purchase has been successful.');
    					localStorage.removeItem('auctionCart' + user);
    					sessionStorage.removeItem('cartLoaded');
    					alert('Saved.');
						// Keep disabled while redirecting
						location.href = "index.html?id=" + user;
                        return;
                    } else {
                        alert(error);
						$("#purchase").attr('data-processing', 'false');
						$("#purchase").attr('disabled', false);
                        return;
                    } 
				}).fail(function() {
					alert('An error occurred while saving your cart. Please try again.');
					$("#purchase").attr('data-processing', 'false');
					$("#purchase").attr('disabled', false);
				});
            });

    		$("#back").click( function() {
    			location.href = "index.html?id=" + user;
            });
		});
    </script>
</html>
