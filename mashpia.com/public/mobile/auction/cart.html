	<body class="page-goals">
        <header class="navbar" id="top" role="banner">
            <div class="container">
                <div class="navbar-header">
                    <h1 class="i18n" data-key="pageTitle">Auction Cart</h1>
                </div>
            </div>
        </header>
        
        <div class="container">
            <div class="content">
        
                <div class="personalImg"></div>
				
				<div class="alert" role="alert" dir="ltr" style="color: red">
                    <b class="i18n" data-key="message1">After ADDING a prize in your Auction cart, be sure to click "SAVE" at the very bottom of your cart.</b><br />
                    <b class="i18n" data-key="message2">After UPDATING the quantities, be sure to click "UPDATE" & then "SAVE".</b>
				</div>
                
                <div class="alert alert-warning" role="alert" dir="ltr">
                    <div class="media">
                        <div class="pull-right">
                            (<span id="cartQty">0</span>) <img id="cart-img" src="../img_new/cart-color-white.svg" style="height: 52px;" />
                        </div>
                        <div class="media-body">
                            <span class="balance" style="color: white"></span>
                        </div>
                    </div>
                </div>
        
                <div id="main">
                    <div class="row">
                        <div class="col-xs-12">
                            <div class="chilrens" id="children">
                                <script id="childrenTpl" type="text/x-handlebars-template">
                                    {{#each items}}
                                        <div class="row child">
                                            <div class="col-xs-4">
                                                <div class="avatar-container img-people" align="center" style="position:relative">
                                                    <img class="children-avatar itemImage" src="https://mashpia.com/file_view.php?id={{this.image}}" />
													<br /><span class="update" >{{this.price}}</span><span class="i18n" data-key="points">Point(s)</span> 
												</div>
                                            </div>
                                            <div class="col-xs-8">
                                                <div class="childrens-content" style="line-height: 1.6" id="{{@key}}">
                                                    <div class="childrens-content-h1">{{this.name}}</div>
                                                    <div class="childrens-content-h2">
                                                        <span class="i18n" data-key="Qty">Qty</span>: <input type="text" size="2" value="{{this.qty}}" /><br />
                                                        <span class="update i18n"  data-key="Update">Update</span>
                                                    </div>
                                                    <div style="padding-top: 10px">
                                                        <div class="del">
                                                            <span class="glyphicon glyphicon-trash"></span>
                                                            <span class="ln-delete i18n"  data-key="REMOVE"><b>REMOVE</b></span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <hr width="75%" />
                                    {{/each}}
                                </script>
                            </div>
                        </div>
                        <div class="col-xs-12">
							<button id="back" class="btn btn-primary center-block pull-left"><b class="i18n" data-key="BACK" >BACK</b></button>
                            <button type="submit" id="purchase" class="btn btn-primary center-block">
                                <b class="i18n" data-key="SAVE">SAVE</b>
                            </button>
                      </div>
                    </div>
                </div>
            </div>
        </div>
        
	</body>

            function setupCart() {
    			if (window.localStorage) {
    				cart = JSON.parse( localStorage.getItem('auctionCart' + user) );
    			} else {
    				// need to update browser so that sessionStorage will work
    				alert("You need to update your browser to the latest version in order for this site to work properly.");
    			}
    			
                // Grab the template script
                var tplScript = $("#childrenTpl").html();
        
                // Compile the template
                var tpl = Handlebars.compile( tplScript );

                // Pass our data to the template
                var html = tpl( { items : cart } );
                
                // Add the compiled html to the page
                $(".chilrens").append( html );
            }
                    
            function calcBalance() {
                var cartQty = 0;
                var totalPrice = 0;
                for (var c in cart) {
                    var item = cart[c];
                    cartQty += item.qty;
                    totalPrice += item.qty * item.price;
                }
                $("#cartQty").text(cartQty);
                bal = originalBal - totalPrice;
                $("#balance").text(bal);
            }
    		
    		function checkBal(key, qty) {
    			var bal = parseInt($("#balance").text());
    			var item = cart[key];
    			var extra = qty - item.qty;
    			if (extra > 0) {
    				if ((extra * item.price) > bal) {
    					alert('You do not have enough miles for this.');
    					return false;
    				}
    			}
    			return true;
    		}

    				}
