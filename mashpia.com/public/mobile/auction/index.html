				var c = $(this).parent().attr('class');
				if (c.indexOf('open') > 0) {
					$(this).parent().removeClass('open');
					$(this).parent().find('.collapse').removeClass('in');
				} else {
					$(this).parent().addClass('open');
					$(this).parent().find('.collapse').addClass('in');
					$(this).parent().siblings().removeClass('open');
					$(this).parent().siblings().find('.collapse').removeClass('in');
				}
			});

			function initCart() {
				if (!window.localStorage) {
					// need to update browser so that sessionStorage will work
					alert(i18next.ht('UpdateBrowser1'));
				} else {
					if (localStorage.getItem('cartLoaded') && localStorage.getItem('auctionCart' + user)) {
						cart = JSON.parse(localStorage.getItem('auctionCart' + user));
						for (var c in cart) {
							var item = cart[c];
							cartQty += item.qty;
							totalPrice += item.qty * item.price;
							$("#" + item.prize).find('.cartNum').text(item.qty);
						}
						$("#cartQty").text(cartQty);
						calcBalance();
					} else {
						$.post('ajax/getTickets.php', {
							user: user,
							auction: auction_id
						}, function (data) {
							var info = $.parseJSON(data);
							for (var i in info) {
								var item = info[i];
								var id = parseInt(item.prize_id);
								var name = item.prize_name;
								var price = parseInt(item.prize_points);
								var qty = parseInt(item.quantity);
								var img = item.prize_image_id;
								cart.push({
									prize: id,
									name: name,
									price: price,
									image: img,
									qty: qty
								});
								//alert(qty);
								cartQty += qty;
								totalPrice += qty * price;
								$("#" + id).find('.cartNum').text(qty);
							}
							//alert(cartQty);
							localStorage.setItem('auctionCart' + user, JSON.stringify(cart));
							localStorage.setItem('cartLoaded', 1);
							$("#cartQty").text(cartQty);
							calcBalance();
						});
					}
				}
			}

			function calcBalance() {
				bal = originalBal - totalPrice;
				$("#balance").text(bal);
			}

			$(document).on('click', '.product-cart', function () {
				// after deadline alert and return
				//alert('We are sorry but the auction deadline has past. You can no longer put in tickets for the auction.');
				//return false;

				// get prize id and add to cart
				var prizeInfo = $(this).attr('id');
				var info = prizeInfo.split(separator);
				var id = parseInt(info[0]);
				var price = parseInt(info[1]);
				var image = info[2];
				var prizeName = info[3];
				var found = false;

				// see if user has enough points for this
				var curBal = parseInt($("#balance").text());
				if (curBal - price < 0) {
					alert(i18next.t('NotEnoughMiles'));
					return false;
				}

				for (var c in cart) {
					var item = cart[c];
					// see if item exists
					if (item.prize == id) {
						found = true;
						item.qty++;
						totalPrice += item.price;
						$("#" + id).find('.cartNum').text(item.qty);
						break;
					}
				}

				if (!found) {
					cart.push({
						prize: id,
						name: prizeName,
						price: price,
						image: image,
						qty: 1
					});
					totalPrice += price;
					$("#" + id).find('.cartNum').text('1');
				}

				cartQty++;
				if (!window.localStorage) {
					// need to update browser so that sessionStorage will work
					alert(i18next.t('UpdateBrowser'));
				} else {
					localStorage.setItem('auctionCart' + user, JSON.stringify(cart));
				}
				$("#cartQty").text(cartQty);

				calcBalance();
			});

			$("#cart-img").click(function () {
				location.href = "cart.html?id=" + user;
			});
	</script>
</body>

</html>
