<body class="page-goals">
	<header class="navbar" id="top" role="banner" style="margin-bottom: 0;">
		<div class="span12" style="max-width:1024px;width:100%;margin:0 auto;float:none;text-align: center;">
			<span id="page-title" class="i18n" data-key="pageTitle">AUCTION</span>
		</div>
	</header>

	<div style="display: flex; background: #343862;">
		<div class="span12 footer media-group subMenu" style="width: 100%;">
			<a href="" id="storeMenu">
				<div class="span3" style="width:33.3%">
					<div class="menu-item">
						<div class="span12">
							<img src="../img_new/store-color-white.svg">
						</div>
						<div class="span12">
							<span class="i18n" data-key="Store">Store</span>
						</div>
					</div>
				</div>
			</a>
			<a href="" id="scanMenu">
				<div class="span3" style="width:33.3%">
					<div class="menu-item">
						<div class="span12">
							<img src="../img_new/scanner-1-color-white.svg">
						</div>
						<div class="span12">
							<span class="i18n" data-key="Scanner">Scanner</span>
						</div>
					</div>
				</div>
			</a>
			<a href="" id="auctionMenu">
				<div class="span3 active" style="width:33.3%">
					<div class="menu-item">
						<div class="span12">
							<img src="../img_new/ticket-color-white.svg">
						</div>
						<div class="span12">
							<span class="i18n" data-key="Auction">Auction</span>
						</div>
					</div>
				</div>
			</a>
		</div>
	</div>

	<div class="container">
		<div class="content">

			<div class="personalImg"></div>

			<!-- <div class="alert alert-warning" role="alert" dir="ltr">
				Coming Soon ...
			</div> -->

			<div class="alert alert-warning" role="alert" dir="ltr" style="min-height: 92px; margin-top: 30px;">
				<div class="media">
					<div id="img-cart" class="pull-right">
						(<span id="cartQty">0</span>) <img id="cart-img" src="../img_new/cart-color-white.svg"
							style="height: 52px;" />
					</div>
					<div class="media-body">
						<span class="balance"></span>
					</div>
				</div>
			</div>

			<!-- Sorting Controls -->
			<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 15px;">
				<div style="display: flex; align-items: center; gap: 10px;">
					<label for="sort-select" style="font-weight: 600; color: #1b2b51;">Sort by:</label>
					<select id="sort-select" style="padding: 4px 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 1em;">
						<option value="amount-asc">Amount (Points) ↑</option>
						<option value="amount-desc">Amount (Points) ↓</option>
						<option value="alpha-asc">Alphabetical (A-Z)</option>
						<option value="alpha-desc">Alphabetical (Z-A)</option>
						<option value="category-asc">Category (A-Z)</option>
						<option value="category-desc">Category (Z-A)</option>
					</select>
				</div>
				<button id="checkout-all-btn" class="checkout-now-btn" style="display: none; padding: 12px 20px; font-size: 1.1em; background: #e92d41; border-color: #e92d41;">
					<i class="fa fa-shopping-cart" style="color: #fff; margin-right: 8px;"></i> Checkout Now
				</button>
			</div>

			<!-- Cart Warning -->
			<div id="cart-warning" style="display: none; background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; padding: 12px; border-radius: 6px; margin-bottom: 18px; text-align: center; font-weight: bold;">
				You must click on checkout in order to purchase what's in your cart.
			</div>

			<div id="main">
				<div id="AuctionEnded" style="text-align: center; font-size: 20px;" class="i18n2"
					data-key="AuctionEnded">
					<br /><br />
					The auction for 5785 has ended.
				</div>
			</div>

		</div>
	</div>

	<div id="spinner"></div>

	<div style="position: fixed;width: 100%;bottom:0px; z-index: 1000; background: #4258a2;display:flex;">
		<div class="span12 footer">
			<div class="span3">
				<a href="../reg/parent_detail.html" id="mainLink">
					<div class="menu-item">
						<div class="span12">
							<img src="../img_new/boy-color-white.svg">
						</div>
						<div class="span12">
							<span class="i18n" data-key="Accounts">Accounts</span>
						</div>
					</div>
				</a>
			</div>
			<div class="span3">
				<a href="#" id="missionsLink">
					<div class="menu-item">
						<div class="span12">
							<img src="../img_new/square-check-color-white.svg">
						</div>
						<div class="span12">
							<span class="i18n" data-key="Missions">Missions</span>
						</div>
					</div>
				</a>
			</div>
			<div class="span3">
				<a href="#" id="rankLink">
					<div class="menu-item">
						<div class="span12">
							<img src="../img_new/achievements-color-white.svg">
						</div>
						<div class="span12">
							<span class="i18n" data-key="Achievements">Achievements</span>
						</div>
					</div>
				</a>
			</div>
			<div class="span3 active">
				<a href="#" id="storeLink">
					<div class="menu-item">
						<div class="span12">
							<img src="../img_new/cart-color-white.svg">
						</div>
						<div class="span12">
							<span class="i18n" data-key="Rewards">Rewards</span>
						</div>
					</div>
				</a>
			</div>
		</div>
	</div>

	<!-- <script src="/mobile/js/authenticate.js" defer></script> -->
	<script>
		document.addEventListener("DOMContentLoaded", async function (event) {
			var url = location.href.toString();
			var pos = url.indexOf('=');
			var user = url.substring(pos + 1);

			if (user.indexOf('#') != -1) {
				var p = user.indexOf('#');
				user = user.substring(0, p);
			}

			// authenticate(user);
			if (localStorage.getItem("login") == "user") {
				$("#mainLink").attr('href', '/mobile/reg/medals/?id=' + user);
			}

			$("#missionsLink").attr('href', '../missionsNew.html?id=' + user);
			$("#goalsLink").attr('href', '../goalsNew.html?id=' + user);
			$("#rankLink").attr('href', '../reg/rank.html?id=' + user);
			$("#storeMenu").attr('href', '../store/index.html?id=' + user);
			$("#scanMenu").attr('href', '../store/scan.html?id=' + user);

			$.post('../reg/ajax/getPhoto.php', {
				user_id: user
			}, function (success) {
				var info = $.parseJSON(success);
				var html = '<a href="../reg/medals/index.html?id=' + user + '">';
				if (info.mobile_pic) html += '<img id="userImg" src="https://mashpia.com/mobile/reg/' + info
						.mobile_pic + '">';
				else if (info.thumb) html += '<img id="userImg" src="https://mashpia.com/thumbs/' + info
						.thumb + '">';
				else if (info.photo) html += '<img id="userImg" src="https://mashpia.com/file_view.php?id=' +
						info.photo + '">';
				html += '</a>';
				$(".personalImg").append(html);
			});

			var bal = 0;
			var cart = [];
			var cartQty = 0;
			var totalPrice = 0;
			var originalBal = 0;
			var separator = '|';

			const auction_id = await fetch('ajax/getAuctionId.php').then(response => response.json()).then(data => data.auction_id);

			var float_element = "";
			var availibleStoreHTML = "Available <strong>Auction</strong> Miles: <br /><span id='balance'></span><span id='balance-display'></span>"
			var totalmilesText = "Total Miles Earned: ";
			var totalmilesYearText = "Total Miles Earned this Year: ";

			if (localStorage.getItem("locallang") == "he") {
				$("#img-cart").removeClass('pull-right').addClass('pull-left');
				float_element = 'style="float:right;direction:rtl; margin-right:8px;"';
				availibleStoreHTML = "נקודות שנשארו <strong>בחנות</strong> : <br /><span id='balance'></span><span id='balance-display'></span>";
				totalmilesText = "סך הנקודות שנצברו  : ";
				var totalmilesYearText = "סך הנקודות שנצברו השנה: ";
				var data_box_css = 'style="float:right;direction:rtl; margin-right:40px; margin-top: 20px;"';
			}
			$.post('ajax/getBalance.php', {
				admin: Cookies.get('admin'),
				user: user,
				auction: auction_id,
				points_beta: new URLSearchParams(window.location.search).get('points_beta') || "0"
			}, function (success) {
				var info = $.parseJSON(success);
				let html = '<div id="balance-box" ' + float_element + '>';
				html += availibleStoreHTML;//"Available <strong>Store</strong> Miles: <br /><span id='balance'></span><span id='balance-display'></span>";
				html += '</div><div id="data-box" ' + data_box_css + '>'
				html += totalmilesText + info.tpoints.toLocaleString(navigator.language) + "<br>";
				html += totalmilesYearText + info.earned.toLocaleString(navigator.language) + "<br>";
				html += '</div></div>'
				$(".balance").html(html);
				originalBal = info.available;
				initCart();
				calcBalance();
			});

			var allPrizes = [];
			var currentSort = 'amount-asc';

			function renderPrizes() {
				var sortedPrizes = allPrizes.slice();
				if (currentSort === 'amount-asc') {
					sortedPrizes.sort(function(a, b) {
						var pointsA = parseInt(a.prize_points, 10);
						var pointsB = parseInt(b.prize_points, 10);
						if (pointsA !== pointsB) return pointsA - pointsB;
						return a.prize_name.localeCompare(b.prize_name);
					});
				} else if (currentSort === 'amount-desc') {
					sortedPrizes.sort(function(a, b) {
						var pointsA = parseInt(a.prize_points, 10);
						var pointsB = parseInt(b.prize_points, 10);
						if (pointsA !== pointsB) return pointsB - pointsA;
						return a.prize_name.localeCompare(b.prize_name);
					});
				} else if (currentSort === 'alpha-asc') {
					sortedPrizes.sort(function(a, b) {
						return a.prize_name.localeCompare(b.prize_name) || (parseInt(a.prize_points, 10) - parseInt(b.prize_points, 10));
					});
				} else if (currentSort === 'alpha-desc') {
					sortedPrizes.sort(function(a, b) {
						return b.prize_name.localeCompare(a.prize_name) || (parseInt(a.prize_points, 10) - parseInt(b.prize_points, 10));
					});
				} else if (currentSort === 'category-asc') {
					sortedPrizes.sort(function(a, b) {
						return a.category.localeCompare(b.category);
					});
				} else if (currentSort === 'category-desc') {
					sortedPrizes.sort(function(a, b) {
						return b.category.localeCompare(a.category);
					});
				}

				var html = '';
				for (var i = 0; i < sortedPrizes.length; i++) {
					var prize = sortedPrizes[i];
					html += '<div class="col-xs-12 col-sm-6 col-md-4 col-lg-3 col-xl-2 text-center product">\
						<article class="product light" id=' + prize.prize_id + '>' +
						'<div class="price-badge">' + prize.prize_points + ' Miles</div>' +
						'<figure class="figure-hover-overlay">' +
						'<a href="#" class="figure-href"></a>\
						<img class="img-responsive" src="https://mashpia.com/file_view.php?id=' + prize.prize_image_id + '" alt="" title="">\
						</figure>\
						<div class="product-caption">\
							<div class="block-name">\
								<div class="category">' + (prize.category ? prize.category : '') + '</div>\
								<a href="#" class="product-name">' + prize.prize_name + '</a>\
								<p class="onePerUser">Only ' + prize.available + ' available.</p>\
							</div>\
						</div>\
						<div class="product-cart" id="' +
						prize.prize_id + separator + prize.prize_points + separator + prize.prize_image_id + separator + prize.prize_name + '">\
							<div style="display: flex; align-items: center; gap: 8px; justify-content: center;">\
								<input type="number" class="qty-input" data-prize-id="' + prize.prize_id + '" value="0" min="0" max="99" style="width: 50px; padding: 4px; border: 1px solid #ccc; border-radius: 4px; text-align: center;">\
								<button class="add-to-cart-btn" style="background: #4258a2; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: 600;"><i class="fa fa-shopping-cart"></i> Add Tickets to Prize</button>\
							</div>\
						</div></article></div>';
				}

				$("#main").html(html);

				// Update quantity inputs
				updateQuantityInputs();
			}
			
			function updateQuantityInputs() {
				$('.qty-input').each(function() {
					var prizeId = parseInt($(this).data('prize-id'));
					var qty = 0;
					var inCart = false;
					
					// Find this prize in cart
					for (var c in cart) {
						var item = cart[c];
						if (item.prize == prizeId) {
							qty = item.qty;
							inCart = true;
							break;
						}
					}
					
					$(this).val(qty);
					// Update button HTML (icon + text)
					var btn = $(this).siblings('.add-to-cart-btn');
					if (inCart) {
						btn.html('<i class="fa fa-shopping-cart"></i> Update Tickets');
					} else {
						btn.html('<i class="fa fa-shopping-cart"></i> Add Tickets to Prize');
					}
				});
			}

			function getCartQty(prizeId) {
				for (var c in cart) {
					var item = cart[c];
					if (item.prize == prizeId) {
						return item.qty;
					}
				}
				return 0;
			}

			if (auction_id > 0) {
				$.post('ajax/getPrizes.php', {
					admin: Cookies.get('admin'),
					user: user,
					auction: auction_id
				}, function (success) {
					var prizes = $.parseJSON(success);

					// Flatten the prizes array
					for (var amount in prizes) {
						for (var p in prizes[amount]) {
							allPrizes.push(prizes[amount][p]);
						}
					}

					renderPrizes();
				});
			}

			// Sort functionality
			$(document).on('change', '#sort-select', function() {
				currentSort = $(this).val();
				renderPrizes();
			});
		
			function initCart() {
				if (!window.localStorage) {
					// need to update browser so that sessionStorage will work
					alert(i18next.ht('UpdateBrowser1'));
				} else {
					if (localStorage.getItem('cartLoaded') && localStorage.getItem('auctionCart' + user)) {
						cart = JSON.parse(localStorage.getItem('auctionCart' + user));
						for (var c in cart) {
							var item = cart[c];
							cartQty += item.qty;
							totalPrice += item.qty * item.price;
						}
						$("#cartQty").text(cartQty);
						calcBalance();
					} else {
						$.post('ajax/getTickets.php', {
							user: user,
							auction: auction_id
						}, function (data) {
							var info = $.parseJSON(data);
							for (var i in info) {
								var item = info[i];
								var id = parseInt(item.prize_id);
								var name = item.prize_name;
								var price = parseInt(item.prize_points);
								var qty = parseInt(item.quantity);
								var img = item.prize_image_id;
								cart.push({
									prize: id,
									name: name,
									price: price,
									image: img,
									qty: qty
								});
								cartQty += qty;
								totalPrice += qty * price;
							}
							localStorage.setItem('auctionCart' + user, JSON.stringify(cart));
							localStorage.setItem('cartLoaded', 1);
							$("#cartQty").text(cartQty);
							calcBalance();
						});
					}
				}
			}

		function calcBalance() {
			bal = originalBal - totalPrice;
			$("#balance").text(bal);
			$("#balance-display").text(bal.toLocaleString(navigator.language));
			
			// Show/hide cart warning and checkout button
			if (cart.length > 0) {
				$('#cart-warning').show();
				$('#checkout-all-btn').show();
			} else {
				$('#cart-warning').hide();
				$('#checkout-all-btn').hide();
			}
		}

		$(document).on('click', '.add-to-cart-btn', function (e) {
			e.preventDefault();
			e.stopPropagation();
			
			var productCart = $(this).closest('.product-cart');
			var qtyInput = productCart.find('.qty-input');
			var newQty = parseInt(qtyInput.val()) || 0;
			
			if (newQty === 0) {
				alert('Please enter a quantity greater than 0 to add to cart.');
				return false;
			}
			
			if (newQty < 0) {
				alert('Please enter a quantity 0 or greater.');
				return false;
			}
			
			// get prize id and add to cart
			var prizeInfo = productCart.attr('id');
			var info = prizeInfo.split(separator);
			var id = parseInt(info[0]);
			var price = parseInt(info[1]);
			var image = info[2];
			var prizeName = info[3];
			var found = false;

			// see if user has enough points for this
			var curBal = parseInt($("#balance").text());
			if (curBal + (getCartQty(id) * price) - (price * newQty) < 0) {
				alert('You do not have enough points for this quantity.');
				return false;
			}

			// Check if user already has this item in cart
			for (var c in cart) {
				var item = cart[c];
				if (item.prize == id) {
					found = true;
					// Update cart quantity
					totalPrice -= item.qty * item.price;
					cartQty -= item.qty;
					item.qty = newQty;
					totalPrice += item.price * newQty;
					cartQty += newQty;
					// If qty is 0, remove from cart
					if (newQty === 0) {
						cart.splice(c, 1);
					}
					break;
				}
			}

			if (!found && newQty > 0) {
				cart.push({
					prize: id,
					name: prizeName,
					price: price,
					image: image,
					qty: newQty
				});
				totalPrice += price * newQty;
				cartQty += newQty;
			}

			if (!window.localStorage) {
				// need to update browser so that sessionStorage will work
				alert(i18next.t('UpdateBrowser'));
			} else {
				localStorage.setItem('auctionCart' + user, JSON.stringify(cart));
			}
			$("#cartQty").text(cartQty);

			calcBalance();
			updateQuantityInputs();
		});
		
		$(document).on('change', '.qty-input', function() {
			var qty = parseInt($(this).val()) || 0;
			var max = parseInt($(this).attr('max')) || 99;
			
			if (qty < 0) {
				$(this).val(0);
			} else if (qty > max) {
				$(this).val(max);
			}
			// Update button HTML (icon + text) live
			var btn = $(this).siblings('.add-to-cart-btn');
			var prizeId = parseInt($(this).data('prize-id'));
			var inCart = false;
			
			// Check if this prize is already in cart
			for (var c in cart) {
				var item = cart[c];
				if (item.prize == prizeId) {
					inCart = true;
					break;
				}
			}
			
			if (inCart) {
				btn.html('<i class="fa fa-shopping-cart"></i> Update Tickets');
			} else {
				btn.html('<i class="fa fa-shopping-cart"></i> Add Tickets to Prize');
			}
		});

		$(document).on('click', '#checkout-all-btn', function (e) {
			e.preventDefault();
			e.stopPropagation();
			window.location.href = 'cart.html?id=' + user;
		});

		$("#cart-img").click(function () {
			if (auction_id > 0) {
				location.href = "cart.html?id=" + user;
			} else {
				alert('Auction is currently closed.');
			}
		});
	})
	</script>
