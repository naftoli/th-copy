<script>
  if (localStorage.getItem('locallang') == 'he' || Cookies.get('lang') == 'he') {
    $(".bug-report").hide()
  }
  // force https
  if (window.location.protocol == 'http:') window.location.href = window.location.href.replace('http:', 'https:')
  if (Cookies.get('admin') == undefined) window.location.href = '/mobile'
</script>

<script type="text/babel">
  const { useState, useEffect, useRef } = React
  const { createRoot } = ReactDOM
  const admin = Cookies.get('admin')

  const Gear = () => {
    const [amount, setAmount] = useState(0)
    const [times, setTimes] = useState(0)
    const [ranks, setRanks] = useState([])
    const [sweaters, setSweaters] = useState([])
    const [children, setChildren] = useState([])
    const [showAddress, setShowAddress] = useState(false)
    const [address, setAddress] = useState({ address: '', city: '', state: '', zip: '' });
    const [assignedChild, setAssignedChild] = useState(0);
    const [choice, setChoice] = useState('');

    const addSweater = () => {
      if (sweaters.length >= times) {
        alert('You cannot add any more sweaters.')
        return
      }
      const newSweater = {
        color: '',
        size: '',
        rank: '',
        cap: '',
      }
      setSweaters([...sweaters, newSweater])
    }

    const handleChange = (e, index) => {
      const { name, value } = e.target
      const list = [...sweaters]
      list[index][name] = value
      setSweaters(list)
    }

    const handleSave = () => {
      // Check if any field is empty or not selected in any sweater
      const isValid = sweaters.every(
        (sweater) =>
          sweater.color !== "" && sweater.size !== "" && sweater.rank !== "" && sweater.cap !== ""
      );

      if (!isValid) {
        // Handle the case when any field is empty
        alert("Please fill out all the fields in each sweater.");
        return;
      }

      // check that the user has entered an address if needed
      if (showAddress) {
        if (!choice) {
          alert('Please select whether you would like to pickup from JCM or ship to a US Address.')
          return
        } else if (choice == 'address') {
          if (address.address == '' || address.city == '' || address.state == '' || address.zip == '') {
            alert('Please enter your address.')
            return
          }
        }
      } else {
        // check that the user has selected a child
        if (assignedChild == 0) {
          alert('Please select a child to assign the sweaters to.')
          return
        }
      }

      console.log(sweaters)
      console.log(address)
      console.log(assignedChild)
      fetch('saveGear.php', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          sweaters,
          address,
          assignedChild,
          choice,
          admin
        })
      })
        .then((res) => res.json())
        .then((data) => {
          if (data.error) {
            console.log(data.error)
            alert('Pls try again. If this keeps on happening, please whatsapp Shimmy Weinbaum @ 917 627 7636.')
          } else {
            let person = 'You'
            if (assignedChild) person = 'Your child'
            const message = "Your order has been saved.\n" + person + " will receive the order by the Elul Rally. Thank you.\n" +
              "You will now be sent back to the home page.\nYou can always come back to this page and edit your order until Rosh Chodesh Elul - August 17."
            alert(message)
            window.location.href = '/mobile'
          }
        })
        .catch((err) => {
          console.log(err)
          alert('An error occurred. Please try again.')
        })
    }


    useEffect(() => {
      (async () => {
        const result = await fetch('getInfo.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            family_id: admin
          })
        })
        const data = await result.json()
        if (data.error) {
          alert(data.error)
          window.location.href = '/mobile'
        } else {
          // make sure that admin can order at least one sweater
          if (data.times < 1) {
            alert('You have not raised enough money to purchase any sweaters.')
            window.location.href = '/mobile'
          }
          setAmount(data.amount)
          setTimes(data.times)
          setChildren(data.children)
          if (data.sweaters.length) setSweaters(data.sweaters)
          else {
            const newSweater = {
              color: '',
              size: '',
              rank: '',
              cap: '',
            }
            setSweaters([newSweater])
          }
          setRanks(Object.values(data.ranks).map(rank => rank.toLowerCase()))
          if (! data.children.length) setShowAddress(true)
          if (data.sweaters.length) {
            if (data.sweaters[0].address) {
              if (data.sweaters[0].address === 'pickup') {
                setChoice('pickup')
                setAddress({ address: 'pickup', city: '', state: '', zip: '' })
              } else {
                setChoice('address')
                const [address, city, state, zip] = data.sweaters[0].address.split(', ')
                setAddress({ address, city, state, zip })
              }
            } else {
              console.log(data.sweaters[0].user_id)
              setAssignedChild(data.sweaters[0].user_id)
            }
          }
        }
      })()
    }, [])

    return (
      <>
        <Raised
          amount={amount}
          times={times}
        />
        <hr />
        <Sweaters
          sweaters={sweaters}
          children={children}
          ranks={ranks}
          address={address}
          assignedChild={assignedChild}
          showAddress={showAddress}
          setAddress={setAddress}
          setAssignedChild={setAssignedChild}
          addSweater={addSweater}
          handleChange={handleChange}
          setChoice={setChoice}
          setSweaters={setSweaters}
        />
        <hr />
        <div align="center">
          <button className="btn btn-info" onClick={handleSave}>Save</button>
        </div>
      </>
    )
  }

  const Raised = ({ amount, times }) => {
    return (
      <div style={{ fontSize: 'larger' }}>
        Thank you so much for making a team in our <i>Grow The Army</i> campaign. You raised ${amount} and this will
        truly help grow the army that will conquer the world for Hashem and bring Moshiach NOW!
        <br/><br/>
        <b>Please make your Tzivos Hashem gear order:</b>
        <br/><br/>
        As a token of our appreciation for raising ${amount}, you can order {times} sweater(s), rank patch(es), and cap(s).
      </div>
    )
  }

  const Sweaters = props => {
    const {
      sweaters,
      children,
      ranks,
      address,
      assignedChild,
      showAddress,
      setAddress,
      setAssignedChild,
      addSweater,
      handleChange,
      setChoice,
      setSweaters
    } = props
    return (
      <>
        <div>
          <GearDetails
            sweaters={sweaters}
            ranks={ranks}
            handleChange={handleChange}
          />
          <br />
          {sweaters.length > 1 ? (
            <>
              <button className="btn btn-danger" onClick={() => setSweaters(sweaters.slice(0, sweaters.length - 1))}>
                Remove Gear #{sweaters.length}
              </button>
              <br /><br />
            </>
          ) : null
          }
          <button className="btn btn-info" onClick={addSweater}>
            Add Gear
          </button>
        </div>
        <hr />
        {showAddress ? (
          <Address
            address={address}
            setAddress={setAddress}
            setChoice={setChoice}
          />
          ) : (
          <AssignGear
            children={children}
            assignedChild={assignedChild}
            setAssignedChild={setAssignedChild}
          />
        )}
      </>
    )
  }

  const GearDetails = ({ sweaters, ranks, handleChange }) => {
    const handleSweaterChange = (e, index) => {
      handleChange(e, index)
    }
    return (
      <div className="details">
        {sweaters.map((sweater, index) => (
          <div key={index}>
            <h4>Gear #{index + 1}</h4>
            <label>Color:</label>
            <select
              name="color"
              className="form-control"
              value={sweater.color}
              onChange={(e) => handleSweaterChange(e, index)}
            >
              <option value="">Please Choose</option>
              <option value="navy">Navy / Boys</option>
              <option value="burgundy">Burgundy / Girls</option>
            </select><br/>
            <label>Size:</label>
            <select
              name="size"
              className="form-control"
              value={sweater.size}
              onChange={(e) => handleSweaterChange(e, index)}
            >
              <option value="">Please Choose</option>
              <option value="youth xs">Youth XS</option>
              <option value="youth s">Youth S</option>
              <option value="youth m">Youth M</option>
              <option value="youth l">Youth L</option>
              <option value="adult xs">Adult XS</option>
              <option value="adult s">Adult S</option>
              <option value="adult m">Adult M</option>
              <option value="adult l">Adult L</option>
              <option value="adult xl">Adult XL</option>
              <option value="adult xxl">Adult XXL</option>
              <option value="adult xxxl">Adult XXXL</option>
            </select><br/>
            <p>
              <b>Which rank would you like your sweater patch to be for?</b><br/>
              <i>Bear in mind that this will be given out at the Elul rally so the child may go up in rank between now and then.</i>
            </p>
            <select
              name="rank"
              className="form-control"
              value={sweater.rank}
              onChange={(e) => handleSweaterChange(e, index)}
            >
              <option value="">Please Choose</option>
              {ranks && ranks.map((rank, i) => (
                <option key={i} value={rank}>{rank[0].toUpperCase() + rank.slice(1)}</option>
              ))}
            </select>
            <br />
            <label>Cap Color:</label>
            <select
              name="cap"
              className="form-control"
              value={sweater.cap}
              onChange={(e) => handleSweaterChange(e, index)}
            >
              <option value="">Please Choose</option>
              <option value="navy">Navy / Boys</option>
              <option value="burgundy">Burgundy / Girls</option>
            </select>
            <br />
          </div>
        ))}
      </div>
    )
  }

  const AssignGear = ({ children, assignedChild, setAssignedChild }) => {
    return (
      <div>
        <p>
          <b>Which child would you like to send it to?</b><br/>
          (All gear will be sent to the child you choose.)
        </p>
        <select
          name="child"
          className="form-control"
          value={assignedChild || ''}
          onChange={e => setAssignedChild(e.target.value)}
        >
          {children.map((child, i) => (
            <option key={i} value={child.user_id}>{child.first + ' ' + child.last + ' - ' + child.school_name}</option>
          ))}
        </select>
      </div>
    )
  }

  const Address = ({ address, setAddress, setChoice }) => {
    const [show, setShow] = useState(address.address === '' || address.address === 'pickup' ? false : true)

    const handleChoice = e => {
      if (e.target.value === 'address') setShow(true)
      else {
        setShow(false)
        setAddress({
          address: 'pickup',
          city: '',
          state: '',
          zip: ''
        })
      }
      setChoice(e.target.value)
    }

    const handleAddressChange = e => {
      setAddress({
        ...address,
        [e.target.name]: e.target.value
      })
    }

    return (
      <>
        <div>
          <label htmlFor="choice">Please choose where you would like your gear to be sent to:</label><br />
          <input
            type="radio"
            name="choice"
            value="pickup"
            onClick={handleChoice}
            defaultChecked={address.address === 'pickup'}
          /> Pickup from Tzivos Hashem HQ<br />
          <input
            type="radio"
            name="choice"
            value="address"
            onClick={handleChoice}
            defaultChecked={address.address && address.address !== 'pickup'}
          /> A US address <b>(only)</b><br />
        </div>
        <br />
        {show && (
          <div id="address-info">
            <label htmlFor="address">Please enter the address you would like the gear sent to:</label>
            <input
              type="text"
              name="address"
              className="form-control"
              placeholder="Enter Address"
              value={address.address}
              onChange={handleAddressChange}
            /><br />
            <input
              type="text"
              name="city"
              className="form-control"
              placeholder="Enter City"
              value={address.city}
              onChange={handleAddressChange}
            /><br />
            <select
              name="state"
              className="form-control"
              value={address.state}
              onChange={handleAddressChange}
            >
              <option value="">State</option>
              <option value="AL">Alabama</option>
              <option value="AK">Alaska</option>
              <option value="AZ">Arizona</option>
              <option value="AR">Arkansas</option>
              <option value="CA">California</option>
              <option value="CO">Colorado</option>
              <option value="CT">Connecticut</option>
              <option value="DE">Delaware</option>
              <option value="DC">District Of Columbia</option>
              <option value="FL">Florida</option>
              <option value="GA">Georgia</option>
              <option value="HI">Hawaii</option>
              <option value="ID">Idaho</option>
              <option value="IL">Illinois</option>
              <option value="IN">Indiana</option>
              <option value="IA">Iowa</option>
              <option value="KS">Kansas</option>
              <option value="KY">Kentucky</option>
              <option value="LA">Louisiana</option>
              <option value="ME">Maine</option>
              <option value="MD">Maryland</option>
              <option value="MA">Massachusetts</option>
              <option value="MI">Michigan</option>
              <option value="MN">Minnesota</option>
              <option value="MS">Mississippi</option>
              <option value="MO">Missouri</option>
              <option value="MT">Montana</option>
              <option value="NE">Nebraska</option>
              <option value="NV">Nevada</option>
              <option value="NH">New Hampshire</option>
              <option value="NJ">New Jersey</option>
              <option value="NM">New Mexico</option>
              <option value="NY">New York</option>
              <option value="NC">North Carolina</option>
              <option value="ND">North Dakota</option>
              <option value="OH">Ohio</option>
              <option value="OK">Oklahoma</option>
              <option value="OR">Oregon</option>
              <option value="PA">Pennsylvania</option>
              <option value="RI">Rhode Island</option>
              <option value="SC">South Carolina</option>
              <option value="SD">South Dakota</option>
              <option value="TN">Tennessee</option>
              <option value="TX">Texas</option>
              <option value="UT">Utah</option>
              <option value="VT">Vermont</option>
              <option value="VA">Virginia</option>
              <option value="WA">Washington</option>
              <option value="WV">West Virginia</option>
              <option value="WI">Wisconsin</option>
              <option value="WY">Wyoming</option>
            </select><br />
            <input
              type="text"
              name="zip"
              className="form-control"
              placeholder="Enter Zip"
              value={address.zip}
              onChange={handleAddressChange}
            /><br />
          </div>
        )}
      </>
    )
  }

  const container = document.getElementById('gear')
  const root = createRoot(container)
  root.render(<Gear />)
</script>
</html>
