<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive PNG Image Display</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background-color: #f0f0f0;
    }
    .image-container {
      width: 100%;
      display: flex;
      justify-content: center;
      background-color: #000; /* Added for visibility */
      padding: 20px 0; /* Added some padding */
    }
    img {
      max-width: 90%;
      max-height: 80vh;
      object-fit: contain;
    }
    .text-overlay {
      position: absolute;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 24px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    #debug {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
<div class="image-container">
  <img src="" alt="Responsive Image" id="responsiveImage">
  <div class="text-overlay" id="nameOverlay"></div>
</div>
<div id="debug"></div>

<script>
const url = window.location.search
  const urlParams = new URLSearchParams(url)
  const file = urlParams.get('url')
  const he_name = urlParams.get('he_name')

  const img = document.getElementById('responsiveImage');
  const debugDiv = document.getElementById('debug');

  img.src = decodeURIComponent(file);

  // Configuration
  const verticalPosition = 0.56; // 56% down from the top
  const minFontSize = 16; // Minimum font size in pixels
  const maxFontSize = 48; // Maximum font size in pixels
  const minWidth = 300; // Minimum viewport width to start scaling
  const maxWidth = 1200; // Maximum viewport width to stop scaling

  function calculateFontSize() {
    const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
    if (vw <= minWidth) return minFontSize;
    if (vw >= maxWidth) return maxFontSize;
    return minFontSize + (maxFontSize - minFontSize) * ((vw - minWidth) / (maxWidth - minWidth));
  }

  function updateTextPosition() {
    const rect = img.getBoundingClientRect();
    const topPosition = rect.height * verticalPosition;
    nameOverlay.style.top = `${topPosition}px`;
    nameOverlay.textContent = he_name;
    // Update font size
    const fontSize = calculateFontSize();
    nameOverlay.style.fontSize = `${fontSize}px`;
  }

  function updateDebugInfo() {
    const rect = img.getBoundingClientRect();
    debugDiv.innerHTML = `
                  Window size: ${window.innerWidth} x ${window.innerHeight}<br>
                  Image size: ${rect.width.toFixed(0)} x ${rect.height.toFixed(0)}<br>
                  Image natural size: ${img.naturalWidth} x ${img.naturalHeight}<br>
                  Text position: ${(verticalPosition * 100).toFixed(0)}% from top
              `;
  }

  function updateLayout() {
    updateTextPosition();
    updateDebugInfo();
  }

  window.addEventListener('load', updateLayout);
  window.addEventListener('resize', updateLayout);
</script>
</body>
</html>
