<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chidon Certificate</title>
  <style>
    @font-face {
      font-family: 'FB';
      src: url('https://mashpia.com/certs/FbTrick-Regular.otf') format('opentype');
    }
    @font-face {
      font-family: 'FB_Black';
      src: url('https://mashpia.com/certs/FbTrick-Black.otf') format('opentype');
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    canvas {
      max-width: 95%;
      max-height: 95%;
    }
    #debug {
      margin-top: 10px;
      font-family: monospace;
    }
  </style>
</head>
<body>
<canvas id="imageCanvas"></canvas>
<div id="debug"></div>

<script>
  const url = window.location.search
  const urlParams = new URLSearchParams(url)
  const file = urlParams.get('url')
  const he_name = urlParams.get('he_name')

  const canvas = document.getElementById('imageCanvas');
  const ctx = canvas.getContext('2d');
  const debugDiv = document.getElementById('debug');
  const img = new Image();
  img.src = decodeURIComponent(file);

  function drawImageAndText() {
    const maxWidth = window.innerWidth * 0.9;
    const maxHeight = window.innerHeight * 0.8; // Reduced to accommodate debug info

    let scaleFactorWidth = maxWidth / img.width;
    // let scaleFactorHeight = maxHeight / img.height;
    let scaleFactor = Math.min(scaleFactorWidth, 1);

    const scaledWidth = img.width * scaleFactor;
    const scaledHeight = img.height * scaleFactor;

    canvas.width = scaledWidth;
    canvas.height = scaledHeight;

    ctx.drawImage(img, 0, 0, scaledWidth, scaledHeight);

    const baseSize = 20;
    const minSize = 16;
    const maxSize = 60; // Increased for better visibility

    // Font size calculation
    const fontSize = Math.max(minSize, Math.min(maxSize, baseSize * (scaleFactor + 1.5)));

    ctx.font = `${fontSize}px Arial`;
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle'; // Ensure vertical centering

    const textX = scaledWidth / 2;
    const textY = scaledHeight / 2;

    // Draw a rectangle behind the text for visibility
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    const textWidth = ctx.measureText(name).width;
    ctx.fillRect(textX - textWidth / 2 - 5, textY - fontSize / 2 - 5, textWidth + 10, fontSize + 10);

    // Draw the text
    ctx.fillStyle = 'white';
    ctx.fillText(name, textX, textY);

    // Draw font size indicator
    ctx.fillStyle = 'yellow';
    ctx.font = '16px Arial';
    ctx.fillText(`Font Size: ${fontSize.toFixed(1)}px`, textX, textY + fontSize / 2 + 20);

    // Debug information
    debugDiv.innerHTML = `
                Window size: ${window.innerWidth} x ${window.innerHeight}<br>
                Scale factor: ${scaleFactor.toFixed(2)}<br>
                Image size: ${scaledWidth.toFixed(0)} x ${scaledHeight.toFixed(0)}<br>
                Font size: ${fontSize.toFixed(1)}px
            `;
  }

  img.onload = function() {
    drawImageAndText();
    window.addEventListener('resize', drawImageAndText);
  };
</script>
</body>
</html>
