<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chidon Certificate</title>
  <style>
    @font-face {
      font-family: 'FB';
      src: url('https://mashpia.com/certs/FbTrick-Regular.otf') format('opentype');
    }
    @font-face {
      font-family: 'FB_Black';
      src: url('https://mashpia.com/certs/FbTrick-Black.otf') format('opentype');
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
<canvas id="imageCanvas"></canvas>

<script>
  const canvas = document.getElementById('imageCanvas');
  const ctx = canvas.getContext('2d');

  const url = window.location.search
  const urlParams = new URLSearchParams(url)
  const file = urlParams.get('url')
  const he_name = urlParams.get('he_name')

  const img = new Image();
  img.src = decodeURIComponent(file); // Replace with your PNG file path

  function drawImageAndText() {
    const maxWidth = window.innerWidth * 0.9; // 90% of window width
    const maxHeight = window.innerHeight * 0.9; // 90% of window height

    let scaleFactor = Math.min(maxWidth / img.width, maxHeight / img.height);
    scaleFactor = Math.min(scaleFactor, 1); // Ensure we don't scale up beyond original size

    const scaledWidth = img.width * scaleFactor;
    const scaledHeight = img.height * scaleFactor;

    canvas.width = scaledWidth;
    canvas.height = scaledHeight;

    // Draw the scaled image
    ctx.drawImage(img, 0, 0, scaledWidth, scaledHeight);

    // Set text properties
    const fontSize = Math.max(14, 100 * scaleFactor); // Minimum font size of 16px
    ctx.font = `${fontSize}px Arial`;
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';

    // Add centered text
    const textX = scaledWidth / 2;
    const textY = scaledHeight / 2 + 25;
    ctx.fillText(he_name, textX, textY);
  }

  img.onload = function() {
    drawImageAndText();
    window.addEventListener('resize', drawImageAndText);
  };
