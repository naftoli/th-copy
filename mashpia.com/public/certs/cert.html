<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image with Correct Container Sizing and Text Scaling</title>
  <style>
    @font-face {
      font-family: 'FB';
      src: url('https://mashpia.com/certs/FbTrick-Regular.otf') format('opentype');
    }
    @font-face {
      font-family: 'FB_Black';
      src: url('https://mashpia.com/certs/FbTrick-Black.otf') format('opentype');
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    #container {
      position: relative;
      width: 95vw;
      height: 95vh;
      max-width: 95%;
      max-height: 95%;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      background: rgba(0, 0, 0, 0.5);
    }
    #name {
      margin-bottom: 10px;
    }
    #fontSizeDisplay {
      font-family: 'FB';
      font-size: 16px;
      color: yellow;
    }
    #debug {
      margin-top: 10px;
      font-family: monospace;
    }
  </style>
</head>
<body>
<div id="container">
  <canvas id="imageCanvas"></canvas>
  <div id="overlay">
    <div id="name"></div>
    <div id="fontSizeDisplay"></div>
  </div>
</div>
<div id="debug"></div>

<script>
  const url = window.location.search
  const urlParams = new URLSearchParams(url)
  const file = urlParams.get('url')
  const he_name = urlParams.get('he_name')

  const container = document.getElementById('container');
  const canvas = document.getElementById('imageCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const nameElement = document.getElementById('name');
  const fontSizeDisplay = document.getElementById('fontSizeDisplay');
  const debugDiv = document.getElementById('debug');
  const img = new Image();
  img.src = decodeURIComponent(file);

  function updateImageAndText() {
    const containerWidth = container.clientWidth;
    const containerHeight = container.clientHeight;
    const imageAspectRatio = img.width / img.height;
    const containerAspectRatio = containerWidth / containerHeight;

    let scaledWidth, scaledHeight;
    if (containerAspectRatio > imageAspectRatio) {
      scaledHeight = containerHeight;
      scaledWidth = scaledHeight * imageAspectRatio;
    } else {
      scaledWidth = containerWidth;
      scaledHeight = scaledWidth / imageAspectRatio;
    }

    canvas.width = scaledWidth;
    canvas.height = scaledHeight;

    ctx.drawImage(img, 0, 0, scaledWidth, scaledHeight);

    const baseSize = 20;
    const minSize = 16;
    const maxSize = 40;

    // Calculate scale factor based on the smaller dimension
    const scaleFactor = Math.min(scaledWidth / img.width, scaledHeight / img.height);

    // Font size calculation
    const fontSize = Math.max(minSize, Math.min(maxSize, baseSize * (2 - scaleFactor)));

    nameElement.style.fontSize = `${fontSize}px`;
    nameElement.textContent = he_name;

    fontSizeDisplay.textContent = `Font Size: ${fontSize.toFixed(1)}px`;

    debugDiv.innerHTML = `
                Container size: ${containerWidth.toFixed(0)} x ${containerHeight.toFixed(0)}<br>
                Scale factor: ${scaleFactor.toFixed(2)}<br>
                Image size: ${scaledWidth.toFixed(0)} x ${scaledHeight.toFixed(0)}<br>
                Calculated font size: ${fontSize.toFixed(1)}px
            `;
  }

  img.onload = function() {
    updateImageAndText();
    window.addEventListener('resize', updateImageAndText);
  };
</script>
</body>
</html>
