<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive PNG Image Display</title>
  <style>
    @font-face {
      font-family: 'FB';
      src: url('https://mashpia.com/certs/FbTrick-Regular.otf') format('opentype');
    }
    @font-face {
      font-family: 'FB_Black';
      src: url('https://mashpia.com/certs/FbTrick-Black.otf') format('opentype');
    }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: #f0f0f0;
    }
    .image-container {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px 0;
      position: relative;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .text-overlay {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      padding: 5px 10px;
      pointer-events: none;
    }
    #debug {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
<div class="image-container">
  <img src="" alt="Responsive Image" id="responsiveImage">
  <div class="text-overlay" id="nameOverlay"></div>
</div>
<div id="debug"></div>

<script>
  const url = window.location.search
  const urlParams = new URLSearchParams(url)
  const file = urlParams.get('url')
  const name = urlParams.get('he_name')

  const img = document.getElementById('responsiveImage');
  img.src = decodeURIComponent(file);

  const nameOverlay = document.getElementById('nameOverlay');
  const debugDiv = document.getElementById('debug');

  // Configuration
  const verticalPosition = 0.52; // % down from the top
  const minFontSize = 12;
  const maxFontSize = 48;
  const fontSizeRatio = 0.04;

  function calculateFontSize() {
    const rect = img.getBoundingClientRect();
    const containerRect = img.parentElement.getBoundingClientRect();
    const topPosition = (containerRect.height - rect.height) / 2 + rect.height * verticalPosition;
    nameOverlay.style.top = `${topPosition}px`;
    const fontSize = rect.height * fontSizeRatio;
    return Math.max(minFontSize, Math.min(maxFontSize, fontSize));
  }

  function updateTextPosition() {
    const rect = img.getBoundingClientRect();
    const topPosition = rect.height * verticalPosition;
    nameOverlay.style.top = `${topPosition}px`;
    nameOverlay.textContent = name;

    const fontSize = calculateFontSize();
    nameOverlay.style.fontSize = `${fontSize}px`;
  }

  function updateDebugInfo() {
    const rect = img.getBoundingClientRect();
    const containerRect = img.parentElement.getBoundingClientRect();
    const textRect = nameOverlay.getBoundingClientRect();
    const fontSize = parseFloat(window.getComputedStyle(nameOverlay).fontSize);
    debugDiv.innerHTML = `
                Window size: ${window.innerWidth} x ${window.innerHeight}<br>
                Container size: ${containerRect.width.toFixed(0)} x ${containerRect.height.toFixed(0)}<br>
                Image size: ${rect.width.toFixed(0)} x ${rect.height.toFixed(0)}<br>
                Image natural size: ${img.naturalWidth} x ${img.naturalHeight}<br>
                Text position: ${(verticalPosition * 100).toFixed(0)}% from top<br>
                Text center: ${(textRect.left + textRect.width / 2).toFixed(0)}px<br>
                Image center: ${(rect.left + rect.width / 2).toFixed(0)}px<br>
                Text top: ${textRect.top.toFixed(0)}px<br>
                Image top: ${rect.top.toFixed(0)}px<br>
                Font size: ${fontSize.toFixed(1)}px
            `;
  }

  function updateLayout() {
    updateTextPosition();
    updateDebugInfo();
  }

  img.addEventListener('load', updateLayout);
  window.addEventListener('load', updateLayout);
  window.addEventListener('resize', updateLayout);
</script>
</body>
</html>
