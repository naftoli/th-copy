<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="manifest" href="manifest.json">
        <link href="https://use.fontawesome.com/releases/v5.0.6/css/all.css" rel="stylesheet">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
        <link href="style.css" rel="stylesheet">
        <link href="css/bulma.min.css" rel="stylesheet">
    </head>
    
    <body>
        <div id="app">
            <section class="header">
                <div id="logout">
                    <i class="fas fa-sign-out-alt"></i> Log out
                </div>
                <img src="/chidon/IDcards/chidon_F.png" alt="logo" class="logo" />
                <div class="title">
                    Chidon Walking Groups
                </div>
            </section>
            
            <section id="user-info-box">
                <h2> Welcome <span id="user-name"></span></h2>
            </section>
            
            <section id="dropdown">
                <div class="select is-primary">
                    <select id="timeDropdown"></select>
                </div>
            </section>

            <section id="scanning">
                <div class="row">
                    <div class="col-lg-6">
                        <div class="input-group">
                            <input id="scanner_input" class="form-control" placeholder="Click the button to scan an EAN..." type="text" /> 
                            <span class="input-group-btn"> 
                                <button class="btn btn-default" type="button" data-toggle="modal" data-target="#livestream_scanner">
                                    <i class="fa fa-barcode"></i>
                                </button> 
                            </span>
                        </div><!-- /input-group -->
                    </div><!-- /.col-lg-6 -->
                </div><!-- /.row -->
                <div class="modal" id="livestream_scanner">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                                <h4 class="modal-title">Barcode Scanner</h4>
                            </div>
                            <div class="modal-body" style="position: static">
                                <div id="interactive" class="viewport"></div>
                                <div class="error"></div>
                            </div>
                            <div class="modal-footer">
                                <label class="btn btn-default pull-left">
                                    <i class="fa fa-camera"></i> Use camera app
                                    <input type="file" accept="image/*;capture=camera" capture="camera" class="hidden" />
                                </label>
                                <button type="button" class="btn btn-primary" data-dismiss="modal">Close</button>
                            </div>
                        </div><!-- /.modal-content -->
                    </div><!-- /.modal-dialog -->
                </div><!-- /.modal -->
            </section>
            
            <section id="child-list">
                
                <label class="child">
                    <div class="box">
                        <input type="checkbox"/> <span class="checkbox"></span>
                        <span class="name"></span>
                        <div class="info"></div>
                        <div class="clearfix"></div>
                    </div>
                </label>
                
                <label class="child">
                    <div class="box">
                        <input type="checkbox"/> <span class="checkbox"></span>
                        <span class="name"></span>
                        <div class="info"></div>
                        <div class="clearfix"></div>
                    </div>
                </label>
                
            </section>
        </div>
    </body>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    <script src="app.js"></script>
    <script type="text/javascript" src="/mobile/kiosk/lib/quagga.min.js"></script>
    <script>
        $(document).ready(function(){
            app.login();
            app.setupApp();
            
            $("#logout").click(app.logout);

            // Create the QuaggaJS config object for the live stream
            var liveStreamConfig = {
                    inputStream: {
                        type : "LiveStream",
                        constraints: {
                            width: {min: 640},
                            height: {min: 480},
                            aspectRatio: {min: 1, max: 100},
                            facingMode: "environment" // or "user" for the front camera
                        }
                    },
                    locator: {
                        patchSize: "medium",
                        halfSample: true
                    },
                    numOfWorkers: (navigator.hardwareConcurrency ? navigator.hardwareConcurrency : 4),
                    decoder: {
                        "readers":[
                            {"format":"ean_reader","config":{}}
                        ]
                    },
                    locate: true
                };
            // The fallback to the file API requires a different inputStream option. 
            // The rest is the same 
            var fileConfig = $.extend(
                    {}, 
                    liveStreamConfig,
                    {
                        inputStream: {
                            size: 800
                        }
                    }
                );
            // Start the live stream scanner when the modal opens
            $('#livestream_scanner').on('shown.bs.modal', function (e) {
                Quagga.init(
                    liveStreamConfig, 
                    function(err) {
                        if (err) {
                            $('#livestream_scanner .modal-body .error').html('<div class="alert alert-danger"><strong><i class="fa fa-exclamation-triangle"></i> '+err.name+'</strong>: '+err.message+'</div>');
                            Quagga.stop();
                            return;
                        }
                        Quagga.start();
                    }
                );
            });
            
            // Make sure, QuaggaJS draws frames an lines around possible 
            // barcodes on the live stream
            Quagga.onProcessed(function(result) {
                var drawingCtx = Quagga.canvas.ctx.overlay,
                    drawingCanvas = Quagga.canvas.dom.overlay;
        
                if (result) {
                    if (result.boxes) {
                        drawingCtx.clearRect(0, 0, parseInt(drawingCanvas.getAttribute("width")), parseInt(drawingCanvas.getAttribute("height")));
                        result.boxes.filter(function (box) {
                            return box !== result.box;
                        }).forEach(function (box) {
                            Quagga.ImageDebug.drawPath(box, {x: 0, y: 1}, drawingCtx, {color: "green", lineWidth: 2});
                        });
                    }
        
                    if (result.box) {
                        Quagga.ImageDebug.drawPath(result.box, {x: 0, y: 1}, drawingCtx, {color: "#00F", lineWidth: 2});
                    }
        
                    if (result.codeResult && result.codeResult.code) {
                        Quagga.ImageDebug.drawPath(result.line, {x: 'x', y: 'y'}, drawingCtx, {color: 'red', lineWidth: 3});
                    }
                }
            });
            
            // Once a barcode had been read successfully, stop quagga and 
            // close the modal after a second to let the user notice where 
            // the barcode had actually been found.
            Quagga.onDetected(function(result) {    		
                if (result.codeResult.code){
                    $('#scanner_input').val(result.codeResult.code);
                    Quagga.stop();	
                    setTimeout(function(){ $('#livestream_scanner').modal('hide'); }, 1000);			
                }
            });
            
            // Stop quagga in any case, when the modal is closed
            $('#livestream_scanner').on('hide.bs.modal', function(){
                if (Quagga){
                    Quagga.stop();	
                }
            });
            
            // Call Quagga.decodeSingle() for every file selected in the 
            // file input
            $("#livestream_scanner input:file").on("change", function(e) {
                if (e.target.files && e.target.files.length) {
                    Quagga.decodeSingle($.extend({}, fileConfig, {src: URL.createObjectURL(e.target.files[0])}), function(result) {alert(result.codeResult.code);});
                }
            });
        });

        register_service_worker();
    </script>
</html>
