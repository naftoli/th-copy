<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="manifest" href="manifest.json">
        <link href="https://use.fontawesome.com/releases/v5.0.6/css/all.css" rel="stylesheet">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
        <link href="style.css" rel="stylesheet">
        <link href="css/bulma.min.css" rel="stylesheet">
    </head>
    
    <body>
        <div id="app">
            <section class="header">
                <div id="logout">
                    <i class="fas fa-sign-out-alt"></i> Log out
                </div>
                <img src="/chidon/IDcards/chidon_F.png" alt="logo" class="logo" />
                <div class="title">
                    Chidon Walking Groups
                </div>
            </section>
            
            <section id="user-info-box">
                <h2> Welcome <span id="user-name"></span></h2>
            </section>
            
            <section id="dropdown">
                <div class="select is-primary">
                    <select id="timeDropdown"></select>
                </div>
            </section>

            <div id="barcode_scanner" class="viewport"></div>            
            
            <section id="child-list">
                
                <label class="child">
                    <div class="box">
                        <input type="checkbox"/> <span class="checkbox"></span>
                        <span class="name"></span>
                        <div class="info"></div>
                        <div class="clearfix"></div>
                    </div>
                </label>
                
                <label class="child">
                    <div class="box">
                        <input type="checkbox"/> <span class="checkbox"></span>
                        <span class="name"></span>
                        <div class="info"></div>
                        <div class="clearfix"></div>
                    </div>
                </label>
                
            </section>
        </div>
    </body>
    
    <script src="https://cdn.jsdelivr.net/npm/promise-polyfill@8/dist/polyfill.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js" integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM" crossorigin="anonymous"></script>
    <script src="quagga.min.js"></script>
    <script src="app.js"></script>
    <script>
        $(document).ready(function(){
            app.login();
            app.setupApp();
            
            $("#logout").click(app.logout);

            register_service_worker();
        });
    </script>
</html>
