<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link type="text/css" rel="stylesheet" href="https://unpkg.com/buefy/lib/buefy.min.css" />
        <style>
            .name {
                width: 100%;
                margin-bottom: 10px;
            }
            input[type='checkbox'] {
                height: 20px;
                width: 20px;
                margin-right: 30px;
                vertical-align: middle;
            }
            .section {
                padding-top: 20px;
                padding-bottom: 0;
            }
        </style>
    </head>
    
    <body>
        <div id="app">
            <section class="section">
                <div class="container" align="center">
                    {{ header }}
                </div>
            </section>
            <section class="section">
                <div class="select is-primary" @click="updateUsers">
                    <select>
                        <option value='wed'>Wed Morning</option>
                        <option value='thurs'>Trip 1 Bus 1</option>
                        <option value='fri'>Fri Going Home</option>
                    </select>
                </div>
            </section>
            <section class="section">
                <user-list :names="names"></user-list>
            </section>
        </div>
    </body>
    
    <script src="https://cdn.jsdelivr.net/npm/vue@2.5.13/dist/vue.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.18.0/axios.js"></script>
    <script src="main.js"></script>
</html>
