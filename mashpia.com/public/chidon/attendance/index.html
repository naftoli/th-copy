<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="manifest" href="manifest.json">
        <link type="text/css" rel="stylesheet" href="./css/bulma.min.css" />
        <link href="https://use.fontawesome.com/releases/v5.0.6/css/all.css" rel="stylesheet">
        <link href="style.css" rel="stylesheet">
    </head>
    
    <body>
        <div>
            <div class="login-page">
                <section class="section">
                    <img src="/chidon/IDcards/chidon_F.png" alt="logo" class="logo" />
                    <p class="title">Login</p>
                    
                    <div id="invalid-login">
                        Invalid Login
                    </div>
                    
                    <div class="field">
                        <div class="control has-icons-left has-icons-right">
                            <input class="input" type="text" placeholder="Username" id="username">
                                <span class="icon is-small is-left">
                                  <i class="fas fa-user"></i>
                                </span>
                        </div>
                    </div>
                    <div class="field">
                        <p class="control has-icons-left">
                            <input class="input" type="password" placeholder="Password" id="password">
                            <span class="icon is-small is-left">
                                <i class="fas fa-lock"></i>
                            </span>
                        </p>
                      </div>
                      <div class="field">
                        <p class="control">
                            <button class="button is-success" id="login">
                                Login
                            </button>
                        </p>
                    </div>
                </section>
            </div>
        </div>
    </body>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            if (localStorage.getItem("attendance_login"))
                window.location = "app.html";
        });
        
        $("#login").click(function() {
            var data = {
                username: $("#username").val(),
                password: $("#password").val()
            };
            
            $.post("api/login.php", data, function( response ) {
                response = JSON.parse( response );
                
                if (!response.success) {
                    $("#invalid-login").show();
                } else {
                    localStorage.setItem("attendance_login", response.login);
                    window.location = "app.html";
                }
            });
        });
    </script>
</html>
