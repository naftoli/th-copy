<div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="settingsModalLabel">
                    <i class="fas fa-cog me-2"></i>Screen Settings
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="settingsError" class="alert alert-danger" style="display: none;">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span id="settingsErrorMessage"></span>
                </div>
                <form id="settingsForm">
                    <input type="hidden" id="settingsScreenId" value="">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label class="form-label">Promotions</label>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="showPromotions" name="show_promotions">
                                    <label class="form-check-label" for="showPromotions">
                                        Show promotions on this screen
                                    </label>
                                </div>
                                <div class="form-group">
                                    <label for="promotionsDays" class="form-label">Number of days to show promotions</label>
                                    <input type="number" class="form-control" id="promotionsDays" name="promotions_days" min="1" max="30" value="7">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label class="form-label">Birthdays</label>
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" id="showBirthdays" name="show_birthdays">
                                    <label class="form-check-label" for="showBirthdays">
                                        Show birthdays on this screen
                                    </label>
                                </div>
                                <div class="form-group">
                                    <label for="birthdaysDays" class="form-label">Number of days to show birthdays</label>
                                    <input type="number" class="form-control" id="birthdaysDays" name="birthdays_days" min="1" max="30" value="7">
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveSettingsBtn">
                    <i class="fas fa-save me-2"></i>Save Settings
                </button>
            </div>
        </div>
    </div>
</div>
<script>
function openSettingsModal(screenId, screenName, settings) {
    document.getElementById('settingsScreenId').value = screenId;
    document.getElementById('showPromotions').checked = !!settings.show_promotions;
    document.getElementById('promotionsDays').value = settings.promotions_days || 7;
    document.getElementById('showBirthdays').checked = !!settings.show_birthdays;
    document.getElementById('birthdaysDays').value = settings.birthdays_days || 7;
    $('#settingsModal').modal('show');
}

// Prevent duplicate event handlers
if (!window.settingsModalHandlersSet) {
    window.settingsModalHandlersSet = true;
    document.getElementById('saveSettingsBtn').onclick = function() {
        const screenId = document.getElementById('settingsScreenId').value;
        const showPromotions = document.getElementById('showPromotions').checked ? 1 : 0;
        const promotionsDays = document.getElementById('promotionsDays').value;
        const showBirthdays = document.getElementById('showBirthdays').checked ? 1 : 0;
        const birthdaysDays = document.getElementById('birthdaysDays').value;
        // TODO: AJAX call to save settings
        // Example:
        /*
        $.post('ajax/saveSettings.php', {
            screen_id: screenId,
            show_promotions: showPromotions,
            promotions_days: promotionsDays,
            show_birthdays: showBirthdays,
            birthdays_days: birthdaysDays
        }, function(response) {
            // handle response
            $('#settingsModal').modal('hide');
        });
        */
        $('#settingsModal').modal('hide');
    };
}
</script>
