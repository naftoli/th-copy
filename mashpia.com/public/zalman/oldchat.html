<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mashpia Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    <script src="chatgpt_stream.js"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-dark: #357abd;
            --secondary-color: #f5f5f5;
            --text-color: #333;
            --light-text: #666;
            --border-color: #ddd;
            --success-color: #4caf50;
            --error-color: #f44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        .chat-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 1000px;
            height: 90vh;
            max-height: 800px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: #f9f9f9;
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: 20px;
            max-width: 80%;
            animation: fadeIn 0.3s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background-color: var(--primary-color);
            color: white;
            border-radius: 18px 18px 0 18px;
            padding: 12px 16px;
            margin-left: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .bot-message {
            background-color: white;
            color: var(--text-color);
            border-radius: 18px 18px 18px 0;
            padding: 12px 16px;
            margin-right: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message-time {
            font-size: 0.7rem;
            color: var(--light-text);
            margin-top: 5px;
            text-align: right;
        }

        .typing-indicator {
            display: none;
            background-color: white;
            padding: 10px 15px;
            border-radius: 18px 18px 18px 0;
            margin-bottom: 20px;
            margin-right: auto;
            max-width: 80%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            background-color: var(--primary-color);
            display: inline-block;
            border-radius: 50%;
            margin-right: 5px;
            animation: typing 1s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .input-container {
            padding: 20px;
            background-color: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        #user-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            resize: none;
            min-height: 45px;
            max-height: 150px;
            line-height: 1.4;
            color: var(--text-color);
            background-color: white;
        }

        #user-input::placeholder {
            color: var(--light-text);
            opacity: 0.8;
        }

        #user-input:focus {
            border-color: var(--primary-color);
        }

        /* Hide scrollbar by default */
        #user-input {
            overflow-y: hidden;
        }

        /* Show scrollbar only after 6 lines */
        #user-input.long-text {
            overflow-y: auto;
        }

        /* Custom scrollbar styling */
        #user-input::-webkit-scrollbar {
            width: 6px;
        }

        #user-input::-webkit-scrollbar-track {
            background: transparent;
        }

        #user-input::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 3px;
        }

        #user-input::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        .send-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-button:hover {
            background-color: var(--primary-dark);
        }

        .send-button:disabled {
            background-color: var(--light-text);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .send-button svg {
            width: 20px;
            height: 20px;
        }

        .message-content {
            white-space: pre-wrap;
        }

        .bot-message a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .bot-message a:hover {
            text-decoration: underline;
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: var(--secondary-color);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            position: relative;
            width: 20px;
            height: 20px;
        }

        .loading div {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: loading 1.2s linear infinite;
        }

        .loading div:nth-child(1) { animation-delay: 0s; }
        .loading div:nth-child(2) { animation-delay: 0.4s; }
        .loading div:nth-child(3) { animation-delay: 0.8s; }

        @keyframes loading {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.5); opacity: 0.5; }
        }

        .model-select {
            margin-top: 10px;
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .model-select:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
        }

        .model-select option {
            background-color: var(--primary-dark);
            color: white;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Mashpia Chatbot</h1>
            <p>How can I help you today?</p>
            <select id="model-select" class="model-select">
                <option value="gpt-4o-mini">GPT-4o Mini</option>
                <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                <option value="gpt-3.5-turbo-16k">GPT-3.5 Turbo 16K</option>
                <option value="gpt-4">GPT-4</option>
                <option value="gpt-4-32k">GPT-4 32K</option>
                <option value="gpt-4-turbo-preview">GPT-4 Turbo</option>
                <option value="gpt-4-vision-preview">GPT-4 Vision</option>
                <option value="gpt-4o">GPT-4o</option>
                <option value="gpt-4o-max">GPT-4o Max</option>
                <option value="gpt-4o-mini-2024-02-15">GPT-4o Mini (2024-02-15)</option>
                <option value="gpt-4o-2024-02-15">GPT-4o (2024-02-15)</option>
                <option value="gpt-4o-max-2024-02-15">GPT-4o Max (2024-02-15)</option>
            </select>
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- Remove the initial message from here since it's added by loadKnowledgeBase -->
        </div>
        <div class="typing-indicator" id="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="input-container">
            <textarea id="user-input" placeholder="Type your message here..." rows="1"></textarea>
            <button class="send-button" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="config-gpt.js"></script>
    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing-indicator');
        const sendButton = document.querySelector('.send-button');
        const modelSelect = document.getElementById('model-select');
        let currentResponseController = null;

        // Add scroll handling variables
        let autoScrollEnabled = true;
        let isUserScrolling = false;
        let scrollTimeout;
        let pauseScrollTimeout;

        // Array to store conversation history
        let messages = [];

        // Add a variable to track if we're currently processing a message
        let isProcessingMessage = false;

        // Add Gemini API key
        const GEMINI_API_KEY = 'AIzaSyAW9USDjI1fVk8CmKK26A84YN5RGiikX_I';

        // Function to load knowledge base from local files
        async function loadKnowledgeBase() {
            try {
                // Try to load the knowledge base from an HTML file
                const response = await fetch('/zalman/knowledge-base.txt');
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch knowledge base (Status: ${response.status}). Please ensure the knowledge base file exists and is accessible.`);
                }

                const knowledgeBase = await response.text();

                // Initialize the system message with the knowledge base
                messages = [{
                role: "system",
                content: `
You are Mashpia, a helpful assistant for Tzivos Hashem. Answer questions based only on the provided information.
Keep responses short, accurate, and to the point.

Formatting:
- **Bold** for emphasis
- *Italic* for quotes
- __Underline__ for terms
- [Links](URL) for references

KNOWLEDGE BASE:
${knowledgeBase}
`
                }];

                // Add initial bot message
                addMessage("Hello! I'm Mashpia. I'm here to help you with any questions about Tzivos Hashem. How can I assist you today?", 'bot');
            } catch (error) {
                console.error('Error loading knowledge base:', error);
                addMessage(`⚠️ Error loading knowledge base: ${error.message}`, 'bot');
                addMessage("Please ensure that:\n1. The knowledge base file exists at '/knowledge-base.txt'\n2. The file has proper read permissions\n3. The server is configured to serve static files", 'bot');
            }
        }

        // Initialize the chat when the page loads
        document.addEventListener('DOMContentLoaded', async () => {
        // Check if API key is set in config.js
        if (!config || !config.API_KEY) {
            addMessage("⚠️ Please set up your OpenAI API key in the config.js file to use this chatbot.", 'bot');
            addMessage("Create a config.js file in the same directory with:\n\nconst config = {\n  API_KEY: 'YOUR_API_KEY_HERE',\n  MODEL: 'gpt-3.5-turbo' // Or your preferred model\n};", 'bot');
                return;
            }

            // Load the knowledge base
            await loadKnowledgeBase();
        });

        // Add scroll event listener
        chatMessages.addEventListener('scroll', function() {
            // Clear any existing timeouts
            if (scrollTimeout) {
                clearTimeout(scrollTimeout);
            }
            if (pauseScrollTimeout) {
                clearTimeout(pauseScrollTimeout);
            }

            // If user scrolls up significantly (more than 10px from bottom)
            if (chatMessages.scrollTop + chatMessages.clientHeight < chatMessages.scrollHeight - 8) {
                // Add a small delay before pausing auto-scroll to prevent accidental pauses
                pauseScrollTimeout = setTimeout(() => {
                    autoScrollEnabled = false;
                    isUserScrolling = true;
                }, 30);
            } else {
                // If we're near the bottom, immediately enable auto-scroll
                autoScrollEnabled = true;
                isUserScrolling = false;
            }
        });

        // Add event listener for Enter key with shift+enter support
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (e.shiftKey) {
                    // Allow default behavior (new line)
                    return;
                } else {
                    e.preventDefault();
                    sendMessage();
                }
            }
        });

        // Auto-resize textarea and handle scrollbar
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            
            // Check if we have more than 6 lines (approximately)
            const lineHeight = parseInt(window.getComputedStyle(this).lineHeight);
            const lines = this.scrollHeight / lineHeight;
            
            if (lines >= 6) {
                this.classList.add('long-text');
            } else {
                this.classList.remove('long-text');
            }
        });

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        async function sendMessage() {
            // Ensure API key is available before sending
            if (!config || !config.API_KEY) {
                addMessage("⚠️ Cannot send message. Please configure your API key in config.js.", 'bot');
                return;
            }

            // Prevent sending new message while processing
            if (isProcessingMessage) return;

            const message = userInput.value.trim();
            if (!message) return;

            // Set processing flag
            isProcessingMessage = true;

            // Only disable the send button, keep input enabled
            sendButton.disabled = true;

            // Add user message to chat and conversation history
            addMessage(message, 'user');
            messages.push({ role: "user", content: message });
            userInput.value = '';

            // Keep focus on input
            userInput.focus();

            // Show typing indicator
            typingIndicator.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                console.log('Sending request to API...');
                let response;
                let botResponse;

                if (modelSelect.value.startsWith('gemini')) {
                    // Gemini API call
                    response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelSelect.value}:generateContent?key=${GEMINI_API_KEY}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: message
                                }]
                            }]
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`Gemini API request failed with status ${response.status}`);
                    }

                    const data = await response.json();
                    botResponse = data.candidates[0].content.parts[0].text;
                } else {
                    // OpenAI API call
                    response = await fetch('https://api.openai.com/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${config.API_KEY}`
                        },
                        body: JSON.stringify({
                            model: modelSelect.value,
                            messages: messages,
                            temperature: 0.2,
                            max_tokens: 1000
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(`OpenAI API request failed with status ${response.status}: ${errorData.error?.message || 'Unknown error'}`);
                    }

                    const data = await response.json();
                    botResponse = data.choices[0].message.content;
                }

                // Add bot response to conversation history
                messages.push({ role: "assistant", content: botResponse });

                // Hide typing indicator
                typingIndicator.style.display = 'none';

                // Show the message with typing animation
                await typeMessage(botResponse, 'bot');

            } catch (error) {
                console.error('Error sending message:', error);
                typingIndicator.style.display = 'none';
                addMessage(`I'm sorry, there was an error processing your request: ${error.message}. Please check the console or try again later.`, 'bot');
            } finally {
                // Re-enable send button and reset processing flag
                sendButton.disabled = false;
                isProcessingMessage = false;
                // Keep focus on input
                userInput.focus();
            }
        }

        async function typeMessage(text, sender) {
            // Always enable auto-scroll at the start of a new message
            autoScrollEnabled = true;
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            messageDiv.appendChild(contentDiv);

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = getCurrentTime();
            messageDiv.appendChild(timeDiv);

            chatMessages.appendChild(messageDiv);
            
            // Always scroll to bottom when starting a new message
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Process formatting for bot messages
            if (sender === 'bot') {
                // Convert markdown-like syntax to HTML and allow safe HTML content
                text = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
                    .replace(/\*(.*?)\*/g, '<em>$1</em>') // Italic
                    .replace(/\_\_(.*?)\_\_/g, '<u>$1</u>') // Underline
                    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>') // Links
                    .replace(/\#\#\#\s+(.*?)(?:\n|$)/g, '<h3>$1</h3>') // H3
                    .replace(/\#\#\s+(.*?)(?:\n|$)/g, '<h2>$1</h2>') // H2
                    .replace(/\#\s+(.*?)(?:\n|$)/g, '<h1>$1</h1>'); // H1
                
                // Sanitize HTML content to prevent XSS while allowing images
                const sanitizedText = DOMPurify.sanitize(text, {
                    ALLOWED_TAGS: ['strong', 'em', 'u', 'a', 'h1', 'h2', 'h3', 'img'],
                    ALLOWED_ATTR: ['href', 'target', 'src', 'alt']
                });
                
                contentDiv.innerHTML = sanitizedText;
            }

            let currentIndex = 0;
            const typingSpeed = 5; // 5ms typing speed
            
            function typeNextCharacter() {
                if (currentIndex < text.length) {
                    try {
                        // Use innerHTML for bot messages to process HTML tags
                        if (sender === 'bot') {
                            contentDiv.innerHTML = text.substring(0, currentIndex + 1);
                        } else {
                            contentDiv.textContent = text.substring(0, currentIndex + 1);
                        }
                        
                        // Only auto-scroll if enabled
                        if (autoScrollEnabled) {
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                        }
                        
                        currentIndex++;
                        setTimeout(typeNextCharacter, typingSpeed);
                    } catch (error) {
                        console.error('Error during typing:', error);
                        contentDiv.innerHTML = text;
                    }
                } else {
                    // Re-enable input and button after typing animation is complete
                    userInput.disabled = false;
                    sendButton.disabled = false;
                }
            }

            try {
                typeNextCharacter();
            } catch (error) {
                console.error('Error starting typing:', error);
                contentDiv.innerHTML = text;
                // Re-enable input and button on error
                userInput.disabled = false;
                sendButton.disabled = false;
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            // Process formatting for bot messages
            if (sender === 'bot') {
                // Convert markdown-like syntax to HTML and allow safe HTML content
                text = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
                    .replace(/\*(.*?)\*/g, '<em>$1</em>') // Italic
                    .replace(/\_\_(.*?)\_\_/g, '<u>$1</u>') // Underline
                    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>') // Links
                    .replace(/\#\#\#\s+(.*?)(?:\n|$)/g, '<h3>$1</h3>') // H3
                    .replace(/\#\#\s+(.*?)(?:\n|$)/g, '<h2>$1</h2>') // H2
                    .replace(/\#\s+(.*?)(?:\n|$)/g, '<h1>$1</h1>'); // H1
                
                // Sanitize HTML content to prevent XSS while allowing images
                const sanitizedText = DOMPurify.sanitize(text, {
                    ALLOWED_TAGS: ['strong', 'em', 'u', 'a', 'h1', 'h2', 'h3', 'img'],
                    ALLOWED_ATTR: ['href', 'target', 'src', 'alt']
                });
                
                contentDiv.innerHTML = sanitizedText;
            } else {
                contentDiv.textContent = text;
            }
            
            messageDiv.appendChild(contentDiv);

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = getCurrentTime();
            messageDiv.appendChild(timeDiv);

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
