<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanya Printing Locations</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css' rel='stylesheet' />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
        }
        .search-container {
            position: absolute;
            top: 20px;
            left: 100px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            width: 300px;
            transition: all 0.3s ease;
            max-height: 60px;
        }
        .search-container.expanded {
            width: 400px;
            max-height: calc(90vh - 40px);
        }
        .search-box {
            width: 100%;
            padding: 10px 35px 10px 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            position: relative;
        }
        .location-list {
            max-height: 0;
            overflow-y: auto;
            transition: max-height 0.3s ease;
            margin-top: 10px;
            background: white;
            border-radius: 4px;
        }
        .location-list.expanded {
            max-height: calc(90vh - 120px);
        }
        .location-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .location-item:hover {
            background-color: #f5f5f5;
        }
        .year {
            color: #666;
            font-size: 0.9em;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        .clear-search {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: none;
            font-size: 18px;
            color: #666;
            z-index: 1001;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .clear-search:hover {
            background: rgba(0,0,0,0.05);
            color: #333;
        }
        .search-container.has-text .clear-search {
            display: flex;
        }
        .admin-login {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .edit-button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 10px;
        }
        .edit-form {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            z-index: 2000;
        }
        .edit-form input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .edit-form button {
            margin-top: 10px;
            padding: 8px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1999;
        }
        .mapboxgl-popup {
            max-width: 300px;
        }
        .mapboxgl-popup-content {
            padding: 15px;
        }
        .custom-popup {
            font-size: 14px;
            line-height: 1.6;
            padding: 10px;
        }
        .custom-popup strong {
            display: block;
            margin-bottom: 5px;
        }
        .custom-popup .edit-button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 12px;
        }
        .custom-popup .edit-button:hover {
            background: #45a049;
        }
        .mapboxgl-popup-content {
            padding: 0 !important;
            border-radius: 4px;
        }
        .mapboxgl-popup-close-button {
            padding: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="admin-login" id="adminLogin" style="display: none;">
        <input type="password" id="adminPassword" placeholder="Admin Password" onkeypress="handleKeyPress(event)">
        <button onclick="loginAdmin()">Login</button>
    </div>
    <div class="overlay" id="overlay"></div>
    <div class="edit-form" id="editForm">
        <h3>Edit Location</h3>
        <input type="text" id="editAddress" placeholder="Address">
        <input type="text" id="editYears" placeholder="Years (comma separated)">
        <input type="text" id="editLat" placeholder="Latitude">
        <input type="text" id="editLng" placeholder="Longitude">
        <button onclick="saveEdit()">Save Changes</button>
        <button onclick="cancelEdit()">Cancel</button>
    </div>
    <div class="search-container" id="searchContainer">
        <div style="position: relative;">
            <input type="text" id="searchInput" class="search-box" placeholder="Search locations...">
            <button class="clear-search" id="clearSearch">✕</button>
        </div>
        <div class="location-list" id="locationList"></div>
    </div>
    <div id="map"></div>
    <div class="loading" id="loading">Loading data...</div>

    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <script>
        // Mapbox configuration
        mapboxgl.accessToken = 'pk.eyJ1IjoiemFsbWFuZW5nZWwiLCJhIjoiY205czM5cnV5MDlxZzJwb2h6dXR2dHlhcyJ9.Ij10BFhrzRmylayskyD64g'; // Replace with your Mapbox access token

        // Google Sheets configuration
        const SPREADSHEET_ID = '1E0PYeOp28sLuknV6AH7Bu800KYpmcmVQUkCTw_DJXps';
        const API_KEY = 'AIzaSyAbBnUIGfdvubPscqLHT7ph4ntvyjsAMME';
        const CLIENT_ID = '186706989736-kbsu8ngdp184huitq39fgp6qkcrnpqss.apps.googleusercontent.com';
        const SCOPES = [
            'https://www.googleapis.com/auth/spreadsheets',
            'https://www.googleapis.com/auth/spreadsheets.readonly'
        ].join(' ');
        
        let map;
        let locations = [];
        let markers = new Map();
        const ADMIN_PASSWORD = 'print';
        let isAdmin = false;
        let currentEditLocation = null;
        let tokenClient;
        let gapiInited = false;
        let gisInited = false;
        let isUpdatingMarkers = false;
        let clusterSource = null;

        // Initialize the map
        function initMap() {
            map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/satellite-streets-v12',
                projection: 'globe',
                center: [-98.5795, 39.8283],
                zoom: 2,
                pitch: 0,
                renderWorldCopies: false,
                maxZoom: 18,
                minZoom: 1
            });

            // Add globe atmosphere
            map.on('style.load', () => {
                map.setFog({
                    'color': 'rgb(186, 210, 235)',
                    'high-color': 'rgb(36, 92, 223)',
                    'horizon-blend': 0.02
                });

                // Add clustering source with adjusted zoom levels
                map.addSource('locations', {
                    type: 'geojson',
                    data: {
                        type: 'FeatureCollection',
                        features: []
                    },
                    cluster: true,
                    clusterMaxZoom: 16,
                    clusterRadius: 50
                });

                // Add cluster layers
                map.addLayer({
                    id: 'clusters',
                    type: 'circle',
                    source: 'locations',
                    filter: ['has', 'point_count'],
                    paint: {
                        'circle-color': [
                            'step',
                            ['get', 'point_count'],
                            '#51bbd6',
                            100,
                            '#f1f075',
                            750,
                            '#f28cb1'
                        ],
                        'circle-radius': [
                            'step',
                            ['get', 'point_count'],
                            20,
                            100,
                            30,
                            750,
                            40
                        ]
                    }
                });

                map.addLayer({
                    id: 'cluster-count',
                    type: 'symbol',
                    source: 'locations',
                    filter: ['has', 'point_count'],
                    layout: {
                        'text-field': '{point_count_abbreviated}',
                        'text-font': ['DIN Offc Pro Medium', 'Arial Unicode MS Bold'],
                        'text-size': 12
                    }
                });

                map.addLayer({
                    id: 'unclustered-point',
                    type: 'symbol',
                    source: 'locations',
                    filter: ['!', ['has', 'point_count']],
                    layout: {
                        'icon-image': 'custom-marker',
                        'icon-size': 0.15,
                        'icon-allow-overlap': true,
                        'icon-anchor': 'bottom'
                    }
                });

                // Add custom marker image with size adjustment
                map.loadImage('https://i.ibb.co/YFQWdSzB/New-Project.png', (error, image) => {
                    if (error) throw error;
                    // Create a smaller version of the image
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 16;
                    canvas.height = 16;
                    ctx.drawImage(image, 0, 0, 16, 16);
                    map.addImage('custom-marker', canvas);
                });

                // Add click handler for unclustered points
                map.on('click', 'unclustered-point', (e) => {
                    const coordinates = e.features[0].geometry.coordinates.slice();
                    const properties = e.features[0].properties;
                    
                    // Close any existing popups
                    const popups = document.getElementsByClassName('mapboxgl-popup');
                    if (popups.length) {
                        popups[0].remove();
                    }
                    
                    // Create popup
                    const popup = new mapboxgl.Popup({
                        closeButton: true,
                        closeOnClick: false,
                        offset: 25
                    })
                    .setLngLat(coordinates)
                    .setHTML(`
                        <div class="custom-popup">
                            <strong>${properties.address}</strong><br>
                            ${properties.years.length === 1 ? 'Year Printed: ' : 'Years Printed: '}${properties.years.join(', ')}
                            ${properties.isAdmin ? `<button class="edit-button" onclick='showEditForm(${JSON.stringify({
                                address: properties.address,
                                years: properties.years,
                                lat: coordinates[1],
                                lng: coordinates[0]
                            }).replace(/"/g, "&quot;")})'>Edit</button>` : ''}
                        </div>
                    `)
                    .addTo(map);
                });

                // Add hover effects for unclustered points
                map.on('mouseenter', 'unclustered-point', () => {
                    map.getCanvas().style.cursor = 'pointer';
                });

                map.on('mouseleave', 'unclustered-point', () => {
                    map.getCanvas().style.cursor = '';
                });

                // Ensure the layer is interactive
                map.on('load', () => {
                    map.on('click', 'unclustered-point', (e) => {
                        const coordinates = e.features[0].geometry.coordinates.slice();
                        const properties = e.features[0].properties;
                        
                        // Close any existing popups
                        const popups = document.getElementsByClassName('mapboxgl-popup');
                        if (popups.length) {
                            popups[0].remove();
                        }
                        
                        // Create popup
                        const popup = new mapboxgl.Popup({
                            closeButton: true,
                            closeOnClick: false,
                            offset: 25
                        })
                        .setLngLat(coordinates)
                        .setHTML(`
                            <div class="custom-popup">
                                <strong>${properties.address}</strong><br>
                                ${properties.years.length === 1 ? 'Year Printed: ' : 'Years Printed: '}${properties.years.join(', ')}
                                ${properties.isAdmin ? `<button class="edit-button" onclick='showEditForm(${JSON.stringify({
                                    address: properties.address,
                                    years: properties.years,
                                    lat: coordinates[1],
                                    lng: coordinates[0]
                                }).replace(/"/g, "&quot;")})'>Edit</button>` : ''}
                            </div>
                        `)
                        .addTo(map);
                    });
                });

                // Add click handlers for clusters with smoother zoom
                map.on('click', 'clusters', (e) => {
                    const features = map.queryRenderedFeatures(e.point, {
                        layers: ['clusters']
                    });
                    const clusterId = features[0].properties.cluster_id;
                    map.getSource('locations').getClusterExpansionZoom(
                        clusterId,
                        (err, zoom) => {
                            if (err) return;

                            map.flyTo({
                                center: features[0].geometry.coordinates,
                                zoom: zoom,
                                duration: 2000,
                                essential: true
                            });
                        }
                    );
                });

                // Add hover effects
                map.on('mouseenter', 'clusters', () => {
                    map.getCanvas().style.cursor = 'pointer';
                });
                map.on('mouseleave', 'clusters', () => {
                    map.getCanvas().style.cursor = '';
                });
            });

            // Add enhanced navigation controls
            const nav = new mapboxgl.NavigationControl({
                showCompass: true,
                showZoom: true,
                visualizePitch: true
            });
            map.addControl(nav, 'top-right');

            // Add zoom buttons
            const zoomButtons = document.createElement('div');
            zoomButtons.className = 'mapboxgl-ctrl-group mapboxgl-ctrl';
            zoomButtons.innerHTML = `
                <button class="mapboxgl-ctrl-icon" id="zoomToWorld" title="Zoom to World View">
                    <span class="mapboxgl-ctrl-icon" aria-hidden="true">🌍</span>
                </button>
                <button class="mapboxgl-ctrl-icon" id="zoomToUS" title="Zoom to US">
                    <span class="mapboxgl-ctrl-icon" aria-hidden="true">🇺🇸</span>
                </button>
            `;
            map.addControl({ onAdd: () => zoomButtons, onRemove: () => {} }, 'top-right');

            // Add zoom button handlers
            document.getElementById('zoomToWorld').addEventListener('click', () => {
                map.flyTo({
                    center: [-98.5795, 39.8283],
                    zoom: 2,
                    duration: 2000,
                    essential: true
                });
            });

            document.getElementById('zoomToUS').addEventListener('click', () => {
                map.flyTo({
                    center: [-98.5795, 39.8283],
                    zoom: 4,
                    duration: 2000,
                    essential: true
                });
            });

            // Add keyboard zoom controls
            document.addEventListener('keydown', (e) => {
                if (e.key === '+') {
                    map.zoomIn();
                } else if (e.key === '-') {
                    map.zoomOut();
                }
            });

            // Add double-click zoom
            map.on('dblclick', (e) => {
                map.flyTo({
                    center: e.lngLat,
                    zoom: map.getZoom() + 1,
                    duration: 1000,
                    essential: true
                });
            });
        }

        function updateMarkers() {
            if (!map.getSource('locations')) return;

            // Convert locations to GeoJSON features
            const features = locations.map(location => ({
                type: 'Feature',
                properties: {
                    address: location.address,
                    years: location.years,
                    isAdmin: isAdmin
                },
                geometry: {
                    type: 'Point',
                    coordinates: [location.lng, location.lat]
                }
            }));

            // Update the source data
            map.getSource('locations').setData({
                type: 'FeatureCollection',
                features: features
            });

            // Ensure custom marker image is loaded
            if (!map.hasImage('custom-marker')) {
                map.loadImage('https://i.ibb.co/YFQWdSzB/New-Project.png', (error, image) => {
                    if (error) throw error;
                    map.addImage('custom-marker', image);
                });
            }
        }

        // Load data
        async function loadData() {
            try {
                console.log('Starting data load...');
                const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/Sheet1!A2:E?key=${API_KEY}`);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Response not OK:', response.status, errorText);
                    throw new Error(`HTTP error! status: ${response.status}. Details: ${errorText}`);
                }
                
                const data = await response.json();
                
                if (!data.values) {
                    throw new Error('No data values found in response');
                }
                
                // Process data in chunks
                const chunkSize = 100;
                const chunks = [];
                for (let i = 0; i < data.values.length; i += chunkSize) {
                    chunks.push(data.values.slice(i, i + chunkSize));
                }

                locations = [];
                for (const chunk of chunks) {
                    const processedChunk = chunk.map(row => {
                        if (!row[0] || !row[1] || !row[2] || !row[3]) {
                            console.warn('Incomplete row:', row);
                            return null;
                        }
                        return {
                            address: row[0],
                            years: row[1].split(',').map(year => parseInt(year.trim())),
                            lat: parseFloat(row[2]),
                            lng: parseFloat(row[3])
                        };
                    }).filter(location => location !== null);
                    
                    locations = locations.concat(processedChunk);
                    
                    // Update markers for the current chunk
                    updateMarkers();
                    
                    // Allow UI to update between chunks
                    await new Promise(resolve => setTimeout(resolve, 0));
                }

                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loading').innerHTML = `
                    Error loading data:<br>
                    ${error.message}<br><br>
                    <button onclick="retryLoad()">Retry</button>
                `;
            }
        }

        function updateLocationList(filteredLocations) {
            if (!Array.isArray(filteredLocations)) {
                console.warn('Invalid or empty locations array');
                return;
            }

            const locationList = document.getElementById('locationList');
            locationList.innerHTML = '';
            
            if (filteredLocations.length > 0) {
                const bounds = new mapboxgl.LngLatBounds();
                filteredLocations.forEach(loc => bounds.extend([loc.lng, loc.lat]));
                map.fitBounds(bounds, {
                    padding: 50,
                    maxZoom: 16,
                    duration: 1000
                });
            }
            
            const fragment = document.createDocumentFragment();
            
            filteredLocations.forEach((location, index) => {
                location.years.forEach(year => {
                    const div = document.createElement('div');
                    div.className = 'location-item';
                    div.innerHTML = `
                        <strong>${location.address}</strong>
                        <span class="year">(${year})</span>
                    `;
                    div.addEventListener('click', () => {
                        map.flyTo({
                            center: [location.lng, location.lat],
                            zoom: 16,
                            duration: 2000,
                            essential: true
                        });
                    });
                    fragment.appendChild(div);
                });
            });
            
            locationList.appendChild(fragment);
        }

        function clearSearch() {
            searchInput.value = '';
            searchContainer.classList.remove('has-text', 'expanded');
            document.getElementById('locationList').classList.remove('expanded');
            map.flyTo({
                center: [-98.5795, 39.8283],
                zoom: 2,
                duration: 2000
            });
            if (Array.isArray(locations)) {
                updateLocationList(locations);
                updateMarkers();
            }
        }

        // Search functionality
        let searchTimeout;
        const searchInput = document.getElementById('searchInput');
        const searchContainer = document.getElementById('searchContainer');
        const clearSearchBtn = document.getElementById('clearSearch');

        clearSearchBtn.addEventListener('click', clearSearch);

        searchInput.addEventListener('input', (e) => {
            const hasText = e.target.value.length > 0;
            searchContainer.classList.toggle('has-text', hasText);
            
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const searchTerm = e.target.value.toLowerCase().trim();
                
                if (searchTerm === '') {
                    clearSearch();
                    return;
                }
                
                if (!Array.isArray(locations)) {
                    console.error('Locations data is not available');
                    return;
                }

                const filteredLocations = locations.filter(location => 
                    location && location.address && 
                    (location.address.toLowerCase().includes(searchTerm) ||
                    (Array.isArray(location.years) && 
                     location.years.some(year => year.toString().includes(searchTerm))))
                );

                updateLocationList(filteredLocations);
                updateMarkers();

                if (searchTerm.length > 0) {
                    searchContainer.classList.add('expanded');
                    document.getElementById('locationList').classList.add('expanded');
                } else {
                    searchContainer.classList.remove('expanded');
                    document.getElementById('locationList').classList.remove('expanded');
                }
            }, 300);
        });

        function loginAdmin() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                isAdmin = true;
                document.getElementById('adminLogin').style.display = 'none';
                // Show edit buttons for existing markers
                updateMarkers();
            } else {
                alert('Incorrect password');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                loginAdmin();
            }
        }

        function showEditForm(location) {
            // Ensure we're working with an object
            currentEditLocation = location;
            
            // Set form values
            document.getElementById('editAddress').value = location.address || '';
            document.getElementById('editYears').value = (location.years || []).join(', ');
            document.getElementById('editLat').value = location.lat || '';
            document.getElementById('editLng').value = location.lng || '';
            
            // Show the form and overlay
            document.getElementById('editForm').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function cancelEdit() {
            document.getElementById('editForm').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
            currentEditLocation = null;
        }

        function gapiLoaded() {
            gapi.load('client', initializeGapiClient);
        }

        async function initializeGapiClient() {
            await gapi.client.init({
                apiKey: API_KEY,
                discoveryDocs: ['https://sheets.googleapis.com/$discovery/rest?version=v4'],
            });
            gapiInited = true;
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: '', // defined later
                ux_mode: 'popup',
                hosted_domain: 'mashpia.com',
                redirect_uri: `${window.location.origin}/oauth2callback`
            });
            gisInited = true;
        }

        async function getAccessToken() {
            return new Promise((resolve, reject) => {
                if (!tokenClient) {
                    reject(new Error('Token client not initialized'));
                    return;
                }

                tokenClient.callback = async (resp) => {
                    if (resp.error !== undefined) {
                        console.error('OAuth error response:', resp);
                        reject(resp);
                        return;
                    }
                    resolve(resp.access_token);
                };

                try {
                    // Force new consent prompt to ensure proper authorization
                    tokenClient.requestAccessToken({
                        prompt: 'consent',
                        login_hint: 'zalman@campsgi.com'
                    });
                } catch (err) {
                    console.error('OAuth request error:', err);
                    reject(err);
                }
            });
        }

        async function saveEdit() {
            if (!currentEditLocation) return;

            try {
                // Get access token first
                const token = await getAccessToken();
                if (!token) {
                    throw new Error('Failed to get access token');
                }

                const updatedLocation = {
                    address: document.getElementById('editAddress').value,
                    years: document.getElementById('editYears').value.split(',').map(year => parseInt(year.trim())),
                    lat: parseFloat(document.getElementById('editLat').value),
                    lng: parseFloat(document.getElementById('editLng').value)
                };

                // Find the row index in the original data
                const rowIndex = locations.findIndex(loc => 
                    loc.address === currentEditLocation.address && 
                    loc.lat === currentEditLocation.lat && 
                    loc.lng === currentEditLocation.lng
                );

                if (rowIndex === -1) {
                    throw new Error('Location not found in data');
                }

                // Update the Google Sheet
                const range = `Sheet1!A${rowIndex + 2}:D${rowIndex + 2}`;
                const updateRequest = {
                    spreadsheetId: SPREADSHEET_ID,
                    range: range,
                    valueInputOption: 'RAW',
                    resource: {
                        values: [[
                            updatedLocation.address,
                            updatedLocation.years.join(','),
                            updatedLocation.lat.toString(),
                            updatedLocation.lng.toString()
                        ]]
                    }
                };

                await gapi.client.sheets.spreadsheets.values.update(updateRequest);

                // Update local data
                locations[rowIndex] = updatedLocation;
                updateMarkers();
                cancelEdit();
                alert('Changes saved successfully!');
            } catch (error) {
                console.error('Error saving changes:', error);
                alert('Error saving changes: ' + error.message);
            }
        }

        // Initialize
        initMap();
        loadData().then(() => {
            updateLocationList(locations);
            updateMarkers();
            
            if (window.location.href.includes('?admin')) {
                document.getElementById('adminLogin').style.display = 'block';
            }
        });

        // Load the Google API client libraries
        gapiLoaded();
        gisLoaded();
    </script>
</body>
</html>
