<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mashpia Chat Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    <style>
        :root {
            --primary-color: #007AFF;
            --primary-light: #e6f2ff;
            --primary-dark: #0056b3;
            --secondary-bg: #f8f9fa;
            --bg-color: #eef2f7;
            --text-dark: #1c1c1e;
            --text-light: #6b7280;
            --border-color: #d1d5db;
            --white: #ffffff;
            --input-bg: var(--white);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius-lg: 20px;
            --radius-md: 16px;
            --radius-sm: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .chat-container {
            width: 100%;
            max-width: 750px;
            background: var(--white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            height: calc(100vh - 40px);
            max-height: 850px;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
            animation: fadeInScaleUp 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        @keyframes fadeInScaleUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .chat-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: var(--white);
            padding: 18px 25px;
            text-align: center;
            border-bottom: 1px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            line-height: 1.5;
            animation: messageAppear 0.3s ease-out;
        }

        @keyframes messageAppear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background-color: var(--primary-light);
            color: var(--text-dark);
            align-self: flex-end;
            border-bottom-right-radius: var(--radius-sm);
        }

        .message.bot {
            background-color: var(--secondary-bg);
            color: var(--text-dark);
            align-self: flex-start;
            border-bottom-left-radius: var(--radius-sm);
        }

        .message.error {
            background-color: #fff1f0;
            color: #dc2626;
            border: 1px solid #fecaca;
        }

        .input-container {
            padding: 15px;
            background: var(--white);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        #userInput {
            width: 100%;
            min-height: 48px;
            max-height: 200px;
            padding: 12px 45px 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--input-bg);
            color: var(--text-dark);
            font-family: inherit;
            font-size: 16px;
            line-height: 1.5;
            resize: none;
            overflow-y: auto;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #userInput:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        #sendButton {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 20px;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #sendButton:hover {
            background-color: var(--primary-dark);
        }

        #sendButton:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: var(--secondary-bg);
            border-radius: var(--radius-md);
            margin: 10px 0;
            align-self: flex-start;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: typingAnimation 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingAnimation {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-4px); }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Mashpia Chat</h1>
        </div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
        </div>
        <div class="input-container">
            <div class="input-wrapper">
                <textarea id="userInput" placeholder="Ask Mashpia..." rows="1"></textarea>
            </div>
            <button id="sendButton">Send</button>
        </div>
    </div>

    <script src="config-gpt.js"></script>
    <script src="chatgpt_stream.js"></script>
    <script>
        // DOM Elements
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');

        // State
        let messages = [];
        let isProcessingMessage = false;

        // Auto-resize textarea
        userInput.addEventListener('input', function() {
            this.style.height = '48px';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Send message on Enter (but not Shift+Enter)
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Send button click handler
        sendButton.addEventListener('click', sendMessage);

        // Disable send button when input is empty
        userInput.addEventListener('input', function() {
            sendButton.disabled = this.value.trim().length === 0;
        });

        function addMessage(text, sender, isError = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}${isError ? ' error' : ''}`;
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const userText = userInput.value.trim();
            if (isProcessingMessage || !userText) return;

            if (typeof config === 'undefined' || !config.API_KEY) {
                addMessage("⚠️ Cannot send. API Key configuration issue.", 'bot', false, true);
                return;
            }

            isProcessingMessage = true;
            sendButton.disabled = true;
            userInput.disabled = true;
            userInput.placeholder = "Mashpia is thinking...";

            addMessage(userText, 'user');
            messages.push({ role: "user", content: userText });
            userInput.value = '';
            userInput.style.height = '48px';
            userInput.focus();

            typingIndicator.style.display = 'flex';
            scrollToBottom();

            try {
                let fullResponse = '';
                await streamChatGPTResponse(userText, 
                    (chunk) => {
                        fullResponse += chunk;
                    },
                    (completeResponse) => {
                        typingIndicator.style.display = 'none';
                        messages.push({ role: "assistant", content: completeResponse });
                        addMessage(completeResponse, 'bot');
                        isProcessingMessage = false;
                        userInput.disabled = false;
                        sendButton.disabled = userInput.value.trim().length === 0;
                        userInput.placeholder = "Ask Mashpia...";
                        userInput.focus();
                    },
                    messages
                );
            } catch (error) {
                console.error('Error during chat processing:', error);
                typingIndicator.style.display = 'none';
                addMessage(`😥 Apologies, I encountered an error trying to respond.\n*${error.message}*\nPlease try again.`, 'bot', false, true);
                isProcessingMessage = false;
                userInput.disabled = false;
                sendButton.disabled = userInput.value.trim().length === 0;
                userInput.placeholder = "Ask Mashpia...";
                userInput.focus();
            }
        }
    </script>
</body>
</html>
