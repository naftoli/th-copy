<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mashpia Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-dark: #357abd;
            --secondary-color: #f5f5f5;
            --text-color: #333;
            --light-text: #666;
            --border-color: #ddd;
            --success-color: #4caf50;
            --error-color: #f44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .chat-container {
            max-width: 1000px;
            margin: 20px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: #f9f9f9;
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: 20px;
            max-width: 80%;
            animation: fadeIn 0.3s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background-color: var(--primary-color);
            color: white;
            border-radius: 18px 18px 0 18px;
            padding: 12px 16px;
            margin-left: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .bot-message {
            background-color: white;
            color: var(--text-color);
            border-radius: 18px 18px 18px 0;
            padding: 12px 16px;
            margin-right: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message-time {
            font-size: 0.7rem;
            color: var(--light-text);
            margin-top: 5px;
            text-align: right;
        }

        .typing-indicator {
            display: none;
            background-color: white;
            padding: 10px 15px;
            border-radius: 18px 18px 18px 0;
            margin-bottom: 20px;
            margin-right: auto;
            max-width: 80%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            background-color: var(--primary-color);
            display: inline-block;
            border-radius: 50%;
            margin-right: 5px;
            animation: typing 1s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .input-container {
            padding: 20px;
            background-color: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        #user-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            resize: none;
            min-height: 45px;
            max-height: 150px;
            line-height: 1.4;
            color: var(--text-color);
            background-color: white;
        }

        #user-input::placeholder {
            color: var(--light-text);
            opacity: 0.8;
        }

        #user-input:focus {
            border-color: var(--primary-color);
        }

        /* Hide scrollbar by default */
        #user-input {
            overflow-y: hidden;
        }

        /* Show scrollbar only after 6 lines */
        #user-input.long-text {
            overflow-y: auto;
        }

        /* Custom scrollbar styling */
        #user-input::-webkit-scrollbar {
            width: 6px;
        }

        #user-input::-webkit-scrollbar-track {
            background: transparent;
        }

        #user-input::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 3px;
        }

        #user-input::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        .send-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-button:hover {
            background-color: var(--primary-dark);
        }

        .send-button:disabled {
            background-color: var(--light-text);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .send-button svg {
            width: 20px;
            height: 20px;
        }

        .message-content {
            white-space: pre-wrap;
        }

        .bot-message a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .bot-message a:hover {
            text-decoration: underline;
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: var(--secondary-color);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            position: relative;
            width: 20px;
            height: 20px;
        }

        .loading div {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: loading 1.2s linear infinite;
        }

        .loading div:nth-child(1) { animation-delay: 0s; }
        .loading div:nth-child(2) { animation-delay: 0.4s; }
        .loading div:nth-child(3) { animation-delay: 0.8s; }

        @keyframes loading {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.5); opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Mashpia Chatbot</h1>
            <p>How can I help you today?</p>
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- Remove the initial message from here since it's added by loadKnowledgeBase -->
        </div>
        <div class="typing-indicator" id="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="input-container">
            <textarea id="user-input" placeholder="Type your message here..." rows="1"></textarea>
            <button class="send-button" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing-indicator');
        const sendButton = document.querySelector('.send-button');
        let currentResponseController = null;

        // Add scroll handling variables
        let autoScrollEnabled = true;
        let isUserScrolling = false;
        let scrollTimeout;
        let pauseScrollTimeout;

        // Array to store conversation history
        let messages = [];

        // Add a variable to track if we're currently processing a message
        let isProcessingMessage = false;

        // Function to load knowledge base from local files
        async function loadKnowledgeBase() {
            try {
                // Try to load the knowledge base from an HTML file
                const response = await fetch('/zalman/knowledge-base.html');
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch knowledge base (Status: ${response.status}). Please ensure the knowledge base file exists and is accessible.`);
                }

                const knowledgeBase = await response.text();

                // Initialize the system message with the knowledge base
                messages = [{
                    role: "user",
                    parts: [{
                        text: `
Your name is Mashpia and your purpose is to help chayolim fulfill their orders properly.
Your purpose is to answer questions based *only* on the information provided here.
Do not use any external knowledge.
Keep responses short, simple, accurate, helpful and to the point.

FORMATTING INSTRUCTIONS:
Use the following formatting in your responses:
- **Bold text** for important points or emphasis
- *Italic text* for subtle emphasis or quotes
- __Underlined text__ for key terms or concepts
- [Link text](URL) for clickable links
- # Heading 1 for main sections
- ## Heading 2 for subsections
- ### Heading 3 for sub-subsections
- <img src="image-url" alt="description"> for images (only use images from the knowledge base)

STRICT RESPONSE RULES:
1. ONLY provide information that is explicitly stated in the knowledge base
2. If asked about information not in the knowledge base, don't make anything up. If you don't know the answer, say so.
3. DO NOT make assumptions or provide information not found in the knowledge base
4. DO NOT use any external knowledge or general information
5. Never make anything up. If you don't know the answer, say so.
6. When providing information:
  - Be precise and specific
  - Feel free to restructure the information to make it more understandable
  - Include relevant contact information only if it's in the knowledge base
  - Include images from the knowledge base when relevant
7. For technical issues, ONLY provide the specific information request format if it's in the knowledge base
8. Maintain a professional and helpful tone while strictly adhering to the knowledge base content
9. you can do basic small talk but not give any information not in the knowledge base
10. Have in mind that the user doesnt know the whole knowledge base, so be clear and specific to what you are referring to
11. When providing links, always use the format [Link text](URL) and make sure the link text clearly describes what the user will find at the link
12. Never use vague references like "this page" or "these instructions" - always be specific about what the link contains
13. When including images, always use the format <img src="image-url" alt="description"> and ensure the image is from the knowledge base
14. **CRITICAL**: When multiple options or variations exist for any topic (e.g., boys/girls groups, different grade levels, different tracks, different locations, etc.), you MUST list ALL available options in the same response. Never assume the user's preference or provide only one option unless only one exists in the knowledge base. This applies to ALL types of information, not just specific categories. For example:
   - When discussing teacher groups, always list both male and female options with their respective member counts
   - When discussing different tracks or levels, list all available options
   - When discussing locations or programs, list all relevant options
   - Never wait for a follow-up question to provide additional options
   - Always provide complete information upfront
   - For WhatsApp groups specifically, always provide both male and female group links and member counts in the same response
15. NEVER mention the knowledge base in your responses, just use the information. don even mention the words "knowledge base"

KNOWLEDGE BASE:
${knowledgeBase}
`
                    }]
                }];

                // Add initial bot message
                addMessage("Hello! I'm Mashpia. I'm here to help you with any questions about Tzivos Hashem. How can I assist you today?", 'bot');
            } catch (error) {
                console.error('Error loading knowledge base:', error);
                addMessage(`⚠️ Error loading knowledge base: ${error.message}`, 'bot');
                addMessage("Please ensure that:\n1. The knowledge base file exists at '/knowledge-base.html'\n2. The file has proper read permissions\n3. The server is configured to serve static files", 'bot');
            }
        }

        // Initialize the chat when the page loads
        document.addEventListener('DOMContentLoaded', async () => {
            // Check if API key is set in config.js
            if (!config || !config.API_KEY) {
                addMessage("⚠️ Please set up your Gemini API key in the config.js file to use this chatbot.", 'bot');
                addMessage("Create a config.js file in the same directory with:\n\nconst config = {\n  API_KEY: 'YOUR_API_KEY_HERE',\n  MODEL: 'gemini-1.5-flash' // Or your preferred model\n};", 'bot');
                return;
            }

            // Load the knowledge base
            await loadKnowledgeBase();
        });

        // Add scroll event listener
        chatMessages.addEventListener('scroll', function() {
            // Clear any existing timeouts
            if (scrollTimeout) {
                clearTimeout(scrollTimeout);
            }
            if (pauseScrollTimeout) {
                clearTimeout(pauseScrollTimeout);
            }

            // If user scrolls up significantly (more than 10px from bottom)
            if (chatMessages.scrollTop + chatMessages.clientHeight < chatMessages.scrollHeight - 8) {
                // Add a small delay before pausing auto-scroll to prevent accidental pauses
                pauseScrollTimeout = setTimeout(() => {
                    autoScrollEnabled = false;
                    isUserScrolling = true;
                }, 30);
            } else {
                // If we're near the bottom, immediately enable auto-scroll
                autoScrollEnabled = true;
                isUserScrolling = false;
            }
        });

        // Add event listener for Enter key with shift+enter support
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (e.shiftKey) {
                    // Allow default behavior (new line)
                    return;
                } else {
                    e.preventDefault();
                    sendMessage();
                }
            }
        });

        // Auto-resize textarea and handle scrollbar
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            
            // Check if we have more than 6 lines (approximately)
            const lineHeight = parseInt(window.getComputedStyle(this).lineHeight);
            const lines = this.scrollHeight / lineHeight;
            
            if (lines >= 6) {
                this.classList.add('long-text');
            } else {
                this.classList.remove('long-text');
            }
        });

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        async function sendMessage() {
            // Ensure API key is available before sending
            if (!config || !config.API_KEY) {
                addMessage("⚠️ Cannot send message. Please configure your API key in config.js.", 'bot');
                return;
            }

            // Prevent sending new message while processing
            if (isProcessingMessage) return;

            const message = userInput.value.trim();
            if (!message) return;

            // Set processing flag
            isProcessingMessage = true;

            // Only disable the send button, keep input enabled
            sendButton.disabled = true;

            // Add user message to chat and conversation history
            addMessage(message, 'user');
            messages.push({ role: "user", parts: [{ text: message }] });
            userInput.value = '';

            // Keep focus on input
            userInput.focus();

            // Show typing indicator
            typingIndicator.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                console.log('Sending request to Gemini API...');
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${config.MODEL || 'gemini-1.5-flash'}:generateContent?key=${config.API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: messages,
                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 2000,
                        }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('API Error:', errorData);
                    throw new Error(`API request failed with status ${response.status}: ${errorData.error?.message || 'Unknown error'}`);
                }

                const data = await response.json();
                console.log('Received API response:', data);

                if (!data.candidates || data.candidates.length === 0 || !data.candidates[0].content) {
                    console.error('Invalid API response structure:', data);
                    throw new Error('Received an invalid response structure from the API.');
                }

                const botResponse = data.candidates[0].content.parts[0].text;
                console.log('Bot response length:', botResponse.length);

                // Add bot response to conversation history
                messages.push({ role: "model", parts: [{ text: botResponse }] });

                // Hide typing indicator
                typingIndicator.style.display = 'none';

                // Show the message with typing animation
                await typeMessage(botResponse, 'bot');

            } catch (error) {
                console.error('Error sending message:', error);
                typingIndicator.style.display = 'none';
                addMessage(`I'm sorry, there was an error processing your request: ${error.message}. Please check the console or try again later.`, 'bot');
            } finally {
                // Re-enable send button and reset processing flag
                sendButton.disabled = false;
                isProcessingMessage = false;
                // Keep focus on input
                userInput.focus();
            }
        }

        async function typeMessage(text, sender) {
            // Always enable auto-scroll at the start of a new message
            autoScrollEnabled = true;
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            messageDiv.appendChild(contentDiv);

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = getCurrentTime();
            messageDiv.appendChild(timeDiv);

            chatMessages.appendChild(messageDiv);
            
            // Always scroll to bottom when starting a new message
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Process formatting for bot messages
            if (sender === 'bot') {
                // Convert markdown-like syntax to HTML and allow safe HTML content
                text = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
                    .replace(/\*(.*?)\*/g, '<em>$1</em>') // Italic
                    .replace(/\_\_(.*?)\_\_/g, '<u>$1</u>') // Underline
                    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>') // Links
                    .replace(/\#\#\# (.*?)\n/g, '<h3>$1</h3>') // H3
                    .replace(/\#\# (.*?)\n/g, '<h2>$1</h2>') // H2
                    .replace(/\# (.*?)\n/g, '<h1>$1</h1>'); // H1
                
                // Sanitize HTML content to prevent XSS while allowing images
                const sanitizedText = DOMPurify.sanitize(text, {
                    ALLOWED_TAGS: ['strong', 'em', 'u', 'a', 'h1', 'h2', 'h3', 'img'],
                    ALLOWED_ATTR: ['href', 'target', 'src', 'alt']
                });
                
                contentDiv.innerHTML = sanitizedText;
            }

            let currentIndex = 0;
            const typingSpeed = 5; // 5ms typing speed
            
            function typeNextCharacter() {
                if (currentIndex < text.length) {
                    try {
                        // Use innerHTML for bot messages to process HTML tags
                        if (sender === 'bot') {
                            contentDiv.innerHTML = text.substring(0, currentIndex + 1);
                        } else {
                            contentDiv.textContent = text.substring(0, currentIndex + 1);
                        }
                        
                        // Only auto-scroll if enabled
                        if (autoScrollEnabled) {
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                        }
                        
                        currentIndex++;
                        setTimeout(typeNextCharacter, typingSpeed);
                    } catch (error) {
                        console.error('Error during typing:', error);
                        contentDiv.innerHTML = text;
                    }
                } else {
                    // Re-enable input and button after typing animation is complete
                    userInput.disabled = false;
                    sendButton.disabled = false;
                }
            }

            try {
                typeNextCharacter();
            } catch (error) {
                console.error('Error starting typing:', error);
                contentDiv.innerHTML = text;
                // Re-enable input and button on error
                userInput.disabled = false;
                sendButton.disabled = false;
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            // Process formatting for bot messages
            if (sender === 'bot') {
                // Convert markdown-like syntax to HTML and allow safe HTML content
                text = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
                    .replace(/\*(.*?)\*/g, '<em>$1</em>') // Italic
                    .replace(/\_\_(.*?)\_\_/g, '<u>$1</u>') // Underline
                    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>') // Links
                    .replace(/\#\#\# (.*?)\n/g, '<h3>$1</h3>') // H3
                    .replace(/\#\# (.*?)\n/g, '<h2>$1</h2>') // H2
                    .replace(/\# (.*?)\n/g, '<h1>$1</h1>'); // H1
                
                // Sanitize HTML content to prevent XSS while allowing images
                const sanitizedText = DOMPurify.sanitize(text, {
                    ALLOWED_TAGS: ['strong', 'em', 'u', 'a', 'h1', 'h2', 'h3', 'img'],
                    ALLOWED_ATTR: ['href', 'target', 'src', 'alt']
                });
                
                contentDiv.innerHTML = sanitizedText;
            } else {
                contentDiv.textContent = text;
            }
            
            messageDiv.appendChild(contentDiv);

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = getCurrentTime();
            messageDiv.appendChild(timeDiv);

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
