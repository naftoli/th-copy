        :root {

            width: 6px;

Jewish Niagara — Operations Overview
Compiled from JewishNiagara.com and associated pages. Last updated: August 21, 2025.

Quick Facts
Organization: Jewish Niagara (Chabad of Niagara)


Primary Hub: Niagara Jewish Welcome Centre, 6417 Main Street, Niagara Falls, ON L2G 5Y3


General Inquiries: visitor@jewishniagara.com | 905-356-7200 ext. 772 | US line: 716-335-9551


Seasonality: Peak operations in summer (July–August) and select holidays; reduced/coordination-based services during shoulder and off-seasons.



Mission & Audience (in practice)
Jewish Niagara serves visitors and locals in the Niagara Region with a welcoming Chabad presence that focuses on tefillah (minyanim), kosher dining access, Shabbat programs and hospitality, holiday programming, and practical trip assistance (discounted attractions, hotel coordination, eiruv guidance, etc.).

Core Operations
1) Synagogue & Minyanim
Location: Shul at the Niagara Jewish Welcome Centre (second floor).


Peak Season (Summer): Reliable daily Shacharit, Mincha & Maariv with multiple Shacharit and Mincha options posted seasonally on the site.


17 Tammuz & Nine Days: Treated like shoulder season; no minyan on fast days; rely on signup/coordination tools.


Shoulder Months (May–June, Sept–Oct): 40–70% chance of minyan; attendees are encouraged to register to help confirm.


Off-Season (Nov–Apr): Low reliability; use Minyan Maker to build/confirm a minyan.


Minyan Maker: Online registration tool (also at FallsMinyan.com). When 10 register, the system auto-confirms via email/text; easy to unregister if plans change.


Nearby Reliable Minyanim (off-season backup):


Hamilton, ON (Canada): Adas Israel Congregation — ~45 min (no border).


Buffalo, NY (USA): Chabad of Buffalo & Young Israel of Greater Buffalo — ~25–30 min (border crossing required).


Parking for Minyan: Limited metered street parking on Main St; nearby hotel self-parking options; emphasis on city by-law compliance and promoting Kiddush Hashem.


2) Shabbat at the Falls (Hospitality & Meals)
Seasonal Shabbat Program (June through Labor Day):


Lively minyanim with diverse visitors.


Three gourmet meals: Friday night dinner, Shabbat day kiddush/luncheon, and Seudah Shlishit; known for plentiful, heimish-yet-elegant atmosphere.


Experience: Singing, zemirot, lechayims, and a peaceful Shabbat menuchah with scenic walks by the Falls.


Reservations: Online pre-registration required (active seasonal booking pages).


Off-Season: Occasional pop-up shabbatons and special packages (e.g., Chanukah, Chol Hamoed). Join mailing list for early rates and limited-capacity events.


3) Kosher Dining & Food Access
Summer & Peak Holidays: Two independently owned kosher restaurants on the Welcome Centre’s main level (operators lease space from Jewish Niagara).


Hechsher: COR – Kashruth Council of Canada.


Standards: Cholov Yisroel, Pas Yisroel, Bishul Yisroel, Heimishe shechita.


Contact: meat@niagarakosher.com (ext. 33) | dairy@niagarakosher.com (ext. 32) | Phone: 289-296-4000.


Address: 6417 Main Street, Niagara Falls, ON L2G 5Y3.


Parking: All-day paid parking available; limited street parking; many hotels offer day/single-entry options; guests encouraged to walk.


Year-Round Groceries: No dedicated kosher supermarket in Niagara Falls. Basic hechshered items at major grocers (No Frills, Food Basics, Walmart, Metro). Nearest kosher markets: Hamilton, ON (Fortinos; Hamilton Kosher Meat Market) and Buffalo, NY (Nissan’s Kosher Deli at Tops; Buffalo Kosher Gourmet) — time/border caveats apply.


4) Attractions Desk & Discounted Tickets
Service: Exclusive discounted tickets/packages to major Canadian and US attractions (e.g., boat rides, Journey Behind the Falls, SkyWheel, White Water Walk, Butterfly Conservatory, Jet Boats, Clifton Hill Fun Pass; US-side Maid of the Mist, Cave of the Winds, Aquarium of Niagara, etc.).


Pricing Positioning: Advertised as lower than typical online deals (e.g., Groupon/AAA/Expedia).


Pickup & Hours (Visitor Centre):


Summer (Jul–Aug): 8:00 AM–9:00 PM


All other times: 9:00 AM–4:00 PM


Group Bookings: Dedicated booking flow for schools/camps (15+ people); assistance via Visitor Desk for itineraries.


Free Things-To-Do Resource: Curated list of free nature, parks, arts, waterfront walks, US-side options, fireworks schedule, etc., to help budget-conscious travelers.


5) Hotels & Lodging Support
Individual Bookings: Book directly with hotels; mention “Jewish Niagara” for 5% discount at partner hotels.


Partner/Featured Hotels:


Embassy Suites by Hilton (within the eiruv) — 6700 Fallsview Blvd.


Wyndham Fallsview Hotel (within the eiruv) — 6455 Fallsview Blvd.


DoubleTree Fallsview (not within the eiruv) — 6039 Fallsview Blvd.


Group Bookings (5+ rooms): Jewish Niagara can assist with bulk rates via an online group form. Holiday seasons (e.g., Chol Hamoed) may feature special rates even for individuals.


Travel Rides/Tours (informational): Local drivers available for regional rides/tours and intercity trips (Toronto, Buffalo, NYC/NJ, Montreal) — multilingual support.


6) Eiruv Guidance
Status: Niagara Falls has an eiruv.


Hotel Planning: Visitors should check eiruv map/coverage before booking; partner hotels listed by Jewish Niagara are within the eiruv.


Keys: Most hotels do not offer Shabbos-key options; contact the Welcome Centre for guidance/workarounds.


7) Mikvah — Current Access & Building Campaign
Nearest Mikva’ot (appointments required):


Hamilton, ON (Canada) — ~55 minutes; address/phone listed on site.


Buffalo, NY (USA) — ~30 minutes (border crossing); women’s mikvah plus men’s mikvah and keilim mikvah; small usage fees for men’s/keilim.


Project in Development: Moussia’s Mikvah Campaign — fundraising to build a state-of-the-art women’s mikvah, men’s mikvah, and keilim mikvah inside the Jewish Welcome Centre to serve locals and tens of thousands of visitors.


8) Holiday & Seasonal Programs
Pesach/Chol Hamoed: Family-oriented programs with minyanim, curated attractions, discounted hotel packages, and kosher food solutions (including BBQs/snack bars in some years). Pages note COR supervision and published meal standards in relevant years.


Shavuos: Boutique Yom Tov experience (fine dining, tea room, children’s program, inspiring Rabbis/Rebbetzins, minyanim); limited capacity.


Sukkos: Kosher food access, on-site sukkah options (large Food Fest sukkah, 24-hour patio sukkah, and overnight sleeping sukkah with reservable cots during some seasons), daily minyanim, vendor-based Kosher Food Fest.


Chanukah: Seasonal Shabbat-at-the-Falls packages (hotel+meals), Grand Menorah Lighting at the Falls, minyan coordination, safe public menorah-lighting in the Centre, discounted attractions.


9) Youth & Education (selected/legacy items)
Camp Gan Israel Niagara: Registration pages appear on the domain for previous years (e.g., 2024). Programming varies by season and year; check site for current availability.


Community learning/workshops: Off-season communications and pop-up events noted on the site/mailing list.


10) Fundraising & Partnerships
Donate: Ongoing opportunities to sponsor programs or contribute holiday/seasonal packages; appeals often connect attraction savings to funding Jewish education in Niagara.


Charitable Status (Canada): Jewish Niagara is a registered charity (CRA), enabling tax-receipted donations.



Physical Hub — The Niagara Jewish Welcome Centre
Functions:


Visitor help desk (tickets, itineraries, local advice).


Kosher restaurants (main level, in-season).


Shul/minyan space (upper level).


Program rooms for Shabbat meals and holiday events.


Future home of Moussia’s Mikvah.


Access & Etiquette: Central, walkable tourist district; please observe local bylaws and respectful parking; promote Kiddush Hashem.



How to Use These Services (At-a-Glance)
Confirm your dates (peak vs. shoulder/off-season).


Reserve Shabbat early (limited capacities during peak/holiday windows).


Minyan in off-season? Register on Minyan Maker / FallsMinyan.com.


Kosher dining: Check NiagaraKosher.com for menus/hours; restaurants are independently operated under COR.


Attractions: Order discount tickets online or in-person; pick up from the Welcome Centre during posted hours.


Hotels: Book direct; mention “Jewish Niagara” for partner discount; verify eiruv coverage.


Mikvah: Use listed Hamilton/Buffalo options for now; follow the Moussia’s Mikvah campaign updates.


Groups (schools/camps/5+ rooms): Use group forms for tailored assistance and bulk rates.

        // Add scroll event listener
        chatMessages.addEventListener('scroll', function() {
            // Clear any existing timeouts
            if (scrollTimeout) {
                clearTimeout(scrollTimeout);
            }
            if (pauseScrollTimeout) {
                clearTimeout(pauseScrollTimeout);
            }

            // If user scrolls up significantly (more than 10px from bottom)
            if (chatMessages.scrollTop + chatMessages.clientHeight < chatMessages.scrollHeight - 8) {
                // Add a small delay before pausing auto-scroll to prevent accidental pauses
                pauseScrollTimeout = setTimeout(() => {
                    autoScrollEnabled = false;
                    isUserScrolling = true;
                }, 30);
            } else {
                // If we're near the bottom, immediately enable auto-scroll
                autoScrollEnabled = true;
                isUserScrolling = false;
            }
        });

        // Add event listener for Enter key with shift+enter support
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (e.shiftKey) {
                    // Allow default behavior (new line)
                    return;
                } else {
                    e.preventDefault();
                    sendMessage();
                }
            }
        });

        // Auto-resize textarea and handle scrollbar
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
           
            // Check if we have more than 6 lines (approximately)
            const lineHeight = parseInt(window.getComputedStyle(this).lineHeight);
            const lines = this.scrollHeight / lineHeight;
           
            if (lines >= 6) {
                this.classList.add('long-text');
            } else {
                this.classList.remove('long-text');
            }
        });

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        async function sendMessage() {
            // Ensure API key is available before sending
            if (!config || !config.API_KEY) {
                addMessage("⚠️ Cannot send message. Please configure your API key in config.js.", 'bot');
                return;
            }

            // Prevent sending new message while processing
            if (isProcessingMessage) return;

            const message = userInput.value.trim();
            if (!message) return;

            // Set processing flag
            isProcessingMessage = true;

            // Only disable the send button, keep input enabled
            sendButton.disabled = true;

            // Add user message to chat and conversation history
            addMessage(message, 'user');
            messages.push({ role: "user", content: message });
            userInput.value = '';

            // Keep focus on input
            userInput.focus();

            // Show typing indicator
            typingIndicator.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                console.log('Sending request to OpenAI API...');
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.API_KEY}`
                    },
                    body: JSON.stringify({
                        model: config.MODEL || 'gpt-3.5-turbo',
                        messages: messages,
                        temperature: 0.7,
                        max_tokens: 3000
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('API Error:', errorData);
                    throw new Error(`API request failed with status ${response.status}: ${errorData.error?.message || 'Unknown error'}`);
                }

                const data = await response.json();
                console.log('Received API response:', data);

                if (!data.choices || data.choices.length === 0 || !data.choices[0].message) {
                    console.error('Invalid API response structure:', data);
                    throw new Error('Received an invalid response structure from the API.');
                }

                const botResponse = data.choices[0].message.content;
                console.log('Bot response length:', botResponse.length);

                // Add bot response to conversation history
                messages.push({ role: "assistant", content: botResponse });

                // Hide typing indicator
                typingIndicator.style.display = 'none';

                // Show the message with typing animation
                await typeMessage(botResponse, 'bot');

            } catch (error) {
                console.error('Error sending message:', error);
                typingIndicator.style.display = 'none';
                addMessage(`I'm sorry, there was an error processing your request: ${error.message}. Please check the console or try again later.`, 'bot');
            } finally {
                // Re-enable send button and reset processing flag
                sendButton.disabled = false;
                isProcessingMessage = false;
                // Keep focus on input
                userInput.focus();
            }
        }

        async function typeMessage(text, sender) {
            // Always enable auto-scroll at the start of a new message
            autoScrollEnabled = true;
           
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            messageDiv.appendChild(contentDiv);

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = getCurrentTime();
            messageDiv.appendChild(timeDiv);

            chatMessages.appendChild(messageDiv);
           
            // Always scroll to bottom when starting a new message
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Process formatting for bot messages
            if (sender === 'bot') {
                // Convert markdown-like syntax to HTML and allow safe HTML content
                text = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
                    .replace(/\*(.*?)\*/g, '<em>$1</em>') // Italic
                    .replace(/\_\_(.*?)\_\_/g, '<u>$1</u>') // Underline
                    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>') // Links
                    .replace(/\#\#\# (.*?)\n/g, '<h3>$1</h3>') // H3
                    .replace(/\#\# (.*?)\n/g, '<h2>$1</h2>') // H2
                    .replace(/\# (.*?)\n/g, '<h1>$1</h1>'); // H1
               
                // Sanitize HTML content to prevent XSS while allowing images
                const sanitizedText = DOMPurify.sanitize(text, {
                    ALLOWED_TAGS: ['strong', 'em', 'u', 'a', 'h1', 'h2', 'h3', 'img'],
                    ALLOWED_ATTR: ['href', 'target', 'src', 'alt']
                });
               
                contentDiv.innerHTML = sanitizedText;
            }

            let currentIndex = 0;
            const typingSpeed = 15; // 5ms typing speed
           
            function typeNextCharacter() {
                if (currentIndex < text.length) {
                    try {
                        // Use innerHTML for bot messages to process HTML tags
                        if (sender === 'bot') {
                            contentDiv.innerHTML = text.substring(0, currentIndex + 1);
                        } else {
                            contentDiv.textContent = text.substring(0, currentIndex + 1);
                        }
                       
                        // Only auto-scroll if enabled
                        if (autoScrollEnabled) {
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                        }
                       
                        currentIndex++;
                        setTimeout(typeNextCharacter, typingSpeed);
                    } catch (error) {
                        console.error('Error during typing:', error);
                        contentDiv.innerHTML = text;
                    }
                } else {
                    // Re-enable input and button after typing animation is complete
                    userInput.disabled = false;
                    sendButton.disabled = false;
                }
            }

            try {
                typeNextCharacter();
            } catch (error) {
                console.error('Error starting typing:', error);
                contentDiv.innerHTML = text;
                // Re-enable input and button on error
                userInput.disabled = false;
                sendButton.disabled = false;
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
           
            // Process formatting for bot messages
            if (sender === 'bot') {
                // Convert markdown-like syntax to HTML and allow safe HTML content
                text = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
                    .replace(/\*(.*?)\*/g, '<em>$1</em>') // Italic
                    .replace(/\_\_(.*?)\_\_/g, '<u>$1</u>') // Underline
                    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>') // Links
                    .replace(/\#\#\# (.*?)\n/g, '<h3>$1</h3>') // H3
                    .replace(/\#\# (.*?)\n/g, '<h2>$1</h2>') // H2
                    .replace(/\# (.*?)\n/g, '<h1>$1</h1>'); // H1
               
                // Sanitize HTML content to prevent XSS while allowing images
                const sanitizedText = DOMPurify.sanitize(text, {
                    ALLOWED_TAGS: ['strong', 'em', 'u', 'a', 'h1', 'h2', 'h3', 'img'],
                    ALLOWED_ATTR: ['href', 'target', 'src', 'alt']
                });
               
                contentDiv.innerHTML = sanitizedText;
            } else {
                contentDiv.textContent = text;
            }
           
            messageDiv.appendChild(contentDiv);

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = getCurrentTime();
            messageDiv.appendChild(timeDiv);

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
