<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Moshiach Chidon 5785</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .video-container {
      position: absolute;
      top: 0;
      left: 0;
      width: calc(100vw - 200px);
      height: calc(100vh - 200px);
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .overlay-image {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100px;
      pointer-events: none; /* allows clicks to go through */
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="video-container" id="videoBox">
    <iframe 
      src="https://www.youtube.com/embed/4Akjd3Vy7HI?rel=0&modestbranding=1&showinfo=0&controls=1"
      title="Moshiach Chidon 5785"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen>
    </iframe>

    <!-- Overlay image covering bottom 100px -->
    <img src="https://mashpia.com/zalman/a.png" class="overlay-image" alt="Overlay" />
  </div>

</body>
</html>
