<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rambam Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-dark: #357abd;
            --secondary-color: #f5f5f5;
            --text-color: #333;
            --light-text: #666;
            --border-color: #ddd;
            --success-color: #4caf50;
            --error-color: #f44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .chat-container {
            max-width: 1000px;
            margin: 20px auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: #f9f9f9;
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: 20px;
            max-width: 80%;
            animation: fadeIn 0.3s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background-color: var(--primary-color);
            color: white;
            border-radius: 18px 18px 0 18px;
            padding: 12px 16px;
            margin-left: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .bot-message {
            background-color: white;
            color: var(--text-color);
            border-radius: 18px 18px 18px 0;
            padding: 12px 16px;
            margin-right: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message-time {
            font-size: 0.7rem;
            color: var(--light-text);
            margin-top: 5px;
            text-align: right;
        }

        .typing-indicator {
            display: none;
            background-color: white;
            padding: 10px 15px;
            border-radius: 18px 18px 18px 0;
            margin-bottom: 20px;
            margin-right: auto;
            max-width: 80%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .typing-indicator span {
            height: 8px;
            width: 8px;
            background-color: var(--primary-color);
            display: inline-block;
            border-radius: 50%;
            margin-right: 5px;
            animation: typing 1s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .input-container {
            padding: 20px;
            background-color: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        #user-input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            font-family: 'Roboto', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            resize: none;
            min-height: 45px;
            max-height: 150px;
            line-height: 1.4;
            color: var(--text-color);
            background-color: white;
        }

        #user-input::placeholder {
            color: var(--light-text);
            opacity: 0.8;
        }

        #user-input:focus {
            border-color: var(--primary-color);
        }

        /* Hide scrollbar by default */
        #user-input {
            overflow-y: hidden;
        }

        /* Show scrollbar only after 6 lines */
        #user-input.long-text {
            overflow-y: auto;
        }

        /* Custom scrollbar styling */
        #user-input::-webkit-scrollbar {
            width: 6px;
        }

        #user-input::-webkit-scrollbar-track {
            background: transparent;
        }

        #user-input::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 3px;
        }

        #user-input::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        .send-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .send-button:hover {
            background-color: var(--primary-dark);
        }

        .send-button:disabled {
            background-color: var(--light-text);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .send-button svg {
            width: 20px;
            height: 20px;
        }

        .message-content {
            white-space: pre-wrap;
        }

        .bot-message a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .bot-message a:hover {
            text-decoration: underline;
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: var(--secondary-color);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            position: relative;
            width: 20px;
            height: 20px;
        }

        .loading div {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary-color);
            border-radius: 50%;
            animation: loading 1.2s linear infinite;
        }

        .loading div:nth-child(1) { animation-delay: 0s; }
        .loading div:nth-child(2) { animation-delay: 0.4s; }
        .loading div:nth-child(3) { animation-delay: 0.8s; }

        @keyframes loading {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.5); opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Rambam Chatbot</h1>
            <p>How can I help you today?</p>
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- Remove the initial message from here since it's added by loadKnowledgeBase -->
        </div>
        <div class="typing-indicator" id="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="input-container">
            <textarea id="user-input" placeholder="Type your message here..." rows="1"></textarea>
            <button class="send-button" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script src="config-gpt.js"></script>
    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const typingIndicator = document.getElementById('typing-indicator');
        const sendButton = document.querySelector('.send-button');
        let currentResponseController = null;

        // Add scroll handling variables
        let autoScrollEnabled = true;
        let isUserScrolling = false;
        let scrollTimeout;
        let pauseScrollTimeout;

        // Array to store conversation history
        let messages = [];

        // Add a variable to track if we're currently processing a message
        let isProcessingMessage = false;

    

        // Initialize the chat when the page loads
        document.addEventListener('DOMContentLoaded', async () => {
            // Check if API key is set in config.js
            if (!config || !config.API_KEY) {
                addMessage("⚠️ Please set up your OpenAI API key in the config.js file to use this chatbot.", 'bot');
                addMessage("Create a config.js file in the same directory with:\n\nconst config = {\n  API_KEY: 'YOUR_API_KEY_HERE',\n  MODEL: 'gpt-3.5-turbo' // Or your preferred model\n};", 'bot');
                return;
            }

            // Initialize the system message with the knowledge base
            messages = [{
                role: "system",
                content: `

You are here to assist people with questions about the Daily Rambam study. You are currently answering only on Hilchos Ma’achalot Assurot, Chapters 5–7.

Guidelines:

Every answer must be based on these chapters of the Rambam.

You must quote the Rambam in the original hebrew and include an english transalation (with chapter) to support everything you say.

Never make up a quote or paraphrase as if it were a direct citation.

Always look at the whole rambam to make sure that you got the entire picture and give as much information as possible and make sure that nothing is left out. For example, if there are 2 opinions, say them both.

If someone asks a question not related to the Rambam, politely explain that you cannot help with that.

You may engage in brief small talk, but your primary role is to help with the current Rambam.

Text
              Ma'achalot Assurot - Chapter 5

אמִפִּי הַשְּׁמוּעָה לָמְדוּ שֶׁזֶּה שֶׁנֶּאֱמַר בַּתּוֹרָה "לֹא תֹאכַל הַנֶּפֶשׁ עִם הַבָּשָׂר" (דברים יב, כג) - לֶאֱסֹר אֵבֶר שֶׁנֶּחְתַּךְ מִן הַחַי. וְעַל אֵבֶר מִן הַחַי נֶאֱמַר לְנוֹחַ "אַךְ בָּשָׂר בְּנַפְשׁוֹ דָמוֹ לֹא תֹאכֵלוּ" (בראשית ט, ד). וְאִסּוּר אֵבֶר מִן הַחַי נוֹהֵג בִּבְהֵמָה חַיָּה וָעוֹף - בַּטְּהוֹרִים, אֲבָל לֹא בַּטְּמֵאִים.
באֶחָד אֵבֶר שֶׁיֵּשׁ בּוֹ בָּשָׂר וְגִידִים וַעֲצָמוֹת, כְּגוֹן הַיָּד וְהָרֶגֶל, וְאֶחָד אֵבֶר שֶׁאֵין בּוֹ עֶצֶם, כְּגוֹן הַלָּשׁוֹן וְהַבֵּיצִים וְהַטְּחוֹל וְהַכְּלָיוֹת וְהַחֵלֶב וְכַיּוֹצֵא בָּהֶן.
אֶלָא שֶׁהָאֵבֶר שֶׁאֵין בּוֹ עֶצֶם - בֵּין שֶׁחָתַךְ כֻּלּוֹ בֵּין שֶׁחָתַךְ מִקְצָתוֹ, הֲרֵי זֶה אָסוּר מִשּׁוּם אֵבֶר מִן הַחַי; וְהָאֵבֶר שֶׁיֵּשׁ בּוֹ עֶצֶם - אֵינוֹ חַיָּב עָלָיו מִשּׁוּם אֵבֶר מִן הַחַי, עַד שֶׁיִּפְרֹשׁ כִּבְרִיָּתוֹ בָּשָׂר וְגִידִים וַעֲצָמוֹת. אֲבָל אִם פֵּרֵשׁ מִן הַחַי הַבָּשָׂר בִּלְבָד - חַיָּב עָלָיו מִשּׁוּם טְרֵפָה כְּמוֹ שֶׁבֵּאַרְנוּ, לֹא מִשּׁוּם אֵבֶר מִן הַחַי.
גהָאוֹכֵל מֵאֵבֶר מִן הַחַי כַּזַּיִת, לוֹקֶה. וְאַפִלּוּ אָכַל אֵבֶר שָׁלֵם: אִם יֵשׁ בּוֹ כַּזַּיִת, חַיָּב; פָּחוֹת מִכַּזַּיִת, פָּטוּר. חָתַךְ מִן הָאֵבֶר כִּבְרִיָּתוֹ בָּשָׂר וְגִידִים וַעֲצָמוֹת כַּזַּיִת, וַאֲכָלוֹ - לוֹקֶה, אַף עַל פִּי שֶׁאֵין בּוֹ בָּשָׂר אֶלָא כָּל שֶׁהוּא.
אֲבָל אִם הִפְרִיד הָאֵבֶר אַחַר שֶׁתְּלָשׁוֹ מִן הַחַי, וְהִפְרִישׁ הַבָּשָׂר מִן הַגִּידִים וּמִן הָעֲצָמוֹת - אֵינוֹ לוֹקֶה עַד שֶׁיֹּאכַל כַּזַּיִת מִן הַבָּשָׂר לְבַדּוֹ, וְאֵין הָעֲצָמוֹת וְהַגִּידִים מִצְטָרְפִין בּוֹ לְכַזַּיִת מֵאַחַר שֶׁשִּׁנָּה בְּרִיָּתוֹ.
דחִלְקוֹ לְאֵבֶר זֶה, וַאֲכָלוֹ מְעַט מְעַט: אִם יֵשׁ בְּמַה שֶׁאָכַל כַּזַּיִת בָּשָׂר, חַיָּב; וְאִם לָאו, פָּטוּר.
לָקַח כַּזַּיִת מִן הָאֵבֶר כִּבְרִיָּתוֹ, בָּשָׂר וְגִידִים וַעֲצָמוֹת, וַאֲכָלוֹ - אַף עַל פִּי שֶׁנֶּחְלַק בְּפִיו בִּפְנִים קֹדֶם שֶׁיִּבְלְעֶנּוּ, חַיָּב.
התָּלַשׁ אֵבֶר מִן הַחַי, וְנִטְרְפָה בִּנְטִילָתוֹ, וַאֲכָלוֹ - חַיָּב שְׁתַּיִם, מִשּׁוּם אֵבֶר מִן הַחַי וּמִשּׁוּם טְרֵפָה; שֶׁהֲרֵי שְׁנֵי הָאִסּוּרִין בָּאִין כְּאַחַת.
וְכֵן הַתּוֹלֵשׁ חֵלֶב מִן הַחַי, וַאֲכָלוֹ - לוֹקֶה שְׁתַּיִם, מִשּׁוּם אֵבֶר מִן הַחַי וּמִשּׁוּם חֵלֶב. תָּלַשׁ חֵלֶב מִן הַטְּרֵפָה, וַאֲכָלוֹ - לוֹקֶה שָׁלוֹשׁ.
ובָּשָׂר הַמְּדֻלְדָּל בַּבְּהֵמָה, וְאֵבֶר הַמְּדֻלְדָּל בָּהּ, אִם אֵינוֹ יָכוֹל לַחֲזֹר וְלִחְיוֹת, אַף עַל פִּי שֶׁלֹּא פֵרַשׁ אֶלָא אַחַר שֶׁנִּשְׁחֲטָה - אָסוּר; וְאֵין לוֹקִין עָלָיו. וְאִם מֵתָה הַבְּהֵמָה, רוֹאִין אוֹתוֹ כְּאִלּוּ נָפַל מֵחַיִּים, לְפִיכָךְ לוֹקִין עָלָיו מִשּׁוּם אֵבֶר מִן הַחַי. אֲבָל הַיָּכוֹל לַחֲזֹר וְלִחְיוֹת - אִם נִשְׁחֲטָה הַבְּהֵמָה, הֲרֵי זֶה מֻתָּר.
זשָׁמַט אֵבֶר אוֹ מִעֲכוֹ אוֹ דָּכוֹ, כְּגוֹן הַבֵּיצִים שֶׁמִּעַךְ אוֹתָן אוֹ נִתְּקָן - הֲרֵי זֶה אֵינוֹ אָסוּר מִן הַתּוֹרָה, שֶׁהֲרֵי יֵשׁ בּוֹ מִקְצַת חַיִּים וּלְפִיכָךְ אֵין מַסְרִיחַ. וְאַף עַל פִּי כֵן אָסוּר לְאָכְלוֹ מִמִּנְהָג שֶׁנָּהֲגוּ כָּל יִשְׂרָאֵל מִקֹּדֶם, שֶׁהֲרֵי הוּא דּוֹמֶה לְאֵבֶר מִן הַחַי.
חעֶצֶם שֶׁנִּשְׁבַּר: אִם הָיָה הַבָּשָׂר אוֹ הָעוֹר חוֹפֶה רֹב עָבְיוֹ שֶׁל עֶצֶם הַנִּשְׁבָּר וְרֹב הֶקֵּף הַשֶּׁבֶר, הֲרֵי זֶה מֻתָּר. וְאִם יָצָא הָעֶצֶם לַחוּץ, הֲרֵי הָאֵבֶר אָסוּר; וּכְשֶׁיִּשְׁחֹט הַבְּהֵמָה אוֹ הָעוֹף, יַחְתֹּךְ מִמְּקוֹם הַשֶּׁבֶר וְיַשְׁלִיכוֹ, וְהַשְּׁאָר מֻתָּר.
נִשְׁבַּר הָעֶצֶם וְהָיָה הַבָּשָׂר חוֹפֶה אֶת רֻבּוֹ, אֲבָל הָיָה אוֹתוֹ הַבָּשָׂר מְרֻסָּס אוֹ נִתְאַכֵּל כַּבָּשָׂר שֶׁהָרוֹפֵא גּוֹרְדוֹ מִן הַחַבּוּרָה, אוֹ שֶׁהָיָה מִתְלַקֵּט הָרֹב מִמְּקוֹמוֹת הַרְבֵּה, אוֹ שֶׁהָיָה הַבָּשָׂר שֶׁעָלָיו נְקָבִים נְקָבִים, אוֹ שֶׁנִּסְדַּק הַבָּשָׂר, אוֹ שֶׁנִּקְדַּד כְּמִין טַבַּעַת, אוֹ שֶׁנִּגְרַד הַבָּשָׂר מִלְמַעְלָה עַד שֶׁלֹּא נִשְׁאָר מִן הַבָּשָׂר אֶלָא כִּקְלִפָּה, אוֹ שֶׁנִתְאַכֵּל הַבָּשָׂר מִלְּמַטָּה מֵעַל הָעֶצֶם שֶׁנִּשְׁבַּר עַד שֶׁנִּמְצָא הַבָּשָׂר הַחוֹפֶה אֵינוֹ נוֹגֵעַ בָּעֶצֶם - בְּכָל אֵלּוּ מוֹרִין לֶאֱסֹר, עַד שֶׁיִּתְרַפָּא הַבָּשָׂר. וְאִם אֲכָל מִכָּל אֵלּוּ, מַכִּין אוֹתוֹ מַכַּת מַרְדּוּת.
טהַמּוֹשִׁיט יָדוֹ לִמְעֵי הַבְּהֵמָה, וְחָתַךְ מִן הַטְּחוֹל וּמִן הַכְּלָיוֹת וְכַיּוֹצֵא בָּהֶן, וְהִנִּיחַ הַחֲתִכּוֹת בְּתוֹךְ מֵעֶיהָ, וְאַחַר כָּךְ שְׁחָטָהּ - הֲרֵי אוֹתָן הַחֲתִכּוֹת אֲסוּרוֹת מִשּׁוּם אֵבֶר מִן הַחַי, וְאַף עַל פִּי שֶׁהוּא בְּתוֹךְ מֵעֶיהָ.
אֲבָל אִם חָתַךְ מִן הָעֻבָּר שֶׁבְּמֵעֶיהָ, וְלֹא הוֹצִיאוֹ, וְאַחַר כָּךְ שְׁחָטָהּ - הֲרֵי חֲתִכּוֹת הָעֻבָּר אוֹ אֵבָרוֹ, מֻתָּר הוֹאִיל וְלֹא יָצָא.
עֻבָּר שֶׁהוֹצִיא יָדוֹ אוֹ רַגְלוֹ, נֶאֱסַר אוֹתוֹ אֵבֶר לְעוֹלָם, בֵּין שֶׁחֲתָכוֹ קֹדֶם שֶׁתִּשָּׁחֵט אִמּוֹ, בֵּין שֶׁחֲתָכוֹ אַחַר שֶׁנִּשְׁחֲטָה אִמּוֹ.
וְאַפִלּוּ הֶחְזִיר אוֹתוֹ אֵבֶר לִמְעֵי אִמּוֹ, וְאַחַר כָּךְ נִשְׁחֲטָה אוֹ נֹלַּד הַוָּלָד, וְחָיָה כַּמָּה שָׁנִים - הֲרֵי אוֹתוֹ הָאֵבֶר, אָסוּר מִשּׁוּם טְרֵפָה; שֶׁכָּל בָּשָׂר שֶׁיָּצָא חוּץ לִמְחִצָּתוֹ - נֶאֱסַר כְּבָשָׂר שֶׁפֵּרֵשׁ מִן הַחַי, שֶׁנֶּאֱמַר "וּבָשָׂר בַּשָּׂדֶה טְרֵפָה" (שמות כב, ל) - כֵּיוָן שֶׁיָּצָא לִמְקוֹם שֶׁהוּא לוֹ כְּשָׂדֶה, נַעֲשָׂה טְרֵפָה כְּמוֹ שֶׁבֵּאַרְנוּ.
יהוֹצִיא מִקְצַת הָאֵבֶר וְנִשְׁאַר מִקְצָתוֹ בִּפְנִים, אַפִלּוּ לֹא נִשְׁאַר אֶלָא מֵעוּטוֹ - הַיּוֹצֵא אָסוּר, וְשֶׁבִּפְנִים מֻתָּר. וְאִם חָתַךְ הַיּוֹצֵא מִן הָאֵבֶר אַחַר שֶׁהֶחֱזִירוֹ, וְנִשְׁחֲטָה - חוֹתֵךְ אוֹתוֹ שֶׁיָּצָא בִּלְבָד, וּשְׁאָר הָאֵבֶר מֻתָּר.
וְאִם לֹא הֶחֱזִירוֹ, וַחֲתָכוֹ וְהוּא בַּחוּץ, בֵּין שֶׁחֲתָכוֹ קֹדֶם שְׁחִיטָה אוֹ אַחַר שְׁחִיטָה - מְקוֹם הַחֲתָךְ אָסוּר. וְהוּא הַמָּקוֹם שֶׁכְּנֶגֶד הָאַוִּיר, אַחַר שֶׁיַּחְתֹּךְ הַיּוֹצֵא, חוֹזֵר וְחוֹתֵךְ מְקוֹם הַחֲתָךְ.
יאאֲבָל אֵבֶר עֻבָּר שֶׁיָּצָא וַחֲתָכוֹ קֹדֶם שְׁחִיטָה, וְהוּא בַּחוּץ - הֲרֵי זֶה אֵבֶר מִן הַחַי, וְלוֹקִין עָלָיו. וְאִם נֶחְתַּךְ אַחַר שְׁחִיטָה - הָאוֹכְלוֹ אֵינוֹ לוֹקֶה, וְאַפִלּוּ מֵת הָעֻבָּר קֹדֶם שְׁחִיטָה. וְאִם מֵתָה הַבְּהֵמָה, וְאַחַר כָּךְ חֲתָכוֹ - הָאוֹכְלוֹ לוֹקֶה מִשּׁוּם אֵבֶר מִן הַחַי.
יבעֻבָּר שֶׁהוֹצִיא אֵבֶר וְנֶאֱסַר הָאֵבֶר, וְאַחַר כָּךְ נֹלַּד, וַהֲרֵי הִיא נְקֵבָה - הֶחָלָב שֶׁלָּהּ אָסוּר לִשְׁתּוֹתוֹ מִסָּפֵק, הוֹאִיל וְהוּא בָּא מִכְּלַל הָאֵבָרִים וְיֵשׁ בָּהּ אֵבֶר אֶחָד אָסוּר. וַהֲרֵי זֶה כַּחֲלֵב טְרֵפָה שֶׁנִּתְעָרֵב בַּחֲלֵב טְהוֹרָה.
יגהַשּׁוֹחֵט בְּהֵמָה מְעֻבֶּרֶת וּמָצָא בָּהּ שְׁלִיל, בֵּין חַי בֵּין מֵת - הֲרֵי זֶה מֻתָּר בַּאֲכִילָה. וְאַפִלּוּ שִׁלְיָא, מֻתֶּרֶת בַּאֲכִילָה.
וְשִׁלְיָא שֶׁיָּצָאת מִקְצָתָהּ, וְשָׁחַט אֶת הַבְּהֵמָה: אִם הָיְתָה שִׁלְיָא זוֹ קְשׁוּרָה בַּוָּלָד, מַה שֶׁיָּצָא מִמֶּנָּה אָסוּר וְהַשְּׁאָר מֻתָּר.
וְאִם לֹא הָיְתָה קְשׁוּרָה בּוֹ, כֻּלָּהּ אֲסוּרָה, שֶׁמָּא שִׁלְיָא זוֹ שֶׁיָצָאת מִקְצָתָהּ הָלַךְ וָלָד שֶׁהָיָה בָּהּ, וּוָלָד זֶה שֶׁנִּמְצָא בַּבֶּטֶן הָלְכָה שִׁלְיָא שֶׁלּוֹ.
וְאֵין צָרִיךְ לוֹמַר שֶׁאִם לֹא נִמְצָא בַּבֶּטֶן וָלָד כְּלָל, שֶׁהַשִּׁלְיָא כֻּלָּהּ אֲסוּרָה.
ידמָצָא בָּהּ עֻבָּר חַי, אַף עַל פִּי שֶׁהוּא בֶּן תִּשְׁעָה חֳדָשִׁים גְּמוּרִים, וְאֶפְשָׁר שֶׁיִּחְיֶה - אֵינוֹ צָרִיךְ שְׁחִיטָה, אֶלָא שְׁחִיטַת אִמּוֹ מְטַהֲרַתּוֹ.
וְאִם הִפְרִיס עַל גַּבֵּי קַרְקַע, צָרִיךְ שְׁחִיטָה.
טוקָרַע אֶת הַבְּהֵמָה, אוֹ שָׁחַט בְּהֵמָה טְרֵפָה, וּמָצָא בָּהּ בֶּן תִּשְׁעָה חַי - צָרִיךְ שְׁחִיטָה לְהַתִּירוֹ, וְאֵין שְׁחִיטַת אִמּוֹ מוֹעֶלֶת לוֹ.
וְאִם לֹא גָמְרוּ לוֹ חֳדָשָׁיו, אַף עַל פִּי שֶׁהוּא חַי בִּמְעֵי הַטְּרֵפָה - הֲרֵי זֶה אָסוּר, מִפְּנֵי שֶׁהוּא כְּאֵבֶר מֵאִמּוֹ.
כָּל עֻבָּר שֶׁהוֹצִיא רֹאשׁוֹ וְהֶחֱזִירוֹ, וְאַחַר כָּךְ שָׁחַט אֶת אִמּוֹ - אֵין שְׁחִיטַת אִמּוֹ מוֹעֶלֶת לוֹ, וַהֲרֵי הוּא כְּיָלוּד, וְצָרִיךְ שְׁחִיטָה.
Ma'achalot Assurot - Chapter 6

אהָאוֹכֵל כַּזַּיִת מִן הַדָּם: בְּמֵזִיד, חַיָּב כָּרֵת; בְּשׁוֹגֵג, מֵבִיא חַטָּאת קְבוּעָה.
וְדָבָר מְפֹרָשׁ בַּתּוֹרָה שֶׁאֵינוֹ חַיָּב אֶלָא עַל דַּם בְּהֵמָה חַיָּה וָעוֹף בִּלְבָד, בֵּין טְמֵאִים בֵּין טְהוֹרִים, שֶׁנֶּאֱמַר "וְכָל דָּם לֹא תֹאכְלוּ בְּכֹל מוֹשְׁבֹתֵיכֶם לָעוֹף וְלַבְּהֵמָה" (ויקרא ז, כו) - וְחַיָּה בִּכְלַל בְּהֵמָה, שֶׁנֶּאֱמַר "זֹאת הַבְּהֵמָה אֲשֶׁר תֹּאכֵלוּ... אַיָּל וּצְבִי וְיַחְמוּר" (דברים יד, ד - ה).
אֲבָל דַּם דָּגִים וַחֲגָבִים וּשְׁקָצִים וּרְמָשִׂים, וְדַם הָאָדָם - אֵין חַיָּבִין עָלָיו מִשּׁוּם דָּם.
לְפִיכָךְ דַּם דָּגִים וַחֲגָבִים טְהוֹרִים, מֻתָּר לְאָכְלוֹ. וְאַפִלּוּ כְּנָסוֹ בִּכְלִי וְשָׁתָהוּ, מֻתָּר.
וְדַם חֲגָבִים וְדָגִים טְמֵאִים, אָסוּר - מִשּׁוּם שֶׁהוּא תַּמְצִית גּוּפָן, כַּחֲלֵב בְּהֵמָה טְמֵאָה.
וְדַם שְׁרָצִים כִּבְשָׂרָן, כְּמוֹ שֶׁבֵּאַרְנוּ.
בדַּם הָאָדָם - אָסוּר מִדִּבְרֵי סוֹפְרִים, אִם פֵּרֵשׁ; וּמַכִּין עָלָיו מַכַּת מַרְדּוּת. אֲבָל דַּם הַשִּׁנַּיִם, בּוֹלְעוֹ וְאֵינוֹ נִמְנָע.
הֲרֵי שֶׁנָּשַׁךְ בַּפַּת, וְיָצָא עָלֶיהָ דָּם - גּוֹרֵד אֶת הַדָּם וְאַחַר כָּךְ אוֹכֵל, שֶׁהֲרֵי פֵּרֵשׁ.
גאֵין חַיָּבִין כָּרֵת אֶלָא עַל דָּם הַיּוֹצֵא בִּשְׁעַת שְׁחִיטָה וּנְחִירָה אוֹ הַתָּזַת הָרֹאשׁ, כָּל זְמַן שֶׁיֵּשׁ בּוֹ אֲדַמְדֻמִּית, וְעַל הַדָּם הַכָּנוּס בְּתוֹךְ הַלֵּב, וְעַל דַּם הַקָּזָה כָּל זְמַן שֶׁהוּא מְקַלֵּחַ וְיוֹצֵא.
אֲבָל הַדָּם הַשּׁוֹתֵת בִּתְחִלַּת הַקָּזָה קֹדֶם שֶׁיַּתְחִיל לְקַלֵּחַ, וְדַם הַשּׁוֹתֵת בְּסוֹף הַקָּזָה כְּשֶׁיַּתְחִיל הַדָּם לִפְסֹק - אֵין חַיָּבִין עָלָיו, וַהֲרֵי הוּא כְּדַם הָאֵבָרִים; שֶׁדַּם הַקִּלּוּחַ הוּא הַדָּם שֶׁהַנֶּפֶשׁ יוֹצְאָה בּוֹ.
דדַּם הַתַּמְצִית וְדַם הָאֵבָרִים - כְּגוֹן דַּם הַטְּחוֹל, וְדַם הַכְּלָיוֹת, וְדַם בֵּיצִים, וְדַם הַמִּתְכַּנֵּס לַלֵּב בִּשְׁעַת שְׁחִיטָה, וְדָם הַנִּמְצָא בַּכָּבֵד - אֵין חַיָּבִין עָלָיו כָּרֵת.
אֲבָל הָאוֹכֵל מִמֶּנּוּ כַּזַּיִת - לוֹקֶה, שֶׁנֶּאֱמַר "וְכָל דָּם לֹא תֹאכֵלוּ" (ויקרא ג, יז; ויקרא ז, כו).
וּבְחִיּוּב כָּרֵת הוּא אוֹמֵר "כִּי נֶפֶשׁ הַבָּשָׂר בַּדָּם הִיא" (ויקרא יז, יא) - אֵינוֹ חַיָּב כָּרֵת אֶלָא עַל הַדָּם שֶׁהַנֶּפֶשׁ יוֹצְאָה בּוֹ.
ההַשְּׁלִיל הַנִּמְצָא בִּמְעֵי הַבְּהֵמָה, הֲרֵי דָּמוֹ כְּדַם הַיִּלּוֹד.
לְפִיכָךְ הַדָּם הַנִּמְצָא כָּנוּס בְּתוֹךְ לִבּוֹ, חַיָּבִין עָלָיו כָּרֵת; אֲבָל שְׁאָר דָּמוֹ, הֲרֵי הוּא כְּדַם הָאֵבָרִים.
והַלֵּב, בֵּין לַצֳּלִי בֵּין לַקְּדֵרָה - קוֹרְעוֹ וּמוֹצִיא אֶת דָּמוֹ, וְאַחַר כָּךְ מוֹלְחוֹ.
וְאִם בִּשֵּׁל הַלֵּב וְלֹא קְרָעוֹ - קוֹרְעוֹ אַחַר שֶׁבִּשְּׁלוֹ, וּמֻתָּר. וְאִם לֹא קְרָעוֹ - אֵין חַיָּבִין עָלָיו כָּרֵת.
בַּמֶה דְבָרִים אַמוּרִים? בְּלֵב הָעוֹף, שֶׁאֵין בּוֹ כְּזַיִת דָּם; אַבָל אִם הָיָה לֵב בְּהֵמָה – חַיָב כָּרֵת; שֶׁהַרֵי יֵשׁ בּוֹ כַּזַּיִת מִדָּם שֶׁבְּתוֹךְ הַלֵּב שֶׁחַיָּבִין עָלָיו כָּרֵת.
זהַכָּבֵד - אִם חֲתָכָהּ וְהִשְׁלִיכָהּ לְתוֹךְ הַחֹמֶץ, אוֹ לְתוֹךְ מַיִם רוֹתְחִין עַד שֶׁתִּתְלַבֵּן - הֲרֵי זוֹ מֻתֶּרֶת לְבַשֵּׁל אוֹתָהּ אַחַר כֵּן.
וּכְבָר נָהֲגוּ כָּל יִשְׂרָאֵל לְהַבְהֲבָהּ עַל הָאוּר, וְאַחַר כָּךְ מְבַשְּׁלִין אוֹתָהּ. בֵּין שֶׁבִּשְּׁלָהּ לְבַדָּהּ, בֵּין שֶׁבִּשְּׁלָהּ עִם בָּשָׂר אַחֵר.
וְכֵן מִנְהָג פָּשׁוּט שֶׁאֵין מְבַשְּׁלִין הַמּוֹחַ שֶׁל רֹאשׁ, וְלֹא קוֹלִין אוֹתוֹ - עַד שֶׁמְּהַבְהֲבִין אוֹתוֹ בָּאוּר.
חהַכָּבֵד שֶׁבִּשְּׁלָהּ, וְלֹא הִבְהֲבָהּ עַל הָאוּר וְלֹא חֲלָטָהּ בְּחֹמֶץ אוֹ בְּרוֹתְחִין - הֲרֵי הַקְּדֵרָה כֻּלָּהּ אֲסוּרָה, הַכָּבֵד וְכָל שֶׁנִּתְבַּשֵּל עִמָּהּ.
וּמֻתָּר לִצְלוֹת כָּבֵד עִם הַבָּשָׂר, בִּשְׁפוּד אֶחָד - וְהוּא שֶׁתִּהְיֶה הַכָּבֵד לְמַטָּה. וְאִם עָבַר וּצְלָאָהּ לְמַעְלָה מִבָּשָׂר, הֲרֵי זֶה אוֹכְלוֹ.
טהַטְּחוֹל - מֻתָּר לְבַשְּׁלוֹ אַפִלּוּ עִם הַבָּשָׂר; שֶׁאֵינוֹ דָּם, אֶלָא בָּשָׂר הַדּוֹמֶה לְדָם. הַשּׁוֹבֵר מַפְרֶקֶת בְּהֵמָה קֹדֶם שֶׁתֵּצֵא נַפְשָׁהּ - הֲרֵי הַדָּם נִבְלַע בָּאֵבָרִים, וְאָסוּר לֶאֱכֹל מִמֶּנָּה בָּשָׂר חַי, וְאַפִלּוּ חֲלָטוֹ.
אֶלָא כֵּיצַד יַעֲשֶׂה? יַחְתֹּךְ הַחֲתִכָּה וְיִמְלֹחַ יָפֶה יָפֶה, וְאַחַר כָּךְ יְבַשֵּׁל אוֹ יִצְלֶה. וּכְבָר בֵּאַרְנוּ שֶׁהַשּׁוֹחֵט בְּהֵמָה חַיָּה וָעוֹף וְלֹא יָצָא מֵהֶן דָּם, שֶׁהֵן מֻתָּרִין.
יאֵין הַבָּשָׂר יוֹצֵא מִידֵי דָּמוֹ אֶלָא אִם כֵּן מוֹלְחוֹ יָפֶה יָפֶה, וּמְדִיחוֹ יָפֶה יָפֶה.
כֵּיצַד עוֹשֶׂה? מֵדִיחַ הַבָּשָׂר תְּחִלָּה, וְאַחַר כָּךְ מוֹלְחוֹ יָפֶה יָפֶה, וּמַנִּיחוֹ בְּמִלְחוֹ כְּדֵי הִלּוּךְ מִיל, וְאַחַר כָּךְ מְדִיחוֹ יָפֶה יָפֶה עַד שֶׁיֵּצְאוּ הַמַּיִם זַכִּים, וּמַשְׁלִיכוֹ מִיָּד לְתוֹךְ מַיִם רוֹתְחִין, אֲבָל לֹא לְפוֹשְׁרִין - כְּדֵי שֶׁיִּתְלַבֵּן מִיָּד, וְלֹא יֵצֵא דָּם.
יאכְּשֶׁמּוֹלְחִין הַבָּשָׂר, אֵין מוֹלְחִין אוֹתוֹ אֶלָא בִּכְלִי מְנֻקָּב. וְאֵין מוֹלְחִין אוֹתוֹ אֶלָא בְּמֶלַח עָבֶה כְּחוֹל הַגַּס, שֶׁהַמֶּלַח הַדַּק כְּקֶמַח יִבָּלַע בַּבָּשָׂר וְלֹא יוֹצִיא דָּם.
וְצָרִיךְ לְנַפֵּץ הַבָּשָׂר מִן הַמֶּלַח, וְאַחַר כָּךְ יְדִיחֶנּוּ.
יבכָּל הַדְּבָרִים הָאֵלּוּ, לְבָשָׂר שֶׁצָּרִיךְ לְבַשְּׁלוֹ. אֲבָל לַצֳּלִי, מוֹלֵחַ וְצוֹלֶה מִיָּד. וְהָרוֹצֶה לֶאֱכֹל בָּשָׂר חַי - מוֹלְחוֹ יָפֶה יָפֶה וּמְדִיחוֹ יָפֶה יָפֶה, וְאַחַר כָּךְ יֹאכַל. וְאִם חֲלָטוֹ בְּחֹמֶץ, מֻתָּר לְאָכְלוֹ כְּשֶׁהוּא חַי, וּמֻתָּר לִשְׁתּוֹת הַחֹמֶץ שֶׁחֲלָטוֹ בּוֹ, שֶׁאֵין הַחֹמֶץ מוֹצִיא דָּם.
יגחֹמֶץ שֶׁחָלַט בּוֹ בָּשָׂר, לֹא יַחְלֹט בּוֹ פַּעַם שְׁנִיָּה. וַחֲתִכָּה שֶׁהֶאְדִּימָה בְּתוֹךְ הַחֹמֶץ - הִיא וְהַחֹמֶץ אֲסוּרִין, עַד שֶׁיִּמְלֹחַ אוֹתָהּ יָפֶה יָפֶה וְיִצְלֶה.
בָּשָׂר שֶׁהֶאְדִּים, וְכֵן בֵּיצֵי בְּהֵמָה וְחַיָּה בַּקְּלָף שֶׁעֲלֵיהֶן, וְכֵן הָעֹרֶף שֶׁבּוֹ הַמִּזְרָקִים שֶׁהֵן מְלֵאִים דָּם - אִם חֲתָכָן וּמְלָחָן כַּדָּת, מֻתָּר לְבַשְּׁלָן. וְאִם לֹא חֲתָכָן וּצְלָאָן בִּשְׁפוּד, וְצָלָה הָעֹרֶף וּפִיו לְמַטָּה, אוֹ שֶׁצְּלָאָן כֻּלָּן עַל הַגֶּחָלִים - הֲרֵי אֵלּוּ מֻתָּרִין.
ידרֹאשׁ הַבְּהֵמָה שֶׁצָּלָהוּ בַּתַּנּוּר אוֹ בַּכִּבְשָׁן - אִם תָּלָהוּ וּבֵית שְׁחִיטָתוֹ לְמַטָּה, מֻתָּר; שֶׁהַדָּם יוֹצֵא וְשׁוֹתֵת.
וְאִם הָיָה בֵּית הַשְּׁחִיטָה מִן הַצַּד: מוֹחוֹ אָסוּר - שֶׁהַדָּם מִתְקַבֵּץ לְתוֹכוֹ; וּשְׁאָר הַבָּשָׂר שֶׁעַל הָעֲצָמוֹת מִבַּחוּץ, מֻתָּר.
הִנִּיחַ חֻטְמוֹ לְמַטָּה - אִם הִנִּיחַ בּוֹ גֳּמִי אוֹ קָנֶה כְּדֵי שֶׁיִּשָּׁאֵר פָּתוּחַ וְיֵצֵא דָּמוֹ דֶּרֶךְ חָטְמוֹ, מֻתָּר. וְאִם לָאו, מוֹחוֹ אָסוּר.
טואֵין מַנִּיחִין כְּלִי תַּחַת הַצֳּלִי לְקַבֵּל מֵימָיו, עַד שֶׁתִּכְלֶה כָּל מַרְאֶה אֲדַמְדֻמִּית שֶׁבּוֹ.
וְכֵיצַד עוֹשִׂין? מַשְׁלִיכִין לְתוֹךְ הַכְּלִי מְעַט מֶלַח, וּמַנִּיחַ הַכְּלִי עַד שֶׁיֵּצָלֶה, וְלוֹקֵחַ הַשַּׁמְנוּנִית שֶׁלְּמַעְלָה, וְהַמַּיִם שֶׁלְּמַטָּה שֶׁתַּחַת הַשַּׁמְנוּנִית אֲסוּרָה.
טזפַּת שֶׁחָתַךְ עָלֶיהָ בְּשַׂר צֳלִי, מֻתָּר לְאָכְלָהּ.
דָּגִים וְעוֹפוֹת שֶׁמְּלָחָן זֶה עִם זֶה - אַפִלּוּ בִּכְלִי מְנֻקָּב, הַדָּגִים אֲסוּרִין; שֶׁהַדָּג רָפֶה, וּבוֹלֵעַ דָּם הַיּוֹצֵא מִן הָעוֹף. וְאֵין צָרִיךְ לוֹמַר, אִם מָלַח דָּג עִם בָּשָׂר בְּהֵמָה אוֹ חַיָּה.
יזעוֹפוֹת שֶׁהִנִּיחָן שְׁלֵמִים, וּמִלָּא חֲלָלָן בָּשָׂר וּבֵיצִים, וּבִשְּׁלָן - אֲסוּרוֹת; שֶׁהַדָּם יוֹצֵא לְתוֹכָן. וְאַף עַל פִּי שֶׁמְּלָחָן יָפֶה יָפֶה, וְאַפִלּוּ הָיָה הַבָּשָׂר שֶׁבְּתוֹכָן שָׁלוּק אוֹ צֳלִי.
וְאִם צְלָאָן, הֲרֵי אֵלּוּ מֻתָּרוֹת, אַף עַל פִּי שֶׁהַבָּשָׂר שֶׁבְּתוֹכָן חַי, וְאַפִלּוּ פִּיהֶן לְמַעְלָה.
יחבְּנֵי מֵעַיִם שֶׁמִּלְּאָן עַל דֶּרֶךְ זוֹ בְּבָשָׂר צֳלִי אוֹ שָׁלוּק, אוֹ שֶׁמִּלְּאָן בְּבֵיצִים, וּשְׁלָקָן אוֹ קְלָיָן - הֲרֵי אֵלּוּ מֻתָּרִין, שֶׁאֵין מַחְזִיקִין דָּם בִּבְנֵי מֵעַיִם. וְכֵן הוֹרוּ הַגְּאוֹנִים.
יטעוֹפוֹת שֶׁטְּפָלָן בְּבָצֵק וּצְלָאָן, בֵּין שְׁלֵמִים בֵּין מְחֻתָּכִין: אִם טְפָלָן בְּסֹלֶת גַּסָּה, אַפִלּוּ הִסְמִיקָה הַטְּפֵלָה - אוֹכֵל אֶת הַטְּפֵלָה; מִפְּנֵי שֶׁהִיא סֹלֶת גַּסָּה, מִתְפָּרֶרֶת וְיוֹצֵא הַדָּם. וְאִם טְפָלָן בְּקֶמַח חִטִּים שֶׁלְּתָתָן: אִם הָיְתָה הַטְּפֵלָה לְבָנָה כְּמוֹ הַכֶּסֶף, מֻתָּר לֶאֱכֹל מִמֶּנָּה; וְאִם לָאו, אֲסוּרָה. טְפָלָן בִּשְׁאָר קְמָחִין: אִם הֶאְדִּימוּ, אֲסוּרִין; וְאִם לֹא הֶאְדִּימוּ, מֻתָּרִין.
כסַכִּין שֶׁשָּׁחַט בָּהּ, אָסוּר לֶאֱכֹל בָּהּ רוֹתֵחַ, עַד שֶׁיְּלַבֵּן הַסַּכִּין, אוֹ יַשְׁחִיזֶנָּה כֻּלָּהּ בְּמַשְׁחֶזֶת, אוֹ יִנְעֲצֶנָּה בְּקַרְקַע קָשָׁה עֲשָׂרָה פְּעָמִים. וְאִם חָתַךְ בָּהּ רוֹתֵחַ, מֻתָּר. וְכֵן אֵינוֹ חוֹתֵךְ בָּהּ צְנוֹן וְכַיּוֹצֵא בּוֹ מִדְּבָרִים הַחֲרִיפִים לְכַתְּחִלָּה. וְאִם הֵדִיחַ הַסַּכִּין, אוֹ קִנְּחָהּ בִּכְלִי - מֻתָּר לַחְתֹּךְ בָּהּ צְנוֹן וְכַיּוֹצֵא בּוֹ, אֲבָל לֹא רוֹתֵחַ.
כאקְעָרָה שֶׁמָּלַח בָּהּ בָּשָׂר, אַפִלּוּ הָיְתָה שׁוּעָה בַּאֲבָר - אָסוּר לֶאֱכֹל בָּהּ רוֹתֵחַ לְעוֹלָם, שֶׁכְּבָר נִבְלַע הַדָּם בַּחֲרָסֶיהָ.
Ma'achalot Assurot - Chapter 7

אהָאוֹכֵל כַּזַּיִת חֵלֶב: בְּמֵזִיד, חַיָּב כָּרֵת; בְּשׁוֹגֵג, מֵבִיא חַטָּאת קְבוּעָה. וּבְפֵרוּשׁ בַּתּוֹרָה שֶׁאֵינוֹ חַיָּב אֶלָא עַל שְׁלוֹשָׁה מִינֵי בְּהֵמָה טְהוֹרָה בִּלְבָד, שֶׁנֶּאֱמַר "כָּל חֵלֶב שׁוֹר וְכֶשֶׂב וָעֵז לֹא תֹאכֵלוּ" (ויקרא ז, כג). בֵּין שֶׁאָכַל מֵחֵלֶב שְׁחוּטָה, בֵּין שֶׁאָכַל מֵחֵלֶב נְבֵלָה וּטְרֵפָה שֶׁלָּהֶן. אֲבָל שְׁאָר בְּהֵמָה וְחַיָּה, בֵּין טְמֵאָה בֵּין טְהוֹרָה - חֶלְבָּהּ כִּבְשָׂרָהּ
וְכֵן נֵפֶל שֶׁל שְׁלוֹשָׁה מִינֵי בְּהֵמָה טְהוֹרָה, חֶלְבּוֹ כִּבְשָׂרוֹ; וְהָאוֹכֵל מֵחֶלְבּוֹ כַּזַּיִת, לוֹקֶה מִשּׁוּם אוֹכֵל נְבֵלָה.
בהָאוֹכֵל מֵחֵלֶב נְבֵלָה וּטְרֵפָה - חַיָּב מִשּׁוּם אוֹכֵל חֵלֶב, וּמִשּׁוּם אוֹכֶל נְבֵלָה וּטְרֵפָה. מִתּוֹךְ שֶׁנּוֹסַף הָאִסּוּר בִּבְשָׂרָהּ שֶׁהָיָה מֻתָּר, נוֹסַף עַל הַחֵלֶב, וּלְפִיכָךְ לוֹקֶה שְׁתַּיִם.
גהַשּׁוֹחֵט בְּהֵמָה וּמָצָא בָּהּ שְׁלִיל - כָּל חֶלְבּוֹ מֻתָּר, וְאַפִלּוּ מְצָאוֹ חַי; מִפְּנֵי שֶׁהוּא כְּאֵבֶר מִמֶּנָּה. וְאִם שָׁלְמוּ לוֹ חֳדָשָׁיו, וּמְצָאוֹ חַי - אַף עַל פִּי שֶׁלֹּא הִפְרִיס עַל הַקַּרְקַע, וְאֵינוֹ צָרִיךְ שְׁחִיטָה - חֶלְבּוֹ אָסוּר, וְחַיָּבִין עָלָיו כָּרֵת. וּמוֹצִיאִין מִמֶּנּוּ כָּל הַחוּטִין וְהַקְּרוֹמוֹת הָאֲסוּרִין, כִּשְׁאָר הַבְּהֵמוֹת.
דהוֹשִׁיט יָדוֹ לִמְעֵי הַבְּהֵמָה, וְחָתַךְ מֵחֵלֶב הָעֻבָּר שֶׁכָּלוּ לוֹ חֳדָשָׁיו, וְהוֹצִיאוֹ - הֲרֵי זֶה חַיָּב עָלָיו כְּאִלּוּ חֲתָכוֹ מֵחֵלֶב הָאֵם עַצְמָהּ, שֶׁהֶחֳדָשִׁים הֵן הַגּוֹרְמִין לְאִסּוּר הַחֵלֶב.
השְׁלוֹשָׁה חֲלָבִים הֵן, שֶׁחַיָּבִין עֲלֵיהֶן כָּרֵת: חֵלֶב שֶׁעַל הַקֶּרֶב, וְשֶׁעַל שְׁתֵּי הַכְּלָיוֹת, וְשֶׁעַל הַכְּסָלִים. אֲבָל הָאַלְיָה, מֻתֶּרֶת בַּאֲכִילָה.
לֹא נִקְרֵאת חֵלֶב אֶלָא לְעִנְיַן קָרְבָּן בִּלְבָד, כְּמוֹ שֶׁנִּקְרְאוּ חֲלָבִים כְּלָיוֹת וְיוֹתֶרֶת הַכָּבֵד לְעִנְיַן קָרְבָּן. כְּמוֹ שָׁאַתָּה אוֹמֵר "חֵלֶב הָאָרֶץ" (בראשית מה, יח), וְ"חֵלֶב כִּלְיוֹת חִטָּה" (דברים לב, יד) - שֶׁהוּא טוּבָם. וּלְפִי שֶׁמְּרִימִין דְּבָרִים אֵלּוּ מִן הַקָּרְבָּן לִשְׂרֵפָה לַה', נִקְרְאוּ 'חֵלֶב', שֶׁאֵין שָׁם דָּבָר טוֹב אֶלָא הַמּוּרָם לַה'. וּלְכָּךְ נֶאֱמַר בִּתְרוּמַת מַעֲשֵׂר "בַּהֲרִימְכֶם אֶת חֶלְבּוֹ מִמֶּנּוּ" (במדבר יח, ל; במדבר יח, לב).
וחֵלֶב שֶׁעַל הַמֶּסֶס, וְשֶׁעַל בֵּית הַכּוֹסוֹת - הוּא הַחֵלֶב שֶׁעַל הַקֶּרֶב. וְחֵלֶב שֶׁבְּעִיקָרֵי הַיְּרֵכוֹת מִבִּפְנִים - חַיָּבִין עָלָיו כָּרֵת, וְהוּא הַחֵלֶב שֶׁעַל הַכְּסָלִים. וְיֵשׁ שָׁם חֵלֶב עַל הַקֵּבָה עָקוּם כְּמוֹ קֶשֶׁת, וְהוּא הָאָסוּר. וְחוּט מָשׁוּךְ כְּמוֹ יֶתֶר, וְהוּא מֻתָּר. חוּטִין שֶׁבַּחֵלֶב אֲסוּרִין, וְאֵין חַיָּבִין עֲלֵיהֶן כָּרֵת.
זחֵלֶב שֶׁהַבָּשָׂר חוֹפֶה אוֹתוֹ - מֻתָּר, שֶׁעַל הַכְּסָלִים אָסַר הַכָּתוּב, לֹא שֶׁבְּתוֹךְ הַכְּסָלִים.
וְכֵן חֵלֶב שֶׁעַל הַכְּלָיוֹת נֶאֱסַר, לֹא שֶׁבְּתוֹךְ הַכְּלָיוֹת. וְאַף עַל פִּי כֵן נוֹטֵל אָדָם לֹבֶן שֶׁבְּתוֹךְ הַכֻּלְיָא וְאַחַר כָּךְ אוֹכֵל אוֹתָהּ, וְאֵינוֹ צָרִיךְ לְחַטֵּט אַחֲרָיו.
חיֵשׁ כְּמוֹ שְׁתֵּי פְּתִילוֹת שֶׁל חֵלֶב בְּעִיקָרֵי הַמָּתְנַיִם, סָמוּךְ לְרֹאשׁ הַיָּרֵךְ. כְּשֶׁהַבְּהֵמָה חַיָה - חֵלֶב זֶה נִרְאֶה בַּמֵּעַיִם, וּכְשֶׁתָּמוּת - יִדְבַּק הַבָּשָׂר בַּבָּשָׂר וְיִתְכַּסֶּה חֵלֶב זֶה וְאֵינוֹ נִרְאֶה עַד שֶׁיִּתְפָּרֵק הַבָּשָׂר מִן הַבָּשָׂר. וְאַף עַל פִּי כֵן הֲרֵי זֶה אָסוּר, שֶׁאֵין זֶה חֵלֶב שֶׁהַבָּשָׂר חוֹפֶה אוֹתוֹ.
וְכָל מָקוֹם שֶׁתִּמְצָא בּוֹ הַחֵלֶב תַּחַת הַבָּשָׂר, וְהַבָּשָׂר מַקִּיף אוֹתוֹ מִכָּל סְבִיבָיו וְלֹא יֵרָאֶה עַד שֶׁיִּקָּרַע הַבָּשָׂר - הֲרֵי זֶה מֻתָּר.
טחֵלֶב הַלֵּב, וְחֵלֶב הַמֵּעַיִם וְהֵן הַדַּקִּין הַמְּלֻפָּפִין - כֻּלָּן מֻתָּרִין, וַהֲרֵי הֵן כַּשּׁוּמָן שֶׁהוּא מֻתָּר. חוּץ מֵרֹאשׁ הַמְּעִי הַסָּמוּךְ לַקֵּבָה, שֶׁהִיא תְּחִלַּת בְּנֵי מֵעַיִם - שֶׁצָּרִיךְ לִגְרֹד הַחֵלֶב שֶׁעָלָיו, וְזֶה הוּא חֵלֶב שֶׁעַל הַדַּקִּין שֶׁאָסוּר. וְיֵשׁ מִן הַגְּאוֹנִים שֶׁיֹּאמַר שֶׁרֹאשׁ הַמְּעִי הַזֶּה שֶׁצָּרִיךְ לְגָרְדוֹ, הוּא הַמְּעִי שֶׁיֵּצֵא בּוֹ הָרְאִי שֶׁהוּא סוֹף הַמֵּעַיִם.
ייֵשׁ בְּגוּף הַבְּהֵמָה חוּטִין וּקְרוֹמוֹת שֶׁהֵן אֲסוּרִין - מֵהֶן מִשּׁוּם חֵלֶב, וּמֵהֶן מִשּׁוּם דָּם. וְכָל חוּט אוֹ קְרוֹם שֶׁהוּא אָסוּר מִשּׁוּם "כָּל דָּם לֹא תֹאכֵלוּ" (ויקרא ג, יז; ויקרא ז, כו) - צָרִיךְ לְנָטְלוֹ, וְאַחַר כָּךְ יִמְלֹחַ וִיבַשֵּׁל הַבָּשָׂר כְּמוֹ שֶׁאָמַרְנוּ.
וְאִם חֲתָכוֹ וּמְלָחוֹ, אֵינוֹ צָרִיךְ לְנָטְלוֹ. וְאִם לַצֳּלִי הוּא, אֵינוֹ צָרִיךְ לְנָטְלוֹ.
וְכָל חוּט אוֹ קְרוֹם שֶׁהוּא אָסוּר מִשּׁוּם "כָּל חֵלֶב" (ויקרא ג, יז; ויקרא ז, כג) - בֵּין לַצֳּלִי בֵּין לְבִשּׁוּל, צָרִיךְ לְנָטְלוֹ מִן הַבְּהֵמָה.
יאחֲמִשָּׁה חוּטִין יֵשׁ בַּכְּסָלִים: שְׁלוֹשָׁה מִן הַיָּמִין וּשְׁנַיִם מִן הַשְּׂמֹאל. הַשְּׁלוֹשָׁה שֶׁמִּן הַיָּמִין, מִתְפַּצֵּל כָּל אֶחָד מֵהֶם לִשְׁנַיִם שְׁנַיִם. וְהַשְּׁנַיִם שֶׁמִּן הַשְּׂמֹאל, מִתְפַּצְּלִין לִשְׁלוֹשָׁה שְׁלוֹשָׁה. וְכֻלָּן, מִשּׁוּם חֵלֶב.
וְחוּטֵי הַטְּחוֹל וְחוּטֵי הַכְּלָיוֹת, מִשּׁוּם חֵלֶב. וְכֵן קְרוֹם שֶׁעַל הַטְּחוֹל, וּקְרוֹם שֶׁעַל הַכְּסָלִים, וּקְרוֹם שֶׁעַל הַכְּלָיוֹת - אֲסוּרִין מִשּׁוּם חֵלֶב. וּקְרוֹם שֶׁעַל דַּד הַטְּחוֹל, חַיָּבִין עָלָיו כָּרֵת. וּשְׁאָר הַקְּרוֹם אָסוּר, וְאֵין חַיָּבִין עָלָיו.
יבוּשְׁנֵי קְרוֹמוֹת יֵשׁ לַכֻּלְיָא - הָעֶלְיוֹן, חַיָּבִין עָלָיו כָּרֵת כַּחֵלֶב שֶׁעַל הַכֻּלְיָא; וְהַתַּחְתּוֹן, הֲרֵי הוּא כִּשְׁאָר קְרוֹמוֹת וְחוּטִין שֶׁהֵן אֲסוּרִין וְאֵין בָּהֶן כָּרֵת.
יגחוּטֵי הַלֵּב, וְחוּטֵי הַיָּד, וְחוּטֵי הָעֹקֶץ, וְחוּטֵי הַלֶּחִי הַתַּחְתּוֹן שֶׁבְּצַד הַלָּשׁוֹן מִכָּאן וּמִכָּאן, וְכֵן הַחוּטִין הַדַּקִּין שֶׁהֵן בְּתוֹךְ חֵלֶב הַדַּקִּין כְּמוֹ בֵּית עַכָּבִישׁ מְסֻבָּכִין זֶה בְּזֶה, וּקְרוֹם שֶׁעַל הַמּוֹחַ שֶׁבַּקָּדְקֹד, וּקְרוֹם שֶׁעַל הַבֵּיצִים - הַכֹּל אֲסוּרִין מִשּׁוּם דָּם.
ידבֵּיצֵי גְּדִי אוֹ טָלֶה שֶׁלֹּא הִשְׁלִים שְׁלוֹשִׁים יוֹם, מֻתָּר לְבַשְּׁלָן בְּלֹא קְלִיפָה. לְאַחַר שְׁלוֹשִׁים יוֹם - אִם נִרְאוּ בָּהֶן חוּטִין דַּקִּין אֲדֻמִּין - בַּיָּדוּעַ שֶׁהָלַךְ בָּהֶן הַדָּם, וְלֹא יְבַשֵּׁל עַד שֶׁיִּקְלֹף, אוֹ עַד שֶׁיַּחְתֹּךְ וְיִמְלֹחַ, כְּמוֹ שֶׁבֵּאַרְנוּ; וְאִם עֲדַיִן לֹא נִרְאוּ בָּהֶן הַחוּטִין הָאֲדֻמִּין, מֻתָּרִין.
טווְכָל בְּנֵי מֵעַיִם שֶׁהַמַּאֲכָל סוֹבֵב בַּחֲלָלָן, אֵין מַחְזִיקִין בָּהֶן דָּם.
טזיֵרָאֶה לִי שֶׁכָּל אֵלּוּ הַחוּטִין וְהַקְּרוֹמוֹת, אִסּוּרָן מִדִּבְרֵי סוֹפְרִים. וְאִם תֹּאמַר שֶׁהֵן אֲסוּרִין מִן הַתּוֹרָה, בִּכְלַל "כָּל חֵלֶב" (ויקרא ג, יז; ויקרא ז, כג) "וְכָל דָּם" (ויקרא ג, יז; ויקרא ז, כו) - אֵין לוֹקִין עֲלֵיהֶן אֶלָא מַכַּת מַרְדּוּת. וְיִהְיוּ כַּחֲצִי שִׁעוּר, שֶׁהוּא אָסוּר מִן הַתּוֹרָה וְאֵין לוֹקִין עָלָיו.
יזאֵין מוֹלְחִין חֲלָבִים עִם הַבָּשָׂר, וְלֹא מְדִיחִין חֲלָבִים עִם הַבָּשָׂר. וְסַכִּין שֶׁחָתַךְ בָּהּ חֲלָבִים, לֹא יַחְתֹּךְ בָּהּ בָּשָׂר. וּכְלִי שֶׁהֵדִיחַ בּוֹ חֲלָבִים, לֹא יָדִיחַ בּוֹ בָּשָׂר. לְפִיכָךְ צָרִיךְ הַטַּבָּח לְהַתְקִין לוֹ שָׁלוֹשׁ סַכִּינִין - אַחַת שֶׁשּׁוֹחֵט בָּהּ, וְאַחַת שֶׁמְּחַתֵּךְ בָּהּ בָּשָׂר, וְאַחַת שֶׁמְּחַתֵּךְ בָּהּ חֲלָבִים.
יחוְאִם דֶּרֶךְ אוֹתוֹ מָקוֹם שֶׁיָּדִיחַ הַטַּבָּח הַבָּשָׂר בְּחָנוּת - צָרִיךְ לְהַתְקִין שְׁנֵי כֵּלִים שֶׁל מַיִם, אֶחָד שֶׁמֵּדִיחַ בּוֹ בָּשָׂר וְאֶחָד שֶׁמֵּדִיחַ בּוֹ חֲלָבִים.
יטוְאָסוּר לַטַּבָּח לִפְרֹס חֵלֶב הַכְּסָלִים עַל הַבָּשָׂר, כְּדֵי לְנָאוֹתוֹ; שֶׁהַקְּרוֹם שֶׁעַל הַחֵלֶב דַּק, וְיִתְמַעֵךְ בְּיַד הַטַּבָּח וְיָזוּב הַחֵלֶב וְיִבָּלַע בַּבָּשָׂר. וְכָל הַדְּבָרִים הָאֵלּוּ אָסוּר לַעֲשׂוֹתָן, וְאִם נַעֲשׂוּ - לֹא נֶאֱסַר הַבָּשָׂר. וְאֵין מַכִּין אֶת הָעוֹשֶׂה, אֶלָא מְלַמְּדִין אוֹתוֹ שֶׁלֹּא יַעֲשֶׂה.
כוְכֵן אֵין מוֹלְחִין אֶת הַבָּשָׂר קֹדֶם שֶׁיָּסִיר מִמֶּנּוּ הַקְּרוֹמוֹת וְהַחוּטִין הָאֲסוּרִין. וְאִם מָלַח, מְסִירָן אַחַר שֶׁנִּמְלְחוּ. וְאַפִלּוּ הָיָה בָּהֶן גִּיד הַנָּשֶׁה - מְסִירוֹ אַחַר שֶׁנִּמְלַח, וּמְבַשֵּׁל.
כאוְטַבָּח שֶׁדַּרְכּוֹ לְנַקּוֹת הַבָּשָׂר, וְנִמְצָא אַחֲרָיו חוּט אוֹ קְרוֹם - מְלַמְּדִין אוֹתוֹ, וּמַזְהִירִין אוֹתוֹ שֶׁלֹּא יְזַלְזֵל בָּאִסּוּרִין.
אֲבָל אִם נִמְצָא אַחֲרָיו חֵלֶב - אִם הָיָה כַּשְּׂעוֹרָה, מַעֲבִירִין אוֹתוֹ; וְאִם נִמְצָא אַחֲרָיו כַּזַּיִת חֵלֶב, אַפִלּוּ בִּמְקוֹמוֹת הַרְבֵּה - מַכִּין אוֹתוֹ מַכַּת מַרְדּוּת, וּמַעֲבִירִין אוֹתוֹ. מִפְּנֵי שֶׁהַטַּבָּח נֶאֱמָן עַל הַחֵלֶב.

`
            }];

            // Add initial bot message
            addMessage("Hello. I'm a Rambam chatbot. How can I help you?", 'bot');
        });

        // Add scroll event listener
        chatMessages.addEventListener('scroll', function() {
            // Clear any existing timeouts
            if (scrollTimeout) {
                clearTimeout(scrollTimeout);
            }
            if (pauseScrollTimeout) {
                clearTimeout(pauseScrollTimeout);
            }

            // If user scrolls up significantly (more than 10px from bottom)
            if (chatMessages.scrollTop + chatMessages.clientHeight < chatMessages.scrollHeight - 8) {
                // Add a small delay before pausing auto-scroll to prevent accidental pauses
                pauseScrollTimeout = setTimeout(() => {
                    autoScrollEnabled = false;
                    isUserScrolling = true;
                }, 30);
            } else {
                // If we're near the bottom, immediately enable auto-scroll
                autoScrollEnabled = true;
                isUserScrolling = false;
            }
        });

        // Add event listener for Enter key with shift+enter support
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (e.shiftKey) {
                    // Allow default behavior (new line)
                    return;
                } else {
                    e.preventDefault();
                    sendMessage();
                }
            }
        });

        // Auto-resize textarea and handle scrollbar
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
           
            // Check if we have more than 6 lines (approximately)
            const lineHeight = parseInt(window.getComputedStyle(this).lineHeight);
            const lines = this.scrollHeight / lineHeight;
           
            if (lines >= 6) {
                this.classList.add('long-text');
            } else {
                this.classList.remove('long-text');
            }
        });

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        async function sendMessage() {
            // Ensure API key is available before sending
            if (!config || !config.API_KEY) {
                addMessage("⚠️ Cannot send message. Please configure your API key in config.js.", 'bot');
                return;
            }

            // Prevent sending new message while processing
            if (isProcessingMessage) return;

            const message = userInput.value.trim();
            if (!message) return;

            // Set processing flag
            isProcessingMessage = true;

            // Only disable the send button, keep input enabled
            sendButton.disabled = true;

            // Add user message to chat and conversation history
            addMessage(message, 'user');
            messages.push({ role: "user", content: message });
            userInput.value = '';

            // Keep focus on input
            userInput.focus();

            // Show typing indicator
            typingIndicator.style.display = 'block';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                console.log('Sending request to OpenAI API...');
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${config.API_KEY}`
                    },
                    body: JSON.stringify({
                        model: config.MODEL || 'gpt-3.5-turbo',
                        messages: messages,
                        temperature: 0.7,
                        max_tokens: 3000
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('API Error:', errorData);
                    throw new Error(`API request failed with status ${response.status}: ${errorData.error?.message || 'Unknown error'}`);
                }

                const data = await response.json();
                console.log('Received API response:', data);

                if (!data.choices || data.choices.length === 0 || !data.choices[0].message) {
                    console.error('Invalid API response structure:', data);
                    throw new Error('Received an invalid response structure from the API.');
                }

                const botResponse = data.choices[0].message.content;
                console.log('Bot response length:', botResponse.length);

                // Add bot response to conversation history
                messages.push({ role: "assistant", content: botResponse });

                // Hide typing indicator
                typingIndicator.style.display = 'none';

                // Show the message with typing animation
                await typeMessage(botResponse, 'bot');

            } catch (error) {
                console.error('Error sending message:', error);
                typingIndicator.style.display = 'none';
                addMessage(`I'm sorry, there was an error processing your request: ${error.message}. Please check the console or try again later.`, 'bot');
            } finally {
                // Re-enable send button and reset processing flag
                sendButton.disabled = false;
                isProcessingMessage = false;
                // Keep focus on input
                userInput.focus();
            }
        }

        async function typeMessage(text, sender) {
            // Always enable auto-scroll at the start of a new message
            autoScrollEnabled = true;
           
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            messageDiv.appendChild(contentDiv);

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = getCurrentTime();
            messageDiv.appendChild(timeDiv);

            chatMessages.appendChild(messageDiv);
           
            // Always scroll to bottom when starting a new message
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Process formatting for bot messages
            if (sender === 'bot') {
                // Convert markdown-like syntax to HTML and allow safe HTML content
                text = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
                    .replace(/\*(.*?)\*/g, '<em>$1</em>') // Italic
                    .replace(/\_\_(.*?)\_\_/g, '<u>$1</u>') // Underline
                    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>') // Links
                    .replace(/\#\#\# (.*?)\n/g, '<h3>$1</h3>') // H3
                    .replace(/\#\# (.*?)\n/g, '<h2>$1</h2>') // H2
                    .replace(/\# (.*?)\n/g, '<h1>$1</h1>'); // H1
               
                // Sanitize HTML content to prevent XSS while allowing images
                const sanitizedText = DOMPurify.sanitize(text, {
                    ALLOWED_TAGS: ['strong', 'em', 'u', 'a', 'h1', 'h2', 'h3', 'img'],
                    ALLOWED_ATTR: ['href', 'target', 'src', 'alt']
                });
               
                contentDiv.innerHTML = sanitizedText;
            }

            let currentIndex = 0;
            const typingSpeed = 5; // 5ms typing speed
           
            function typeNextCharacter() {
                if (currentIndex < text.length) {
                    try {
                        // Use innerHTML for bot messages to process HTML tags
                        if (sender === 'bot') {
                            contentDiv.innerHTML = text.substring(0, currentIndex + 1);
                        } else {
                            contentDiv.textContent = text.substring(0, currentIndex + 1);
                        }
                       
                        // Only auto-scroll if enabled
                        if (autoScrollEnabled) {
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                        }
                       
                        currentIndex++;
                        setTimeout(typeNextCharacter, typingSpeed);
                    } catch (error) {
                        console.error('Error during typing:', error);
                        contentDiv.innerHTML = text;
                    }
                } else {
                    // Re-enable input and button after typing animation is complete
                    userInput.disabled = false;
                    sendButton.disabled = false;
                }
            }

            try {
                typeNextCharacter();
            } catch (error) {
                console.error('Error starting typing:', error);
                contentDiv.innerHTML = text;
                // Re-enable input and button on error
                userInput.disabled = false;
                sendButton.disabled = false;
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
           
            // Process formatting for bot messages
            if (sender === 'bot') {
                // Convert markdown-like syntax to HTML and allow safe HTML content
                text = text
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
                    .replace(/\*(.*?)\*/g, '<em>$1</em>') // Italic
                    .replace(/\_\_(.*?)\_\_/g, '<u>$1</u>') // Underline
                    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>') // Links
                    .replace(/\#\#\# (.*?)\n/g, '<h3>$1</h3>') // H3
                    .replace(/\#\# (.*?)\n/g, '<h2>$1</h2>') // H2
                    .replace(/\# (.*?)\n/g, '<h1>$1</h1>'); // H1
               
                // Sanitize HTML content to prevent XSS while allowing images
                const sanitizedText = DOMPurify.sanitize(text, {
                    ALLOWED_TAGS: ['strong', 'em', 'u', 'a', 'h1', 'h2', 'h3', 'img'],
                    ALLOWED_ATTR: ['href', 'target', 'src', 'alt']
                });
               
                contentDiv.innerHTML = sanitizedText;
            } else {
                contentDiv.textContent = text;
            }
           
            messageDiv.appendChild(contentDiv);

            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = getCurrentTime();
            messageDiv.appendChild(timeDiv);

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
