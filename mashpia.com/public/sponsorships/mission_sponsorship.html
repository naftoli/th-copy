<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database CRUD Operations</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 95vw;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .content {
            padding: 30px;
            overflow-x: auto;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 200px;
        }

        .form-group label {
            font-weight: 600;
            color: #374151;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f9fafb;
            height: 48px;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #4f46e5;
            background: white;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            height: 48px;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 158, 11, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
            color: white;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(107, 114, 128, 0.3);
        }

        .table-container {
            background: white;
            border-radius: 15px;
            overflow: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e5e7eb;
            max-width: 100%;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        .table th {
            background: #f8fafc;
            padding: 16px 12px;
            text-align: left;
            font-weight: 600;
            color: #374151;
            border-bottom: 2px solid #e5e7eb;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            min-width: 120px;
        }

        .table td {
            padding: 16px 12px;
            border-bottom: 1px solid #f3f4f6;
            color: #374151;
            white-space: nowrap;
            min-width: 120px;
        }

        .table td:last-child {
            white-space: nowrap;
            min-width: 100px;
        }

        .table tr:hover {
            background: #f9fafb;
        }

        .table tr:last-child td {
            border-bottom: none;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f3f4f6;
        }

        .modal-header h2 {
            color: #374151;
            font-size: 1.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6b7280;
            padding: 5px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #f3f4f6;
            color: #374151;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: #374151;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .table-container {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DatabaseCRUD = () => {
            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(false);
            const [showModal, setShowModal] = useState(false);
            const [modalMode, setModalMode] = useState('create'); // 'create' or 'edit'
            const [currentRecord, setCurrentRecord] = useState({});
            const [alert, setAlert] = useState(null);
            const [columns, setColumns] = useState([]);
            const [schema, setSchema] = useState([]);
            const [parshos, setParshos] = useState([]);
            const [imageChanges, setImageChanges] = useState({});

            useEffect(() => {
                loadTableData('sponsorships');
                loadParshos();
            }, []);

            const loadParshos = async () => {
                try {
                    const response = await fetch(`ajax/getTableInfo.php`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ table: 'parshos' }),
                    });
                    const result = await response.json();
                    const parshosData = result.parshos || result.data || result || [];
                    setParshos(parshosData);
                } catch (error) {
                    console.error('Error loading parshos:', error);
                }
            };

            const loadTableData = async (tableName) => {
                setLoading(true);
                try {
                    // API call to get table info
                    const response = await fetch(`ajax/getTableInfo.php`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ table: tableName }),
                    });
                    const result = await response.json();
                    
                    // Expecting result to have both data and schema
                    const tableData = result.data || result || [];
                    const tableSchema = result.schema || [];
                    
                    setData(tableData);
                    setSchema(tableSchema);
                    
                    if (tableData.length > 0) {
                        setColumns(Object.keys(tableData[0]));
                        showAlert(`Successfully loaded ${tableData.length} sponsorship record${tableData.length === 1 ? '' : 's'}`, 'success');
                    } else if (tableSchema.length > 0) {
                        // If no data but schema exists, use schema columns
                        setColumns(tableSchema.map(col => col.COLUMN_NAME));
                        showAlert('Table structure loaded successfully. No records found.', 'info');
                    } else {
                        showAlert('No data or schema information available.', 'error');
                    }
                } catch (error) {
                    showAlert('Error loading data: ' + error.message, 'error');
                } finally {
                    setLoading(false);
                }
            };

            const handleCreate = () => {
                setModalMode('create');
                // Initialize with default values from schema
                const defaultRecord = {};
                if (schema.length > 0) {
                    schema.forEach(column => {
                        const columnName = column.COLUMN_NAME;
                        const dataType = column.DATA_TYPE;
                        const isNullable = column.IS_NULLABLE === 'YES';
                        const defaultValue = column.COLUMN_DEFAULT;
                        const extra = column.EXTRA;
                        
                        // Skip auto-increment columns
                        if (extra && extra.includes('auto_increment')) {
                            return;
                        }
                        
                        // skip created_at and updated_at columns
                        if (columnName === 'created_at' || columnName === 'updated_at') {
                            return;
                        }   

                        if (defaultValue !== null && defaultValue !== undefined && defaultValue !== 'NULL') {
                            defaultRecord[columnName] = defaultValue;
                        } else if (dataType === 'date') {
                            defaultRecord[columnName] = new Date().toISOString().slice(0, 10);
                        } else if (dataType === 'datetime' || dataType === 'timestamp') {
                            defaultRecord[columnName] = new Date().toISOString().slice(0, 19).replace('T', ' ');
                        } else if (dataType === 'int' || dataType === 'decimal' || dataType === 'float') {
                            defaultRecord[columnName] = '';
                        } else if (dataType === 'tinyint' && defaultValue === '1') {
                            defaultRecord[columnName] = true;
                        } else {
                            defaultRecord[columnName] = '';
                        }
                    });
                }
                setCurrentRecord(defaultRecord);
                setImageChanges({}); // Reset image changes
                setShowModal(true);
            };

            const handleEdit = (record) => {
                setModalMode('edit');
                setCurrentRecord({ ...record });
                setImageChanges({}); // Reset image changes
                setShowModal(true);
            };

            const handleDelete = async (sponsorship_id) => {
                if (window.confirm('Are you sure you want to delete this record?')) {
                    setLoading(true);
                    try {
                        // API call to delete record
                        const action = 'delete';
                        await fetch('ajax/sponsorship.php', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ sponsorship_id, action }),
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (!data.success) {
                                throw new Error(data.message);
                            }
                        })
                        .catch(error => {
                            console.error('Error deleting record:', error);
                            throw error;
                        });
                        
                        const updatedData = data.filter(item => item.sponsorship_id !== sponsorship_id);
                        setData(updatedData);
                        showAlert('Record deleted successfully', 'success');
                    } catch (error) {
                        showAlert('Error deleting record: ' + error.message, 'error');
                    } finally {
                        setLoading(false);
                    }
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                
                try {
                    // Prepare form data for file uploads
                    const formData = new FormData();
                    
                    // Add all form fields to FormData
                    Object.keys(currentRecord).forEach(key => {
                        const value = currentRecord[key];
                        if (value !== null && value !== undefined) {
                            // Check if this is a file upload field
                            if (key.includes('image') || key.includes('photo') || key.includes('picture')) {
                                if (value instanceof File) {
                                    formData.append(key, value);
                                    // Add flag indicating this image was changed
                                    formData.append(`${key}_changed`, 'true');
                                } else if (typeof value === 'string' && value) {
                                    // If it's a string (existing file path), check if it was changed
                                    if (imageChanges[key]) {
                                        formData.append(`${key}_changed`, 'true');
                                        if (value === '') {
                                            // Image was removed
                                            formData.append(`${key}_removed`, 'true');
                                        }
                                    } else {
                                        formData.append(`${key}_changed`, 'false');
                                    }
                                }
                            } else {
                                formData.append(key, value);
                            }
                        }
                    });
                    
                    // Add action
                    const action = modalMode === 'create' ? 'create' : 'update';
                    formData.append('action', action);
                    
                    // API call to save record
                    const response = await fetch('ajax/sponsorship.php', {
                        method: 'POST',
                        body: formData, // Use FormData instead of JSON
                    });
                    const result = await response.json();
                    if (!result.success) {
                        throw new Error(result.message);
                    }
                    
                    if (modalMode === 'create') {
                        // Use the sponsorship_id from server response and set created_at
                        const newRecord = { 
                            ...currentRecord, 
                            sponsorship_id: result.sponsorship_id || result.id || Math.max(...data.map(item => item.sponsorship_id || item.id), 0) + 1,
                            created_at: new Date().toISOString().slice(0, 19).replace('T', ' ')
                        };
                        setData([...data, newRecord]);
                        showAlert('Record created successfully', 'success');
                    } else {
                        // For updates, refresh the data from server to get updated file information
                        await loadTableData('sponsorships');
                        showAlert('Record updated successfully', 'success');
                    }
                    
                    setShowModal(false);
                    setImageChanges({}); // Reset image changes after successful save
                } catch (error) {
                    showAlert('Error saving record: ' + error.message, 'error');
                } finally {
                    setLoading(false);
                }
            };

            const showAlert = (message, type) => {
                setAlert({ message, type });
                // All alerts stay open until manually closed by the user
            };

            const closeAlert = () => {
                setAlert(null);
            };

            const handleInputChange = (field, value) => {
                setCurrentRecord(prev => ({
                    ...prev,
                    [field]: value
                }));
            };

            const getParshaName = (parshaId) => {
                const parsha = parshos.find(p => p.id == parshaId);
                return parsha ? parsha.name : `Unknown (ID: ${parshaId})`;
            };

            const renderFormField = (column) => {
                // Find column info from schema
                const columnInfo = schema.find(col => col.COLUMN_NAME === column);
                
                if (!columnInfo) return null;

                // skip created_at and updated_at columns
                if (column === 'created_at' || column === 'updated_at') {
                    return null;
                }
                
                const value = currentRecord[column] || '';
                const dataType = columnInfo.DATA_TYPE;
                const isNullable = columnInfo.IS_NULLABLE === 'YES';
                const extra = columnInfo.EXTRA;
                
                // Skip auto-increment columns in forms (but they will show in table)
                if (extra && extra.includes('auto_increment')) {
                    return null;
                }
                
                // Handle foreign key to parshos table
                if (column === 'parsha_id') {
                    return (
                        <div key={column} className="form-group">
                            <label htmlFor={column}>Parsha</label>
                            <select
                                id={column}
                                value={value}
                                onChange={(e) => handleInputChange(column, e.target.value)}
                                required={!isNullable}
                                style={{
                                    padding: '12px 16px',
                                    border: '2px solid #e5e7eb',
                                    borderRadius: '10px',
                                    fontSize: '1rem',
                                    transition: 'all 0.3s ease',
                                    background: '#f9fafb',
                                    height: '48px'
                                }}
                            >
                                <option value="">Select a Parsha...</option>
                                {parshos.map(parsha => (
                                    <option key={parsha.id} value={parsha.id}>
                                        {parsha.name}
                                    </option>
                                ))}
                            </select>
                        </div>
                    );
                }
                
                // Handle image upload fields
                if (column.includes('image') || column.includes('photo') || column.includes('picture')) {
                    const label = column.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    return (
                        <div key={column} className="form-group">
                            <label htmlFor={column}>{label}</label>
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                                {value && (
                                    <div style={{ 
                                        display: 'flex', 
                                        alignItems: 'center', 
                                        gap: '10px',
                                        padding: '10px',
                                        border: '1px solid #e5e7eb',
                                        borderRadius: '8px',
                                        background: '#f9fafb'
                                    }}>
                                        <img 
                                            src={typeof value === 'string' ? value : URL.createObjectURL(value)} 
                                            alt="Current image" 
                                            style={{ 
                                                width: '60px', 
                                                height: '60px', 
                                                objectFit: 'cover',
                                                borderRadius: '6px'
                                            }}
                                            onError={(e) => {
                                                e.target.style.display = 'none';
                                                e.target.nextSibling.style.display = 'block';
                                            }}
                                        />
                                        <div style={{ display: 'none', fontSize: '0.9rem', color: '#6b7280' }}>
                                            Image preview not available
                                        </div>
                                        <button
                                            type="button"
                                            onClick={() => {
                                                handleInputChange(column, '');
                                                // Mark this image as changed (removed)
                                                setImageChanges(prev => ({
                                                    ...prev,
                                                    [column]: true
                                                }));
                                            }}
                                            style={{
                                                background: '#ef4444',
                                                color: 'white',
                                                border: 'none',
                                                borderRadius: '4px',
                                                padding: '4px 8px',
                                                fontSize: '0.8rem',
                                                cursor: 'pointer'
                                            }}
                                        >
                                            Remove
                                        </button>
                                    </div>
                                )}
                                <input
                                    type="file"
                                    id={column}
                                    accept="image/*"
                                    onChange={(e) => {
                                        const file = e.target.files[0];
                                        if (file) {
                                            handleInputChange(column, file);
                                            // Mark this image as changed
                                            setImageChanges(prev => ({
                                                ...prev,
                                                [column]: true
                                            }));
                                        }
                                    }}
                                    style={{
                                        padding: '12px 16px',
                                        border: '2px solid #e5e7eb',
                                        borderStyle: 'dashed',
                                        borderRadius: '10px',
                                        fontSize: '1rem',
                                        transition: 'all 0.3s ease',
                                        background: '#f9fafb',
                                        cursor: 'pointer'
                                    }}
                                />
                                <div style={{ fontSize: '0.8rem', color: '#6b7280' }}>
                                    Click to upload an image. Supported formats: JPG, PNG, GIF
                                </div>
                            </div>
                        </div>
                    );
                }
                
                // Determine input type and properties based on MySQL data type
                let inputType = 'text';
                let inputProps = {};
                
                if (dataType.includes('varchar') || dataType.includes('char')) {
                    inputType = 'text';
                    // Extract max length from data type (e.g., varchar(255) -> 255)
                    const maxLengthMatch = dataType.match(/\((\d+)\)/);
                    if (maxLengthMatch) {
                        inputProps.maxLength = parseInt(maxLengthMatch[1]);
                    }
                } else if (dataType.includes('text') || dataType.includes('longtext')) {
                    inputType = 'textarea';
                } else if (dataType.includes('int') || dataType.includes('decimal') || dataType.includes('float')) {
                    inputType = 'number';
                    if (dataType.includes('unsigned')) {
                        inputProps.min = 0;
                    }
                } else if (dataType === 'date') {
                    inputType = 'date';
                } else if (dataType === 'datetime' || dataType === 'timestamp') {
                    inputType = 'datetime-local';
                } else if (dataType === 'time') {
                    inputType = 'time';
                } else if (dataType === 'year') {
                    inputType = 'number';
                    inputProps.min = 1901;
                    inputProps.max = 2155;
                } else if (dataType === 'tinyint' && columnInfo.COLUMN_DEFAULT === '1') {
                    inputType = 'checkbox';
                } else if (dataType === 'tinyint') {
                    inputType = 'number';
                    inputProps.min = 0;
                    inputProps.max = 255;
                } else if (column.includes('email')) {
                    inputType = 'email';
                } else if (column.includes('url')) {
                    inputType = 'url';
                }
                
                inputProps.required = !isNullable;
                
                const label = column.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                
                if (inputType === 'textarea') {
                    return (
                        <div key={column} className="form-group">
                            <label htmlFor={column}>{label}</label>
                            <textarea
                                id={column}
                                value={value}
                                onChange={(e) => handleInputChange(column, e.target.value)}
                                {...inputProps}
                                style={{ 
                                    padding: '12px 16px',
                                    border: '2px solid #e5e7eb',
                                    borderRadius: '10px',
                                    fontSize: '1rem',
                                    transition: 'all 0.3s ease',
                                    background: '#f9fafb',
                                    minHeight: '100px',
                                    resize: 'vertical'
                                }}
                            />
                        </div>
                    );
                } else if (inputType === 'checkbox') {
                    return (
                        <div key={column} className="form-group">
                            <label htmlFor={column} style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                <input
                                    type="checkbox"
                                    id={column}
                                    checked={value === true || value === '1' || value === 1}
                                    onChange={(e) => handleInputChange(column, e.target.checked)}
                                    {...inputProps}
                                />
                                {label}
                            </label>
                        </div>
                    );
                } else {
                    return (
                        <div key={column} className="form-group">
                            <label htmlFor={column}>{label}</label>
                            <input
                                type={inputType}
                                id={column}
                                value={value}
                                onChange={(e) => handleInputChange(column, e.target.value)}
                                {...inputProps}
                            />
                        </div>
                    );
                }
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1><i className="fas fa-database"></i> Sponsorships Management</h1>
                        <p>Manage sponsorship records with ease</p>
                    </div>
                    
                    <div className="content">
                        {alert && (
                            <div className={`alert alert-${alert.type}`}>
                                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                                        <i className={`fas fa-${alert.type === 'success' ? 'check-circle' : alert.type === 'error' ? 'exclamation-circle' : 'info-circle'}`}></i>
                                        {alert.message}
                                    </div>
                                    <button 
                                        onClick={closeAlert}
                                        style={{
                                            background: 'none',
                                            border: 'none',
                                            fontSize: '1.2rem',
                                            cursor: 'pointer',
                                            color: 'inherit',
                                            opacity: 0.7,
                                            padding: '4px',
                                            borderRadius: '4px',
                                            transition: 'opacity 0.3s ease'
                                        }}
                                        onMouseEnter={(e) => e.target.style.opacity = '1'}
                                        onMouseLeave={(e) => e.target.style.opacity = '0.7'}
                                    >
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>
                        )}
                        
                        <div className="controls">
                            <button className="btn btn-primary" onClick={handleCreate}>
                                Add New Sponsorship
                            </button>
                            <button className="btn btn-secondary" onClick={() => loadTableData('sponsorships')}>
                                <i className="fas fa-sync-alt"></i> Refresh
                            </button>
                        </div>
                        
                        <div className="table-container">
                            {loading ? (
                                <div className="empty-state">
                                    <div className="loading"></div>
                                    <p>Loading data...</p>
                                </div>
                            ) : data.length === 0 ? (
                                <div className="empty-state">
                                    <i className="fas fa-table"></i>
                                    <h3>No records found</h3>
                                    <p>No sponsorship records exist in the database. Click "Add New Sponsorship" to create your first record.</p>
                                </div>
                            ) : (
                                <table className="table">
                                    <thead>
                                        <tr>
                                            {columns.map(column => (
                                                <th key={column}>
                                                    {column === 'parsha_id' ? 'Parsha' : 
                                                     column === 'sponsorship_id' ? 'ID' :
                                                     column.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}
                                                </th>
                                            ))}
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {data.map(record => (
                                            <tr key={record.id}>
                                                {columns.map(column => (
                                                    <td key={column}>
                                                        {column === 'parsha_id' ? getParshaName(record[column]) : 
                                                         column.includes('image') || column.includes('photo') || column.includes('picture') ? 
                                                         (record[column] ? (
                                                             <img 
                                                                 src={`/sponsorships/images/${record[column]}`}
                                                                 alt="Image" 
                                                                 style={{ 
                                                                     width: '50px', 
                                                                     height: '50px', 
                                                                     objectFit: 'cover',
                                                                     borderRadius: '6px',
                                                                     border: '1px solid #e5e7eb'
                                                                 }}
                                                                 onError={(e) => {
                                                                     e.target.style.display = 'none';
                                                                     e.target.nextSibling.style.display = 'inline';
                                                                 }}
                                                             />
                                                         ) : (
                                                             <span style={{ color: '#9ca3af', fontSize: '0.9rem' }}>No image</span>
                                                         )) : 
                                                         record[column]}
                                                    </td>
                                                ))}
                                                <td>
                                                    <div className="action-buttons">
                                                        <button
                                                            className="btn btn-warning"
                                                            onClick={() => handleEdit(record)}
                                                            style={{ padding: '8px 12px', fontSize: '0.9rem' }}
                                                        >
                                                            <i className="fas fa-edit"></i>
                                                        </button>
                                                        <button
                                                            className="btn btn-danger"
                                                            onClick={() => handleDelete(record.sponsorship_id)}
                                                            style={{ padding: '8px 12px', fontSize: '0.9rem' }}
                                                        >
                                                            <i className="fas fa-trash"></i>
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                    </div>
                    
                    {showModal && (
                        <div className="modal">
                            <div className="modal-content">
                                <div className="modal-header">
                                    <h2>
                                        <i className={`fas fa-${modalMode === 'create' ? 'plus' : 'edit'}`}></i>
                                        {modalMode === 'create' ? 'Create New Sponsorship' : 'Edit Sponsorship'}
                                    </h2>
                                    <button className="close-btn" onClick={() => setShowModal(false)}>
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                
                                <form onSubmit={handleSubmit}>
                                    <div className="form-row">
                                        {columns.map(column => renderFormField(column))}
                                    </div>
                                    
                                    <div style={{ display: 'flex', gap: '15px', justifyContent: 'flex-end' }}>
                                        <button
                                            type="button"
                                            className="btn btn-secondary"
                                            onClick={() => setShowModal(false)}
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="submit"
                                            className={`btn btn-${modalMode === 'create' ? 'success' : 'warning'}`}
                                            disabled={loading}
                                        >
                                            {loading ? (
                                                <div className="loading"></div>
                                            ) : (
                                                <>
                                                    <i className={`fas fa-${modalMode === 'create' ? 'save' : 'check'}`}></i>
                                                    {modalMode === 'create' ? 'Create' : 'Update'}
                                                </>
                                            )}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<DatabaseCRUD />, document.getElementById('root'));
    </script>
</body>
</html>
