<!DOCTYPE html>
<html>
<head>
  <meta charset="utf8"/>
  <title>Chidon Experience Registration Report</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
    crossorigin="anonymous"/>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
    crossorigin="anonymous"></script>
  <style>
    body {
      margin: 20px;
    }
    td {
      vertical-align: middle !important;
      horiz-align: center !important;
    }
    .smaller {
      font-size: 14px;
    }
  </style>
</head>
<body>
<h1>Chidon Experience Registration Report</h1>
<div id="main"></div>
</body>
<script type="text/babel">
  const { useState, useEffect } = React
  const { createRoot } = ReactDOM

  const Report = () => {
    const [data, setData] = useState([])
    const [loading, setLoading] = useState(true)
    const [error, setError] = useState(null)
    const [superAdmin, setSuperAdmin] = useState(false)
    const [types, setTypes] = useState([])
    const [schools, setSchools] = useState([])

    useEffect(() => {
      fetch('api/getExpRegInfo.php')
        .then(res => res.json())
        .then(
          (result) => {
            if (result.super) setSuperAdmin(true)
            if (result.types) setTypes(result.types)
            if (result.schools) setSchools(result.schools)
            if (result.info) setData(result.info)
            else if (result.error) setError(result.error)
            setLoading(false)
          },
          (error) => {
            setError(error)
            setLoading(false)
          }
        )
    }, [])

    if (loading) {
      return <div>Loading...</div>
    }

    if (error) {
      return <div>Error: {error.message}</div>
    }

    const headers = ['Grade', 'Serial', 'Name', 'Earned Reward', 'Eligible Reward', 'KHK Trip Eligible', 'Award',
      'Raised on Drive', 'Minimum Fee', 'Registered', 'Trip Registered', 'Extra Purchases']
    if (superAdmin) headers.push('Registration Paid')

    const rewardDescs = {
      'Yesod': 'Sweater, Gift & Yesod Final',
      'Yediah': 'Sweater, Gift, & Yediah Final',
      'Havonah': 'Sweater, Gift, Prizes, Trip & Havonah Final',
      'Iyun': 'Sweater, Gift, Prizes, Trip & Iyun Final',
    }

    const khkDescs = {
      'Havonah': 'Sweater, Gift, Prizes, Trip & Havonah & KHK Final',
      'Iyun': 'Sweater, Gift, Prizes, Trip & Iyun & KHK Final',
    }

    const awardDescs = {
      'Yesod': 'Certificate',
      'Yediah': 'Plaque',
      'Havonah': 'Plaque & Medal',
      'Iyun': 'Plaque, Medal & Mini Trophy',
    }

    return (
      <div>
        {data && Object.keys(data).map((school, j) => (
        <div key={j}>
          <h2>{schools[school]}</h2>
          <table className="table table-striped">
            <thead>
            <tr>
              {headers.map((header, i) => (
                <th key={i}>{header}</th>
              ))}
            </tr>
            </thead>
            <tbody>
            {data[school].map((row, i) => (
              <tr key={i}>
                <td>{row.grade}</td>
                <td>{row.user_serial}</td>
                <td>{row.first + ' ' + row.last}</td>
                <td><b>{types[row.highest_track]}</b><br/><span className="smaller">{rewardDescs[types[row.highest_track]]}</span></td>
                <td>
                  <b>{types[row.reward]}</b><br/><span className="smaller">{row.khk ? khkDescs[types[row.reward]] : rewardDescs[types[row.reward]]}</span>
                </td>
                <td>{row.khk ? 'Yes' : 'No'}</td>
                <td><b>{types[row.award]}</b><br/><span className="smaller">{awardDescs[types[row.award]]} {row.khk ? '& KHK Plaque' : ''}</span></td>
                <td>{row.raised}</td>
                <td>{row.khk ? '$200 Regional Trip<br />$350 KHK Trip' : ('$' + row.fee)}</td>
                <td>{row.date_paid > 0 ? row.date_paid : ''}</td>
                <td>{row.trip}</td>
                <td>{row.extra_purchases}</td>
                {superAdmin && <td>{row.paid}</td>}
              </tr>
            ))}
            </tbody>
          </table>
        </div>
        ))}
      </div>
    )
  }

  const container = document.getElementById('main')
  const root = createRoot(container)
  root.render(<Report/>)
</script>
</html>
