<!DOCTYPE html>
<html>
<head>
  <meta charset="utf8"/>
  <title>Limud Evaluation Report</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
    crossorigin="anonymous"/>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
    crossorigin="anonymous"></script>
  <style>
    body {
      margin: 20px;
    }
  </style>
</head>
<body>
<h1>Limud Evaluation Report</h1>
<div id="main"></div>
</body>
<script type="text/babel">
  const {useState, useEffect} = React
  const {createRoot} = ReactDOM

  const Report = () => {
    const [school, setSchool] = useState(0)
    const [year, setYear] = useState(0)
    const [grade, setGrade] = useState(0)
    const [info, setInfo] = useState([])
    const [summary, setSummary] = useState([])
    const [test_num, setTestNum] = useState(1)

    const handleSchoolChange = (e) => {
      setSchool(e.target.value)
    }

    const handleYearChange = (e) => {
      setYear(e.target.value)
    }

    const handleGradeChange = (e) => {
      setGrade(e.target.value)
    }

    const handleTestNumChange = (e) => {
      setTestNum(e.target.value)
    }

    const getInfo = () => {
      fetch('api/limudInfo.php', {
        method: 'POST',
        body: JSON.stringify({
          school, year, grade, test_num
        })
      })
        .then((response) => response.json())
        .then((data) => {
          setInfo(data.info)
          setSummary(data.summary)
        })
    }

    return (
      <div>
        <div>
          <Choices
            handleSchoolChange={handleSchoolChange}
            handleYearChange={handleYearChange}
            handleGradeChange={handleGradeChange}
            handleTestNumChange={handleTestNumChange}
            handleClick={getInfo}
          />
        </div>
        <div>
          {info.length > 0 &&
            <>
              <SummaryTable
                info={summary}
              />
              <Table
                info={info}
              />
            </>
          }
        </div>
      </div>
    )
  }

  const Choices = ({handleSchoolChange, handleYearChange, handleGradeChange, handleClick, handleTestNumChange}) => {
    const [schools, setSchools] = useState([])
    const [years, setYears] = useState([])
    const [grades, setGrades] = useState([])

    useEffect(() => {
      fetch('api/limudEval.php')
        .then((response) => response.json())
        .then((data) => {
          setSchools(data.schools)
          setYears(data.years)
          handleYearChange({target: {value: data.years[0]}}) // set year to first year
        })
    }, [])

    const getClasses = (e) => {
      handleSchoolChange(e)
      const school_id = parseInt(e.target.value)
      if (school_id > 0) {
        fetch('api/getClasses.php', {
          method: 'POST',
          body: JSON.stringify({
            school: school_id
          })
        })
          .then((response) => response.json())
          .then((data) => {
            setGrades(data.grades)
          })
      }
    }

    return (
      <div>
        <div className="row">
          <div className="col">
            <label htmlFor="school">School</label>
            <select className="form-select" id="school" onChange={getClasses}>
              <option value="0">All</option>
              {schools.map((school, i) => {
                return <option key={i} value={school.id}>{school.name}</option>
              })}
            </select>
          </div>
          <div className="col">
            <label htmlFor="year">Year</label>
            <select className="form-select" id="year" onChange={handleYearChange}>
              {years.map((year, i) => {
                return <option key={i} value={year}>{year}</option>
              })}
            </select>
          </div>
          <div className="col">
            <label htmlFor="grade">Class</label>
            <select className="form-select" id="grade" onChange={handleGradeChange}>
              <option value="0">All</option>
              {grades.map((grade, i) => {
                return <option key={i} value={grade.id}>{grade.name}</option>
              })}
            </select>
          </div>
          <div className="col">
            <label htmlFor="grade">Test</label>
            <select className="form-select" id="grade" onChange={handleTestNumChange}>
              <option value="1">1</option>
              <option value="2">1 & 2</option>
              <option value="3">1, 2 & 3</option>
            </select>
          </div>
        </div>
        <br/>
        <div className="row">
          <div className="col">
            <button className="btn btn-primary" onClick={handleClick}>Get / Update Info</button>
          </div>
        </div>
      </div>
    )
  }

  const SummaryTable = ({info}) => {
    const track_options = {
      maven: 'Yesod',
      pro: 'Yediah',
      expert: 'Havonah',
      genius: 'Iyun'
    }

    const headers = Object.keys(info['maven'])

    let totals = {}
    for (let outcome of headers) {
      totals[outcome] = 0
    }

    return (
      <div>
        <br />
        <h2>Summary</h2>
        <table className="table table-striped">
          <thead>
          <tr>
            <th colSpan={headers.length + 1}></th>
          </tr>
          <tr>
            <th style={{ borderRight: '1px solid grey' }}>Track Currently On</th>
            <th colSpan={4} style={{ textAlign: 'center', borderRight: '1px solid grey' }}>Track Passed</th>
            <th colSpan={3}></th>
          </tr>
          <tr>
            <th style={{ borderRight: '1px solid grey' }}></th>
            {headers.map((header, i) => {
              let style = {}
              if (i == 3) style = { borderRight: '1px solid grey' }
              return (
                <th key={i} style={style}>{Object.keys(track_options).includes(header) ? track_options[header] : header}</th>
              )
            })}
          </tr>
          </thead>
          <tbody>
            {Object.entries(track_options).map((track, i) => (
              <tr key={i}>
                <th style={{borderRight: '1px solid grey'}}>{track[1]}</th>
                {headers.map((outcome, i) => {
                  totals[outcome] += info[track[0]][outcome]
                  let style = {}
                  if (i == 3) style = { borderRight: '1px solid grey' }
                  return (
                    <td key={i} style={style}>{info[track[0]][outcome]}</td>
                  )
                })}
              </tr>
            ))}
            <tr>
              <th style={{borderRight: '1px solid grey'}}>Totals</th>
              {Object.entries(totals).map((total, i) => {
                let style = {}
                if (i == 3) style = { borderRight: '1px solid grey' }
                return (
                  <th key={i} style={style}>{total[1]}</th>
                )
              })}
            </tr>
          </tbody>
        </table>
        <br/>
      </div>
    )
  }

  const Table = ({info}) => {
    // variables
    const tracks = {
      'Yesod': 'maven',
      'Yediah': 'pro',
      'Havonah': 'expert',
      'Iyun': 'genius'
    }

    const rewards = Object.assign({}, tracks, {
      'Highest track passed': 'highest track passed',
      'No Reward': 'no reward',
    })

    const awards = Object.assign({}, tracks, {
      'Highest final passed': 'highest final passed',
      'No Award': 'no award'
    })

    const createChangeEvent = (serial, field) => {
      const elem = document.getElementById(serial).querySelector(`.${field}`)
      elem.addEventListener('change', (e) => {
        update(e, field, serial)
      })
      elem.dispatchEvent(new Event('change'))
    }

    // functions
    const updateTrack = (e, serial) => {
      update(e, 'track', serial)
    }

    const updateReward = (e, serial) => {
      update(e, 'reward', serial)
    }

    const updateAward = (e, serial) => {
      update(e, 'award', serial)
    }

    const updateAvg = (e, serial) => {
      update(e, 'passing_avg', serial)
    }

    const updateDroppedOut = (e, serial) => {
      const reason = document.getElementById(serial).querySelector('.reason')
      if (e.target.checked) {
        // check reason
        if (reason.value == '') {
          alert('You must first select a reason!')
          e.target.checked = false
          return false
        } else {
          update(e, 'dropped_out', serial)
        }
      } else {
        update(e, 'dropped_out', serial)
        // reset reason
        reason.value = ''
        createChangeEvent(serial, 'reason')
      }
    }

    const updateReason = (e, serial) => {
      if (e.target.value !== '') {
        update(e, 'reason', serial)
        const dropped_out = document.getElementById(serial).querySelector('.dropped_out')
        if (! dropped_out.checked) dropped_out.checked = true
        createChangeEvent(serial, 'dropped_out')
      } else {
        update(e, 'reason', serial)
        const dropped_out = document.getElementById(serial).querySelector('.dropped_out')
        if (dropped_out.checked) dropped_out.checked = false
        createChangeEvent(serial, 'dropped_out')
      }
    }

    const update = (e, field, serial) => {
      let value
      if (field == 'dropped_out') value = e.target.checked || e.checked ? 1 : 0
      else value = e.target.value.toLowerCase()
      fetch('api/update.php', {
        method: 'POST',
        body: JSON.stringify({
           field, serial, value
        })
      })
        .then((response) => response.json())
        .then((data) => {
          if (! data.success) {
            alert(data.error)
            console.log(data.sql)
          }
        })
    }

    // constants for table
    const headers = ['Serial', 'Name', 'Class', 'Track', 'Non Cumulative Track Passed', 'Cumulative Track Passed',
      'Passing Avg', 'Yesod Mark/Avg', 'Yediah Mark/Avg', 'Havonah Mark/Avg', 'Iyun Mark/Avg', 'Reward', 'Award', 'KHK Experience', 'Time Committed', 'Time Learned', 'Dropped Out', 'Reason']
    const reasons = ['', 'Not Interested', 'Family Reason', 'Other School Work', 'Not happy with mark on previous test', 'Other']
    const khk_options = ['Eligible', 'KHK Experience', 'Regional Trip']
    const avgs = [70, 75, 80, 85, 90]
    const style = {
      0: 'black',
      1: 'red'
    }

    return (
      <div>
        <h2>Details</h2>
        <table className="table table-striped">
          <thead>
          <tr>
            {headers.map((header) => (
              <th scope="col">{header}</th>
            ))}
          </tr>
          </thead>
          <tbody>
          {info.map((row) => (
            <tr key={row.serial} id={row.serial}>
              <td>{row.serial}</td>
              <td>{row.name}</td>
              <td>{row.grade}</td>
              <td>
                <select name="track" className="form-select track" style={{width: '100px'}} defaultValue={row.track}
                        onChange={(e) => updateTrack(e, row.serial)}>
                  {Object.entries(tracks).map((track, i) => {
                    return <option key={i} value={track[1]}>{track[0]}</option>
                  })}
                </select>
              </td>
              <td>{row.non_cumulative_track_passed}</td>
              <td>{row.cumulative_track_passed}</td>
              <td>
                {isNaN(row.passing_avg) && row.passing_avg}
                {!isNaN(row.passing_avg) &&
                  <select name="avg" className="form-select avg" style={{width: '100px'}} defaultValue={row.passing_avg}
                          onChange={(e) => updateAvg(e, row.serial)}>
                    {avgs.map((avg, i) => {
                      return <option key={i} value={avg}>{avg}</option>
                    })}
                  </select>
                }
              </td>
              <td style={{color: style[row.yesod < row.passing_avg ? 1 : 0]}}>{row.yesod}</td>
              <td style={{color: style[row.yediah < row.passing_avg ? 1 : 0]}}>{row.yediah}</td>
              <td style={{color: style[row.havonah < row.passing_avg ? 1 : 0]}}>{row.havonah}</td>
              <td style={{color: style[row.iyun < row.passing_avg ? 1 : 0]}}>{row.iyun}</td>
              <td>
                <select name="reward" className="form-select reward" style={{width: '100px'}}
                        defaultValue={row.reward}
                        onChange={(e) => updateReward(e, row.serial)}>
                  {Object.entries(rewards).map((reward, i) => {
                    return <option key={i} value={reward[1]}>{reward[0]}</option>
                  })}
                </select>
              </td>
              <td>
                <select name="award" className="form-select award" style={{width: '100px'}} defaultValue={row.award}
                        onChange={(e) => updateAward(e, row.serial)}>
                  {Object.entries(awards).map((award, i) => {
                    return <option key={i} value={award[1]}>{award[0]}</option>
                  })}
                </select>
              </td>
              <td>
                {!row.khk_eligible && <span style={{color: 'red'}}>Not Eligible</span>}
                {row.khk_eligible &&
                  <select name="khk_experience" className="form-select khk_experience" defaultValue={row.khk_experience}
                          onChange={(e) => update(e, 'khk_experience', row.serial)}>
                    {khk_options.map((option, i) => {
                      return <option key={i} value={option.toLowerCase()}>{option}</option>
                    })}
                  </select>
                }
              </td>
              <td>{row.time_committed}</td>
              <td>{row.time_learned}</td>
              <td>
                <input type="checkbox" name="dropped_out" className="form-check-label dropped_out"
                       defaultChecked={row.dropped_out ? true : false}
                       onClick={(e) => updateDroppedOut(e, row.serial)}/>
              </td>
              <td>
                <select name="reason" className="form-select reason" defaultValue={row.reason}
                        onChange={(e) => updateReason(e, row.serial)}>
                  {reasons.map((reason, i) => {
                    return <option key={i} value={reason.toLowerCase()}>{reason}</option>
                  })}
                </select>
              </td>
            </tr>
          ))}
          </tbody>
        </table>
      </div>
    )
  }

  const container = document.getElementById('main')
  const root = createRoot(container)
  root.render(<Report/>)
</script>
</html>
