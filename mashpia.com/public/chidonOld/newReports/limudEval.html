<!DOCTYPE html>
<html>
<head>
  <meta charset="utf8"/>
  <title>Limud Evaluation Report</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
    crossorigin="anonymous"/>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
    crossorigin="anonymous"></script>
  <style>
    body {
      margin: 20px;
    }
  </style>
</head>
<body>
<h1>Limud Evaluation Report</h1>
<div id="main"></div>
</body>
<script type="text/babel">
  const {useState, useEffect} = React
  const {createRoot} = ReactDOM

  const Report = () => {
    const [school, setSchool] = useState(0)
    const [year, setYear] = useState(0)
    const [grade, setGrade] = useState(0)
    const [info, setInfo] = useState([])
    const [test_num, setTestNum] = useState(1)

    const handleSchoolChange = (e) => {
      setSchool(e.target.value)
    }

    const handleYearChange = (e) => {
      setYear(e.target.value)
    }

    const handleGradeChange = (e) => {
      setGrade(e.target.value)
    }

    const handleTestNumChange = (e) => {
      setTestNum(e.target.value)
    }

    const getInfo = () => {
      fetch('api/limudInfo.php', {
        method: 'POST',
        body: JSON.stringify({
          school, year, grade, test_num
        })
      })
        .then((response) => response.json())
        .then((data) => {
          setInfo(data.info)
        })
    }

    return (
      <div>
        <div>
          <Choices
            handleSchoolChange={handleSchoolChange}
            handleYearChange={handleYearChange}
            handleGradeChange={handleGradeChange}
            handleTestNumChange={handleTestNumChange}
            handleClick={getInfo}
          />
        </div>
        <div>
          {info.length > 0 &&
            <Table
              info={info}
            />
          }
        </div>
      </div>
    )
  }

  const Choices = ({handleSchoolChange, handleYearChange, handleGradeChange, handleClick, handleTestNumChange}) => {
    const [schools, setSchools] = useState([])
    const [years, setYears] = useState([])
    const [grades, setGrades] = useState([])

    useEffect(() => {
      fetch('api/limudEval.php')
        .then((response) => response.json())
        .then((data) => {
          setSchools(data.schools)
          setYears(data.years)
          handleYearChange({target: {value: data.years[0]}}) // set year to first year
        })
    }, [])

    const getClasses = (e) => {
      handleSchoolChange(e)
      const school_id = parseInt(e.target.value)
      if (school_id > 0) {
        fetch('api/getClasses.php', {
          method: 'POST',
          body: JSON.stringify({
            school: school_id
          })
        })
          .then((response) => response.json())
          .then((data) => {
            setGrades(data.grades)
          })
      }
    }

    return (
      <div>
        <div className="row">
          <div className="col">
            <label htmlFor="school">School</label>
            <select className="form-select" id="school" onChange={getClasses}>
              <option value="0">All</option>
              {Object.entries(schools).map((school, i) => {
                return <option key={i} value={school[0]}>{school[1]}</option>
              })}
            </select>
          </div>
          <div className="col">
            <label htmlFor="year">Year</label>
            <select className="form-select" id="year" onChange={handleYearChange}>
              {years.map((year, i) => {
                return <option key={i} value={year}>{year}</option>
              })}
            </select>
          </div>
          <div className="col">
            <label htmlFor="grade">Class</label>
            <select className="form-select" id="grade" onChange={handleGradeChange}>
              <option value="0">All</option>
              {Object.entries(grades).map((grade, i) => {
                return <option key={i} value={grade[0]}>{grade[1]}</option>
              })}
            </select>
          </div>
          <div className="col">
            <label htmlFor="grade">Test</label>
            <select className="form-select" id="grade" onChange={handleTestNumChange}>
              <option value="1">1</option>
              <option value="2">1 & 2</option>
              <option value="3">1, 2 & 3</option>
            </select>
          </div>
        </div>
        <br/>
        <div className="row">
          <div className="col">
            <button className="btn btn-primary" onClick={handleClick}>Get / Update Info</button>
          </div>
        </div>
      </div>
    )
  }

  const Table = ({info}) => {
    // variables
    const tracks = {
      'Yesod': 'maven',
      'Yediah': 'pro',
      'Havonah': 'expert',
      'Iyun': 'genius'
    }

    const rewards = Object.assign({}, tracks, {
      'KHK Trip': 'khk trip',
      'No Reward': 'no reward',
      'Highest track passed': 'highest track passed'
    })

    const awards = Object.assign({}, tracks, {
      'No Award': 'no award'
    })

    // functions
    const updateTrack = (e, serial) => {
      update(e, 'track', serial)
    }

    const updateReward = (e, serial) => {
      update(e, 'reward', serial)
    }

    const updateAward = (e, serial) => {
      update(e, 'award', serial)
    }

    const updateAvg = (e, serial) => {
      update(e, 'passing_avg', serial)
    }

    const updateDroppedOut = (e, serial) => {
      update(e, 'dropped_out', serial)
    }

    const updateReason = (e, serial) => {
      update(e, 'reason', serial)
    }

    const update = (e, field, serial) => {
      let value
      if (field == 'dropped_out') value = e.target.checked ? 1 : 0
      else value = e.target.value.toLowerCase()
      fetch('api/update.php', {
        method: 'POST',
        body: JSON.stringify({
           field, serial, value
        })
      })
        .then((response) => response.json())
        .then((data) => {
          if (! data.success) {
            alert(data.error)
            console.log(data.sql)
          } else {
            if (field == 'dropped_out' && value === 1) {
              const elem = document.getElementById(serial).querySelector('.reason')
              elem.addEventListener('change', (e) => {
                update(e, 'reason', serial)
              })
              elem.dispatchEvent(new Event('change'))
            }
          }
        })
    }

    // constants for table
    const headers = ['Serial', 'Name', 'Class', 'Track', 'Reward', 'Award', 'Passing Avg', 'Yesod', 'Yediah', 'Havonah', 'Iyun',
      'Non Cumulative Track Passed', 'Cumulative Track Passed', 'Time Committed', 'Time Learned', 'Dropped Out', 'Why']
    const reasons = ['Not Interested', 'Family Reason', 'Other School Work', 'Not happy with mark on previous test', 'Other']
    const avgs = [70, 75, 80, 85, 90]

    return (
      <div>
        <table className="table table-striped">
          <thead>
          <tr>
            {headers.map((header) => {
              return <th scope="col">{header}</th>
            })}
          </tr>
          </thead>
          <tbody>
          {info.map((row) => {
            return (
              <tr key={row.serial} id={row.serial}>
                <td>{row.serial}</td>
                <td>{row.name}</td>
                <td>{row.grade}</td>
                <td>
                  <select name="track" className="form-select track" style={{width: '100px'}} defaultValue={row.track}
                          onChange={(e) => updateTrack(e, row.serial)}>
                    {Object.entries(tracks).map((track, i) => {
                      return <option key={i} value={track[1]}>{track[0]}</option>
                    })}
                  </select>
                </td>
                <td>
                  <select name="reward" className="form-select reward" style={{width: '100px'}} defaultValue={row.reward}
                          onChange={(e) => updateReward(e, row.serial)}>
                    {Object.entries(rewards).map((reward, i) => {
                      return <option key={i} value={reward[1]}>{reward[0]}</option>
                    })}
                  </select>
                </td>
                <td>
                  <select name="award" className="form-select award" style={{width: '100px'}} defaultValue={row.award}
                          onChange={(e) => updateAward(e, row.serial)}>
                    {Object.entries(awards).map((award, i) => {
                      return <option key={i} value={award[1]}>{award[0]}</option>
                    })}
                  </select>
                </td>
                <td>
                  <select name="passing_avg" className="form-select passing_avg" defaultValue={row.passing_avg}
                          onChange={(e) => updateAvg(e, row.serial)}>
                    {avgs.map((avg, i) => {
                      return <option key={i} value={avg}>{avg}</option>
                    })}
                  </select>
                </td>
                <td>{row.yesod}</td>
                <td>{row.yediah}</td>
                <td>{row.havonah}</td>
                <td>{row.iyun}</td>
                <td>{row.non_cumulative_track_passed}</td>
                <td>{row.cumulative_track_passed}</td>
                <td>{row.time_committed}</td>
                <td>{row.time_learned}</td>
                <td>
                  <input type="checkbox" name="dropped_out" className="dropped_out" defaultChecked={row.dropped_out ? true : false}
                         onClick={(e) => updateDroppedOut(e, row.serial)} />
                </td>
                <td>
                  <select name="reason" className="form-select reason" defaultValue={row.reason}
                          onChange={(e) => updateReason(e, row.serial)}>
                    {reasons.map((reason, i) => {
                      return <option key={i} value={reason}>{reason}</option>
                    })}
                  </select>
                </td>
              </tr>
            )
          })}
          </tbody>
        </table>
      </div>
    )
  }

  const container = document.getElementById('main')
  const root = createRoot(container)
  root.render(<Report/>)
</script>
</html>
