<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#686de0" />
  <title>Chidon Attendance</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f6fa; color: #2d3436; }

    /* Loading */
    .loading-spinner { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 40px; color: #636e72; font-size: 1rem; }
    .spinner { width: 24px; height: 24px; border: 3px solid #dfe6e9; border-top-color: #686de0; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Login */
    .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #686de0, #a29bfe); padding: 20px; }
    .login-card { background: white; border-radius: 12px; padding: 40px; width: 100%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .login-card h2 { font-size: 1.5rem; font-weight: 700; color: #2d3436; margin-bottom: 4px; }
    .login-card .subtitle { color: #636e72; margin-bottom: 24px; font-size: 0.95rem; }
    .error-message { background: #fff5f5; border: 1px solid #fc5c65; color: #c0392b; padding: 10px 14px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 16px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #636e72; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input { width: 100%; padding: 10px 14px; border: 2px solid #dfe6e9; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    .form-group input:focus { border-color: #686de0; }
    .btn-primary { width: 100%; padding: 12px; background: #686de0; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 4px; }
    .btn-primary:hover:not(:disabled) { background: #5f62d0; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Header */
    .app-header { background: linear-gradient(135deg, #686de0, #a29bfe); color: white; padding: 14px 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(104,109,224,0.3); }
    .app-header h1 { font-size: 1.2rem; font-weight: 700; white-space: nowrap; }
    .user-name { font-size: 0.9rem; opacity: 0.9; flex: 1; text-align: right; }
    .btn-logout { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.4); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; flex-shrink: 0; }
    .btn-logout:hover { background: rgba(255,255,255,0.3); }

    /* Dashboard */
    .dashboard { max-width: 900px; margin: 20px auto; padding: 0 16px 40px; }

    /* Cards */
    .section-card { background: white; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .section-card h3 { font-size: 1rem; font-weight: 700; color: #2d3436; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    /* Group checkboxes */
    .groups-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .group-checkbox-label { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border: 2px solid #dfe6e9; border-radius: 8px; cursor: pointer; user-select: none; transition: border-color 0.15s, background 0.15s; font-size: 0.95rem; }
    .group-checkbox-label:hover { border-color: #686de0; background: #f8f7ff; }
    .group-checkbox-label.checked { border-color: #686de0; background: #f0f0fd; color: #686de0; font-weight: 600; }
    .group-checkbox-label input[type="checkbox"] { display: none; }
    .group-counselor { font-size: 0.8rem; color: #636e72; font-weight: 400; }

    /* Buttons */
    .toggle-all-btn { background: #f5f6fa; border: 1px solid #dfe6e9; color: #636e72; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .toggle-all-btn:hover { background: #dfe6e9; }
    .go-button { background: #686de0; color: white; border: none; padding: 12px 32px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .go-button:disabled { opacity: 0.5; cursor: not-allowed; }
    .go-button:hover:not(:disabled) { background: #5f62d0; }
    .check-all-btn { background: #f5f6fa; border: 1px solid #dfe6e9; color: #636e72; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .check-all-btn:hover { background: #dfe6e9; }

    /* Back bar */
    .back-bar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; flex-wrap: wrap; }

    /* Time select */
    .time-select { width: 100%; padding: 10px 14px; border: 2px solid #dfe6e9; border-radius: 8px; font-size: 1rem; outline: none; cursor: pointer; background: white; }
    .time-select:focus { border-color: #686de0; }

    /* Children */
    .children-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; margin-top: 12px; }
    .group-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; gap: 8px; flex-wrap: wrap; }
    .group-section-title { font-size: 1rem; font-weight: 700; color: #2d3436; }
    .child-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border: 2px solid #dfe6e9; border-radius: 8px; cursor: pointer; transition: border-color 0.15s, background 0.15s; background: white; outline: none; }
    .child-item:hover { border-color: #686de0; background: #f8f7ff; }
    .child-item:focus { border-color: #686de0; }
    .child-item.marked { border-color: #00b894; background: #f0fdf8; }
    .child-check-icon { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #b2bec3; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; font-size: 0.7rem; }
    .child-item.marked .child-check-icon { border-color: #00b894; background: #00b894; color: white; }
    .child-info { flex: 1; min-width: 0; }
    .child-name { font-weight: 600; font-size: 0.95rem; }
    .child-detail { font-size: 0.8rem; color: #636e72; margin-top: 2px; line-height: 1.5; }
    .child-host-info { font-size: 0.8rem; color: #636e72; margin-top: 6px; border-top: 1px solid #f0f0f0; padding-top: 6px; line-height: 1.6; }
    .child-host-address { color: #2d3436; font-weight: 500; }
    .empty-state { text-align: center; color: #636e72; padding: 20px; }

    /* Initial loading screen */
    #initial-loader { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #686de0, #a29bfe); }
    #initial-loader .spinner { border-top-color: white; border-color: rgba(255,255,255,0.3); border-top-color: white; width: 36px; height: 36px; border-width: 4px; }

    @media (max-width: 600px) {
      .children-grid { grid-template-columns: 1fr; }
      .app-header { flex-wrap: wrap; }
      .user-name { flex-basis: 100%; text-align: left; order: 3; }
    }
  </style>
</head>
<body>

  <!-- Initial loading -->
  <div id="initial-loader">
    <div class="spinner"></div>
  </div>

  <!-- Login page -->
  <div id="login-page" style="display:none">
    <div class="login-page">
      <div class="login-card">
        <h2>Chidon Attendance</h2>
        <p class="subtitle">Sign in to mark attendance</p>
        <div class="error-message" id="login-error" style="display:none"></div>
        <form id="login-form">
          <div class="form-group">
            <label for="login-username">Username</label>
            <input type="text" id="login-username" autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" autocomplete="current-password" />
          </div>
          <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Main app -->
  <div id="app-page" style="display:none">
    <header class="app-header">
      <h1>Chidon Attendance</h1>
      <div class="user-name" id="user-name"></div>
      <button class="btn-logout" id="logout-btn">Logout</button>
    </header>
    <div class="dashboard" id="dashboard"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
