<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image with Overlay</title>
    <style>
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }
        .responsive-image {
            width: 100%;
            height: auto;
            display: block;
        }
        .overlay-container {
            position: absolute;
            width: 25%;  
            padding-bottom: 25%;  
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            border-radius: 50%;
        }
        .overlay-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="7774977.jpg" alt="Responsive Image" class="responsive-image">
        <div class="overlay-container">
            <img src="inside_pic.png" alt="Overlay Image" class="overlay-image">
        </div>
    </div>
</body>
</html>
