<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script>
            window.onload = event => {
                const url = window.location.search
                const urlParams = new URLSearchParams(url)
                const id = urlParams.get('id')
                document.getElementById('invite').src = '../certs/Jpegs/' + id + '.jpg'
            }
        </script>
        <style>
            #invite {
                max-width: 100%;
            }
        </style>
    </head>
    <body>
        <img id="invite" src="" />
    </body>
</html>
