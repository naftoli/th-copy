<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chidon Invitation</title>
    <style>
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }
        .responsive-image {
            width: 100%;
            height: auto;
            display: block;
            max-width: 100%;
        }
        .overlay-container {
            position: absolute;
            width: 22%;  
            padding-bottom: 22%;  
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%);
            overflow: hidden;
            border-radius: 50%;
        }
        .overlay-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .download-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .download-btn:hover {
            background-color: #0056b3;
        }

        /* Adjust overlay position for mobile screens */
        @media screen and (max-width: 860px) {
            .overlay-container {
                top: 22.5%;
            }
        }
        @media screen and (max-width: 768px) {
            .overlay-container {
                top: 23%;
            }
        }
        @media screen and (max-width: 625px) {
            .overlay-container {
                top: 23.5%;
            }
        }
        @media screen and (max-width: 500px) {
            .overlay-container {
                top: 24%;
            }
        }
        @media screen and (max-width: 400px) {
            .overlay-container {
                top: 24.5%;
            }
        }
        @media screen and (max-width: 350px) {
            .overlay-container {
                top: 25%;
            }
        }
        @media screen and (max-width: 320px) {
            .overlay-container {
                top: 25.5%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="" alt="Responsive Image" class="responsive-image" id="mainImage">
        <div class="overlay-container">
            <img src="" alt="Overlay Image" class="overlay-image" id="overlayImage">
        </div>
    </div>
    <button class="download-btn" onclick="downloadCombinedImage()">Download Image</button>
    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        async function getUpdatedImg(id) {
            fetch('getUpdatedImage.php', {
                method: 'POST',
                body: JSON.stringify({ id }),
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(res => res.json())
            .then(data => {
                if (data.success && data.img) {
                    document.getElementById('overlayImage').src = 'getImage.php?path=mobile/reg/' + encodeURIComponent(data.img);
                }
            })
        }

        function downloadCombinedImage() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const mainImage = document.getElementById('mainImage');
            const overlayImage = document.getElementById('overlayImage');
            const container = document.querySelector('.container');
            const overlayContainer = document.querySelector('.overlay-container');

            // Set canvas size to match main image's natural dimensions
            canvas.width = mainImage.naturalWidth;
            canvas.height = mainImage.naturalHeight;

            // Draw main image
            ctx.drawImage(mainImage, 0, 0, canvas.width, canvas.height);

            // Calculate overlay position and size (circle diameter)
            const overlaySize = canvas.width * 0.23; // 23% of main image width
            const overlayX = (canvas.width - overlaySize) / 2;
            const overlayY = canvas.height * 0.21 - overlaySize / 2; // 21% from top

            // Scale overlay to cover the circle while preserving aspect ratio (match object-fit: cover)
            const iw = overlayImage.naturalWidth;
            const ih = overlayImage.naturalHeight;
            const scale = Math.max(overlaySize / iw, overlaySize / ih);
            const drawW = iw * scale;
            const drawH = ih * scale;
            const drawX = overlayX + (overlaySize - drawW) / 2;
            const drawY = overlayY + (overlaySize - drawH) / 2;

            // Create circular clipping path
            ctx.save();
            ctx.beginPath();
            ctx.arc(overlayX + overlaySize / 2, overlayY + overlaySize / 2, overlaySize / 2, 0, Math.PI * 2);
            ctx.clip();

            // Draw overlay image (centered, aspect ratio preserved)
            ctx.drawImage(overlayImage, drawX, drawY, drawW, drawH);
            ctx.restore();

            // Create download link
            const link = document.createElement('a');
            link.download = 'image.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // get invite id from url; load via same-origin proxy so canvas is not tainted (toDataURL works)
        const url = window.location.search
        const urlParams = new URLSearchParams(url)
        const id = urlParams.get('id')
        const src = 'getImage.php?path=chidonOld/certs/Jpegs/' + encodeURIComponent(id) + '.jpg'
        document.getElementById('mainImage').src = src

        // get updated image if exists
        document.getElementById('mainImage').onload = async function() {
            await getUpdatedImg(id)
        }

        // Wait for images to load before allowing download
        window.onload = function() {
            const mainImage = document.getElementById('mainImage');
            const overlayImage = document.getElementById('overlayImage');
            const downloadBtn = document.querySelector('.download-btn');
            
            if (!mainImage.complete || !overlayImage.complete) {
                downloadBtn.disabled = true;
                Promise.all([
                    new Promise(resolve => mainImage.onload = resolve),
                    new Promise(resolve => overlayImage.onload = resolve)
                ]).then(() => {
                    downloadBtn.disabled = false;
                });
            }
        };
    </script>
</body>
</html>
