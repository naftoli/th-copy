		<script type="text/javascript">
      $('#fullpage').fullpage({

          verticalCentered: false,
          controlArrows: false,
          responsiveWidth: 860,
          recordHistory: true,

            //using index
            $('.bar').each(function(index, i){
              var percent = $(this).data('percent');
              $(this).find('.bar-line__bar').width(percent + '%');
