<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Battlefront Report</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
    crossorigin="anonymous" />
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
    crossorigin="anonymous"></script>
  <style>
    #main {
      margin-left: 2%;
      margin-right: 2%;
    }
  </style>
</head>
<body>
<div id="main"></div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.6.0/jszip.min.js"></script>
<script>
  function saveAs(blob, filename) {
    if (typeof navigator.msSaveOrOpenBlob !== 'undefined') {
      return navigator.msSaveOrOpenBlob(blob, fileName);
    } else if (typeof navigator.msSaveBlob !== 'undefined') {
      return navigator.msSaveBlob(blob, fileName);
    } else {
      var elem = window.document.createElement('a');
      elem.href = window.URL.createObjectURL(blob);
      elem.download = filename;
      elem.style = 'display:none;opacity:0;color:transparent;';
      (document.body || document.documentElement).appendChild(elem);
      if (typeof elem.click === 'function') {
        elem.click();
      } else {
        elem.target = '_blank';
        elem.dispatchEvent(new MouseEvent('click', {
          view: window,
          bubbles: true,
          cancelable: true
        }));
      }
      URL.revokeObjectURL(elem.href);
    }
  }
</script>
<script type="text/babel">
  const {useState, useEffect} = React
  const {createRoot} = ReactDOM

  // top level component
  const App = () => {
    const [chosen, setChosen] = useState([])
    const [dates, setDates] = useState({
      start60m: 0, end60m: 0,
      start5m: 0, end5m: 0,
      startBirthdays: 0, endBirthdays: 0,
      startRanks: 0, endRanks: 0
    })
    const [show60m, setShow60m] = useState(false)
    const [show5m, setShow5m] = useState(false)
    const [showBirthdays, setShowBirthdays] = useState(false)
    const [showRanks, setShowRanks] = useState(false)

    const handleChange = e => {
      // add to choices if checked, remove if unchecked
      const choice = e.target.name
      const checked = e.target.checked
      if (checked) setChosen([...chosen, choice])
      else setChosen(chosen.filter(c => c !== choice))
    }

    const handleDateChange = e => {
      const name = e.target.name
      const date = e.target.value
      setDates({...dates, [name]: date})
    }

    useEffect(() => {
      if (dates.start60m && dates.end60m) setShow60m(true)
      if (dates.start5m && dates.end5m) setShow5m(true)
      if (dates.startBirthdays && dates.endBirthdays) setShowBirthdays(true)
      if (dates.startRanks && dates.endRanks) setShowRanks(true)
    }, [dates])

    return (
      <div className="container-fluid mt-4 p-3">
        <Choices handleChange={handleChange} dateChange={handleDateChange} /><br />
        <div className="row">
          {chosen.includes('60M Raffles') && show60m && <Raffles raffle_type="60" dates={dates} />}
          {chosen.includes('5M Raffles') && show5m && <Raffles raffle_type="5" dates={dates} />}
          {chosen.includes('Birthdays') && showBirthdays && <Birthdays dates={dates} />}
          {chosen.includes('Ranks') && showRanks && <Ranks dates={dates} />}
          {chosen.includes('WWTC') && <WWTC />}
        </div>
      </div>
    )
  }

  const Choices = ({ handleChange, dateChange }) => {
    return (
      <div className="container-fluid border border-1 rounded p-3">
        <h3 className="mb-3">Choose what you would like to have on your Report</h3>
        <table className="table">
          <tbody>
            <tr>
              <td>
                <label><input type="checkbox" name="60M Raffles" onChange={handleChange} /> 60M Raffles</label>
              </td>
              <td>
                <input type="date" name="start60m" onChange={dateChange} /> <input type="date" name="end60m" onChange={dateChange} />
              </td>
              <td>
                &nbsp;
              </td>
            </tr>
            <tr>
              <td>
                <label><input type="checkbox" name="5M Raffles" onChange={handleChange} /> 5M Raffles</label>
              </td>
              <td>
                <input type="date" name="start5m" onChange={dateChange} /> <input type="date" name="end5m" onChange={dateChange} />
              </td>
              <td>
                &nbsp;
              </td>
            </tr>
            <tr>
              <td>
                <label><input type="checkbox" name="Birthdays" onChange={handleChange} /> Birthdays</label>
              </td>
              <td>
                <input type="date" name="startBirthdays" onChange={dateChange} /> <input type="date" name="endBirthdays" onChange={dateChange} />
              </td>
              <td>
                &nbsp;
              </td>
            </tr>
            <tr>
              <td>
                <label><input type="checkbox" name="Ranks" onChange={handleChange} /> Ranks</label>
              </td>
              <td>
                <input type="date" name="startRanks" onChange={dateChange} /> <input type="date" name="endRanks" onChange={dateChange} />
              </td>
              <td>
                &nbsp;
              </td>
            </tr>
            <tr>
              <td>
                <input type="checkbox" name="WWTC" onChange={handleChange} /> WWTC (latest WWTC)
              </td>
              <td>
                &nbsp;
              </td>
              <td>
                &nbsp;
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    )
  }

  const Raffles = ({ raffle_type, dates }) => {
    const [raffles, setRaffles] = useState([])
    let start, end
    if (raffle_type == '60') {
      start = dates.start60m
      end = dates.end60m
    } else {
      start = dates.start5m
      end = dates.end5m
    }

    useEffect(() => {
      fetch('api/getRaffleWinners.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ raffle_type, start, end })
      })
        .then(res => res.json())
        .then(data => setRaffles(data))
    }, [])

    const infoStyle = {fontStyle: "italic"}
    return (
      <div className="container-fluid border border-1 rounded p-3 mt-3 col-6">
        <h4>{raffle_type}M Raffles</h4>
        {raffles && raffles.map(raffle => (
          <div key={raffle.raffle_id}>
            <hr />
            <div style={infoStyle}>{raffle.raffle_name}</div>
            {raffle_type == '60' && <div style={infoStyle}>From: {raffle.raffle_from}</div>}
            {raffle_type == '60' && <div style={infoStyle}>To: {raffle.raffle_to}</div>}
            <br />
            <Winners info={raffle.winners} raffle={raffle_type} />
          </div>
        ))}
      </div>
    )
  }

  const Winners = ({ info, raffle }) => {
    const nameStyle = {fontWeight: 'bold'}
    const prizeStyle = {fontStyle: 'italic'}
    return (
      <div>
        {info.map(winner => (
          <div key={winner.user_id}>
            {raffle == '60' && <div style={prizeStyle}>Prize: {winner.prize_name}</div>}
            <div style={nameStyle}>{winner.name}</div>
            <div>{winner.shorthand ? winner.shorthand : winner.school_id}</div>
            {raffle == '0' && <br />}
          </div>
        ))}
      </div>
    )
  }

  const Birthdays = ({ dates }) => {
    const [heDates, setHeDates] = useState([])
    const [birthdays, setBirthdays] = useState([])
    const start = dates.startBirthdays
    const end = dates.endBirthdays

    useEffect(() => {
      fetch('api/getBirthdays.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({start, end})
      })
        .then(res => res.json())
        .then(data => {
          setHeDates(data.heDates)
          setBirthdays(data.birthdays)
        })
    }, [])

    const schoolStyle = {fontStyle: 'italic'}
    return (
      <div className="container-fluid border border-1 rounded p-3 mt-3 col-6">
        <h4>Birthdays</h4>
        {birthdays && Object.keys(birthdays).map(birthdate => (
          <div key={birthdate}>
            <hr/>
            <div style={{fontWeight: 'bold'}}>{heDates[birthdate]}</div>
            {birthdays[birthdate].map((birthday, i) => (
              <div key={i}>
                <div>{birthday.name}</div>
                <div style={schoolStyle}>{birthday.school ? birthday.school : birthday.school_id}</div>
              </div>
            ))}
          </div>
        ))}
      </div>
    )
  }

  const Ranks = ({ dates }) => {
    const [ranks, setRanks] = useState([])
    const [lowerRanks, setLowerRanks] = useState([])
    const [starGenerals, setStarGenerals] = useState([])
    const [generals, setGenerals] = useState([])
    const start = dates.startRanks
    const end = dates.endRanks

    useEffect(() => {
      fetch('api/getRanks.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ start, end })
      })
        .then(res => res.json())
        .then(data => {
          setRanks(data.ranks)
          setLowerRanks(data.lowerRanks)
          setStarGenerals(data.starGenerals)
          setGenerals(data.generals)
        })
    }, [])

    return (
      <div className="row">
        {starGenerals && <StarGenerals info={starGenerals} ranks={ranks} />}
        {generals && <Generals info={generals} dates={{start, end}} />}
        {ranks && <LowerRanks info={lowerRanks} ranks={ranks} />}
      </div>
    )
  }

  const StarGenerals = ({ info, ranks }) => {
    return (
      <div className="container-fluid border border-1 rounded p-3 mt-3 col-6">
        <h4>Star Generals</h4>
        <hr />
        {Object.keys(info).map(rank => (
          <div key={rank}>
            <div style={{fontWeight: 'bold'}}>{ranks[rank]}</div>
            {info[rank].map(user => (
            <div key={user.user_serial}>
              <div>{user.first + ' ' + user.last}</div>
              <div style={{fontStyle: 'italic'}}>{user.school}</div>
            </div>
            ))}
            <br />
          </div>
        ))}
      </div>
    )
  }

  const Generals = ({ info, dates }) => {
    const createZip = async () => {
      // find all profile pictures on the page
      let urls = []
      const profiles = document.querySelectorAll(".profile")
      profiles.forEach(profile => {
        const img = profile.dataset.profile
        const name = profile.dataset.name
        urls.push({src: img, name: name})
      })
      console.log(urls)

      const zip = new JSZip()
      for (let idx = 0; idx < urls.length; idx++) {
        const url = urls[idx]
        const file = await fetch('https:' + url.src)
        const blob = await file.blob()
        const name = url.name.replace(/\s/g, '_')
        const ext = url.src.split('.').pop()
        const filename = `${idx + 1}_${name}.${ext}`
        zip.file(filename, blob)
      }
      return zip
    }

    const download = async e => {
      e.preventDefault()
      const zip = await createZip()
      console.log(zip)
      zip.generateAsync({ type: "blob" })
        .then(function (content) {
          saveAs(content, "generals.zip")
        })
    }

    return (
      <div className="container-fluid border border-1 rounded p-3 mt-3 col-6">
        <h4>Generals</h4>
        <hr />
        <a href="" onClick={download} style={{textDecoration: 'none'}}>Download Images</a><br /><br />
        {info.map(general => {
          const profile = general.mobile_pic ? `//mashpia.com/mobile/reg/${general.mobile_pic}` : general.user_photo_id ? `/file_view.php?id=${general.user_photo_id}` : ''
          return (
            <div key={general.user_serial}>
              <div style={{fontWeight: 'bold'}}>{general.first + ' ' + general.last}</div>
              <div style={{textDecoration: 'underline'}}>{general.school}</div>
              <input type="hidden" className="profile" data-profile={profile} data-name={general.first + ' ' + general.last} />
            </div>
          )
        })}
      </div>
    )
  }

  const LowerRanks = ({ info, ranks }) => {
    const initials = name => {
      const names = name.split(' ')
      return names.map(n => n[0])
    }

    // first split up the users by ranks then schools
    let sorted = []
    for (let rank in info) {
      sorted[rank] = []
      for (let user of info[rank]) {
        let school = user.school
        if (!sorted[rank][school]) sorted[rank][school] = []
        sorted[rank][school].push(user)
      }
    }

    return (
      <div className="container-fluid border border-1 rounded p-3 mt-3 col-6">
        <h4>Lower Ranks</h4>
        <hr />
        {Object.keys(sorted).map(rank => (
          <div key={rank}>
            <div style={{fontStyle: 'italic'}}>{ranks[rank]}</div>
            {Object.keys(sorted[rank]).map(school => (
              <div key={school}>
                <div style={{fontWeight: 'bold'}}>{school}</div>
                {sorted[rank][school].map(user => (
                  <div key={user.user_serial}>
                    <div>{initials(user.first).join('. ') + ' ' + user.last}</div>
                  </div>
                ))}
              </div>
            ))}
            <br />
          </div>
        ))}
      </div>
    )
  }

  const WWTC = () => {
    const [info, setInfo] = useState([])

    useEffect(() => {
      fetch('api/getWWTC.php')
        .then(res => res.json())
        .then(data => setInfo(data))
    }, [])

    return (
      <div className="container-fluid border border-1 rounded p-3 mt-3 col-6">
        <h4>WWTC</h4>
        <hr />
        {Object.keys(info).map(grade => (
          <div key={grade}>
            <div style={{fontWeight: 'bold'}}>{grade}</div>
            {info[grade].map((details, i) => (
              <div key={i}>
                <div>{details.teacher}</div>
                <div style={{fontStyle: 'italic'}}>{details.school}</div>
              </div>
            ))}
            <br />
          </div>
        ))}
      </div>
    )
  }

  const container = document.getElementById('main')
  const root = createRoot(container)
  root.render(<App />)
</script>
</body>
</html>
