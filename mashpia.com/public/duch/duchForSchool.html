        <style>
            #userImg {
                border-radius: 50%;
                width: 100%;
                height: 100%;
                border: 2px solid #31559f;
            }
    
            .personalImg {
                width: 50px;
                height: 50px;
                left: 1%;
                top: -30px;
                border-radius: 50%;
                position: relative;
            }
    
            @font-face {
                font-family: 'digi';
                src: url('font/DS-DIGIB.TTF');
            }
    
            .header-yellow #page-title {
                font-size: 25px;
                font-weight: 700;
                color: #fff;
                text-align: center;
                width: auto;
                display: block;
                padding: 5px 0px;
                transition: .25s;
            }
    
            .header-yellow {
                min-height: 48px;
            }
    
            .extra-info {
                padding-left: 1em;
            }

            .container {
                column-count: 3 !important;
                column-gap: 20px !important;
                height: auto !important;
            }
    
            @media (min-width: 525px) {
                .header-yellow #page-title {
                    font-size: 40px;
                    padding: 10px 0px;
                }
                .header-yellow {
                    min-height: 70px;
                }
                .personalImg {
                    top: -35px;
                }
            }
    
            @media screen {
                .print-only {
                    display: none;
                }
                .no-print {
                    display: block;
                }
            }
            @media print {
                .print-only {
                    display: block !important;
                }
                .userDuch {
                    width: 7in !important;
                }
                .no-print, #userImg {
                    display: none !important;
                }
            }
    
            @media screen and (max-width: 315px) {
                .streak .campaign-icon {
                    width: 50px !important;
                }
            }
            @media screen and (max-width: 280px) {
                .task {
                    width: auto !important;
                }
                .streak progress {
                    width: 1.5in !important;
                }
            }

                display: flex;
                gap: 10px;
                justify-content: center;
                margin-top: -30px;
                margin-bottom: 20px;
            }
            #print-buttons {
                padding-top: 1em;
            }

    <body>
        <h1>Print Duch for School</h1>
        <div style='display: flex; justify-content: center; gap: 10px; margin-top: 10px;'>
            <button class='no-print btn btn-primary' id='print-button' style='display: none;' onclick='javascript:window.print()'>Print</button>
            <button class='no-print btn btn-primary' id='email-button' style='display: none;' onclick='javascript:emailToOhel()'>Email to the Ohel</button>
        </div>
        <div id="duchForSchool"></div>
    </body>
    <script src="https://code.jquery.com/jquery-1.12.4.min.js" 
            integrity="sha256-ZosEbRLbNQzLpnKIkEdrPv7lOy9C27hHQ+Xp8a4MxAQ=" 
            crossorigin="anonymous"></script>
    <script>
        window.onload = async function() {
            try {
                const school_id = new URLSearchParams(window.location.search).get('id');
                
                if (!school_id) {
                    $('#duchForSchool').html('<p>No school ID provided</p>');
                    return;
                }
                
                const url = '/api/print/printDuchAll.php?id=' + school_id;
                const response = await fetch(url);
                console.log(response);                
            } catch (e) {
                console.error('Error:', e);
                $('#duchForSchool').html('<p style="color: red;">Error loading users: ' + e.message + '</p>');
            }
        }
    </script>
