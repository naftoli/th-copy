<!DOCTYPE html>
<html>
<head>
    <meta charset='utf8'/>
    <title>Limud Evaluation Report</title>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js' crossorigin></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js'
            crossorigin></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.21.8/babel.min.js' crossorigin></script>
    <link
        href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css'
        rel='stylesheet'
        integrity='sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM'
        crossorigin='anonymous'/>
    <script
        src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js'
        integrity='sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz'
        crossorigin='anonymous'></script>
    <style>
        body {
            margin: 20px;
        }
    </style>
</head>
<body>
<h1>Limud Evaluation Report</h1>
<div id='main'></div>
</body>
<script type='text/babel'>
    const {useState, useEffect} = React
    const {createRoot} = ReactDOM

    const Report = () => {
        const [info, setInfo] = useState([])

        useEffect(() => {
            fetch('getInstallments.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                setInfo(data)
            })
        }, [])

        return (
            <div>
                <table>
                    <thead>
                        <tr>
                            <th>Subscription ID</th>
                            <th>Name / Description</th>
                            <th>Status</th>
                            <th>Amount to charge</th>
                            <th>Number of charges to make</th>
                            <th>Number of transactions done</th>
                            <th>Number of charges successfully completed</th>
                            <th>Number of charges failed</th>
                            <th>Total Paid to date</th>
                        </tr>
                    </thead>
                    {info.length > 0 && (
                    <tbody>
                        {info.map((item, index) => (
                            <tr key={index}>
                                <td>{item.subscription_id}</td>
                                <td>{item.name}</td>
                                <td>{item.status}</td>
                                <td>{item.subscription_amount}</td>
                                <td>{item.total_num_installments}</td>
                                <td>{item.num_transactions}</td>
                                <td>{item.completed}</td>
                                <td>{item.failed}</td>
                                <td>{item.paid}</td>
                            </tr>
                        ))}
                    </tbody>
                    )}
                </table>
            </div>
        )
    }

    const container = document.getElementById('main')
    const root = createRoot(container)
    root.render(<Report/>)
</script>
</html>
