<!DOCTYPE html>
<html>
<head>
    <meta charset='utf8'/>
    <title>Limud Evaluation Report</title>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js' crossorigin></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js'
            crossorigin></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.21.8/babel.min.js' crossorigin></script>
    <link
        href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css'
        rel='stylesheet'
        integrity='sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM'
        crossorigin='anonymous'/>
    <script
        src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js'
        integrity='sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz'
        crossorigin='anonymous'></script>
    <style>
        body {
            margin: 20px;
        }
    </style>
    <style>
    body {
        margin: 20px;
        background-color: #f8f9fa;
    }
    
    .table {
        background-color: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
        margin-top: 2rem;
    }

    .table thead th {
        border-bottom: 2px solid #dee2e6;
        font-weight: 600;
        color: #495057;
    }

    .table td, .table th {
        border: 1px solid #dee2e6;
        vertical-align: middle;
    }

    .table-hover tbody tr:hover {
        background-color: rgba(0, 0, 0, 0.015);
    }

    .badge {
        padding: 0.5em 1em;
        font-weight: 500;
        text-transform: capitalize;
    }

    /* Make the table responsive with horizontal scroll on small screens */
    .table-responsive {
        border-radius: 8px;
    }

    /* Custom scrollbar for webkit browsers */
    .table-responsive::-webkit-scrollbar {
        height: 8px;
    }

    .table-responsive::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 4px;
    }

    .table-responsive::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 4px;
    }

    .table-responsive::-webkit-scrollbar-thumb:hover {
        background: #555;
    }
</style>
</head>
<body>
<h1>Limud Evaluation Report</h1>
<div id='main'></div>
</body>
<script type='text/babel'>
    const {useState, useEffect} = React

    const {createRoot} = ReactDOM

    const Report = () => {
    const [info, setInfo] = useState([]);
    const [isLoading, setIsLoading] = useState(false);
    const [selectedYear, setSelectedYear] = useState(parseInt(
        new Intl.DateTimeFormat('he-IL', { year: 'numeric' }).format(new Date()))
    );
    
    const fetchData = (year) => {
        setIsLoading(true);
        fetch('getInstallments.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ year: selectedYear })
        })
        .then(response => response.json())
        .then(data => {
            setInfo(data);
            setIsLoading(false);
        })
        .catch(error => {
            console.error('Error fetching data:', error);
            setIsLoading(false);
        });
    };

    // Generate array of last 3 years in hebrew
    const yearsHebrew = [];
    for (let i = 0; i < 3; i++) {
        const year = selectedYear - i;
        yearsHebrew.push(year);
    }

    return (
        <div>
            <div className="mb-4 d-flex align-items-center gap-3">
                <select 
                    className="form-select" 
                    style={{ width: 'auto' }}
                    value={selectedYear}
                    onChange={(e) => {
                        setSelectedYear(parseInt(e.target.value));
                        fetchData(e.target.value);
                    }}
                >
                    {yearsHebrew.map(year => (
                        <option key={year} value={year}>{year}</option>
                    ))}
                </select>
                <button 
                    className="btn btn-primary"
                    onClick={() => fetchData(selectedYear)}
                >
                    Get Data
                </button>
            </div>

            {isLoading ? (
                <div className="d-flex justify-content-center align-items-center" style={{ minHeight: '200px' }}>
                    <div className="spinner-border text-primary" role="status">
                        <span className="visually-hidden">Loading...</span>
                    </div>
                    <span className="ms-2">Loading...</span>
                </div>
            ) : (
                <div className="table-responsive">
                    <table className="table table-hover table-striped table-bordered">
                        <thead className="table-light">
                            <tr>
                                <th className="px-4 py-3">Subscription ID</th>
                                <th className="px-4 py-3">Name / Description</th>
                                <th className="px-4 py-3">Status</th>
                                <th className="px-4 py-3">Amount to charge</th>
                                <th className="px-4 py-3">Number of charges to make</th>
                                <th className="px-4 py-3">Number of transactions done</th>
                                <th className="px-4 py-3">Number of charges successfully completed</th>
                                <th className="px-4 py-3">Number of charges failed</th>
                                <th className="px-4 py-3">Total Paid to date</th>
                            </tr>
                        </thead>
                        <tbody>
                            {info.map((item, index) => (
                                <tr key={index}>
                                    <td className="px-4 py-3">{item.subscription_id}</td>
                                    <td className="px-4 py-3">{item.name}</td>
                                    <td className="px-4 py-3">
                                        <span className={`badge ${item.status === 'active' ? 'bg-success' : 'bg-secondary'}`}>
                                            {item.status}
                                        </span>
                                    </td>
                                    <td className="px-4 py-3">${item.subscription_amount}</td>
                                    <td className="px-4 py-3">{item.total_num_installments}</td>
                                    <td className="px-4 py-3">{item.num_transactions}</td>
                                    <td className="px-4 py-3">{item.completed}</td>
                                    <td className="px-4 py-3">{item.failed}</td>
                                    <td className="px-4 py-3">${item.paid}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            )}
        </div>
    );
};

    const container = document.getElementById('main')
    const root = createRoot(container)
    root.render(<Report/>)
</script>
</html>
