<!DOCTYPE html>
<html>
<head>
    <meta charset='utf8'/>
    <title>Limud Evaluation Report</title>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js' crossorigin></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js'
            crossorigin></script>
    <script src='https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.21.8/babel.min.js' crossorigin></script>
    <link
        href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css'
        rel='stylesheet'
        integrity='sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM'
        crossorigin='anonymous'/>
    <script
        src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js'
        integrity='sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz'
        crossorigin='anonymous'></script>
    <style>
        body {
            margin: 20px;
        }
    </style>
</head>
<body>
<h1>Limud Evaluation Report</h1>
<div id='main'></div>
</body>
<script type='text/babel'>
    const {useState, useEffect} = React
    const {createRoot} = ReactDOM

    const Report = () => {
        const [info, setInfo] = useState([])
        const [error, setError] = useState(false)
        const [success, setSuccess] = useState(true)

        useEffect(() => {
            fetch('getInstallments.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                setInfo(data)
                console.log(data)
            })
        }, [])
    }

    const container = document.getElementById('main')
    const root = createRoot(container)
    root.render(<Report/>)
</script>
</html>
