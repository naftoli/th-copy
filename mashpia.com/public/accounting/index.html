<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounting Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .card-header {
            transition: background-color 0.3s ease;
        }
        
        .card-header:hover {
            background-color: #f8f9fa;
        }
        
        .card-body {
            transition: all 0.3s ease;
        }
        
        .bi-chevron-down, .bi-chevron-right {
            transition: transform 0.3s ease;
        }
        
        .accordion-toggle {
            cursor: pointer;
            user-select: none;
        }
        
        .accordion-toggle:hover {
            background-color: #f8f9fa;
        }
        
        @media print {
            .card-header {
                background-color: #f8f9fa !important;
                color: #000 !important;
            }
            
            .accordion-toggle {
                display: none !important;
            }
            
            .card-body {
                display: block !important;
            }
            
            .btn {
                display: none !important;
            }
            
            .form-control, .form-select, .form-check {
                border: 1px solid #ccc !important;
                background-color: #fff !important;
            }
        }
        
        /* Make container stretch for wide tables */
        .table-responsive {
            min-width: 100%;
            overflow-x: auto;
        }
        
        .table-responsive .table {
            min-width: max-content;
        }
        
        /* When table is wider than container, stretch the container */
        @media (min-width: 768px) {
            .container {
                max-width: none !important;
                width: 100% !important;
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }
        }
        
        /* Ensure the table container can grow */
        .card-body {
            overflow-x: auto;
        }
        
        /* Dropdown positioning fixes */
        .position-relative {
            overflow: visible !important;
        }
        
        .dropdown-container {
            overflow: visible !important;
            position: relative !important;
            z-index: 9998 !important;
        }
        
        /* Fixed dropdown positioning */
        .position-fixed {
            position: fixed !important;
            z-index: 99999 !important;
            background: white !important;
            border: 1px solid #dee2e6 !important;
            border-radius: 0.375rem !important;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
        }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/react-bootstrap@2.9.0/dist/react-bootstrap.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
            Container, 
            Row, 
            Col, 
            Form, 
            Button, 
            Card, 
            Alert,
            FormCheck,
            FormSelect,
            Table,
            InputGroup
        } = ReactBootstrap;

        function ReportTable({ data, headers, reportType, year }) {
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });
            const [filterText, setFilterText] = useState('');
            const [currentPage, setCurrentPage] = useState(1);
            const [itemsPerPage, setItemsPerPage] = useState(50);

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') {
                    direction = 'desc';
                }
                setSortConfig({ key, direction });
            };

            const filteredData = data.filter(row =>
                Object.values(row).some(value =>
                    String(value).toLowerCase().includes(filterText.toLowerCase())
                )
            );

            const sortedData = [...filteredData].sort((a, b) => {
                if (!sortConfig.key) return 0;
                
                const aValue = a[sortConfig.key];
                const bValue = b[sortConfig.key];
                
                if (aValue < bValue) return sortConfig.direction === 'asc' ? -1 : 1;
                if (aValue > bValue) return sortConfig.direction === 'asc' ? 1 : -1;
                return 0;
            });

            const indexOfLastItem = currentPage * itemsPerPage;
            const indexOfFirstItem = indexOfLastItem - itemsPerPage;
            const currentItems = sortedData.slice(indexOfFirstItem, indexOfLastItem);
            const totalPages = Math.ceil(sortedData.length / itemsPerPage);

            const getSortIcon = (key) => {
                if (sortConfig.key !== key) return '↕️';
                return sortConfig.direction === 'asc' ? '↑' : '↓';
            };

            const handleRefund = (row) => {
                // TODO: Implement refund functionality
                const confirm = window.confirm('Are you sure you want to refund this charge?\nThis action cannot be undone.');
                if (!confirm) return;
                row['year'] = year;
                console.log('Refund requested for row:', row);
                fetch('api/refund.php', {
                    method: 'POST',
                    body: JSON.stringify({ info: row })
                })
                    .then(response => response.text())
                    .then(data => {
                        console.log('Refund response:', data);
                        if (data.success) {
                            alert('Refund successful');
                            // refresh the report table
                            handleSubmit(new Event('submit'));
                        } else {
                            alert('Refund failed');
                        }
                    })
                    .catch(error => {
                        console.error('Refund error:', error);
                    });
            };

            return (
                <div>
                    <div className="d-flex justify-content-between align-items-center mb-3">
                        <InputGroup style={{ maxWidth: '300px' }}>
                            <InputGroup.Text>
                                <i className="bi bi-search"></i>
                            </InputGroup.Text>
                            <Form.Control
                                type="text"
                                placeholder="Filter data..."
                                value={filterText}
                                onChange={(e) => setFilterText(e.target.value)}
                            />
                        </InputGroup>
                        
                        <div className="d-flex align-items-center">
                            <span className="me-2">Show:</span>
                            <FormSelect
                                value={itemsPerPage}
                                onChange={(e) => setItemsPerPage(Number(e.target.value))}
                                style={{ width: '80px' }}
                            >
                                <option value={10}>10</option>
                                <option value={25}>25</option>
                                <option value={50}>50</option>
                                <option value={100}>100</option>
                            </FormSelect>
                            <span className="ms-2">entries</span>
                        </div>
                    </div>

                    <div className="table-responsive">
                        <Table striped bordered hover>
                            <thead className="table-dark">
                                <tr>
                                    {headers.map(header => (
                                        <th 
                                            key={header}
                                            style={{ cursor: 'pointer' }}
                                            onClick={() => handleSort(header)}
                                        >
                                            {header.indexOf('_') === -1 && (
                                                <>
                                                    {header} {getSortIcon(header)}
                                                </>
                                            )}
                                        </th>
                                    ))}
                                    {reportType === 'details' && (
                                        <th style={{ width: '100px' }}></th>
                                    )}
                                </tr>
                            </thead>
                            <tbody>
                                {currentItems.map((row, index) => (
                                    <tr key={index}>
                                        {headers.map(header => (
                                            <td key={header}>{row[header] || ''}</td>
                                        ))}
                                        {reportType === 'details' && (
                                            <td className="text-center">
                                                <Button
                                                    variant={row['Refunded'] === '1' ? "secondary" : "outline-danger"}
                                                    size="sm"
                                                    onClick={() => handleRefund(row)}
                                                    disabled={row['Refunded'] === '1'}
                                                >
                                                    {row['Refunded'] === '1' ? (
                                                        <>
                                                            <i className="bi bi-check-circle"></i> Refunded
                                                        </>
                                                    ) : (
                                                        <>
                                                            <i className="bi bi-arrow-clockwise"></i> Refund
                                                        </>
                                                    )}
                                                </Button>
                                            </td>
                                        )}
                                    </tr>
                                ))}
                            </tbody>
                        </Table>
                    </div>

                    <div className="d-flex justify-content-between align-items-center mt-3">
                        <div>
                            Showing {indexOfFirstItem + 1} to {Math.min(indexOfLastItem, sortedData.length)} of {sortedData.length} entries
                        </div>
                        <div>
                            <Button
                                variant="outline-secondary"
                                size="sm"
                                onClick={() => setCurrentPage(Math.max(1, currentPage - 1))}
                                disabled={currentPage === 1}
                                className="me-2"
                            >
                                Previous
                            </Button>
                            <span className="mx-2">
                                Page {currentPage} of {totalPages}
                            </span>
                            <Button
                                variant="outline-secondary"
                                size="sm"
                                onClick={() => setCurrentPage(Math.min(totalPages, currentPage + 1))}
                                disabled={currentPage === totalPages}
                            >
                                Next
                            </Button>
                        </div>
                    </div>
                </div>
            );
        }

        function MultiSelect({ options, selectedValues, onChange, placeholder }) {
            const [isOpen, setIsOpen] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            const dropdownRef = useRef(null);

            const filteredOptions = options.filter(option =>
                option.name.toLowerCase().includes(searchTerm.toLowerCase())
            );

            // Handle click outside to close dropdown
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) {
                        // Check if click is outside the dropdown content as well
                        const dropdownContent = document.querySelector('.position-fixed');
                        if (dropdownContent && !dropdownContent.contains(event.target)) {
                            setIsOpen(false);
                            setSearchTerm('');
                        }
                    }
                };

                document.addEventListener('mousedown', handleClickOutside);
                return () => {
                    document.removeEventListener('mousedown', handleClickOutside);
                };
            }, []);

            const handleSelect = (option) => {
                const isSelected = selectedValues.some(s => s.value === option.id);
                if (isSelected) {
                    onChange(selectedValues.filter(s => s.value !== option.id));
                } else {
                    onChange([...selectedValues, { value: option.id, label: option.name }]);
                }
                setSearchTerm('');
            };

            const handleRemove = (valueToRemove) => {
                onChange(selectedValues.filter(s => s.value !== valueToRemove));
            };

            const handleSelectAll = () => {
                if (selectedValues.length === options.length) {
                    // Deselect all individual schools (but keep "All Schools" if selected)
                    const allSchoolsSelected = selectedValues.filter(s => s.value === '0');
                    onChange(allSchoolsSelected);
                } else {
                    // Select all individual schools (but don't affect "All Schools")
                    const allSchoolsOption = selectedValues.filter(s => s.value === '0');
                    const allIndividualSchools = options.map(option => ({ value: option.id, label: option.name }));
                    onChange([...allSchoolsOption, ...allIndividualSchools]);
                }
            };

            return (
                <div className="position-relative dropdown-container">
                    <div 
                        className="form-control d-flex flex-wrap align-items-center"
                        style={{ minHeight: '38px', cursor: 'pointer' }}
                        onClick={() => setIsOpen(!isOpen)}
                        ref={dropdownRef}
                    >
                        {selectedValues.length === 0 ? (
                            <span className="text-muted">{placeholder}</span>
                        ) : (
                            <>
                                {selectedValues.map((selected, index) => (
                                    <span 
                                        key={selected.value}
                                        className="badge bg-primary me-1 mb-1"
                                        style={{ fontSize: '0.8rem' }}
                                    >
                                        {selected.label}
                                        <button
                                            type="button"
                                            className="btn-close btn-close-white ms-1"
                                            style={{ fontSize: '0.6rem' }}
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                handleRemove(selected.value);
                                            }}
                                        />
                                    </span>
                                ))}
                            </>
                        )}
                        <i className={`bi bi-chevron-${isOpen ? 'up' : 'down'} ms-auto`}></i>
                    </div>

                    {isOpen && (
                        <div 
                            className="position-fixed bg-white border rounded shadow-sm" 
                            style={{ 
                                zIndex: 99999, 
                                maxHeight: '300px', 
                                overflowY: 'auto', 
                                width: dropdownRef.current ? dropdownRef.current.offsetWidth + 'px' : '100%',
                                top: dropdownRef.current ? dropdownRef.current.getBoundingClientRect().bottom + 'px' : '0px',
                                left: dropdownRef.current ? dropdownRef.current.getBoundingClientRect().left + 'px' : '0px'
                            }} 
                        >
                            <div className="p-2 border-bottom">
                                <input
                                    type="text"
                                    className="form-control form-control-sm"
                                    placeholder="Search schools..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    onClick={(e) => e.stopPropagation()}
                                />
                            </div>
                            
                            <div className="p-2 border-bottom">
                                <FormCheck
                                    type="checkbox"
                                    checked={selectedValues.filter(s => s.value !== '0').length === options.length && options.length > 0}
                                    onChange={handleSelectAll}
                                    label="Select All Schools"
                                    className="fw-bold"
                                />
                            </div>
                            
                            <div>
                                <div
                                    className="px-2 py-1 d-flex align-items-center"
                                    style={{ cursor: 'pointer' }}
                                    onClick={() => {
                                        const isSelected = selectedValues.some(s => s.value === '0');
                                        if (isSelected) {
                                            onChange(selectedValues.filter(s => s.value !== '0'));
                                        } else {
                                            onChange([...selectedValues, { value: '0', label: 'All Schools' }]);
                                        }
                                    }}
                                    onMouseEnter={(e) => e.target.style.backgroundColor = '#f8f9fa'}
                                    onMouseLeave={(e) => e.target.style.backgroundColor = 'transparent'}
                                >
                                    <FormCheck
                                        type="checkbox"
                                        checked={selectedValues.some(s => s.value === '0')}
                                        onChange={() => {}} // Handled by parent div
                                        className="me-2"
                                    />
                                    <span className="fw-bold">All Schools</span>
                                </div>
                                {filteredOptions.map(option => (
                                    <div
                                        key={option.id}
                                        className="px-2 py-1 d-flex align-items-center"
                                        style={{ cursor: 'pointer' }}
                                        onClick={() => handleSelect(option)}
                                        onMouseEnter={(e) => e.target.style.backgroundColor = '#f8f9fa'}
                                        onMouseLeave={(e) => e.target.style.backgroundColor = 'transparent'}
                                    >
                                        <FormCheck
                                            type="checkbox"
                                            checked={selectedValues.some(s => s.value === option.id)}
                                            onChange={() => {}} // Handled by parent div
                                            className="me-2"
                                        />
                                        <span>{option.name}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AccountingReportForm() {
            const [formData, setFormData] = useState({
                year: '',
                schools: [{ value: '0', label: 'All Schools' }],
                reportType: '',
                baseOptions: [],
                soldierOptions: [],
                detailsOptions: []
            });

            const [schools, setSchools] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');
            const [isFormExpanded, setIsFormExpanded] = useState(true);
            const [reportData, setReportData] = useState(null);
            const [generatingReport, setGeneratingReport] = useState(false);
            const [years, setYears] = useState([]);
            
            // Add Payment form state
            const [paymentForm, setPaymentForm] = useState({
                school: '0',
                paymentType: '0',
                paymentMethod: 'cash',
                amount: ''
            });
            const [addingPayment, setAddingPayment] = useState(false);
            const [paymentMessage, setPaymentMessage] = useState('');
            const [isPaymentFormOpen, setIsPaymentFormOpen] = useState(false);

            const reportTypes = {
                'base': 'Base Charges Report',
                'soldier': 'Soldier Charges Report',
                'summary': 'Summary Transactions Report',
                'details': 'Details Transactions Report',
                'base_discounts': 'View / Add Base Vouchers',
                'soldier_discounts': 'View / Add Soldier Vouchers',
                'settings': 'Update Base Registration Settings',
                'types': 'Update School Types',
                'unregister': 'Unregister Base / Soldiers'
            };

            const baseOptions = {
                'base_type': 'Registration Type',
                'school_number': 'Base Number',
                'school_name': 'Base Name',
                'date_registered': 'Date Registered',
                'chayolei_fee': 'Chayolei Fee',
                'chayolei_paid': 'Chayolei Fee Paid',
                'chidon_fee': 'Chidon Fee',
                'chidon_paid': 'Chidon Fee Paid',
                'prior_balance': 'Prior Balance',
                'prior_balance_paid': 'Prior Balance Paid',
                'total_owed': 'Total Owed',
                'base_discount': 'Base Discount',
                'total_paid': 'Total Paid',
                'total_balance': 'Base Balance',
                'registered_chayolim': 'Soldiers Registered'
            };

            const soldierOptions = {
                'reg_type': 'Registration Type',
                'school_number': 'Base Number',
                'school_name': 'Base Name',
                'user_serial': 'User Serial',
                'grade': 'Grade',
                'user_name': 'User Name',
                'date_registered': 'Date Registered',
                'reg_fee': 'Registration Fee',
                'reg_paid': 'Registration Paid',
                'soldier_discount': 'Coupon Discount',
                'total_balance': 'Balance'
            };

            const detailsOptions = {
                'reg_type': 'Registration Type',
                'school_number': 'Base Number',
                'school_name': 'Base Name',
                'user_serial': 'User Serial',
                'user_name': 'User Name',
                'type': 'Type',
                'code': 'Code',
                'reg_date': 'Registration Date',
                'reg_amount': 'Amount',
                'refunded': 'Refunded'
            };

            // Payment types and methods
            const paymentTypes = [
                { value: '0', label: 'Choose Payment Type' },
                { value: 'chayolei', label: 'Chayolei' },
                { value: 'chidon', label: 'Chidon' },
                { value: 'tanya', label: 'Tanya' },
                { value: 'rewards', label: 'Rewards Program' },
                { value: 'past_due', label: 'Past Dues' }
            ];

            const paymentMethods = [
                { value: 'cash', label: 'Cash' },
                { value: 'check', label: 'Check' },
                { value: 'credit_card', label: 'Credit Card' },
                { value: 'wire', label: 'Wire Transfer' }
            ];

            // Load schools data
            useEffect(() => {
                const timeoutId = setTimeout(() => {
                    if (loading) {
                        setError('Request timed out. Please check your connection and try again.');
                        setLoading(false);
                    }
                }, 10000); // 10 second timeout

                fetch('api/getSchools.php')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        clearTimeout(timeoutId);
                        console.log('API Response:', data); // Debug log
                        
                        // Handle different possible data structures
                        let schoolsArray = [];
                        let yearsArray = [];
                        
                        if (data.schools) {
                            // If schools is an object with id/name pairs, convert to array
                            if (typeof data.schools === 'object' && !Array.isArray(data.schools)) {
                                schoolsArray = Object.entries(data.schools).map(([id, name]) => ({
                                    id: id,
                                    name: name
                                }));
                            } else if (Array.isArray(data.schools)) {
                                schoolsArray = data.schools;
                            }
                        }
                        
                        if (data.years) {
                            yearsArray = Array.isArray(data.years) ? data.years : [];
                        }
                        
                        console.log('Processed schools:', schoolsArray); // Debug log
                        console.log('Processed years:', yearsArray); // Debug log
                        
                        setSchools(schoolsArray);
                        setYears(yearsArray);
                        setFormData(prev => ({
                            ...prev,
                            year: yearsArray.length > 0 ? yearsArray[0] : ''
                        }));
                        setLoading(false);
                    })
                    .catch(err => {
                        clearTimeout(timeoutId);
                        console.error('Error loading schools:', err);
                        setError('Failed to load schools: ' + err.message);
                        setLoading(false);
                    });

                return () => clearTimeout(timeoutId);
            }, []);

            const handleInputChange = (field, value) => {
                setFormData(prev => ({
                    ...prev,
                    [field]: value
                }));
            };

            const handleSchoolChange = (selectedOptions) => {
                setFormData(prev => ({
                    ...prev,
                    schools: selectedOptions
                }));
            };

            const handleOptionChange = (optionType, option, checked) => {
                setFormData(prev => ({
                    ...prev,
                    [optionType]: checked 
                        ? [...prev[optionType], option]
                        : prev[optionType].filter(item => item !== option)
                }));
            };

            const showOptionsForReportType = (reportType) => {
                return reportType === 'base' || reportType === 'soldier' || reportType === 'details';
            };

            const getOptionsForReportType = (reportType) => {
                switch (reportType) {
                    case 'base':
                        return baseOptions;
                    case 'soldier':
                        return soldierOptions;
                    case 'details':
                        return detailsOptions;
                    default:
                        return {};
                }
            };

            const validateForm = () => {
                if (!formData.reportType) {
                    alert('Please select a report type');
                    return false;
                }

                if (formData.schools.length === 0) {
                    alert('Please select at least one school');
                    return false;
                }

                if (showOptionsForReportType(formData.reportType)) {
                    const optionsKey = formData.reportType + 'Options';
                    if (formData[optionsKey].length === 0) {
                        alert(`Please select at least one option for the ${reportTypes[formData.reportType]} report`);
                        return false;
                    }
                }

                return true;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                if (!validateForm()) {
                    return;
                }

                setGeneratingReport(true);

                // Create form data for submission
                const submitData = new FormData();
                submitData.append('year', formData.year);
                submitData.append('report_type', formData.reportType);
                
                formData.schools.forEach(school => {
                    submitData.append('school_id[]', school.value);
                });

                if (showOptionsForReportType(formData.reportType)) {
                    const optionsKey = formData.reportType + 'Options';
                    formData[optionsKey].forEach(option => {
                        submitData.append(`${formData.reportType}_options[]`, option);
                    });
                }

                // check if current url has a get parameter called debug
                const urlParams = new URLSearchParams(window.location.search);
                const debug = urlParams.get('debug');
                if (debug) {
                    submitData.append('debug', true);
                }

                // Handle special report types that require redirect
                const specialReports = {
                    // base_discounts: '/reports/registration/discounts.php',
                    // soldier_discounts: '/reports/registration/create_user_discount.php',
                    settings: '/reports/schools/registration_info.php',
                    unregister: '/admin_yearly.php',
                    types: '/types_of_schools.php'
                };

                const reportType = formData.reportType;
                if (specialReports[reportType]) {
                    let url = specialReports[reportType];
                    let schools = '';
                    if (formData.schools.length > 0 && Number(formData.schools[0].value) > 0) {
                        schools = formData.schools.map(s => s.value).join(',');
                    }
                    if (['summary', 'settings'].includes(reportType)) {
                        url += `?year=${formData.year}&schools=${schools}`;
                    } else {
                        url += `?schools=${schools}`;
                    }
                    window.location.href = url;
                    setGeneratingReport(false);
                    return;
                }

                let url
                switch (formData.reportType) {
                    case 'summary':
                        url = 'api/getSummary.php';
                        break;
                    case 'base_discounts':
                        url = 'api/getBaseDiscounts.php';
                        break;
                    case 'soldier_discounts':
                        url = 'api/getSoldierDiscounts.php';
                        break;
                    default:
                        url = 'api/create_report.php';
                        break;
                }

                // Handle normal report types
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        body: submitData
                    });

                    if (response.ok) {
                        const data = await response.json();
                        setReportData(data);
                        setIsFormExpanded(false); // Collapse form after successful report generation
                        setIsPaymentFormOpen(true); // Open payment form after report generation
                    } else {
                        throw new Error('Failed to generate report');
                    }
                } catch (error) {
                    setError('Failed to generate report: ' + error.message);
                } finally {
                    setGeneratingReport(false);
                }
            };

                    ...reportData.data.map(row => 
                        headers.map(header => {
                            const value = row[header] || '';
                            return `"${String(value).replace(/"/g, '""')}"`;

                    )
                ].join('\n');
                
                const blob = new Blob([csvContent], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `accounting_report_${formData.year}_${formData.reportType}.csv`;
                document.body.appendChild(a);
                a.click();

                                    <Form.Control

                                        value={discountForm.amount}

                                Retry

                            <Card.Body>
                                {formData.reportType === 'base' && (
                                    <Alert variant="warning" className="alert-custom mb-4">
                                        <h6>
                                            <i className="bi bi-exclamation-triangle"></i> Important Information
                                        </h6>
                                        <p className="mb-0">
                                            The list of schools is based on those with any registered children for the current year and are not test schools.<br />
                                            The number of registered children reflects those currently registered for the current year.
                                        </p>
                                    </Alert>
                                )}
                                <ReportTable data={reportData.data} headers={reportData.headers} reportType={formData.reportType} year={formData.year} />
                            </Card.Body>
                        </Card>
                    )}
                </Container>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AccountingReportForm />);
    </script>
</body>
</html>
