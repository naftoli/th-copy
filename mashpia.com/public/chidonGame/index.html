    <script>
      const NUM_TEAMS = 2

      let t1 = ''

      $(function () {
        let htmlNames = ''
        for (let i = 0; i < teams.length; i++) {

        }
        $(".teamNames").append(htmlNames)
    		
    		$("#update").click( function() {
    			let tTotal = 0;
          t1 = $("#tName1").val()
          t2 = $("#tName2").val()

    			$(".t1 span").text(t1);
    			$(".t2 span").text(t2);

          $(".t1n").text(t1)
          $(".t2n").text(t2)

          // since the teams are right to left it's the opposite of how they are displayed
          $(".team_name").eq(1).text(t1);
          $(".team_name").eq(0).text(t2);

          $(".team").eq(0).val(t1)
          $(".team").eq(1).val(t2)
        })

        // set team 2 to second option
        $(".teamNames").eq(1).val(teams[1])
        // wait a few ms
        setTimeout(() => {
          // and update
          $("#update").trigger('click')
        }, 100)
          
        $(".setPoints").click( function() {
          let points = parseInt($(this).prev('input').val());
          if (!isNaN(points)) {
            let team = '.team' + $(this).parent().attr('id');
            $(team).text(points);
            // $(team).fadeOut(300).delay().fadeIn().fadeOut(300).
            //   delay().fadeIn().fadeOut(300).delay().fadeIn().text(points);
          }
        })
          
        $(".givePoints button").click( function() {
          let val = $(this).text();
          if (val == 'Go') {
            val = $(this).prev('input').val();
          } else if (val == 'Set') {
            return;
          }
          
          if (val != '') {
            let points = parseInt(val);
            let id = $(this).parent().attr('id');
            let team = '.team' + id;
            let curPoints = parseInt($(team).text());
            curPoints += points;
            if (!isNaN(curPoints)) {
                $(team).text(curPoints);
                // $(team).fadeOut(300).delay().fadeIn().fadeOut(300).
                //   delay().fadeIn().fadeOut(300).delay().fadeIn().text(curPoints);
                //updateTable(id);
              }
          }
        })
    		
    		$("#save1").click( function() {

            // $("#round1 .t4p").text(team4);

    	function updateTable(id) {
    		setTimeout(function() {

      let total = 40
      function generateHtml(num_container) {
        // let html
        // if (num_container == 2) html = `<div id="bolts_container_${num_container}" style="float: right; padding-left: 30px;"><div class="bolts">`
        // else html = `<div id="bolts_container_${num_container}" style="float: left"><div class="bolts">`
        let html = `<div id="bolts_container_${num_container}"><div class="bolts" style="float: left; margin-bottom: 20px;">`
        let rows = 5
        let columns = 8

        outer:
          for (let i = 0; i < rows; i++) {
            for (let j = 1; j <= columns; j++) {
              let number = i * columns + j
              if (number > total) break outer
              html += `<img id="bolt_image_${num_container}_${number}" src="bolts/Lightning_Yellow.png" />`;
            }
            html += '<br />'
          }
        html += "</div>"
        html += `<div class="action">`
        html += `<select class="team" disabled>`
        for (let i = 0; i < teams.length; i++) {
          html += `<option>${teams[i]}</option>`
        }
        html += '</select>&nbsp;&nbsp;&nbsp;'
        html += `<select id="bolt_${num_container}">`
        for (let k = 1; k <= (total + 1); k++) {
          html += `<option value=${k}>${k}</option>`
        }
        html += `</select><br />`
        html += "<div class='buttons' style='margin-top: 10px; margin-bottom: 10px;'><button class='mark' data-action='correct'>Correct</button>" +
          "<button class='mark' data-action='incorrect'>Incorrect</button>"
        html += "<button class='mark' data-action='reset'>Reset</button></div><div><button class='mark' data-action='resetAll'>Reset All</button></div>"
        html += `</div></div>`
        $("#main").append(html)
      }

      function updatePoints(container, action = 'add') {
        // find team name and number
        let team_number = 0
        let team_name = $(container).find('.team').val()
        // find out if this name is for team 1 or team 2
        if (team_name == $('.teamNames').eq(0).val()) team_number = 1
        else if (team_name == $('.teamNames').eq(1).val()) team_number = 2
        console.log(team_number, team_name)
        if (team_number) {
          // add 10 points to team
          let elem = '.team' + team_number
          let amount = parseInt($(elem).text())
          if (action == 'add') amount += 10
          else if (action == 'subtract') amount -= 10
          $(elem).text(amount)
        }
      }

      $( function () {
        for ($i = 1; $i <= 2; $i++) {
          generateHtml($i)
        }
      })

      $(document).on('click', '.mark', function() {
        // first find the outer bolts container
        let default_image = 'bolts/Lightning_Yellow.png'
        let action = $(this).data('action')
        let container = '#' + $(this).parent().parent().parent().attr('id')
        let container_num = container[container.length - 1]

        let number = $(container).find('#bolt_' + container_num).val()
        let team = $(container).find('.team').val()

        let id = 'bolt_' + container_num
        let elem = 'bolt_image_' + container_num + '_' + number

        if (action === 'correct') {
          if (number == (total + 1)) return
          document.getElementById(id).value = ++number
          document.getElementById(elem).src = 'bolts/Lightning_Green.png'
          updatePoints(container)
        } else if (action === 'incorrect') {
          if (number == (total + 1)) return
          document.getElementById(id).value = ++number
          document.getElementById(elem).src = 'bolts/Lightning_Red.png'
        } else if (action === 'reset') {
          if (number > 1) {
            document.getElementById(id).value = --number
            elem = 'bolt_image_' + container_num + '_' + number
            const old_img = document.getElementById(elem).src
            console.log(old_img)
            document.getElementById(elem).src = default_image
            if (old_img.includes('bolts/Lightning_Green.png')) {
              updatePoints(container, 'subtract')
            }
          }
        }

        if (action === 'resetAll') {
          for (let i = 1; i <= total; i++) {
            elem = 'bolt_image_' + container_num + '_' + i
            document.getElementById(elem).src = default_image
          }
          document.getElementById(id).value = 1
        }
      })

      $("#scoreColorBtn").click(function() {
        let color = $("#scoreColor").val()
        $(".t1 span").css("color", color)
        $(".t2 span").css("color", color)
        $(".team1").css("color", color)
        $(".team2").css("color", color)
      })

      $("#boltColorBtn").click(function() {
        let color = $("#boltColor").val()
        $(".bolts").css("background-color", color)
        $(".team1").css("background-color", color)
        $(".team2").css("background-color", color)
      })
