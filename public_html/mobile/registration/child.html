<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Tzivos Hashem | Add Child</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro" rel="stylesheet">
    <script defer src="https://use.fontawesome.com/releases/v5.0.9/js/all.js" integrity="sha384-8iPTk2s/jMVj81dnzb/iFR2sdA7u06vHJyyLlAd4snFpCl/SnyUjRrbdJsw1pGIl" crossorigin="anonymous"></script>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css" integrity="sha384-9gVQ4dYFwwWSjIDZnLEWnxCjeSWFphJiwGPXr1jddIhOegiu1FwO5qRGvFXOdJZ4" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="css/main.css" />
    <link rel="stylesheet" type="text/css" media="screen" href="loader.css" />
</head>
<body>
    <header>
        <span id="title">ADD CHILD</span>
    </header>
    <div id="pages">
        <section id="welcome">
            <div class="container">
                <div class="row" id="welcome-message" >
                    <div class="col-12">
                        <h1>Welcome To Tzivos Hashem</h1>
                        <h2>Is your childs school* registered as a Tzivos Hashem base?</h2>
                    </div>
                </div>
                <div class="row" id="welcome-buttons">
                    <div class="col-6">
                        <button class="navigation-button btn btn-lg btn-success" data-id="th-base">Yes</button>
                    </div>
                    <div class="col-6">
                        <button class="navigation-button btn btn-lg btn-danger" data-id="no-th-base">No</button>
                    </div>
                </div>
                <p class="subtext">*MyShliach is not counted as a school. If your child is in MyShliach please press "No"</p>
            </div>
        </section>
        
        <section id="th-base">
            <div class="container">
                <div class="row">
                    <div class="col-12 centered">
                        <a class="navigation-button btn btn-info" data-id="no-th-base" href="#">
                            Actually, my child does not have a base...
                        </a>
                    </div>
                </div>
                <form id="th-base-child" class="child-form">
                    <div class="row">
                        <div class="col-12">
                            <div class="input-group">
                                <span class="input-group-btn">
                                    <img src="/mobile/img_new/school-2-color-gray-svg.svg" width="75" />  
                                </span>
                                <select class="form-control form-control-lg" id="school_id" name="school_id" required>
                                    <option value="" selected disabled>Base (School)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div class="input-group">
                                <span class="input-group-btn">
                                    <img src="/mobile/img_new/arrow-down-color-gray-svg.svg" width="75" />  
                                </span>
                                <select class="form-control form-control-lg" id="class_id" name="class_id" required>
                                    <option value="" selected disabled>Platton (Grade)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div class="input-group">
                                <span class="input-group-btn">
                                    <img src="/mobile/img_new/profile-1-color-gray-svg.svg" width="75" />  
                                </span>
                                <select class="form-control form-control-lg" id="last" name="last" required>
                                    <option value="" selected disabled>Last Name</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div class="input-group">
                                <span class="input-group-btn">
                                    <img src="/mobile/img_new/calendar-color-gray-svg.svg" width="75" />  
                                </span>
                                <input type="date" class="form-control" id="dob" name="dob" placeholder="English Birthday" required>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <input type="submit" class="btn btn-primary" value="Add Child" />
                        </div>
                    </div>
                </form>
            </div>
        </section>
        
        <section id="no-th-base">
            <div class="container">
                <div class="row">
                    <div class="col-12 centered">
                        <a class="navigation-button btn btn-info" data-id="th-base" href="#">
                            Actually, my child does have a base....
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </div>
    

    <!-- Jquery, Popper.js and Bootstrap -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.0/umd/popper.min.js" integrity="sha384-cs/chFZiN24E4KMATLdqdvsezGxaGsi4hLGOzlXwp5UZB1LY//20VyM2taTB4QvJ" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/js/bootstrap.min.js" integrity="sha384-uefMccjFJAIv6A+rW+L4AHf99KvxDjWSu1z9VI8SKNVmz4sk7buKt/6v9KI65qnm" crossorigin="anonymous"></script>
    <!-- Our JavaScript files -->
    <script src="/mobile/js/authenticate.js"></script>
    <script src="js/child.js"></script>
</body>
</html>
