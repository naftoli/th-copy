<!DOCTYPE html>
<html>
    <head>
        <title>Testing Page</title>
    </head>
    <body>
        <button id="button">Click me</button>
    </body>
    <script src="js/jquery-1.7.1.min.js"></script>
    <script src="cordova/angular.js"></script>
    <script src="cordova/dist/ng-cordova.js"></script>
    <script src="cordova/cordova.js"></script>
    <script>
        // ES5 JavaScript
        document.addEventListener('ondeviceready', function(){
          IonicNative.Camera.getPicture().then(
            function(res) {
              console.log("We have taken a picture!", res);
              // Run code to save the picture or use it elsewhere
            },
            function(err){
              console.error("Error taking a picture", err);
            }
          );
        });

        $("#button").click( function(){
          IonicNative.BarcodeScanner.scan().then(
            function(res) {
              alert(res);
            },
            function(err){
              alert(err);
            }
          );
        });
        /*
        // ES6 JavaScript
        import { BarcodeScanner } from 'ionic-native';
        BarcodeScanner.scan().then((barcodeData) => {
         // Success! Barcode data is here
        }, (err) => {
            // An error occurred
        });
        */
    </script>
</html>
