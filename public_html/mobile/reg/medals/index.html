		<script>
        document.addEventListener("DOMContentLoaded", function(event) {
            var carousel = "";
            var loop = 0;

            $(window).load(function(){
                $( ".sky-carousel" ).unbind();
                $( ".slider img" ).click( function() {
					var item_id = $( this ).attr( "id" );
					var from_id = 0;
                    $( ".slider img" ).each( function() {
						if ( $(this).attr('class') == "active" ) {
							from_id = parseInt($(this).attr("id").replace("item","")) + 1;
						}
                        $( this ).removeClass( "active" );
                    });

                    $( "#item"+item_id ).addClass( "active" );
                    item_id = item_id.replace( "item", "" );
					var duration = Math.abs( parseInt( item_id ) + 1 - from_id ); // one duration unit for each medal it needs to pass
                    if( item_id == "0" ) {
                        carousel.select(0, duration); // go to the first element
                    } else {
                        carousel.select(parseInt(item_id), duration); // or go to the selected item
                    }
                });
                //if( /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ) {
                //}
            });
            
            var url = location.toString();
    		var pos = url.indexOf( '=' ); 
    		var id = url.substring( pos+1 );
            
            $(function() {
            	var admin_id = Cookies.get('admin');
    			$.post('/mobile/reg/ajax/checkAuth.php', { user_id : id, admin_id : admin_id }, function( success ) {
    				if (success === "0") {
    					window.location = "/mobile";
    				}
    			});
    			
    			$("#logOff").click( function() {
    				Cookies.remove('admin', { path: '/' });
    				Cookies.remove('admin_id', { path: '/' });
    				window.location = "/mobile/reg/";
    			});
    		});
    		
    		$("#carouselLink").attr('href', '../rank.html?id=' + id);
    		$("#missionsLink").attr('href', '../../missionsNew.html?id=' + id);
    		$("#goalsLink").attr('href', '../../goalsNew.html?id=' + id);
    		$("#rankLink").attr('href', '../rank.html?id=' + id);
    		$("#storeLink").attr('href', '../../store/index.html?id=' + id);

    		$.post('ajax/getPoints.php', { user_id : id }, function( success ) {
    			$(".points").append(success + ' miles');
    			$("#points").val( success );
    		});
    		
    		$.post('ajax/getUserInfo.php', { user_id : id }, function( success ) {
    			var user = $.parseJSON( success );
    			
    			var grade = user.class_grade;
    			if (user.class_sub) grade += '-' + user.class_sub;
    			
    			$("#rank").text( user.rank_name );
    			$("#name").text( user.lang_id === "2" ? user.first_he + ' ' + user.last_he : user.first + ' ' + user.last );
				$("#serial").text( user.user_serial );
    			$("#grade").text( grade );
    			$("#teacher").text( user.class_teacher );
    			
    			if (user.mobile_pic) {
    				$("#userImg").attr('src', '../' + user.mobile_pic);
    			} else if (user.thumb) {
    				$("#userImg").attr('src', 'https://mashpia.com/thumbs/' + user.thumb);
    			} else if (user.user_photo_id) {
    				$("#userImg").attr('src', 'https://mashpia.com/file_view.php?id=' + user.user_photo_id);
    			} else {
    				$("#userImg").attr('src', 'https://mashpia.com/mobile/reg/images/profile-photo-default.jpg');
    			}
    			if (user.logo && (!user.logo_2 || user.gender === "M")) {
    				$("#logo").attr('src', 'https://mashpia.com/schoolLogos/' + user.logo);
    			} else if(user.logo_2) {
					$("#logo").attr('src', 'https://mashpia.com/schoolLogos/' + user.logo_2);
				} else {
    				$("#logo").attr('src', 'https://mashpia.com/schoolLogos/TH-Blank Logo.gif');
    			}
    			
    			var rank = parseInt( user.rank_ord ) - 1;
    			if (rank > 8) rank = 8;

    	        $(".sky-carousel-container li img").css({"width":"100px","height":"180px"});
    	        $(".sky-carousel").css("height","200px");
    	        setTimeout( function() {
    	            $( function() {
    	                carousel = $('.sky-carousel').carousel({
    	                    itemWidth: 100,
    	                    itemHeight: 180,
    	                    distance: 40,
    	                    startIndex: 0,
    	                    autoSlideshowDelay: 1,
    	                    loop : false,
    	                    selectedItemDistance: 20,
    	                    selectedItemZoomFactor: 1,
    	                    unselectedItemZoomFactor: 0.7,
    	                    unselectedItemAlpha: 0.2,
    	                    topMargin: 10,
    	                    preload:true,
    	                    showPreloader:true,
    	                    navigationButtonsVisible: false,
    	                    gradientStartPoint: 0.5,
    	                    gradientEndPoint: 1,
    	                    reflectionDistance:100,
    	                    gradientOverlayColor: "#f5f5f5",
    	                    gradientOverlaySize: 100,
    	                    slideSpeed: 1,
    	                    enableMouseWheel : false,
    	                    selectByClick: false
    	                });
    	                carousel.startAutoSlideshow();
    	
    	                carousel.on('itemSelected.sc', function(evt) {
    	                    var item = evt.item.index();
    	                    if (item == 1 && rank == 0) { // go back to the first element if the user is a private
    	                    	carousel.selectPrevious(1);
    	                    	carousel.stopAutoSlideshow();
    	                    	return;
    	                    }
    	                    var next_item = parseInt(item) + 1;
    	                    $(".slider img").each(function(){
    	                        $(this).removeClass("active");
    	                    });
							
    	                    $(".slider img:nth-child("+next_item+")").addClass("active");
    	                    
    	                    $(".real").attr('style', 'opacity: 0.3');
    	                    $("#" + next_item).find(".real").attr('style', 'opacity: 1');
    	                    
    	                    if (item == rank){
    	                    	$(".medalPic").attr('style', 'opacity: 1');
    	                        carousel.stopAutoSlideshow();
    	                        loop ++;
    	                    } else {
    	                        if( loop == 0 ) {
    	                            carousel.startAutoSlideshow();
    	                        } else {
    	                            carousel.stopAutoSlideshow();
    	                        }
    	                    }
    	                });
    	            });
    	        }, 1000);
    		});
    		
    		$(".header-edit").click( function() {
    			window.location = '/mobile/reg/re_register.html?child=' + id + '&e=1';
    		});
    		
    		$.post('ajax/getMedalInfo.php', { user_id : id }, function( success ) {
    			var medals = $.parseJSON( success );
    			
    			var html = '<div>';
    			for (var i in medals) {
    				var medal = medals[i];
    				if (i % 3 == 0 && i < 10) {
    					html += '</div></div><div class="span12"><div class="l-3 medal_row">';
    				}

    				html += '<div class="span4 medal_row_item" style="text-align: center;">';

    				html += '<a href="https://mashpia.com/mobile/reg/medals3.html?id=' + id + '&subject=' + medal.id + '">';
    				if (medal.photo != '')
    					html += '<img class="medal" src="https://mashpia.com/file_view.php?id=' + medal.photo + '">';
    				else 
    					html += '<img class="medal" src="https://mashpia.com/kiosk/images/medals/holder.png">';
    				html += '</a><div class="medal-sub" style="background-image: url(images/bot-caption.png);">\
    								<div style="display: table;width: 100%;"><span>' + medal.name + '</span></div>\
    							</div>\
    							<span>' + medal.left + ' to Level ' + medal.next + '</span>\
    						</div>';
    			}
    			html += '</div></div>';
    			$("#medals").append( html );
            });
		});
		</script>
