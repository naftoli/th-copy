		<script>
        document.addEventListener("DOMContentLoaded", function(event) {
            var carousel = "";
            var loop = 0;

            $(window).load(function(){
                $( ".sky-carousel" ).unbind();
                // when an items dot is clicked, send the carosel to that item
                $( ".slider img" ).click( function() {
					var item_id = $( this ).attr( "id" );
					var from_id = 0;
                    $( ".slider img" ).each( function() {
						if ( $(this).attr('class') == "active" ) {
							from_id = parseInt($(this).attr("id").replace("item","")) + 1;
						}
                        $( this ).removeClass( "active" );
                    });

                    $( "#item"+item_id ).addClass( "active" );
                    item_id = item_id.replace( "item", "" );
					var duration = Math.abs( parseInt( item_id ) + 1 - from_id ); // one duration unit for each medal it needs to pass
                    if( item_id == "0" ) {
                        carousel.select(0, duration); // go to the first element
                    } else {
                        carousel.select(parseInt(item_id), duration); // or go to the selected item
                    }
                });
            }); // end on window load

            // get the ID of the current user
            var url = location.toString();
            var id = url.substring( url.indexOf( '=' ) + 1 );
            // authenticate the user with authenticate.js
            authenticate( id );
            // update the UI for children over parents
            if( localStorage.getItem( "login" ) == "user" ){
                $("#mainLink").attr('href', "/mobile/news");
                $("#mainLink img").attr('src', "/mobile/img_new/news-color-green-svg.svg");
                $("#mainLink .menu-item #main-title").text("News");
                $(".header-edit").hide(); // no editing
            }
    		
    		$("#carouselLink").attr('href', '../rank.html?id=' + id);
    		$("#missionsLink").attr('href', '../../missionsNew.html?id=' + id);
    		$("#goalsLink").attr('href', '../../goalsNew.html?id=' + id);
    		$("#rankLink").attr('href', '../rank.html?id=' + id);
            $("#storeLink").attr('href', '../../store/index.html?id=' + id);
            
            // set the Miles total
    		$.post('ajax/getPoints.php', { user_id : id }, function( success ) {
    			$(".points").append(success + ' miles');
    			$("#points").val( success );
    		});
			
			// get raffle eligibility info
			$.post('ajax/getRaffleInfo.php', { user_id : id }, function( response ) {
                if ( response ) {
                    $("#raffleInfoBanner").show();
                    $("#raffleInfo").append( response );
                }
			});
            
            // get the user's information and update the UI
    		$.post('ajax/getUserInfo.php', { user_id : id }, function( success ) {
    			var user = $.parseJSON( success );
    			// get the users grade
    			var grade = user.class_grade;
    			if (user.class_sub) grade += '-' + user.class_sub;
    			// update the information on the page
    			$("#rank").text( user.rank_name );
    			$("#name").text( user.lang_id === "2" ? user.first_he + ' ' + user.last_he : user.first + ' ' + user.last );
				$("#serial").text( user.user_serial );
    			$("#grade").text( grade );
    			$("#teacher").text( user.class_teacher );
    			// set the users profile picture
    			if (user.mobile_pic) {
    				$("#userImg").attr('src', '../' + user.mobile_pic);
    			} else if (user.thumb) {
    				$("#userImg").attr('src', '/thumbs/' + user.thumb);
    			} else if (user.user_photo_id) {
    				$("#userImg").attr('src', '/file_view.php?id=' + user.user_photo_id);
    			} else {
    				$("#userImg").attr('src', '/mobile/reg/images/profile-photo-default.jpg');
                }
                // set the school logo
    			if (user.logo && (!user.logo_2 || user.gender === "M")) {
    				$("#logo").attr('src', '/schoolLogos/' + user.logo);
    			} else if(user.logo_2) {
					$("#logo").attr('src', '/schoolLogos/' + user.logo_2);
				} else {
    				$("#logo").attr('src', '/schoolLogos/TH-Blank Logo.gif');
    			}
    			// get the rank for the user
    			var rank = parseInt( user.rank_ord ) - 1;
                if (rank > 8) rank = 8;
                // set the images to be the correct size
    	        $(".sky-carousel-container li img").css( { "width" : "100px" , "height" : "180px" } );
                $(".sky-carousel").css( { "width" : "100%", "margin" : "0px" } );
                // setup the carosel in 1 second
    	        setTimeout( function() {
    	            $( function() {
    	                carousel = $('.sky-carousel').carousel({
    	                    itemWidth: 100,
    	                    itemHeight: 180,
    	                    distance: 40,
    	                    startIndex: 0,
    	                    autoSlideshowDelay: 1,
    	                    loop : false,
    	                    selectedItemDistance: 20,
    	                    selectedItemZoomFactor: 1,
    	                    unselectedItemZoomFactor: 0.7,
    	                    unselectedItemAlpha: 0.2,
    	                    topMargin: 10,
    	                    preload:true,
    	                    showPreloader:true,
    	                    navigationButtonsVisible: false,
    	                    gradientStartPoint: 0.5,
    	                    gradientEndPoint: 1,
    	                    reflectionDistance:100,
    	                    gradientOverlaySize: 0,
    	                    slideSpeed: 1,
    	                    enableMouseWheel : false,
    	                    selectByClick: false
    	                }); // end options
                        carousel.startAutoSlideshow(); // autmatically start the slideshow
                        // when an item is selected...
    	                carousel.on('itemSelected.sc', function(evt) {
    	                    var item = evt.item.index(); // get the index
    	                    if ( item == 1 && rank == 0 ) { // go back to the first element if the user is a private
    	                    	carousel.selectPrevious( 1 );
    	                    	carousel.stopAutoSlideshow( );
    	                    	return;
                            }
                            // get the next item and remove the active class from the circle
                            var next_item = parseInt(item) + 1;
    	                    $(".slider img").each(function(){
    	                        $(this).removeClass("active");
    	                    });
							// update the correct dot to be active
    	                    $(".slider img:nth-child("+next_item+")").addClass("active");
    	                    // set the rest of the images to be faded out a bit
    	                    $(".real").attr('style', 'opacity: 0.3');
    	                    $("#" + next_item).find(".real").attr('style', 'opacity: 1');
    	                    // if we have hit the rank
    	                    if (item == rank){
    	                    	$(".medalPic").attr('style', 'opacity: 1');
    	                        carousel.stopAutoSlideshow(); // stop
    	                        loop++; // increment the loop
    	                    } else {
    	                        if( loop == 0 ) { // if the loop is 0 then start the slideshow
    	                            carousel.startAutoSlideshow();
    	                        } else { // otherwise just end it
    	                            carousel.stopAutoSlideshow();
    	                        } // end if loop is/is not 0
    	                    } // end if the item is the users rank, or not
    	                }); // end on item in slideshow is selected
    	            }); // end jquery wraped function
    	        }, 1000); // end settimeout
    		}); // finish updating the users information
    		// setup the edting link
    		$(".header-edit").click( function() {
    			window.location = '/mobile/reg/re_register.html?child=' + id + '&e=1';
    		});
            // get the medal info for the user
            medal_board( "#medals", id );
		});
