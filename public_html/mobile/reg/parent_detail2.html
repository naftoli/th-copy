		<script>
            document.addEventListener("DOMContentLoaded", function(event) {
				function setSwiper() {
					$("#children .row").each( function() {
						var h = new Hammer( this );
						var id = $(this).find("table td:last-child").attr('id');
						h.on("swipe", function( evt ) {
							location.href = "medals/index.html?id=" + id;
						});
					});
				}		
			    $( function() {
			    	var admin = Cookies.get('admin');
			    	if (!admin) {
			    		window.location = "index.html";
			    	}
					/*
					$.post('ajax/checkReminder.php', { admin : admin }, function( success ) {
						if (parseInt(success) == 0) {
							$("#reminder").modal();
						}
					});
					
					$("#reminder").on('hidden.bs.modal', function() {
						if ($("#forget").is(":checked")) {
							$.post('ajax/updateReminder.php', { admin : admin });
						}
					});
					*/
			    	var year = 5777;
					var childrenToRegister = [];
			    	$.post('ajax/getChildren.php', { admin: admin, year : year }, function( success ) {
			    		if ( success == -1 ) {
			    			window.location = "index.html";
			    		} else {
			    			var data = $.parseJSON( success );
			    			var parent = data.parent;
			    			var children = data.children;
			    			
			    			var father = parent.father;
			    			var mother = parent.mother;
			    			
			    			if (father)
			    				$(".father").text(father.toUpperCase());
			    			if (mother)
			    				$(".mother").text(mother.toUpperCase());
			    			
			    			var fatherPic = parent.fatherPic;
			    			var motherPic = parent.motherPic;
			    			
			    			if (fatherPic != '' && fatherPic != null) {
			    				$("#father").attr('src', fatherPic);
			    			}
			    			var w = $("#father").width();
		    				//var newW = w * 1.1;
		    				//$("#father").width( newW );
		    				//$("#father").height( newW );
			    			
			    			if (motherPic != '' && motherPic != null) {
			    				$("#mother").attr('src', motherPic);
			    			}
			    			//$("#mother").width( newW );
		    				//$("#mother").height( newW );
							
							//set auction button link
							//for (var c in children) {
							//	$("#auction").attr('href', '/mobile/auction/category2.html?id=' + c);
							//	break;
							//}
							
							for (var c in children) {
								var child = children[c];
								if (child.needsReg) {
									childrenToRegister.push({
										id : c,
										reg : 0,
										reviewed : 0
									});
								}
							}
							Cookies.set('toRegister', childrenToRegister);
			    			
						    // Grab the template script
						    var tplScript = $("#childrenTpl").html();
						
						    // Compile the template
						    var tpl = Handlebars.compile( tplScript );

						    // Pass our data to the template
						    var html = tpl( { children : children } );
						    
						    // Add the compiled html to the page
						    $(".chilrens").append( html );
						    
						    setSwiper();
			    		}
			    	});
			    	
			    	$(document).on('click', ".re_register", function() {
				    	var id = $(this).parent().parent().parent().attr('id');
				        location.href = "reg.html?child=" + id;
				    });
				    
				    $(document).on('click', '.del', function() {
				    	var del = confirm('Are you sure you want to delete this child from your profile?');
				    	//alert( del );
				    	if ( del ) {
				    		var id = $(this).parent().parent().attr('id');
				    		$.post('ajax/delChild.php', { child : id, parent : admin }, function( success ) {
				    			if ( success ) {
				    				alert('This child has been removed from your profile.');
				    				location.href = "parent_detail.html";
				    			} else {
				    				alert('There was an error deleting your child from your profile.');
				    			}
				    		});
				    	}
				    });
				    
				    $("#logOff").click( function() {
				    	//Cookies.set('isconnected', 'false', { expires : -1 });
						//Cookies.remove('isconnected');
						//Cookies.set('admin', '0', { expires: -1 });
						//Cookies.remove('admin', { path: '/mobile/reg' });
						//Cookies.set('admin', '0', { expires: -1 });
						//Cookies.set('admin_id', '0', { expires: -1 });
						Cookies.remove('admin', { path: '/' });
						Cookies.remove('admin_id', { path: '/' });
						window.location = "/mobile/reg/";
					});
					
					$("#addChild").click( function() {
						//$("#popModal").modal();
					});
					
					$("#popup").submit( function() {
						var answer = $(".thAdded");
						var submit = false;
						$(answer).each( function() {
							if ($(this).is(":checked")) {
								submit = true;
								return;
							}
						});
						if (submit) {
							return true;
						} else {
							alert('You must choose "Yes" or "No"');
							return false;
						}
					});
					
					/*
					$(".btn.submit").click( function() {
						var answer = ($(this).text());
						$("#popModal").modal('hide');
						if (answer == 'Yes') {
							document.location.href = 'https://mashpia.com/mobile/reg/addchild.html';
						} else if (answer == 'No') {
							//location.href = ;
						}
					});
					*/
			    });
			});
		</script>
