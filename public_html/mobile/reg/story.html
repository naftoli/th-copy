<body class="rank-page">
<div class="header-yellow" style="position: relative">
    <div class="span12" style="max-width:1024px;width:100%;margin:0 auto;float:none;text-align: center;">
        <table style="width: 100%;">
            <tr>
            	<td>&nbsp;</td>
            	<td>&nbsp;</td>
                <!--<td><div class="yellow-star-l"><img src="images/yellow-star.png"></div></td>-->
                <td style="text-align: center;"><span>Story Contest</span></td>
                <!--<td><div class="yellow-star-r"><img src="images/yellow-star.png"></div></td>-->
                <td>&nbsp;</td>
                <td>&nbsp;</td>
            </tr>
        </table>
    </div>
</div>
<div class="container">
    <div class="span12" style="max-width:1024px;width:100%;margin:0 auto;float:none;margin-bottom: 100px">
        
        <div class="span12" style="padding: 15px; padding-top: 0;">
            <h2>My Special Moment With the Rebbe</h2>
            <form role="form">
                <div class="form-group">
                    <label for="chayol">From: (Chayol's Name)</label>
                    <select class="form-control" id="chayol">
                    </select>
                </div>
                <div class="form-group">
                  <label for="story">My Story:</label>
                  <textarea class="form-control" rows="5" id="story"></textarea>
                </div>
                <div class="form-group">
                  <label for="lesson">...and it's Lesson to me:</label>
                  <textarea class="form-control" rows="5" id="lesson"></textarea>
                </div>
				<div class="form-group" align="center">
					<button type="submit" class="btn btn-default" id="submit">Submit</button>
				</div>
            </form>
        </div>
        
        <div class="span12" style="position: fixed;bottom: 0px;z-index: 9999;">
            <div class="span12 footer">
                <div class="span3" style="width: 50%">
                    <a href="/mobile/news">
                        <div class="menu-item">
                            <div class="span12">
                                  <picture>
                                        <source srcset="img/webp/top-menu1.webp" type="image/webp">
                                        <img src="img/top-menu1.png" alt="">
                                  </picture>
                            </div>
                            <div class="span12">
                                <span>News</span>
                            </div>
                        </div>
                    </a>
                </div>
                <div class="span3" style="width: 50%; border-left: 1px solid #9f9f9f;">
                	<a href="/mobile/reg/">
	                    <div class="menu-item">
	                        <div class="span12">
                                  <picture>
                                        <source srcset="img/webp/menu1.webp" type="image/webp">
                                        <img src="img/menu1.png" alt="">
                                  </picture>
	                        </div>
	                        <div class="span12">
	                            <span>Accounts</span>
	                        </div>
	                    </div>
	                </a>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function(event) {
        $( function() {
            var admin = Cookies.get('admin');
            if (!admin) {
                window.location = "index.html";
            }
            $.post('ajax/getChildrenNames.php', { admin : admin }, function( success ) {
                var children = $.parseJSON( success );
                var html = "<option value='0'>Please choose</option>";
                for (var c in children) {
                    var child = children[c];
                    html += "<option value='" + c + "'>" + child + "</option>";
                }
                $("#chayol").empty();
                $("#chayol").append(html);
            });
        });
        
        $("#submit").click(function( e ) {
            e.preventDefault();
    		
    		var user = parseInt($("#chayol").val());
    		var story = $("#story").val();
            var lesson = $("#lesson").val();
    		var year = 5777;
    		
            if (user === 0) {
                alert('You must choose a child.');
                return false;
            }
            
            if (story.length < 250) {
                alert('Your story must have at least 250 characters.');
                return false;
            }
    		
    		if (lesson.length < 100) {
                alert('Your lesson must have at least 100 characters.');
                return false;
            }
            
            $.post('ajax/submitStory.php', {
    			user : user,
    			story : story,
    			lesson : lesson,
    			year : year
    		}, function( success ) {
                if (parseInt(success) === 0) {
                    alert('Your story has been submitted. Thank you.');
                } else {
                    alert('There was an error submitting your story.');
                }
            });
        });
    });
</script>
