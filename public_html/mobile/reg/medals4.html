<style>
    body {margin-bottom: 100px;}

    #gold {
    	padding-top: 4%;
    }
    #gold img {
    	width: 26%;
    	height: 26%;
    	margin-left: 10%;
    	margin-right: 10%;
    }
    #backs img {
    	opacity: 0.3;
    }
    #userImg {
	    border-radius: 50%;
	    width: 100%;
	    height: 100%;

	}
	.personalImg {
		width: 50px;
		height: 50px;
		left: 1%;
		top: 1%;
		border-radius: 50%;
		position: absolute;
	}
	
	.panel-heading {
		background-color: #f68829 !important;
		border: none;
		font-size: 20px;
	}
	.panel a {
		color: white;
	}
	.panel a:hover, a:active, a:visited, a:link {

	}
	
	.medalInfo {
		float: right;
		width: 70%;
		padding-top: 1%;
	}
	
	.progress {
		margin-bottom: 5px !important;
	}
	
	.progressText {
		position: absolute;
	    display: block;
	    width: 95%;
	    color: black;
	    text-align: center;
	    font-family: 'digi';
	    font-size: 14px;
	}
	
	.progress .text {
		font-family: 'digi';
		color: #fff;
		font-weight: normal;
	}
	
	.progressMedalText {
		position: absolute;
	    width: 60%;
	    color: black;
	    text-align: center;
	    font-family: 'digi';
	    font-size: 14px;
	    font-weight: normal;
	}
	
	i.glyphicon {
		transition: transform .3s ease-in-out;
		transition: -moz-transform .3s ease-in-out;

	}
	
	hr {

<script>
    document.addEventListener("DOMContentLoaded", function() {
		$(document).ready(function() {
		   
		    var url = location.toString();
			var pos = url.indexOf('='); 
			var id = url.substring( pos+1 );
			
			authenticate( id );
        
            if( localStorage.getItem("login") == "user" ){
                $( "#mainLink" ).attr('href', '/mobile/reg/medals/?id=' + id);
            };
			
			$.post('/mobile/reg/ajax/getPhoto.php', { user_id : id }, function( success ) {
                var info = $.parseJSON( success );
                var html = '<a href="/mobile/reg/medals/index.html?id=' + id +'">';
                if (info.mobile_pic) html += '<img id="userImg" src="https://mashpia.com/mobile/reg/' + info.mobile_pic + '">';
                else if (info.thumb) html += '<img id="userImg" src="https://mashpia.com/thumbs/' + info.thumb + '">';
                else if (info.photo) html += '<img id="userImg" src="https://mashpia.com/file_view.php?id=' + info.photo + '">';
                html += '</a>';
                $(".personalImg").append( html );
				// set the USER ID for bug reports
                $(".bug-report img").data("user_id", id);
            });
			
			$("#missionsLink").attr('href', '../missionsNew.html?id=' + id);
			$("#goalsLink").attr('href', '../goalsNew.html?id=' + id);
			$("#rankLink").attr('href', 'rank.html?id=' + id);
			$("#storeLink").attr('href', '../store/index.html?id=' + id);
			
            $("#rankMenu").attr('href', 'rank.html?id=' + id);
            $("#leaderMenu").attr('href', '../leaderboard/?id=' + id);
			$("#auctionMenu").attr('href', '../auction/category2.html?id=' + id);
			
            // get the medal info for the user
            medal_board( "#medals", id );
		});
	});
</script>
