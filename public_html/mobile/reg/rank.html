<script>
    document.addEventListener("DOMContentLoaded", function(event) {
        var carousel = "";
        var loop = 0;
        function isiPhone(){
            return (
                (navigator.platform.indexOf("iPhone") != -1) ||
                (navigator.platform.indexOf("iPod") != -1)
            );
        }
        $(document).ready(function(){

            $(".footer .span3").click(function(){
                $(".footer .span3").each(function(){
                    $(this).removeClass("active");
                });
                if($(this).hasClass("active") == "active"){
                    $(this).addClass("active");
                }
            });
            
            $.post('ajax/getPhoto.php', { user_id : id }, function( success ) {
                var info = $.parseJSON( success );
                var html = '<a href="medals/index.html?id=' + id +'">';
                if (info.mobile_pic) html += '<img id="userImg" src="/mobile/reg/' + info.mobile_pic + '">';
                else if (info.thumb) html += '<img id="userImg" src="/thumbs/' + info.thumb + '">';
                else if (info.photo) html += '<img id="userImg" src="/file_view.php?id=' + info.photo + '">';
                html += '</a>';
                $(".personalImg").append( html );
                // set the USER ID for bug reports
                $(".bug-report img").data("user_id", id);
            });
            
        });
        $(window).load(function(){
            $( ".sky-carousel" ).unbind();
            $(".slider img").click(function(){
                var item_id = $(this).attr("id");
                var from_id = 0;
                $(".slider img").each(function(){
                    var element  = $(this);
                    if (element.attr('class') == "active") {
                        from_id = parseInt(element.attr("id").replace("item","")) + 1;
                    }
                    $(this).removeClass("active");
                });
                $("#item"+item_id).addClass("active");
                item_id = item_id.replace("item","");
                var duration = Math.abs(parseInt(item_id)+1 - from_id); // one duration unit for each medal it needs to pass
                if(item_id == "0"){
                    carousel.select(0, duration);
                }else{
                    carousel.select(parseInt(item_id), duration); // index and an ever increasing duration
                }
                console.log(parseInt(item_id)+1);
            });
            if( /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ) { // on mobile
            }
        });
            
        var url = location.toString();
        var id = url.substring( url.indexOf('=') + 1 );
        
        authenticate( id );
        
        if( localStorage.getItem("login") == "user" ){
            $( "#mainLink" ).attr('href', '/mobile/reg/medals/?id=' + id);
        }

        $("#missionsLink").attr('href', '../missionsNew.html?id=' + id);
        $("#goalsLink").attr('href', '../goalsNew.html?id=' + id);
        $("#rankLink").attr('href', 'rank.html?id=' + id);
        $("#storeLink").attr('href', '../store/index.html?id=' + id);
        
        $("#subMenu li").each( function() {
            var link = $(this).find('a');
            var href = link.attr('href');
            link.attr('href', href + '?id=' + id);
        });
        
        $("#medalMenu").attr('href', 'medals4.html?id=' + id);
        //$("#auctionMenu").attr('href', '/mobile/auction/category2.html?id=' + id);
        
        var rank;
        $.post('ajax/getRank.php', { user : id }, function( success ) {
            var user = $.parseJSON( success );
            var rank = parseInt( user.rank ) - 1;
            
            var needed = parseInt( user.medalsNeeded );
            var done = parseInt( user.totalMedals );
            var medals = user.medals;
            var num = medals.length;
            //var show = needed - done;
            //var empty = needed - show;
            var medalsInfo = user.medalsInfo;
            
            var ranks = {
                1 : 'Private', 
                2 : 'Sergeant',
                3 : 'Sergeant Major', 
                4 : 'Second Lieutenant', 
                5 : 'First Lieutenant', 
                6 : 'Captain', 
                7 : 'Major', 
                8 : 'Colonel', 
                9 : 'General', 
                10 : '1* General', 
                11 : '2* General', 
                12 : '3* General', 
                13 : '4* General', 
                14 : '5* General'
            }

            var html = "";
            var start = 0;
            for (var j = 1; j < 15; j++) {
                var end = parseInt( medalsInfo[j+1] );
                if (j == 14) end = 133; // 5 star general ending
                
                html += '<div id="' + j + '">';
                html +=     '<div class="rank-logo">';
                html +=         '<div class="rankName">' + ranks[j] + '</div>';
                html +=         '<img class="medal real rankLogo" src="/mobile/img_new/ranks/' + j + '.svg" />';
                html +=     '</div>';
                html +=     '<div class="rank-medals">';
                // for each medal show a icon
                for (var i = start; i < end; i++) {
                    html += '<div class="rank-medal">';
                    html += ( i + 1 ) + '<br />'; // print the medal number
                    if ( i < num ) {
                        if ( medals[i].subject == 106 ) {
                            html += '<img class="medal real medalPic" src="../../../file_view.php?id=' + medals[i].photo + '" />';
                        } else {
                            html += '<a href="medals3.html?id=' + id + '&subject=' + medals[i].subject + '">';
                            html +=     '<img class="medal real medalPic" src="../../../file_view.php?id=' + medals[i].photo + '" />';
                            html += '</a>';
                        }
                    }
                    else html += '<img class="medal" src="../../../kiosk/images/medals/holder.png" />';
                    
                    html += '</div>';
                }
                html += '</div>';
                html += '</div><hr style="width: 50%;" />';
                start = end;
            }
            
            $("#ranks").append( html );
            
            var top = rank + 1;
            for (var j = 1; j <= top; j++) {
                $("#" + j).find('.real').attr('style', 'opacity: 1');
            }
            
            var height = $(".medalPic:first-child").height();
            $(".addHeight").each( function(i, v) {
                if (i > 2) {
                    if (i < 8) {
                        $(this).height(height + 'px');
                    } else {
                        $(this).height((height * 2) + 'px');
                    }
                }
            });
            
            $(".sky-carousel-container li img").css({"width":"100px","height":"180px"});
            $(".sky-carousel").css( { "width" : "100%", "margin" : "0px" } );
            setTimeout( function() {
                $( function() {
                    carousel = $('.sky-carousel').carousel({
                        itemWidth: 100,
                        itemHeight: 180,
                        distance: 40,
                        startIndex: 0,
                        autoSlideshowDelay: 1,
                        loop : false,
                        selectedItemDistance: 20,
                        selectedItemZoomFactor: 1,
                        unselectedItemZoomFactor: 0.7,
                        unselectedItemAlpha: 0.2,
                        topMargin: 10,
                        preload:true,
                        showPreloader:true,
                        navigationButtonsVisible: false,
                        gradientStartPoint: 0.5,
                        gradientEndPoint: 1,
                        reflectionDistance:100,
                        gradientOverlaySize: 0,
                        slideSpeed: 1,
                        enableMouseWheel : false,
                        selectByClick: false
                    }); // end options
                    carousel.startAutoSlideshow(); // autmatically start the slideshow
                    // when an item is selected...
                    carousel.on('itemSelected.sc', function(evt) {
                        var item = evt.item.index(); // get the index
                        if ( item == 1 && rank == 0 ) { // go back to the first element if the user is a private
                            carousel.selectPrevious( 1 );
                            carousel.stopAutoSlideshow( );
                            return;
                        }
                        // get the next item and remove the active class from the circle
                        var next_item = parseInt(item) + 1;
                        $(".slider img").each(function(){
                            $(this).removeClass("active");
                        });
                        // update the correct dot to be active
                        $(".slider img:nth-child("+next_item+")").addClass("active");
                        // set the rest of the images to be faded out a bit
                        $(".real").attr('style', 'opacity: 0.3');
                        $("#" + next_item).find(".real").attr('style', 'opacity: 1');
                        // if we have hit the rank
                        if (item == rank){
                            $(".medalPic").attr('style', 'opacity: 1');
                            carousel.stopAutoSlideshow(); // stop
                            loop++; // increment the loop
                        } else {
                            if( loop == 0 ) { // if the loop is 0 then start the slideshow
                                carousel.startAutoSlideshow();
                            } else { // otherwise just end it
                                carousel.stopAutoSlideshow();
                            } // end if loop is/is not 0
                        } // end if the item is the users rank, or not
                    }); // end on item in slideshow is selected
                }); // end jquery wraped function
            }, 1000); // end settimeout
        });
    });
</script>
