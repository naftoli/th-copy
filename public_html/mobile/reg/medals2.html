<script>
    document.addEventListener("DOMContentLoaded", function(event) {
        $(document).ready(function() {
            $('#banner-slide').bjqs({
                height        : 500,
                width         : 770,
                responsive    : true
            });
            
            var url = location.toString();
        	var pos = url.indexOf('='); 
        	var id = url.substring( pos+1 );
        	
        	var s = id.indexOf('&');
        	var subject = 0;
        	if (s > 0) {
        		var temp = id.substring( s+1 );
        		id = id.substring( 0, s );
        		
        		var tPos = temp.indexOf('=');
        		subject = parseInt( temp.substring( tPos+1 ) );
        	}

        	$.post('ajax/checkAuth.php', { user_id : id, admin_id : Cookies.get('admin') }, function( success ) {
        		if (success == 0) {
        			window.location = "/mobile";
        		}
        	});
        	
        	$.post('ajax/getPhoto.php', { user_id : id }, function( success ) {
        		var info = $.parseJSON( success );
        		var html = '<a href="/mobile/reg/medals/index.html?id=' + id +'">';
        		if (info.mobile_pic) html += '<img id="userImg" src="https://mashpia.com/mobile/reg/' + info.mobile_pic + '">';
        		else if (info.thumb) html += '<img id="userImg" src="https://mashpia.com/thumbs/' + info.thumb + '">';
        		else if (info.photo) html += '<img id="userImg" src="https://mashpia.com/file_view.php?id=' + info.photo + '">';
        		html += '</a>';
        		$(".personalImg").append( html );
        	});
        	
        	$.post('ajax/getMedalSubject.php', { user_id : id, subject : subject }, function( success ) {
        		var medalOrd = 0;
        		medalOrd = parseInt( success );
        		for (var i = 0; i < medalOrd; i++) {
        			$("#backs img").eq(i).attr('style', 'opacity: 1');
        		}
        	});
        	
        	$("#missionsLink").attr('href', '/mobile/missionsNew.html?id=' + id);
        	$("#goalsLink").attr('href', '/mobile/goalsNew.html?id=' + id);
        	$("#rankLink").attr('href', '/mobile/reg/rank.html?id=' + id);
        	
        	var golds = {
        		1 : 'tehillim.png', 
        		4 : 'tefillah.png', 
        		12 : 'mivtzoim.png', 
        		13 : 'nigunim.png', 
        		15 : 'Hakhel _medal.jpg', 
        		16 : 'hiskashrus.png', 
        		21 : 'Sefer Hamitzvos.png', 
        		27 : 'tanya.png', 
        		40 : 'yomei dipagra.png', 
        		41 : 'avos ubonim.png', 
        		42 : 'vhalachta bidrachov.png', 
        		45 : 'cheshbon Hanefesh.png', 
        		90 : 'chitas.png', 
        		100 : 'brias haguf.png', 
        	}
        	
        	var subjects = [];
        	for (var g in golds) subjects.push( g );
        	var index;
        	for (var i = 0; i < subjects.length; i++) {
        		if (subjects[i] == subject) {
        			index = i;
        			break;
        		}
        	}
        	
        	var html = '<a href="medals2.html?id=' + id + '&subject=';
        	if (subject > 1) html += subjects[index-1];
        	else html += subjects[subjects.length-1];
        	html += '"><span class="glyphicon glyphicon-menu-left"></span></a>';
        	html += '<img src="images/backs/goldLogos/' + golds[subject] + '" />';
        	html += '<a href="medals2.html?id=' + id + '&subject=';
        	if (subject < 100) html += subjects[index+1];
        	else html += subjects[0];
        	html += '"><span class="glyphicon glyphicon-menu-right"></span></a>';
        	$("#gold").append( html );
        	
        	var elem = document.getElementById('gold');
        	var h = new Hammer(elem);
        	h.on("swiperight", function( evt ) {
        		var s;
        		if (subject > 1) s = subjects[index-1];
        		else s = subjects[subjects.length-1];
        		location.href = "medals2.html?id=" + id + "&subject=" + s;
        	});
        	h.on("swipeleft", function( evt ) {
        		var s;
        		if (subject < 100) s = subjects[index+1];
        		else s = subjects[0];
        		location.href = "medals2.html?id=" + id + "&subject=" + s;
        	});
        	
        	html = '<div class="span12">';
        	var medals = ['white', 'red', 'orange', 'yellow', 'green', 'blue', 'purple', 'brown', 'grey', 'black'];
        	for (var i = 0; i < 10; i++) {
        		var newColumn;
        		if (i == 4 || i == 8) newColumn = true;
        		else newColumn = false;
        		if (newColumn) html += '</div><div class="span12">';
        		html += '<div class="span3" style="text-align: center;"><img class="medal" src="';
        		if (i == 8) {
        			html += 'images/sub-medal/blank.png"></div><div class="span3" style="text-align: center;"><img class="medal" src="';
        		}
        		if (subject == 1 || subject == 12 || subject == 21) {
        			html += 'images/backs/wwtc/' + medals[i] + '.gif';
        		} else if (subject == 40) {
        			html += 'images/backs/yd/' + medals[i] + '.gif';
        		} else {
        			html += 'images/backs/weekly/' + medals[i] + '.gif';
        		}
        		html += '"></div>';
        	}
        	html += '</div>';
        	$("#backs").append( html );
        });
    });
</script>
