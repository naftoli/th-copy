	<body class="page-goals">
        <header class="navbar" id="top" role="banner">
			<div class="span12" style="max-width:1024px;width:100%;margin:0 auto;float:none;text-align: center;">
				<span id="page-title">Purchase Lulav Set(s)</span>
			</div>
        </header>
		
		<div class="personalImg"></div>
		<div class="bug-report">
			<img src="/mobile/img_new/tools-color-white-svg.svg" data-category="Store" alt="bug-report" />
        </div>
        
        <section style="width: 300px; margin: 10px auto; display: none;" id="purchase_lulav_sets">
            <div class="container page5">   
                <div class="row">
                    <div class="col-12" style="font-size: 18px; font-weight: bold;">
                        Please use the following form to enter how many sets you would like to purchase for each child.
                    </div>
                </div>   
                
                <div style="width: 250px; margin: auto;">
                    <div class="row">
                        <h2>Lulav Sets</h2>
                        <hr />
                        <div class="col-12">
                            <div class="chilrens" id="children">
                                <script id="childrenTpl" type="text/x-handlebars-template">
                                    {{#each children}}
                                <div class="child">
                                        <div style="padding: 10px; font-size: 14px;">
                                            <span>
                                                <b>{{rank}}</b> {{first}} {{last}} 
                                            </span>
                                            <input type="text" class="lulav form-control" style="width: 40px; float: right;" />
                                            <input type="hidden" class="id" value="{{@key}}" />
                                        </div>
                                    </div>
                                    {{/each}}
                                </script>
                            </div>
                            <div id='no-children'>
                                <h3>
                                    It looks like you have not added any children yet.
                                </h3>
                            </div>
                        </div>
                    </div>

                    <hr />
                    <div class="row">
                        <button id="calculate" class="btn btn-primray">Calculate Total</button>
                        <h2>Total: $<span id="amount">0</span></h2>
                        <input type="hidden" id="total" />
                    </div>

                    <form action="" method="post">
                        <div class="row">
                            <h2>Checkout</h2>
                            <hr />
                            <div class="form-group">
                                <label for="cc-first" class="control-label mb-1">First Name on Card</label>
                                <input id="cc-first" name="cc-first" type="tel" class="form-control cc-first identified" required placeholder="First Name" maxlength="10">
                                <!-- <span class="invalid-feedback">Enter a valid credit card number</span> -->
                            </div>
                            <div class="form-group">
                                <label for="cc-last" class="control-label mb-1">Last Name on Card</label>
                                <input id="cc-last" name="cc-last" type="tel" class="form-control cc-last identified" required placeholder="Last Name" maxlength="10">
                                <!-- <span class="invalid-feedback">Enter a valid credit card number</span> -->
                            </div>
                            <div class="form-group">
                                <label for="cc-number" class="control-label mb-1">Card number</label>
                                <input id="cc-number" name="cc-number" type="tel" class="form-control cc-number identified" required placeholder="XXXX XXXX XXXX XXXX" maxlength="19">
                                <!-- <span class="invalid-feedback">Enter a valid credit card number</span> -->
                            </div>
                            <div class="form-group">
                                <label for="cc-exp" class="control-label mb-1">Expiration</label>
                                <input id="cc-exp" name="cc-exp" type="tel" class="form-control cc-exp" required placeholder="MMYY" autocomplete="cc-exp" maxlength="4">
                                <!-- <span class="invalid-feedback">Enter the expiration date</span> -->
                            </div>
                            <label for="x_card_code" class="control-label mb-1">Security code</label>
                            <div class="form-group">
                                <input id="x_card_code" name="x_card_code" type="tel" class="form-control cc-cvc" required autocomplete="off" placeholder="XXX" pattern="[0-9]{3,4}" maxlength="4">
                                <!-- <span class="invalid-feedback order-last">Enter the 3-digit code on back</span> -->
                            </div>
                            <div class="form-group">
                                <label for="zip" class="control-label mb-1">Zip / Postal Code</label>
                                <input id="zip" name="zip" type="tel" class="form-control" placeholder="XXXXX" maxlength="12" required />
                                <!-- <span class="invalid-feedback">Enter a valid zip / postal code</span> -->
                            </div>
                        </div>
                        <div class="row" style="padding: 20px !important;">
                            <button id="purchase" class="btn btn-primray">Purchase Set(s)</button>
                        </div>
                    </form>                    
                </div>
            </div>
        </section>
    </body>
    
    <script src="js/all.js" defer></script>
    <script>
        document.addEventListener("DOMContentLoaded", function(event) {
            // make sure we have a cookie
            var admin = Cookies.get('admin');
            if (!admin) { window.close(); }
            
            // get the current year
            var year;
            $.ajax({ type: "POST", url: "/mobile/chidon/ajax/getYear.php", async: false, 
                success: function( info ) { year = info; }
            });
            
            // load children
            $.post('ajax/getChildren.php', { admin : admin, year : year }, function( success ) {
                if ( success == -1 ) {
                    window.location = "index.html";
                } else {
                    var data = $.parseJSON( success );
                    var children = data.children;
                    
                    // sepearate registered and un-registered
                    var registred_children = {};
                    var unregistered_children = {};
                    
                    for (var c in children) {
                        var child = children[c];
                        if (child.schoolRegistered && child.schoolTypeRegistered && !child.user_registered) {
                            unregistered_children[c] = child;
                        } else {
                            registred_children[c] = child;
                        }
                    }
                                        
                    // Grab the template script
                    var tplScript = $("#childrenTpl").html();
                
                    // Compile the template
                    var tpl = Handlebars.compile( tplScript );

                    // Pass our data to the template
                    var html = tpl( { children : registred_children } );
                    
                    $("#purchase_lulav_sets").show();
                    if ( $.trim( html ) === '' ) { 
                        $("#no-children").show(); 
                    } else {
                        // Add the compiled html to the page
                        $(".chilrens").append( html );
                        $(".year").text(year);
                    } 
                }
            });

            $(document).on("click", "#calculate", calcAmount);

            $(document).on("click", "#purchase", purchaseSets);

            function calcAmount() {
                var base = 7.70;
                var amount = 0;
                $(".lulav").each( function() {
                    var val = $(this).val();
                    if ( val > 0 ) amount += (base * val);
                });
                amount = amount.toFixed(2); 
                $("#amount").text( amount );
                $("#total").val( amount );
            }

            function purchaseSets( e ) {
                e.preventDefault();
                var total = $("#total").val();
                if ( total > 0 ) {
                    
                    var first = $("#cc-first").val().trim();
                    var last = $("#cc-last").val().trim();
                    var num = $("#cc-number").val().trim();
                    var exp = $("#cc-exp").val().trim();
                    var zip = $("#zip").val().trim();

                    if ( !first || !last || !num || !exp || !zip ) {
                        alert("You must fill in all fields.");
                        return false;
                    }

                    if ( isNaN( num ) || isNaN(exp) ) {
                        alert("Credit Card Number and Expiry Date must be numbers.");
                        return false;
                    }

                    // build data
                    var info = {};
                    info.admin = admin;
                    info.amount = total;
                    info.cc = {};
                    info.cc.first = first;
                    info.cc.last = last;
                    info.cc.num = num;
                    info.cc.exp = exp;
                    info.zip = zip;
                    info.sets = [];
                    var num_sets = 0;
                    $(".child").each( function() {
                        var id = $(this).find('.id').val();
                        var numsets = $(this).find('.lulav').val();
                        info.sets.push({
                            id: id, 
                            num: numsets
                        });
                        num_sets += parseInt( numsets );
                    });
                    
                    $.post('ajax/lulavPayment.php', { info: info }, function( info ) {
                        var result = JSON.parse( info );
                        if ( result.success ) {
                            alert("You have successfully purchased " + num_sets + " sets.");
                        } else {
                            alert( result.error );
                        }
                    });

                } else {
                    alert("You have not indicated how many sets you need.");
                }
            }
        });
    </script>
