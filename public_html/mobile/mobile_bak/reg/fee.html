  <body class="skin-blue sidebar-mini">
  <div class="container fee-page page5">
      <div class="login-header">
          <span class="span12">RECRUITMENT FEE</span>

			<div class="row">
					<div class="col-xs-12">
						<div class="chilrens" id="children">
							<script id="childrenTpl" type="text/x-handlebars-template">
								{{#each children}}
									<div class="row child" id="r{{@key}}">
										<div class="col-xs-12">
											<table width="100%" style="margin-left:-10px">
												<tr>
													<td width="33.3%" valign="top">
														<div class="avatar-container img-people" align="center" style="position:relative">
															{{#if mobile_pic}}
																<img src="{{mobile_pic}}" class="children-avatar">
															{{else}}
																{{#if photo}}
																	{{#if thumb}} 
																	<img src="/thumbs/{{thumb}}" class="children-avatar">
																	{{else}}
																	<img src="../../file_view.php?id={{photo}}" class="children-avatar">
																	{{/if}}
																{{else}}
																<img src="images/profile-photo-default.jpg" class="children-avatar">
																{{/if}}
															{{/if}}
															<img src="images/rankImgs/{{rankOrd}}.png" class="children-mark">
														</div>
													</td>
													<td style="padding-left:10px" id="{{@key}}">
														<div class="childrens-content">
																<div class="childrens-content-h1"><b>{{rank}}</b> {{first}} {{last}}</div>
																<div class="childrens-content-h2">{{school}} - {{city}}</div>
																<div class="childrens-content-h2">Registration Fee:	${{fee}}
																<!--
																	{{#if australia}}
																		$40
																	{{/if}}
																	{{#if fortyFive}}
																		$45
																	{{else}}
																		{{#if laSchool}}
																			$50
																		{{else}}
																			$55
																		{{/if}}
																	{{/if}}
																	-->
																</div>
																<div>
																	<a href="" class="del">
																		<span class="glyphicon glyphicon-trash"></span>
																		<span class="ln-delete"><b>REMOVE</b></span>
																	</a>
																</div>
														</div>
													</td>
												</tr>
											</table>
										</div>
									</div>
								{{/each}}
							</script>

			<div id="spinner"></div>
			
      <form id="feeForm" action="" method="post">
      <div class="register-box">
          <div class="register-box-body">
                    <div class="row">
                        <div class="col-xs-12">
                          <div class="form-group has-feedback" id="divcreditcard">
                            <select id="cardtype" name="cardtype" class="selectpicker show-tick form-control"  data-style="btn-default">
                                <option data-icon="fa fa-credit-card" selected disabled>&nbsp;&nbsp;Credit Card</option>
                                <option data-icon="fa fa-cc-amex">&nbsp;&nbsp;American Express</option>
                                <option data-icon="fa fa-cc-mastercard">&nbsp;&nbsp;Mastercard</option>
                                <option data-icon="fa fa-cc-visa">&nbsp;&nbsp;Visa Card</option>
                            </select>
                          </div>
                        </div>
                        <div class="col-xs-12">
                             <div class="form-group has-feedback" id="divcardnumber">
                                <div class="input-group">
                                    <span class="input-group-addon"><span class="fa fa-credit-card"></span></span>
                                    <input id="cardnumber" name="cardnumber" type="text" class="form-control" placeholder="Card Number" data-error="Oops, that card number is invalid" required/>
                                </div>
                             </div>
                        </div>
                        <div class="col-xs-12">
                          <div class="form-group has-feedback" id="divcardexp">

                        <div class="col-xs-12">

                            <div class="input-group">

									<div class="row shipFee">
										<div class="col-xs-12">
												<div class="text">
														Additional Shipping Fee: $<span id="xtra"></span>
												</div>
										</div>
									</div>
									
                  <div class="row">
                      <div class="col-xs-12">
                          <label class="check-accept">
                              <input type="checkbox" name="accept" id="accept" class="minimal-red" /> 
                              <span>I agree to pay $<span id="amount" style="padding: 0;"></span> to register</br> my child(ren) for Tzivos Hashem<span class="year"></span></span>
                          </label>
                      </div>
                  </div>
                  <div class="row">
                      <div class="col-xs-12">
                          <button type="submit" id="btn_create"  class="btn btn-primary btn-block H8">

<script>
	$(document).ready(function(){
	   //$('#cardnumber').inputmask("9999 9999 9999 9999");  //static mask
	   //$('#expiration').inputmask("99 99");  //static mask
	   //$('#zip').inputmask("99999");
	});
</script>

<script>
	var admin = Cookies.get('admin');
	if (!admin) {
		window.location = "index.html";
	}
	
	var ship = 0;
	var shipOpt = 0;
	var destination = 0;
	$(".shipFee").hide();
	
	if (Cookies.get('shipping') !== undefined) {
			ship = parseInt(Cookies.get('shipping'));
			if (Cookies.get('myshliach') !== undefined) {
				if (ship == 25) {
					shipOpt = 1;
					$("#xtra").text(ship);
					$(".shipFee").show();
				}
				var dest = Cookies.get('myshliach');
				switch (dest) {
					case 2:
						destination = 'Canada';
						break;
					case 3:
						destination = 'International';
						break;
				}
			} else if (Cookies.get('anashkinder') !== undefined) {
				shipOpt = Cookies.get('shipOpt');
				destination = Cookies.get('destination');
				$("#xtra").text(ship);
				$(".shipFee").show();
			}
	}
	
	var url = location.toString();
	var pos = url.indexOf('='); 
	var str = url.substring( pos+1 );
	var newChild = false;
	var id, pos2;
	
	pos2 = str.indexOf('&');
	if (pos2 != -1) {
		//new child
		newChild = true;
		id = str.substring(0, pos2);
	} else {
		id = str;
	}
	
	Date.prototype.getJulian = function() {
    return Math.floor((this / 86400000) - (this.getTimezoneOffset()/1440) + 2440587.5);
	}
	var today = new Date(); //set any date
	var julian = today.getJulian(); //get Julian counterpart
	//alert(julian);	
	
	var fee = 45;
	if (julian > 2457996.5) fee = 50;
	if (julian > 2458049.5) fee = 55;
	
	var amount = 0;
	var numChildren = 0;
	var childrenRegister = {};
	//var childrenLA = 0;
	//var children45 = 0;
	//var children40 = 0;
	//var schools45 = [54,48,81,61,269,7,263,58,2,21,37,4,49,192];
	//var schools40 = [66,112];
	
	var year = 5778;
	if (!newChild) {
		$(".year").text( year );
		$.post('ajax/getChildrenToRegister.php', { admin: admin, year : year }, function( success ) {
			if ( success == -1 ) {
				window.location = "index.html";
			} else {
				var data = $.parseJSON( success );
				children = data.children;
				
				var toRegister = Cookies.getJSON('toRegister');
				//alert(JSON.stringify(toRegister));
				for (var i in toRegister) {
					var child = toRegister[i];
					for (var c in children) {
						if (child.id == c) {
							if (child.reg) {
								childrenRegister[c] = children[c];
								numChildren++;
								//if (julian < 2457665 && children[c].school_id == 162) childrenLA++;
								//if (julian < 2457665 && schools45.indexOf(parseInt(children[c].school_id)) != -1) children45++;
								//if (schools40.indexOf(parseInt(children[c].school_id)) != -1) children40++;
								//if (parseInt(children[c].school_id) == 61) children45++;
							}
						}
					}
				}

				if (numChildren === 0) {
					alert('You have not selected any child to register!');
					//location.href = "parent_detail.html";
				}
				
				// Grab the template script
				var tplScript = $("#childrenTpl").html();
		
				// Compile the template
				var tpl = Handlebars.compile( tplScript );
	
				// Pass our data to the template
				var html = tpl( { children : childrenRegister } );
				
				// Add the compiled html to the page
				$(".chilrens").append( html );
				
				calcFee();
			}
		});
	} else {
		numChildren = 1;
		calcFee();
	}
	
	/*
	//find out amount to charge
	$.ajax({
		type : "POST", 
		url : 'ajax/getAmount.php', 
		data : { user_id : id }, 
		async : false, 
		success : function( num ) {
		amount = num * numChildren;
		$("#amount").text( amount );
	});
	*/
	
	$(document).on('click', ".del", function(e) {
		e.preventDefault();
		var child = $(this).parent().parent().parent().attr('id');
		$("#r" + child).remove();
		numChildren--;
		if (numChildren === 0) {
			alert('You have not selected any child to register!');
			location.href = "parent_detail.html";
			return;
		}
		var toRegister = Cookies.getJSON('toRegister');
		for (var i in toRegister) {
			if (child == toRegister[i].id) {
				toRegister.splice(i,1);
				break;
			}
		}
		Cookies.set('toRegister', toRegister);
		
		// check if any anashkinder children remain or have all been removed
		// do same thing for myshliach international children
		if (ship) {
			var anash = false;
			for (var i in toRegister) {
				if (toRegister[i].anash) {
					anash = true;
					break;
				}
			}
			if (!anash) {
				// remove shipping charges
				ship = 0;
				$(".shipFee").remove();
				Cookies.remove('shipping');
				Cookies.remove('anashkinder');
				Cookies.remove('shipOpt');
			}
			
			if (ship == 25) {
				var shliach = false;
				for (var i in toRegister) {
					if (toRegister[i].shliach) {
						shliach = true;
						break;
					}
				}
				if (!shliach) {
					// remove shipping charges
					ship = 0;
					$(".shipFee").remove();
					Cookies.remove('shipping');
					Cookies.remove('myshliach');
				}
			}
		}
		
		for (var c in childrenRegister) {
			if (child == c) {
				delete childrenRegister[c];
			}
		}
		calcFee();
	});
	
	function calcFee() {
		//console.log(childrenRegister);
		/*
		var rest = numChildren;
		if (childrenLA) {
			rest -= childrenLA;
		}
		if (children45) {
			rest -= children45;
		}
		if (children40) {
			rest -= children40;
		}
		if (rest) amount = fee * rest;
		if (childrenLA) amount += (50 * childrenLA);
		if (children45) amount += (45 * children45);
		if (children40) amount += (40 * children40);
		*/
		console.log(childrenRegister);
		amount = 0;
		for (var c in childrenRegister) {
			if (parseInt(childrenRegister[c].tuitionSchool) == 0) {
				amount += parseInt(childrenRegister[c].fee);
			}
		}
		if (ship) amount += ship;
		
		if (amount == 0) {
			// remove credit card form and allow registration without cc info
			$("#feeForm").hide();
			var html = '<div class="register-box">\
									<div class="register-box-body">\
									<div class="row">\
                      <div class="col-xs-12">\
                          <button type="submit" id="btn_reg"  class="btn btn-primary btn-block H8">\
                              <b>REGISTER</b>\
                          </button>\
                      </div><!-- /.col -->\
                  </div>\
									</div>\
									</div>';
			$("#feeForm").before(html);
		}
		
		$("#amount").text(amount);
	}
	
    $( function () {
        $('input').iCheck({
            checkboxClass: 'icheckbox_square-blue',
            radioClass: 'iradio_square-blue',
            increaseArea: '20%' // optional
        });
    });
		
    $("#feeForm").submit( function(e) {
        // Stop form from submitting normally
        e.preventDefault();
        
        if (!$("#accept").is(":checked")) {
        	alert('You must indicate your acceptance of the charge.');
        	return false;
        }
        
        var ccnum = $("#cardnumber").val();
        var exp = $("#expiration").val();
        var zip = $("#zip").val();
        
        if (ccnum == '' || exp == '' || zip == '') {
        	alert("All fields are required.");
        	return false;
        }
        
        $("#btn_create").attr('disabled', 'disabled');
        
				var users = [id];
				if (!newChild) {
					users = [];
					var toRegister = Cookies.getJSON('toRegister');
					for (var i in toRegister) {
						var child = toRegister[i];
						if (child.reg == 1) users.push(child.id);
					}
				}
				//alert(users); return;
				
				$("#btn_create").html('<img src="ajax-loader.gif" />');
				
        $.post('ajax/processPayment.php', {
        	number : ccnum, 
        	expiry : exp, 
        	zip : zip, 
        	amount : amount, 
        	users : users, 
        	year : year, 
        	admin_id : admin,
					shipFee : ship, 
					shipOpt : shipOpt,
					dest : destination
        }, function( success ) {
					$("#btn_create").html('<b>PROCEED</b>');
        	if ( success == 1 ) {
						if (ship) {
							Cookies.remove('shipping');
							Cookies.remove('anashkinder');
							Cookies.remove('shipOpt');
							Cookies.remove('destination');
						}
						Cookies.remove('toRegister');
						
						// enroll into campaigns
						$.post('https://www.mashpia.com/ajax/enrollIntoCampaigns.php', { id : users }, function( error ) {
							if (error) {
								alert( error );
							}
						});
						
        		if (newChild) {
        			window.location = "welcome.html?id=" + id;
        		} else {
        			window.location = "welcome-back.html?id=" + users.join();
        		}
        	} else {
        		alert( success );
						$("#btn_create").removeAttr('disabled');
        		return false;
        	}
        });
    });
		
		$(document).on('click', "#btn_reg", function() {
			var users = [id];
			if (!newChild) {
				users = [];
				var toRegister = Cookies.getJSON('toRegister');
				for (var i in toRegister) {
					var child = toRegister[i];
					if (child.reg == 1) users.push(child.id);
				}
			}
			$.post('ajax/registerChildren.php', {
        	users : users, 
        	year : year, 
        	admin_id : admin
        }, function( success ) {
        	if ( success == 1 ) {
						Cookies.remove('toRegister');
						
						// enroll into campaigns
						$.post('https://www.mashpia.com/ajax/enrollIntoCampaigns.php', { id : users }, function( error ) {
							if (error) {
								alert( error );
							}
						});
						
        		if (newChild) {
        			window.location = "welcome.html?id=" + id;
        		} else {
        			window.location = "welcome-back.html?id=" + users.join();
        		}
        	} else {
        		alert( success );
        		return false;
        	}
        });
		});
</script>
