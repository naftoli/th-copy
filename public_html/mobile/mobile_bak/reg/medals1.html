<script>
	var url = location.toString();
	var pos = url.indexOf('='); 
	var id = url.substring( pos+1 );
	
	$.post('ajax/checkAuth.php', { user_id : id, admin_id : Cookies.get('admin') }, function( success ) {
		if (success == 0) {
			window.location = "/mobile";
		}
	});
	
	$("#missionsLink").attr('href', '/mobile/missions.php?id=' + id);
	$("#goalsLink").attr('href', '/mobile/goals.php?id=' + id);
	$("#rankLink").attr('href', '/mobile/reg/rank.html?id=' + id);
	$("#subMenu li").each( function() {
		var link = $(this).find('a');
		var href = link.attr('href');
		link.attr('href', href + '?id=' + id);
	});
	
	$.post('../medals/ajax/getMedalInfo.php', { user_id : id }, function( success ) {
		var medals = $.parseJSON( success );
		
		var html = '<div class="span12"><div class="l-3">';
		for (var i in medals) {
			var medal = medals[i];
			if (i % 3 == 0 && i < 10) {
				if (i == 9) {
					html += '</div></div><div class="span12 mt2"><div class="l-4">';
				} else {
					html += '</div></div><div class="span12"><div class="l-3">';
				}
			}
			html += '<a href="medals2.html?id=' + id + '&subject=' + medal.id + '">';
			if (i > 8) {
				html += '<div class="span3" style="text-align: center;">';
			} else {
				html += '<div class="span4" style="text-align: center;">';
			}
			
			if (medal.photo != '')
				html += '<img class="medal" src="../../../file_view.php?id=' + medal.photo + '">';
			else 
				html += '<img class="medal" src="../../../kiosk/images/medals/holder.png">';
			html += '<div class="medal-sub" style="background-image: url(images/bot-caption.png);">\
                            <div style="display: table;width: 100%;"><span>' + medal.name + '</span></div>\
                        </div>\
                        <span>' + medal.left + ' to ' + medal.next + '</span>\
                    </div></a>';
		}
		html += '</div></div>';
	    $("#medals").append( html );
	});
</script>
