<html>
  <head>
    <meta charset="UTF-8">
    <title>Tzivos Hashem | Commitment</title>
      <meta content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no' name='viewport'>
      <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
      <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet" type="text/css" />
      <link href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css" rel="stylesheet" type="text/css" />
      <link href="plugins/iCheck/all.css" rel="stylesheet" type="text/css" />
      <link href="dist/css/Tsivot-Mobile.css" rel="stylesheet" type="text/css" />
      <link href="dist/css/skins/skin-blue-Tsivot.css" rel="stylesheet" type="text/css" />

      <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
      <![endif]-->
      <link href="css/style.css" type="text/css" rel="stylesheet" />
      <link href="css/responsive.css" type="text/css" rel="stylesheet" />
      <script src="js/jquery-1.9.1.min.js"></script>
  </head>
  <body class="skin-blue sidebar-mini">

  <div class="container child-commit-page">
      <div class="login-header">
          <span class="span12">PARENT'S COMMITMENT</span>
      </div>

      <div class="register-box body">
          <div class="logo">
              <img src="dist/img/Tzivos_Hashem_Logo.png" class="img-responsive center-block">
          </div>
      <div class="register-box-body">

            <div class="row">
                <div class="col-xs-12">
                    <label class="check-accept">
                        <input type="checkbox" name="accept" id="accept" class="minimal-red" />
                        <span>I would like my child to join Tzivos
                        Hashem, and I will support them in
                        completing missions and becoming the
                        best chayol they can.</span>
                    </label>
                </div>
            </div>
          <div class="row">
              <div class="col-xs-12">
                  <button type="submit" id="btn_next"  class="btn btn-primary btn-block H8">
                      <b>NEXT ></b>
                  </button>
              </div><!-- /.col -->
          </div>

      </div><!-- /.form-box -->
    </div><!-- /.register-box -->
	</div><!-- wrapper  -->
    <script src="plugins/jQuery/jQuery-2.1.4.min.js"></script>
    <script src="bootstrap/js/bootstrap.min.js" type="text/javascript"></script>
    <script src="plugins/iCheck/icheck.min.js" type="text/javascript"></script>
	<script>
        $(function () {
            $('input').iCheck({
                checkboxClass: 'icheckbox_square-blue',
                radioClass: 'iradio_square-blue',
                increaseArea: '20%' // optional
            });
        });
        
        var url = location.toString();
		var pos = url.indexOf('='); 
		var id = url.substring( pos+1 );
		
		$("#btn_next").click( function() {
			if (!$("#accept").is(":checked")) {
				alert("You have not accepted parent's responsibilities.");
			} else {
				window.location = "fee.html?child=" + id + "&newChild";
			}
		});
	</script>

	  })(window,document,'script','//www.google-analytics.com/analytics.js','ga');

</body>
</html>
