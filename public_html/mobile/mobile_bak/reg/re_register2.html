<script>
	var url = location.toString();
	var pos = url.indexOf('='); 
	var schoolID = url.substring( pos+1 );
	var pos2 = schoolID.indexOf('&');
	if (pos2 != -1) {
		schoolID = schoolID.substring(0, pos2);
		if (schoolID == 269) {
			$("#noSchool").attr('checked', true);
		}
	}
			
    $( function () {
        $('input').iCheck({
            checkboxClass: 'icheckbox_square-red',
            radioClass: 'iradio_square-red',
            increaseArea: '20%' // optional
        });
			
		$(".newOnly .remember input").on('ifChecked', function() {
			alert('You will be assigned to the school called "Anash Kinder".');
			$("#school").val('269').change();
			$("#school").attr('disabled', true);
		});	
		$(".newOnly .remember input").on('ifUnchecked', function() {
			$("#school").attr('disabled', false);
		});
        
    $('#dob').datetimepicker();
		$('#dob').data("DateTimePicker").format('MM/DD/YYYY');
		$('#dob').data("DateTimePicker").options({ 
			showClose : true 
		});
		
		var html = "<option value='269'";
		if (schoolID == 269) html += " selected";
		html += ">Anash Kinder</option>";
		if (schoolID != 269) {
			html += "<option value='61'";
			if (schoolID == 61) html += " selected";
			html += ">MyShliach</option>";
		}
		//$("#school").empty();
		$("#school").append( html );
		$("#school").selectpicker('refresh');
		
		$("#classe").empty();
		$("#classe").append( "<option value='0'>Select Class</option>" );
		$("#classe").selectpicker('refresh');
		
		$("#school").change( function() {
			var school = $(this).val();
			$.post('ajax/getGrades.php', { school : school }, function( success ) {
				var grades = $.parseJSON( success );
				var html = "";
				for ( var g in grades ) {
					html += "<option value='" + g + "'>" + grades[g] + "</option>";
				}
				$("#classe").empty();
				$("#classe").append( html );
				$("#classe").selectpicker('refresh');
			});
		});
		
		$("#school").trigger('change');
    });
		
		var addChild = false;
		function setAdd() {
			addChild = true;
		}
		
    $('#regForm').submit( function(e) {
    	e.preventDefault();
    	var admin = Cookies.get('admin');
    	var gender = 0;
    	$(".gender").each( function() {
    		if ($(this).is(":checked")) {
    			gender = $(this).val();
    		}
    	});
			if (gender == 0) {
				alert("You need to choose 'boy' or 'girl'.");
				return false;
			}
			var fname = $("#firstname").val();
			var lname = $("#lastname").val();
			var fhname = $("#fhname").val();
			var lhname = $("#lhname").val();
			var address = $("#address").val();
			var city = $("#city").val();
			var state = $("#state").val();
			var zip = $("#zip").val();
			var school = $("#school").val();
			var grade = $("#classe").val();
			var dob = $("#dob").val();
			var photo = $("#imgchild").attr('src');
			if (photo == 'images/addphoto.png') {
				photo = null;
				alert('You need to upload a photo.');
				return false;
			}
			var lang = $("#lang").val();
        
       if (fname == '' || lname == '' || fhname == '' || school == '0' || grade == '0' || dob == '') {
    		alert('You must have all fields filled out.');
    		return false;
    	}
			
			var conf = confirm('Are you sure you entered the correct DOB?');
			if (conf) {
				$.post('ajax/newUser.php', {
					admin : admin, 
					first : fname, 
					last : lname, 
					firsthe : fhname, 
					lasthe : lhname,
					school_id : school, 
					class_id : grade, 
					dob : dob, 
					gender : gender, 
					photo : photo, 
					lang : lang 
				}, function( success ) {
					var userID = parseInt(success);
					if ( userID ) {
						alert('Child successfully added.');
						var added = Cookies.getJSON('childrenAdded');
						if (!added) added = [];
						added.push(userID);
						Cookies.set('childrenAdded', added);
						
						if (addChild) {
							location.href = "re_register2.html?school=" + schoolID;
						} else {
							location.href = "parent_detail.html";
						}
					} else {
						alert('There was an error creating a new child.');
						return false;
					}
				});
			}
    });
</script>
