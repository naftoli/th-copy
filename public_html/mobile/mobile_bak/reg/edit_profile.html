    <script>
$(document).ready( function(){
    $(function () {
        $('input').iCheck({
            checkboxClass: 'icheckbox_square-blue',
            radioClass: 'iradio_square-blue',
            increaseArea: '20%' // optional
        });
    });
    //$('#phone').inputmask("(999) 999-9999");  //static mask
    //$('#zip').inputmask("99999");
   
    $('#country').val('USA');
	
	// initialize with defaults
	// get all the info about the family
	//var admin = Cookies.get('admin');
	//if (!admin) {
	//	admin = Cookies.get('admin', { path: '/mobile/reg' });
	//}
	$.post('ajax/getAdmin.php', { admin : Cookies.get('admin') }, function( success ) {
		if (success == -1) {
			alert('There was an error pulling up your admin account.');
			window.location = "parent_detail.html";
		} else {
			data = $.parseJSON( success );
			$("#father").val( data.father );
			$("#mother").val( data.mother );
			$("#lastname").val( data.last );
			$("#login").val( data.username );
			$("#phone").val( data.admin_phone_mobile );
			$("#email").val( data.admin_email );
			$("#address").val( data.admin_address1 );
			$("#city").val( data.admin_city );
			$("#state").val( data.admin_state );
			$("#zip").val( data.admin_postal );
			$("#country").val( data.admin_country );
			if ( data.father_pic ) {
				$("#img-father").attr('src', data.father_pic);
				/*
				var elem = $(".img-people").eq(0);
		        $(elem).find(".addPhoto").remove();
		        $(elem).find("img").remove();
		        $(elem).find("label").append('<img id="imgfather" src="' + data.father_pic + '" class="img-img" />');
		        */
			}
			if ( data.mother_pic ) {
				$("#img-mother").attr('src', data.mother_pic);
				/*
				var elem = $(".img-people").eq(1);
		        $(elem).find(".addPhoto").remove();
		        $(elem).find("img").remove();
		        $(elem).find("label").append('<img id="imgfather" src="' + data.mother_pic + '" class="img-img" />');
		        */
			}
		}
	});
	
	$("#editForm").submit( function(e) {
		e.preventDefault();
		var pwd = $("#newpwd").val();
		var pwd2 = $("#newpwd2").val();
		if (pwd != '') {
			if (pwd != pwd2) {
				alert('Your new passwords do not match.');
				return false;
			}
		}
		
		var fatherPic = $("#img-father").length ? $("#img-father").attr('src') : null;
		var motherPic = $("#img-mother").length ? $("#img-mother").attr('src') : null;
		
		if (fatherPic == 'images/addphoto.png') fatherPic = null;
		if (motherPic == 'images/addphoto.png') motherPic = null;
		
		$.post('ajax/updateAdmin.php', {
			admin_id : Cookies.get('admin'),
			father : $("#father").val(), 
			mother : $("#mother").val(),
			last : $("#lastname").val(),
			username : $("#login").val(),
			pwd : pwd,
			phone : $("#phone").val(), 
			email : $("#email").val(),
			address : $("#address").val(),
			city : $("#city").val(), 
			state : $("#state").val(),
			zip : $("#zip").val(), 
			country : $("#country").val(), 
			fatherPic : fatherPic, 
			motherPic : motherPic,
		}, function( success ) {
			if (success) {
				//alert("Saved.");
				window.location = "parent_detail.html";
			} else {
				alert('There was an error saving. Please try again.');
				return false;
			}
		});
	});
	$(".file-input-new").find("div.input-group").addClass('hide');
});
   
var $input = $('#imagefather');
$("#imagefather").fileinput({
    showPreview: false,
	showCancel: false,
	showUploadedThumbs: false,
    showcaption: false,
	showUpload: false,
	showRemove: false,
	uploadAsync : false,
	allowedFileExtensions : ['jpg', 'png','gif'],
    uploadUrl: "server.php", // your upload server url
	minFileCount: 1,
	maxFileCount: 5,
      uploadExtraData: function() {   // pour le futur...
        return {
            action: 'inputimg'
        };
    } 
}).on("filebatchselected", function(event, files) {
	    // trigger upload method immediately after files are selected
	    $input.fileinput("upload").on('filebatchuploadsuccess', function(event, data, previewId, index) {
	    var form = data.form, files = data.files, extra = data.extra,
        response = data.response, reader = data.reader;
		//$("#imgfather").attr('src',response);
		
		var elem = $(".img-people").eq(0);
        $(elem).find(".addPhoto").remove();
        $(elem).find("img").remove();
        $(elem).find("label").append('<img id="imgfather" src="' + response + '" class="img-img" />');
	});
});
var $inputm = $('#imagemother');
$("#imagemother").fileinput({
    showPreview: false,
	showCancel: false,
	showUploadedThumbs: false,
    showcaption: false,
	showUpload: false,
	showRemove: false,
	uploadAsync : false,
	allowedFileExtensions : ['jpg', 'png','gif'],
    uploadUrl: "server.php", // your upload server url
	minFileCount: 1,
	maxFileCount: 5,
      uploadExtraData: function() {   // pour le futur...
        return {
            action: 'inputimg'
        };
    } 
}).on("filebatchselected", function(event, files) {
	    // trigger upload method immediately after files are selected
	    $inputm.fileinput("upload").on('filebatchuploadsuccess', function(event, data, previewId, index) {
	    var form = data.form, files = data.files, extra = data.extra,
        response = data.response, reader = data.reader;
		//$("#imgmother").attr('src',response);
		var elem = $(".img-people").eq(1);
        $(elem).find(".addPhoto").remove();
        $(elem).find("img").remove();
        $(elem).find("label").append('<img id="imgmother" src="' + response + '" class="img-img" />');
	});
});
