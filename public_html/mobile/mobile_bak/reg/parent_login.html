<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Mobile Web Site</title>
		<link href="bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
		<link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet" type="text/css" />
		<link href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css" rel="stylesheet" type="text/css" />
		<link href="dist/css/Tsivot-Mobile.css" rel="stylesheet" type="text/css" />
		<link href="dist/css/skins/skin-blue-Tsivot.css" rel="stylesheet" type="text/css" />
		<link href="css/style.css" type="text/css" rel="stylesheet" />
		<link href="css/responsive.css" type="text/css" rel="stylesheet" />
		<script src="js/jquery-1.9.1.min.js"></script>
	</head>
	<body>
		<div class="container login-page">
			<div class="login-header">
				<span class="span12">NEW PARENT ACCOUNT</span>
			</div>
			<div class="span12 body">
				<div class="login-box">
					<div class="login-box-body login-box-body-3">
						<form action="" id="loginForm">
							<div class="form-group has-feedback" id="divlogin">
								<div class="input-group">
									<span class="input-group-addon"><span class="glyphicon glyphicon-user "></span></span>
									<input id="login" name="login" type="text" class="form-control" placeholder="username" required/>
								</div>
							</div>
							<div class="form-group has-feedback" id="divpwd" >
								<div class="input-group">
									<span class="input-group-addon"><span class="glyphicon glyphicon-lock "></span></span>
									<input id="pwd" name="pwd" type="password" class="form-control" placeholder="password" required/>
								</div>
							</div>
							<div class="form-group has-feedback" id="divrepwd" >
								<div class="input-group">
									<span class="input-group-addon"><span class="glyphicon glyphicon-lock "></span></span>
									<input id="repwd" name="repwd" type="password" class="form-control" placeholder="re-type password" required/>
								</div>
							</div>
							<div class="row">
								<div class="col-xs-12">
									<button type="submit" class="btn btn-primary btn-block H8">
										<b>NEXT ></b>
									</button>
								</div><!-- /.col -->
							</div>
							<br />
							<div class="row" id="error-block" style="display:none">
								<div class="col-sm-12 error-box">
									<img src="images/error.png" width="8%">
									<span class="color-red"><b>oops!</b></span>
									<span class="color-grey">Please re-enter your</span>
									<span class="color-red">password</span>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
		<script src="bootstrap/js/bootstrap.min.js" type="text/javascript"></script>
		<script src="js/js.cookie.js"></script>
		<script>
			$(document).ready(function() {
				$('#msg_alert').hide();
			});
		</script>
		<script>
			$("#loginForm").submit(function(event) {
				event.preventDefault();
				
				$(".login-box-body-3 .has-error").removeClass("has-error");
				$("#error-block").hide();
				
				var $form = $(this);
				var login = $form.find("input[name='login']").val();
				var pwd = $form.find("input[name='pwd']").val();
				var repwd = $form.find("input[name='repwd']").val();
				
				if (pwd != repwd) {
					$("#divrepwd").addClass("has-error");
					$("#error-block").show();
					$("#error-block .error-box").html('<img src="images/error.png" width="8%">' + 
									'<span class="color-red"><b>oops! </b></span>' + 
									'<span class="color-grey">Your </span><span class="color-red">passwords do not match.</span>');
				} else {
					window.location = "parent_register.html";
				}
			});
		</script>
		<script>
		  (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
		  (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
		  m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
		  })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
		  ga('create', 'UA-71974937-1', 'auto');
		  ga('send', 'pageview');
		</script>
	</body>
</html>
