<script>
	function setNameUpper( str ) {
		var arr = str.split(" ");
		var newStr = '';
		var last = arr.length - 1;
		for (var a in arr) {
				var temp = arr[a];
				var s = temp[0].toUpperCase();
				newStr += s;
				var other = temp.substring(1);
				newStr += other;
				if (a < last) newStr += ' ';
		}
		return newStr;
	}
	
	var url = location.toString();
	var pos = url.indexOf('='); 
	var pos2, id;
	
	if (pos == -1) {
		//new registration
		$(".titler").text('NEW REGISTRATION');
		$("#btn_create").html("<b>SIGN UP</b>");
		$(".reg").hide();
	} else {
		$(".newOnly").hide();
		id = url.substring( pos+1 );
		pos2 = id.indexOf('&');
		if (pos2 !== -1) {
			//edit profile
			$(".titler").text('EDIT PROFILE');
			$("#btn_create").html("<b>UPDATE</b>");
			$(".reg").hide();
			id = id.substr(0, pos2);
		}
	}

						var schools = $.parseJSON( success );

						for ( var i in schools ) {
							for ( var s in schools[i] ) {
								if ( s == info.school_id ) {
									html += "<option value='" + s + "' selected>" + schools[i][s] + "</option>";
								} else {
									html += "<option value='" + s + "'>" + schools[i][s] + "</option>";
								}
							}
						}
						$("#school").empty();
						$("#school").append( html );
						$("#school").selectpicker('refresh');
						var school = $("#school").val();
						if (school != 61 && school != 269) $("#classe").parent().parent().parent().parent().hide();
					});
					
					$.post('ajax/getGrades.php', { school : info.school_id }, function( success ) {

			function checkReg() {
