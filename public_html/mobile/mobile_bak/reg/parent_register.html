	<script>

	$(document).ready( function() {
		//get info
		var admin = 
	    $(function () {
	        $('input').iCheck({
	            checkboxClass: 'icheckbox_square-aero',
	            radioClass: 'iradio_square-aero',
	            increaseArea: '20%' // optional
	        });
	    });
	    //$('#phone').inputmask("(999) 999-9999");  //static mask
	    //$('#zip').inputmask("99999");
	   
	    $('#country').val('USA');
	   
		$(".file-input-new").find("div.input-group").addClass('hide');
	});

    $('#regForm').submit( function(e) {
    	e.preventDefault();
        var pwd = $("#pwd").val();
        var repwd = $("#repwd").val();
        if (pwd != repwd) {
        	alert('Your passwords do not match.');
        	return false;
        }
        
        var father = $("#father").val();
        var mother = $("#mother").val();
        var lastname = $("#lastname").val();
        var email = $("#email").val();
        var address = $("#address").val();
        var city = $("#city").val();
        var state = $("#state").val();
        var zip = $("#zip").val();
        var country = $("#country").val();
        var phone = $("#phone").val();
        var username = $("#login").val();
        var fatherPic = $("#img-father").length ? $("#img-father").attr('src') : null;
        var motherPic = $("#img-mother").length ? $("#img-mother").attr('src') : null;
        
        if (fatherPic == 'images/addphoto.png') fatherPic = null;
        if (motherPic == 'images/addphoto.png') motherPic = null;
        
        /*
        if (father == '' && mother == '') {
        	alert("You must enter father's or mother's name.");
        	return false;
        }
        */
				/*
        if (lastname == '' || email == '' || address == '' || city == '' || state == '' || zip == '' 
        	|| country == '' || phone == '' || username == '' || pwd == '') {
    		alert('You must fill in all the fields.');
    		*/
				if (lastname == '' || email == '' || phone == '' || username == '' || pwd == '') {
					alert('Not all mandatory fields have been filled out. Please fill out and try again.');
					return false;
				}
    	/*
    	if ( !$("#terms").is(":checked") ) {
        	alert('You must agree to terms.');
        	return false;
        }
        */
        $.post('ajax/createParent.php', {
        	father : father, 
        	mother : mother, 
        	fatherPic : fatherPic, 
        	motherPic : motherPic,
        	lastname : lastname, 
        	email : email, 
        	address : address, 
        	city : city, 
        	state : state, 
        	zip : zip, 
        	country : country, 
        	phone : phone, 
        	username : username, 
        	pwd : pwd
        }, function( success ) {
        	if (success == -1) {
        		alert('This username or email address is already being used. Please try again.');
        		return;
        	}
        	else if (success == 1) {
        		alert('Your account has been created. You can now login with your username / password.');
        		window.location = "/mobile/reg";
        	} else {
        		alert('There was a problem creating a parent account. Please try again. If this problem persists please contact Tzivos Hashem.');
        		return;
        	}
        });
    });
</script>
