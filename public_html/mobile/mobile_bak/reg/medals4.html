<style>
	@font-face {
		font-family: 'digi';
		src: url('font/DS-DIGIB.TTF');

    body {
    	margin-bottom: 100px;
    }
    #gold {
    	padding-top: 4%;
    }
    #gold img {
    	width: 26%;
    	height: 26%;
    	margin-left: 10%;
    	margin-right: 10%;
    }
    #backs img {
    	opacity: 0.3;
    }
    #userImg {
	    border-radius: 50%;
	    width: 100%;
	    height: 120%;
	    border: 2px solid grey;
	}
	.personalImg {
		width: 50px;
		height: 50px;
		left: 1%;
		top: 1%;
		border-radius: 50%;
		position: absolute;
	}
	
	.panel-heading {
		background-color: #f68829 !important;
		border: none;
		font-size: 20px;
	}
	.panel a {
		color: white;
	}
	.panel a:hover, a:active, a:visited, a:link {
		text-decoration: none;
	}
	
	.medalInfo {
		float: right;
		width: 70%;
		padding-top: 1%;
	}
	
	.progress {
		margin-bottom: 5px !important;
	}
	
	.progressText {
		position: absolute;
	    display: block;
	    width: 95%;
	    color: black;
	    text-align: center;
	    font-family: 'digi';
	    font-size: 14px;
	}
	
	.progress .text {
		font-family: 'digi';
		color: #fff;
		font-weight: normal;
	}
	
	.progressMedalText {
		position: absolute;
	    width: 60%;
	    color: black;
	    text-align: center;
	    font-family: 'digi';
	    font-size: 14px;
	    font-weight: normal;
	}
	
	i.glyphicon {
		transition: transform .3s ease-in-out;
		transition: -moz-transform .3s ease-in-out;
		transition: -webkit-transform .3s ease-in-out;
	}
	
	hr {
		margin: 10px 0 !important;
	}
	
	.levelText {
		font-weight: bold !important;
		margin: 0 auto;
		line-height: 1.1;
		font-size: 24px !important;
		width: 95%;
	}
	
	@media screen and (max-width: 1024px) {
		.levelText {
			line-height: 1;
			font-size: 24px !important;
		}
	}
	
	@media screen and (max-width: 900px) {
		.levelText {
			line-height: 1;
			font-size: 20px !important;
		}
	}
	
	@media screen and (max-width: 767px) {
		.levelText {
			line-height: 0.9;
			font-size: 18px !important;
		}
	}
	
	@media screen and (max-width: 639px) {
		.levelText {
			line-height: 0.9;
			font-size: 16px !important;
		}
	}
	
	@media screen and (max-width: 479px) {
		.levelText {
			line-height: 0.9;
			font-size: 14px !important;
		}
		.medalInfo span {
			font-size: 16px !important;
		}
	}
</style>

<script>
$(document).ready(function() {
   
    var url = location.toString();
	var pos = url.indexOf('='); 
	var id = url.substring( pos+1 );
	
	$.post('ajax/checkAuth.php', { user_id : id, admin_id : Cookies.get('admin') }, function( success ) {
		if (success == 0) {
			window.location = "/mobile";
		}
	});
	
	$("#missionsLink").attr('href', '/mobile/missionsNew.html?id=' + id);
	$("#goalsLink").attr('href', '/mobile/goalsNew.html?id=' + id);
	$("#rankLink").attr('href', '/mobile/reg/rank.html?id=' + id);
	$("#storeLink").attr('href', '/mobile/store/index.html?id=' + id);
	
	$("#rankMenu").attr('href', '/mobile/reg/rank.html?id=' + id);
	$("#auctionMenu").attr('href', '/mobile/auction/category2.html?id=' + id);
	
	var medalInfo = {
        1 : 'black', 
        2 : 'red', 
        3 : 'orange', 
        4 : 'yellow', 
        5 : 'green', 
        6 : 'blue', 
        7 : 'purple', 
        8 : 'brown', 
        9 : 'grey', 
        10 : 'black'
    };
    
    $.post('medals/ajax/getMedalInfo.php', { user_id : id }, function( success ) {
        var medals = $.parseJSON( success );
        
        var html = '<div class="span12"><div class="l-3">';
        for (var i in medals) {
            var medal = medals[i];
            if (i % 3 == 0 && i < 10) {
                //if (i == 9) {
                //    html += '</div></div><div class="span12 mt2"><div class="l-4">';
                //} else {
                    html += '</div></div><div class="span12"><div class="l-3">';
                //}
            }
            //if (i > 8) {
            //    html += '<div class="span3" style="text-align: center;">';
            //} else {
                html += '<div class="span4" style="text-align: center;">';
            //}
            html += '<a href="https://mashpia.com/mobile/reg/medals3.html?id=' + id + '&subject=' + medal.id + '">';
            if (medal.photo != '')
                html += '<img class="medal" src="https://mashpia.com/file_view.php?id=' + medal.photo + '">';
            else 
                html += '<img class="medal" src="https://mashpia.com/kiosk/images/medals/holder.png">';
            html += '</a><div class="medal-sub" style="background-image: url(images/bot-caption.png);">\
                            <div style="display: table;width: 100%;"><span>' + medal.name + '</span></div>\
                        </div>\
                        <span>' + medal.left + ' to Level ' + medal.next + '</span>\
                    </div>';
        }
        html += '</div></div>';
        $("#medals").append( html );
        //$(".medal-sub").eq(i).next('span').attr('color', medalInfo[i+1]);
    });
});

</script>
