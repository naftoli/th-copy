<style>
	@font-face {
		font-family: 'digi';
		src: url('font/DS-DIGIB.TTF');
	}
	
    body {
    	margin-bottom: 100px;
    }

    	padding-top: 4%;

    	width: 26%;

    #backs img {
    	opacity: 0.3;
    }
    #userImg {
	    border-radius: 50%;
	    width: 100%;
	    height: 120%;
	    border: 2px solid grey;
	}
	.personalImg {
		width: 50px;
		height: 50px;
		left: 1%;
		top: 1%;
		border-radius: 50%;
		position: absolute;
	}
	
	.panel-heading {
		background-color: #f68829 !important;
		border: none;
		font-size: 20px;
	}
	.panel a {
		color: white;
	}
	.panel a:hover, a:active, a:visited, a:link {
		text-decoration: none;
	}
	
	.medalInfo {
		float: right;
		width: 70%;
		padding-top: 1%;
	}
	
	.progress {
		margin-bottom: 5px !important;
	}
	
	.progressText {
		position: absolute;
	    display: block;
	    width: 95%;
	    color: black;
	    text-align: center;
	    font-family: 'digi';
	    font-size: 14px;
	}
	
	.progress .text {
		font-family: 'digi';
		color: #fff;
		font-weight: normal;
	}
	
	.progressMedalText {
		position: absolute;
	    width: 60%;
	    color: black;
	    text-align: center;
	    font-family: 'digi';
	    font-size: 14px;
	    font-weight: normal;
	}
	
	i.glyphicon {
		transition: transform .3s ease-in-out;
		transition: -moz-transform .3s ease-in-out;
		transition: -webkit-transform .3s ease-in-out;
	}
	
	hr {
		margin: 10px 0 !important;
	}
	
	.levelText {
		font-weight: bold !important;
		margin: 0 auto;
		line-height: 1.1;
		font-size: 24px !important;
		width: 95%;
	}
	
	@media screen and (max-width: 1024px) {
		.levelText {
			line-height: 1;
			font-size: 24px !important;
		}
	}
	
	@media screen and (max-width: 900px) {
		.levelText {
			line-height: 1;
			font-size: 20px !important;
		}
	}
	
	@media screen and (max-width: 767px) {
		.levelText {
			line-height: 0.9;
			font-size: 18px !important;
		}
	}
	
	@media screen and (max-width: 639px) {
		.levelText {
			line-height: 0.9;
			font-size: 16px !important;
		}
	}
	
	@media screen and (max-width: 479px) {
		.levelText {
			line-height: 0.9;
			font-size: 14px !important;
		}
		.medalInfo span {
			font-size: 16px !important;
		}
	}
</style>

<script>
$(document).ready(function() {
    $('#banner-slide').bjqs({
        height        : 500,
        width         : 770,
        responsive    : true
    });
    
    var url = location.toString();
	var pos = url.indexOf('='); 
	var id = url.substring( pos+1 );
	
	var s = id.indexOf('&');
	var subject = 0;
	if (s > 0) {
		var temp = id.substring( s+1 );
		id = id.substring( 0, s );
		
		var tPos = temp.indexOf('=');
		subject = parseInt( temp.substring( tPos+1 ) );
	}
	
	$.post('ajax/checkAuth.php', { user_id : id, admin_id : Cookies.get('admin') }, function( success ) {
		if (success == 0) {
			window.location = "/mobile";
		}
	});
	
	$.post('ajax/getPhoto.php', { user_id : id }, function( success ) {
		var info = $.parseJSON( success );
		var html = '<a href="/mobile/reg/medals/index.html?id=' + id +'">';
		if (info.mobile_pic) html += '<img id="userImg" src="https://mashpia.com/mobile/reg/' + info.mobile_pic + '">';
		else if (info.thumb) html += '<img id="userImg" src="https://mashpia.com/thumbs/' + info.thumb + '">';
		else if (info.photo) html += '<img id="userImg" src="https://mashpia.com/file_view.php?id=' + info.photo + '">';
		html += '</a>';
		$(".personalImg").append( html );
	});
	
	$("#missionsLink").attr('href', '/mobile/missionsNew.html?id=' + id);
	$("#goalsLink").attr('href', '/mobile/goalsNew.html?id=' + id);
	$("#rankLink").attr('href', '/mobile/reg/rank.html?id=' + id);
	
	var golds = {
		1 : 'tehillim.png', 
		4 : 'tefillah.png', 
		12 : 'mivtzoim.png', 
		13 : 'nigunim.png', 
		15 : 'Hakhel _medal.jpg', 
		16 : 'hiskashrus.png', 
		21 : 'Sefer Hamitzvos.png', 
		27 : 'tanya.png', 
		40 : 'yomei dipagra.png', 
		41 : 'avos ubonim.png', 
		42 : 'vhalachta bidrachov.png', 
		45 : 'cheshbon Hanefesh.png', 
		90 : 'chitas.png', 
		100 : 'brias haguf.png', 
	}
	
	var subjects = [];
	for (var g in golds) subjects.push( g );
	var index;
	for (var i = 0; i < subjects.length; i++) {
		if (subjects[i] == subject) {
			index = i;
			break;
		}
	}
	
	var html = '<a href="medals3.html?id=' + id + '&subject=';
	if (subject > 1) html += subjects[index-1];
	else html += subjects[subjects.length-1];
	html += '"><span class="glyphicon glyphicon-menu-left"></span></a>';
	html += '<img src="" />';
	html += '<a href="medals3.html?id=' + id + '&subject=';
	if (subject < 100) html += subjects[index+1];
	else html += subjects[0];
	html += '"><span class="glyphicon glyphicon-menu-right"></span></a>';
	$("#gold").append( html );
	
	var elem = document.getElementById('gold');
	var h = new Hammer(elem);
	h.on("swiperight", function( evt ) {
		var s;
		if (subject > 1) s = subjects[index-1];
		else s = subjects[subjects.length-1];
		location.href = "medals3.html?id=" + id + "&subject=" + s;
	});
	h.on("swipeleft", function( evt ) {
		var s;
		if (subject < 100) s = subjects[index+1];
		else s = subjects[0];
		location.href = "medals3.html?id=" + id + "&subject=" + s;
	});
	
	$.post('ajax/getMedalDiv.php', { id : subject, user: id }, function( html ) {
		$('#backs').append( html );
		$(document).on('click', '.panel-heading', function() {
			var obj = $(this).find('i.glyphicon');
			if ($(obj).attr('class').indexOf('turned') == -1) {
				$(obj).css('transform', 'rotate(90deg)');
				$(obj).css('-moz-transform', 'rotate(90deg)');
				$(obj).css('-webkit-transform', 'rotate(90deg)');
				$(obj).addClass('turned');
			} else {
				$(obj).removeClass('turned');
				$(obj).css('transform', 'rotate(0deg)');
			}
		});
		
		$.post('ajax/getMedalInfo.php', {subject : subject}, function( success ) {
			var medalsInfo = $.parseJSON( success );
			var total = 0;
			var needed = [];
			for (var m in medalsInfo) {
				total += medalsInfo[m];
				needed[m] = total;
			}
			
			var html = '<div class="span12 allMedals">';
			var medals = ['white', 'red', 'orange', 'yellow', 'green', 'blue', 'purple', 'brown', 'grey', 'black'];
			for (var i = 0; i < 10; i++) {
				html += '<div class="span3" style="text-align: center;">';
				html += '<span class="levelText">Level ' + (i+1) + '</span><img class="medal" src="';
				if (i == 8) {
					//html += 'images/sub-medal/blank.png"></div><div class="span3" style="text-align: center;"><img class="medal" src="';
				}
				if (subject == 1 || subject == 12 || subject == 21) {
					html += 'images/backs/wwtc/' + medals[i] + '.gif';
				} else if (subject == 40) {
					html += 'images/backs/yd/' + medals[i] + '.gif';
				} else {
					html += 'images/backs/weekly/' + medals[i] + '.gif';
				}
				html += '"></div>';
				html += '<div class="medalInfo"><div><div class="neededText"><span class="medalsNeeded">' + needed[i+1] + '</span> missions <span class="need">needed</span>.</div><div class="earned"></div></div>';
				html += '</div><div style="clear: both"></div><hr />';
			}
			html += '</div>';
			$(".panel").after( html );
			
			$.post('ajax/getMedalSubject.php', { user_id : id, subject : subject }, function( success ) {
				var medalOrd = 0;
				if (success) medalOrd = parseInt( success );
				
				//update gold img to show medal earned or logo if no medal earned
				if (medalOrd) {
					//var src = $(".medal").eq(medalOrd-1).attr('src');
					//$("#gold img").attr('src', src);
					$.post('ajax/getMedalPic.php', { medal : medalOrd, subject : subject }, function( success ) {
						$("#gold img").attr('src', '../../../../file_view.php?id=' + success);
					});
				} else {
					$("#gold img").attr('src', 'images/backs/goldLogos/' + golds[subject]);
				}
				
				for (var i = 0; i < medalOrd; i++) {
					$(".allMedals img").eq(i).attr('style', 'opacity: 1');
					$("#" + subject + " img").eq(i).attr('style', 'opacity: 1');
					var total = $(".medalsNeeded").eq(i).text();
					$(".earned").eq(i).parent().find('.neededText').hide();
					//$(".earned").eq(i).html("<span>" + total + "</span> missions <span>accomplished</span>.");
					$(".medalInfo").eq(i).css('padding-top', '8%');
				}
				var num = medalOrd ? medalOrd + 1 : 0;
				for (var j = num; j < 10; j++) {
					$(".medalInfo").eq(j).css('padding-top', '9%');
				}
			});
			
			$.post('ajax/getMedalsEarned.php', { user_id : id, subject : subject }, function( success ) {
				var info = $.parseJSON( success );
				var end = $(".medalsNeeded").last().text();
				if (info.total > 0)
					var num = parseInt( info.total / end * 100 );
				else 
					var num = 0;
				//var html = '<div style="float: left;width: 80%;margin-left: 10%; margin-top: 5%; margin-bottom: 0">';
				var html = '<div style="margin: 4% 2% 0 2%"><div class="progress"><div class="progress-bar progress-bar-warning progress-bar-striped" role="progressbar" aria-valuenow="' + info.total + '" aria-valuemin="0" aria-valuemax="100" style="width: ' + num + '%"><span class="progressText">' + info.total + ' / ' + end + ' missions to Level 10</span></div></div></div>';
				$("#gold").after( html );
				
				var medals = info.medals;
				for (var medal in medals) {
					var total = $(".medalsNeeded").eq(medal-1).text();
					var html = '<div class="progress"><div class="progress-bar progress-bar-warning progress-bar-striped" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" style="width: 100%"><span class="text">' + total + ' missions - ' + '100%</span></div></div>';
					html += '<div>Medal earned on: ' + medals[medal] + '</div>';
					$(".earned").eq(medal-1).after( html );
				}
				if (!medal) medal = 0;
				var total = $(".medalsNeeded").eq(medal).text();
				var needed = medalsInfo[parseInt(medal)+1];
				var num = needed - (total - info.total);
				var left = needed - num;
				//var num = parseInt( info.total / total * 100 );
				var percent = Math.round( num / needed * 100 );
				//alert(percent);
				var html = "<span>" + info.total + "</span> missions <span>earned</span>.";
				html += '<div class="progress"><div class="progress-bar progress-bar-warning progress-bar-striped" role="progressbar" aria-valuenow="' + percent + '" aria-valuemin="0" aria-valuemax="100" style="width: ' + percent + '%"><div class="progressMedalText">' + left + ' missions to Level ' + (parseInt(medal)+1) + '</div></div></div>';
				//alert(html);
				$(".earned").eq(medal).append( html );
			});
		});
	});	
});

</script>
