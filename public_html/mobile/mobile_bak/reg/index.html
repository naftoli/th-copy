	<head>
		<meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Mobile Web Site</title>
        <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
        <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet" type="text/css" />
        <link href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css" rel="stylesheet" type="text/css" />
        <link href="plugins/iCheck/all.css" rel="stylesheet" type="text/css" />
        <link href="dist/css/Tsivot-Mobile.css" rel="stylesheet" type="text/css" />
        <link href="dist/css/skins/skin-blue-Tsivot.css" rel="stylesheet" type="text/css" />
		<link href="css/style.css?v=1.5" type="text/css" rel="stylesheet" />
		<link href="css/responsive.css?v=1.5" type="text/css" rel="stylesheet" />
		<script src="js/jquery-1.9.1.min.js"></script>
	</head>
	<body>
        <div class="container login-page">
            <div class="login-header">
                <span class="span12">PARENT'S LOGIN</span>
            </div>
            <div class="span12 body">
                <div class="logo">
                    <img src="dist/img/Tzivos_Hashem_Logo.png" class="img-responsive center-block">
                </div>
                <div class="login-box">
                    <div class="login-box-body">
                        <form id="loginForm">
                            <div class="form-group has-feedback" id="divlogin">
                                <div class="input-group">
                                    <span class="input-group-addon"><span class="glyphicon glyphicon-user "></span></span>
                                    <input id="login" name="login" type="text" class="form-control" placeholder="username" required/>
                                </div>
                            </div>
                            <div class="form-group has-feedback" id="divpwd" >
                                <div class="input-group">
                                    <span class="input-group-addon"><span class="glyphicon glyphicon-lock "></span></span>
                                    <input id="pwd" name="pwd" type="password" class="form-control" placeholder="password" required/>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-xs-12">
                                    <div class="form-group no-border remember">
                                        <label>
                                            <input type="checkbox" class="flat-red" />
                                            <span>&nbsp; Remember me </span>
                                        </label>
                                    </div>
                                </div><!-- /.col -->
                            </div>
                            <div class="row" id="error-block">
	                            <div class="col-sm-12 error-box" style="display: none;">
                            		<div class="error-box" style="display: none;"><img src="images/error.png" width="10%"><span class="color-red"><b>oops!</b></span></div>
	                                <span class="color-grey">The</span>
	                                <span class="color-red">username</span>
	                                <span class="color-grey">or</span>
	                                <span class="color-red">password</span>
	                                <span class="color-grey">you entered is</span>
	                                <span class="color-red">incorrect.</span>
	                                <span class="color-grey"> Please try again.</span>
	                            </div>
	                        </div>
                            <div class="row">
                                <div class="col-xs-12">
                                    <button type="submit" class="btn btn-primary btn-block H8"><b>LOGIN</b></button>
                                </div><!-- /.col -->
                            </div>
                        </form>
                        <br>
                        <div class="row">
                            <div class="col-xs-7 forgot">
                                <div class="error-change"><a href="forgot.html">Forgot user/password?</a></div>
                            </div>
                            <div class="col-xs-5 text-right create-account">
                                <a href="parent_register.html" ><b>Create account</b></a>
                            </div>
                        </div>
						<!--
                        <div class="row" align="center" id="desktop">
                        	<div class="col-xs-12 forgot">
                        		<a href="/admin.php?fromMobile">
                        			<span style="color: red">Desktop Site</span>
                        		</a>
                        	</div>
                        </div>
						-->
                    </div>

                </div>

            </div>
        </div>
        <script src="bootstrap/js/bootstrap.min.js" type="text/javascript"></script>
        <script src="plugins/iCheck/icheck.min.js" type="text/javascript"></script>
        <script>
            $(function () {
                $('input').iCheck({
                    checkboxClass: 'icheckbox_square-aero',
                    radioClass: 'iradio_square-aero',
                    increaseArea: '20%' // optional
                });
            });
        </script>
        <script src="js/js.cookie.js"></script>
        <script>
            $(document).ready( function() {
            	if (Cookies.get('isconnected')) {
            		var cookies = Cookies.get();
            		for (var c in cookies) {
            			Cookies.remove(c);
            		}
            	}
            	
            	//check cookie
            	if (Cookies.get('admin')) {
            		window.location = "parent_detail.html";
            	}
            	
                $( "#loginForm" ).submit(function( event ) {
                    // Stop form from submitting normally
                    event.preventDefault();

                    // Get some values from elements on the page:
                    var $form = $( this ),
                        login = $form.find( "input[name='login']" ).val(),
                        pwd = $form.find( "input[name='pwd']" ).val();
                    
                    $.post('ajax/auth.php', {
                    	username : login, 
                    	password : pwd
                    }, function( success ) {
                    	if ( success != 0 ) {
                    		//check for 'remember me'
                    		if ($(".remember input").is(":checked")) {
                    			Cookies.set('admin', success, { path: '/', expires: 365 });
                    		} else {
                    			Cookies.set('admin', success, { path: '/', expires: 1 });
                    		}
                    		//Cookies.set('admin', success, { path: '/', expires: 1 });
                    		window.location = "parent_detail.html";
                    	} else {
                    		$("#desktop").hide();
                    		$(".error-box").show();
                    	}
                    });  
                });
            });
        </script>
        <script>
		  (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
		  (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
		  m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
		  })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
		  ga('create', 'UA-71974937-1', 'auto');
		  ga('send', 'pageview');
		</script>
	</body>
</html>
