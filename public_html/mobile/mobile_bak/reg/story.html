<div class="container">

        <div class="span12" style="padding: 15px; padding-top: 0;">
            <h2>My Special Moment With the Rebbe</h2>
            <form role="form">
                <div class="form-group">
                    <label for="chayol">From: (Chayol's Name)</label>
                    <select class="form-control" id="chayol">
                    </select>
                </div>
                <div class="form-group">
                  <label for="story">My Story:</label>
                  <textarea class="form-control" rows="5" id="story"></textarea>
                </div>
                <div class="form-group">
                  <label for="lesson">...and it's Lesson to me:</label>
                  <textarea class="form-control" rows="5" id="lesson"></textarea>
                </div>
				<div class="form-group" align="center">
					<button type="submit" class="btn btn-default" id="submit">Submit</button>

<script src="js/js.cookie.js" type="text/javascript"></script>
<script>
    $( function() {
        var admin = Cookies.get('admin');
        if (!admin) {
            window.location = "index.html";
        }
        $.post('ajax/getChildrenNames.php', { admin : admin }, function( success ) {
            var children = $.parseJSON( success );
            var html = "<option value='0'>Please choose</option>";
            for (var c in children) {
                var child = children[c];
                html += "<option value='" + c + "'>" + child + "</option>";
            }
            $("#chayol").empty();
            $("#chayol").append(html);
        });
    });
    
    $("#submit").click(function( e ) {
        e.preventDefault();
		
		var user = parseInt($("#chayol").val());
		var story = $("#story").val();
        var lesson = $("#lesson").val();
		var year = 5777;
		
        if (user === 0) {
            alert('You must choose a child.');
            return false;
        }
        
        if (story.length < 250) {
            alert('Your story must have at least 250 characters.');
            return false;
        }
		
		if (lesson.length < 100) {
            alert('Your lesson must have at least 100 characters.');
            return false;
        }
        
        $.post('ajax/submitStory.php', {
			user : user,
			story : story,
			lesson : lesson,
			year : year
		}, function( success ) {
            if (parseInt(success) === 0) {
                alert('Your story has been submitted. Thank you.');
            } else {
                alert('There was an error submitting your story.');
            }
        });
    });
</script>
