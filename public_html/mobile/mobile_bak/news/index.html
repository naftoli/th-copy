	<script>
		//new UISearch( document.getElementById( 'sb-search' ) );
	</script>
	<script>
		var page = 1;
		var url = window.location.href.toString();
		
		var pos = url.indexOf('p='); 
		if (pos > 0) {
			var p1 = url.indexOf('=');
			page = url.substring( p1+1, p1+2 );
		}
		
		var search = '';
		var pos2 = url.indexOf('search=');
		if (pos2 > 0) {
			var p2 = url.indexOf('=');
			search = url.substring( p2+1 );
		}
		
		var postID = 0;
		var pos3 = url.indexOf('pid=');
		if (pos3 > 0) {
			var p3 = url.indexOf('=');
			postID = url.substring( p3+1 );
		}
		
		$.post('ajax/getPosts.php', { page : page, search : search, postID : postID }, function( success ) {
			var info = $.parseJSON( success );
			var pageInfo = info['pageInfo'];
			var page = parseInt( pageInfo['page'] );
			var total = parseInt( pageInfo['total'] );
			var posts = info['data'];
			var html = '';
			if (posts.length) {
				for (var p in posts) {
					html += '<div class="span12 wrap1">';
					html += '<div style="width : 90%; margin : 2% 5%;">';
					html += '<div class="b-t-title">';
					html += '<span>' + posts[p]['title'] + '</span>';
					html += '</div><div class="b-t-description">';
					html += '<span>' + posts[p]['content'] + '</span>';
					html += '</div><br />';
					if (posts[p]['images'].length) {
						html += '<div class="b-m-main">';
						for (var i in posts[p]['images']) {
							html += '<img class="img-responsive" src="' + posts[p]['images'][i][0] + '" /><br />';
						}
						html += '</div>';
					}
					//var d = new Date( posts[p]['posted'] );
					//html += '<div style="font-size: 10px; font-style: italic; clear: both;">Posted: ' + d.toDateString() + '</div>';
					html += '</div></div><div style="clear: both"></div>';
					if (p < (posts.length-1)) {
						html += '<hr style="width: 50%; border: 1px solid #72bf44; margin-top: 20px;" />';
					} else {
						if (page == 1 && total == 1) {} 
						else {
							html += '<div style="margin-top: 20px;">';
							if (page != 1) {
								html += '<a href="index.html?p=' + (page - 1) + '" class="btn btn-success pull-left" role="button"><< Previous</a>';
							}
							if (page != total) {
								html += '<a href="index.html?p=' + (page + 1) + '" class="btn btn-success pull-right" role="button">Next >></a>';
							}
							html += '</div>';
						}
					}
				}
			} else {
				html += '<div class="span12 wrap1">';
				html += '<div style="width : 90%; margin : 2% 5%;">';
				html += '<div class="b-t-description">';
				html += '<span>No Posts match your search criteria.</span>';
				html += '</div></div></div>';
			}
			
			if (postID) {
				html += '<br /><div align="center"><a href="index.html"><button type="button" class="btn btn-success">Back</button></a></div>';
			}
			
			$("#wpContent").append( html );
		});
		
		$(document).on('click', '.more-link', function(e) {
			e.preventDefault();
			var link = $(this).attr('href');
			var pos1 = link.indexOf('?');
			var pos2 = link.indexOf('#');
			var id = link.substring((pos1+3), pos2);
			window.location.href = "index.html?pid=" + id;
		});
	</script>
