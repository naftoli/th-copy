		var id = 77;
		
		if (id > 0) {
			$("#wpContent").empty();
			$.post('ajax/getWinners.php', { raffle : id }, function( success ) {
				var posts = $.parseJSON( success );
				var boys = posts.boys;
				var girls = posts.girls;
				
				var html = '<div class="span12 wrap1">';
				html += '<div class="heDate">' + posts.raffle + '</div><div class="date"></div>';
				html += '<div class="mazalTov">!מזל טוב</div>';
				html += '<div style="width : 90%; margin : 2% 5%;">';
				html += '<div style="float: left; width: 48%;">';
				html += '<div class="b-t-title"><span>Boys</span></div>';
				
				if (boys.length) {
					for (var p in boys) {					
						html += '<div class="b-t-description">';
						html += '<span style="line-height: 1">' + boys[p]['rank'];
						html += '<br />' + boys[p]['name'] + '</span>';
						html += '</div>';
						html += '<div>' + boys[p]['school'] + '</div>';
						html += '<div style="font-size: 11px; color: red">Prize: ' + boys[p]['prize'] + '</div><br />';
					}
				}
				html += '</div>';
				
				html += '<div style="float: right; width: 48%;">';
				html += '<div class="b-t-title"><span>Girls</span></div>';
				if (girls.length) {
					for (var p in girls) {					
						html += '<div class="b-t-description">';
						html += '<span style="line-height: 1">' + girls[p]['rank'];
						html += '<br />' + girls[p]['name'] + '</span>';
						html += '</div>';
						html += '<div>' + girls[p]['school'] + '</div>';
						html += '<div style="font-size: 11px; color: red">Prize: ' + girls[p]['prize'] + '</div><br />';
					}
				}
				html += '</div></div></div><div style="clear: both"></div>';
				
				$("#wpContent").append( html );
			});
		}
