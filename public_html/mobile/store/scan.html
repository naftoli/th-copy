    <script src="/mobile/js/authenticate.js" defer></script>
    <script>
        document.addEventListener("DOMContentLoaded", function(event) {
	        var url = location.href.toString();
	        var pos = url.indexOf('='); 
	        var user = url.substring(pos+1);
			
			authenticate( user );
            if( localStorage.getItem("login") == "user" ){
                $( "#mainLink" ).attr('href', '/mobile/reg/medals/?id=' + user);
            }
				
			$("#missionsLink").attr('href', '../missionsNew.html?id=' + user);
			$("#goalsLink").attr('href', '../goalsNew.html?id=' + user);
			$("#rankLink").attr('href', '../reg/rank.html?id=' + user);
			$("#storeLink").attr('href', 'index.html?id=' + user);
	        $("#storeMenu").attr('href', 'index.html?id=' + user);
			$("#auctionMenu").attr('href', '../auction/index.html?id=' + user);
	        
	        $.post('../reg/ajax/getPhoto.php', { user_id : user }, function( success ) {
	            var info = $.parseJSON( success );
	            var html = '<a href="../reg/medals/index.html?id=' + user +'">';
	            if (info.mobile_pic) html += '<img id="userImg" src="https://mashpia.com/mobile/reg/' + info.mobile_pic + '">';
	            else if (info.thumb) html += '<img id="userImg" src="https://mashpia.com/thumbs/' + info.thumb + '">';
	            else if (info.photo) html += '<img id="userImg" src="https://mashpia.com/file_view.php?id=' + info.photo + '">';
	            html += '</a>';
	            $(".personalImg").append( html );
				// set the USER ID for bug reports
                $(".bug-report img").data("user_id", user);
	        });
	        
	        $("#scan").click( function() {
	            var card = $("#scanner").val();
	            if (card.length == 20) {
	                $.post('ajax/checkCard.php', { admin : admin, user : user, card : card }, function( success ) {
	                    alert(success);
	                });
	            } else {
	                alert('Card must be 20 digits.');
	            }
	        });
	    });
    </script>
