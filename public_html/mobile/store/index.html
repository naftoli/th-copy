    <script src="/mobile/js/authenticate.js" defer></script>
    <script>
        document.addEventListener("DOMContentLoaded", function(event) {
            var url = location.href.toString();
            var pos = url.indexOf('='); 
            var user = url.substring(pos+1);
    		
    		if (user.indexOf('#') != -1) {
    			// remove anything trailing after user_id
    			var pos2 = (user.indexOf('#'));
    			user = user.substring(0,pos2);
    		}
    		
    		if (user.indexOf('&') != -1) {
    			// remove anything trailing after user_id
    			var pos2 = (user.indexOf('&'));
    			user = user.substring(0,pos2);
    		} 
    		
            authenticate( user );
        
            if( localStorage.getItem("login") == "user" ){
                $( "#mainLink" ).attr('href', '/mobile/reg/medals/?id=' + user);
            }
			
			$("#missionsLink").attr('href', '../missionsNew.html?id=' + user);
			$("#goalsLink").attr('href', '../goalsNew.html?id=' + user);
			$("#rankLink").attr('href', '../reg/rank.html?id=' + user);
			$("#scanMenu").attr('href', '../store/scan.html?id=' + user);
			$("#auctionMenu").attr('href', '../auction/index.html?id=' + user);
	        
	        $.post('../reg/ajax/getPhoto.php', { user_id : user }, function( success ) {
	            var info = $.parseJSON( success );
	            var html = '<a href="../reg/medals/index.html?id=' + user +'">';
	            if (info.mobile_pic) html += '<img onerror="handleProfileError(this)" id="userImg" src="https://mashpia.com/mobile/reg/' + info.mobile_pic + '">';
	            else if (info.thumb) html += '<img onerror="handleProfileError(this)" id="userImg" src="https://mashpia.com/thumbs/' + info.thumb + '">';
	            else if (info.photo) html += '<img onerror="handleProfileError(this)" id="userImg" src="https://mashpia.com/file_view.php?id=' + info.photo + '">';
	            else html += '<img id="userImg" src="/mobile/reg/images/profile-photo-default.jpg">';
				html += '</a>';
	            $(".personalImg").append( html );
				// set the USER ID for bug reports
                $(".bug-report img").data("user_id", user);
	        });
            
            var bal = 0;
            var cart = [];
            var cartQty = 0;
            var totalPrice = 0;
            var originalBal = 0;
            
            $.post('ajax/getBalance.php', { user : user }, function( success ) {
                var info = $.parseJSON(success);
				var html = '<div id="balance-box">';
				html += 	"Available <strong>Store</strong> Miles: <br /><span id='balance'></span><span id='balance-display'></span>";
				html += '</div><div id="data-box">'
				html += 	"Total Miles Earned: " + info.tpoints.toLocaleString( navigator.language ) + "<br />";
                html += 	"Total Miles Earned this Year: " + info.earned.toLocaleString( navigator.language ) + "<br />";
				html += '</div>'
                $(".balance").html(html);
                originalBal = info.available;
                initCart();
                calcBalance();
            });
            
            $.post('ajax/getPrizes.php', { user : user }, function( data ) {
                // var data = $.parseJSON(success);

				var prizes = data.prizes;
				var message = data.message;
                
                if ( prizes.length == 0 ) {
                    $('#no-prizes-message').text( message );
					$('#no-prizes').show();
                }

                var html = '';
                for (var amount in prizes) {
                    html += '<div class="panel panel-default">' +
						'<div class="panel-heading"><i class="glyphicon glyphicon-chevron-right"></i>' +  parseInt( amount, 10 ).toLocaleString() +  ' Mile Prizes</div>' +
						'<div class="collapse" id="collapse_prize_' + amount + '"><div class="panel-body"><div class="row">';
                    for (var p in prizes[amount]) {
    					var prize = prizes[amount][p];
                        html += '<div class="col-xs-6 col-sm-6 col-md-4 text-center product">\
							<article class="product light">\
								<div class="product-caption">';
                        html += '<figure class="figure-hover-overlay">';
						// show the new label if the prize was edited in the last 30 days
                        if ( new Date( prize.created ).getTime() > new Date().getTime() - (30 * 24 * 60 * 60 * 1000) ) {
							html += '<div class="product-new">new</div> ';
						}
                        html += 	'<!--<div class="product-sale">&nbsp;7% <br> off</div>-->';
							if (prize.image_id != 0) {
								html += '<img class="img-responsive" onerror="handleImageError( this )" src="/v2/imgs/v/w/150/src/' + prize.image_id + '" alt="" title="">';
							} else {
								html += '<img class="img-responsive" src="/v2/images/imgsrepo/default.png" alt="" title="">';
							};
						html += '</figure>\
								<div class="block-name">\
									<a href="#" class="product-name">' + prize.prize_name + '</a>\
									<p class="product-price">' + parseInt( prize.points, 10 ).toLocaleString() + ' Mile' + ( prize.points > 1 ? 's' : '' ) + '</p>\
								</div>\
								<div class="product-cart" id="' +
								prize.prize_id + ':' + prize.points + ':' +	prize.image_id + ':' +
								prize.prize_name + ':' + prize.one_per_user + ':' + prize.prize_count + '">\
									<a href="#"><i class="fa fa-shopping-cart"></i> </a>\
								</div>';
    							if (parseInt(prize.one_per_user) == 1) {
    								html += '<p class="onePerUser">Only one per Soldier</p>';
    							}
								html += '<p class="description clearfix">' + prize.prize_description + '</p>';
								html += '</div>\
								</article>\
							</div>';
                    }
                    
                    html += '</div></div></div></div>';
                }
                $("#main").append(html);
				
                $(".product-cart a").hover(
                    function() {
                        $(this).css('background-color', '#eb2c33');
                        $(this).find('.fa').css('color', '#fff');
                    },
                    function() {
                        $(this).css('background-color', '#fff');
                        $(this).find('.fa').css('color', '#eb2c33');
                    }
                );
            });
			
			var toggle_dropdown = true;

			$(document).on('click', ".panel-heading", function() {
				var c = $(this).parent().attr('class');
				var parent = $(this).parent();
				if (c.indexOf('open') > 0 && toggle_dropdown) {
					parent.removeClass('open');
					parent.find('.collapse').removeClass('in');
					parent.find('.collapse').css({"height": '0px'});
					
					toggle_dropdown = false;
					setTimeout(function(){
						parent.find('.collapse .panel-body').css({"display": "none"});
						toggle_dropdown = true;
					}, 300);
				} else if(toggle_dropdown) {
					parent.addClass('open');
					parent.find('.collapse').addClass('in');
					parent.find('> .collapse .panel-body').css({"display": 'block'});
					parent.find('> .collapse').css({"height": parent.find('.collapse').children()[0].scrollHeight});
					parent.siblings().removeClass('open');
					parent.siblings().find('.collapse').removeClass('in');
					parent.siblings().find('.collapse').css({"height": '0px'});
					
					toggle_dropdown = false;
					setTimeout(function(){
						parent.siblings().find('.collapse .panel-body').css({"display": 'none'});
						toggle_dropdown = true;
					}, 300);
				}
			});

            function initCart() {
				if (!window.localStorage) {
    				// need to update browser so that sessionStorage will work
    				alert("You need to update your browser to the latest version in order for this site to work properly.");
    			} else {
					if (localStorage.getItem('storeCart' + user)) {
						cart = JSON.parse( localStorage.getItem('storeCart' + user) );
						for (var c in cart) {
							var item = cart[c];
							cartQty += item.qty;
							totalPrice += item.qty * item.price;
						}
						$("#cartQty").text(cartQty);
					}
				}
				/*
                if (Cookies.getJSON('cart' + user) != undefined) {
                    cart = Cookies.getJSON('cart' + user);
                    for (var c in cart) {
                        var item = cart[c];
                        cartQty += item.qty;
                        totalPrice += item.qty * item.price;
                    }
                    $("#cartQty").text(cartQty);
                }
                */
            }
            
            function calcBalance() {
                bal = originalBal - totalPrice;
				$('#balance').text( bal );
                $("#balance-display").text(bal.toLocaleString( navigator.language ));
            }
            
            $(document).on('click', '.product-cart', function() {
                // get prize id and add to cart
                var prizeInfo = $(this).attr('id');
                var info = prizeInfo.split(':');
                var id = parseInt(info[0]);
                var price = parseInt(info[1]);
    			var image = info[2];
    			var prizeName = info[3];
    			var onePerUser = parseInt(info[4]);
    			var stock = parseInt(info[5]);
    			var available = stock;
                var found = false;
                
                // see if user has enough points for this
                var curBal = parseInt($("#balance").text());
                if (curBal - price < 0) {
                    alert('You do not have enough points to add this prize.');
                    return false;
                }
                
                for (var c in cart) {
                    var item = cart[c];
                    // see if item exists
                    if (item.prize == id) {
    					found = true;
    					// make sure it's not only one per child
    					if (item.onlyOne == 1) {
    						alert('You can only purchase one of this prize.');
    						return false;
    					}
    					if (item.stock == 0) {
    						alert('Sorry there are no more left in stock.');
    						return false;
    					}
                        item.qty++;
    					item.stock--;
                        totalPrice += item.price;
                        break;
                    }
                }
                
                if (!found) {
    				if (stock > 0) {
    					cart.push({
    					   prize : id,
    					   name : prizeName, 
    					   price : price,
    					   image : image, 
    					   qty : 1,
    					   stock : --stock,
    					   onlyOne : onePerUser,
    					   available : available
    					});
    					totalPrice += price;
    				} else {
    					alert('Sorry there are no more left in stock.');
    					return false;
    				}
                }
                
                cartQty++;
				if (!window.localStorage) {
    				// need to update browser so that sessionStorage will work
    				alert("You need to update your browser to the latest version in order for this feature to work.");
    			} else {
    				localStorage.setItem('storeCart' + user, JSON.stringify( cart ));
    			}
                //Cookies.set('cart' + user, cart);
                $("#cartQty").text(cartQty);
                
                calcBalance();
            });
    		
    		$("#cart-img").click( function() {
    			location.href = "cart.html?id=" + user;
            });
    	});

		function handleImageError( img ) {
			// console.log( img.src );
			if( img.src.indexOf('imgs/v/w/150/src/') > 0 ) {
				img.src = img.src.replace('imgs/v/w/150/src/', 'images/imgsrepo/')
			} else {
				img.src = '/v2/images/imgsrepo/default.png';
			}
		}

		function handleProfileError( img ) {
			img.src = '/mobile/reg/images/profile-photo-default.jpg';
		}
    </script>
