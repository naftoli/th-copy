<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Tzivos Hashem Kiosk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css" integrity="sha384-9gVQ4dYFwwWSjIDZnLEWnxCjeSWFphJiwGPXr1jddIhOegiu1FwO5qRGvFXOdJZ4" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" media="screen" href="css/main.css" />
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <a class="navbar-brand">
            <img src="/mobile/img_new/TH%20Logo-colorful-svg.svg" id="navbar-logo" alt="" height="50" width="50">
        </a>
        <span class="navbar-text navbar-title mx-auto">
            Tzivos Hashem Kiosk
        </span>
    </nav>

    <section class="barcode-scanner">
        <div class="flex">
            <div class="manual" id="manual-scanner">
                <div class="alert alert-warning">
                    <div class="scanner-background">
                        <h2>Enter the digits underneath the barcode on your ID card</h2>

                        <form name="cardForm" id="cardForm">
                            <input type="text" class="form-control" id="scanner" name="scanner" placeholder="ID Card Number" autocomplete="off" autofocus />
                        </form>
                    </div>
                </div>
            </div>
            <div id="barcode_scanner" class="viewport"></div>
        </div>
    </section>
    <div class="clearfix"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.0/umd/popper.min.js" integrity="sha384-cs/chFZiN24E4KMATLdqdvsezGxaGsi4hLGOzlXwp5UZB1LY//20VyM2taTB4QvJ" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/js/bootstrap.min.js" integrity="sha384-uefMccjFJAIv6A+rW+L4AHf99KvxDjWSu1z9VI8SKNVmz4sk7buKt/6v9KI65qnm" crossorigin="anonymous"></script>
    <script src="lib/quagga.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
