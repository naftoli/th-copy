    <script src="js/jquery-2.1.0.min.js"></script>

    <script>
    	var admin = Cookies.get('admin');
    	if (!admin) {
    		window.location = "/mobile";
    	}
    	
    	var opts = {
			  lines: 10 // The number of lines to draw
			, length: 26 // The length of each line
			, width: 12 // The line thickness
			, radius: 26 // The radius of the inner circle
			, scale: 1 // Scales overall size of the spinner
			, corners: 1 // Corner roundness (0..1)
			, color: 'grey' // #rgb or #rrggbb or array of colors
			, opacity: 0.25 // Opacity of the lines
			, rotate: 0 // The rotation offset
			, direction: 1 // 1: clockwise, -1: counterclockwise
			, speed: 1 // Rounds per second
			, trail: 60 // Afterglow percentage
			, fps: 20 // Frames per second when using setTimeout() as a fallback for CSS
			, zIndex: 2e9 // The z-index (defaults to 2000000000)
			, className: 'spinner' // The CSS class to assign to the spinner
			, top: '50%' // Top position relative to parent
			, left: '50%' // Left position relative to parent
			, shadow: true // Whether to render a shadow
			, hwaccel: true // Whether to use hardware acceleration
			, position: 'absolute' // Element positioning
		}
		var target = document.getElementById('spinner');
		var spinner = new Spinner(opts).spin(target);
			
		var auction = 70;
		Cookies.set('auction', auction);
		
		var url = location.toString();
		var pos = url.indexOf('='); 
		var id = url.substring( pos+1 ); 
		
		var cart = [];
		initCart();
		//if (Cookies.get('cart' + id) !== undefined) {
		//	cart = Cookies.getJSON('cart' + id);
		//} else {
		//  initCart();
		//}
        
		var p = id.indexOf('&');
		var cat = 0;
		if (p > 0) {
				var temp = id.substring( p+1 );
				id = id.substring( 0, p );
				
				var tPos = temp.indexOf('=');
				cat = parseInt( temp.substring( tPos+1 ) );
		}
						
		//get user info
		$.post('ajax/getUserInfo.php', { user : id }, function( success ) {
				var user = $.parseJSON( success );
				$(".title").html(user.rank + ' ' + user.name);
		});
		
		/*
		//setup children dropdown
		$.post('ajax/getSiblings.php', { user : id }, function( success ) {
			var siblings = $.parseJSON( success );
			var html = '';
			for (var s in siblings) {
				html += '<li><a href="category2.html?id=' + s + '">' + siblings[s] + '</a></li>';
			}
			if (html != '') {
				$(".children").empty();
				$(".children").append( html);
			} else {
				$(".children").hide();
			}
		});
		*/
		//get user points
		var initPoints;
		$.post('ajax/getUserPoints.php', { user : id, auction : auction }, function( success ) {
				var points = $.parseJSON( success );
				initPoints = Math.floor(points.cur);
				calcPoints();
		});
		
		//figure out number of items in cart
		var numItems = 0;
		for (var i in cart) {
				numItems += cart[i].qty;
		}
		
		//setup menu
		$.post('ajax/menu.php', { auction : auction }, function( success ) {
			var menu = $.parseJSON( success );
			var html = '<li><a onclick="saveCart()" class="no-child"><i class="ion-ios-cart-outline"></i><span class="badge cartNum">' + numItems + '</span>Cart</a></li>';
			for (var m in menu) {
				html += '<li><a onclick="setPrizes(' + menu[m].points + ')" class="no-child">' + menu[m].points + ' Point Prizes<span class="badge">' + menu[m].total + '</span></a></li>'
			}
			$(".menu").append(html);
		});
		
		function setPrizes( cat ) {
			var open = $("#slide-out").css('right');
			if (open == '0px') $("#open-right").trigger('click');
			$("#prizes").empty();
			$.post('ajax/prizes.php', { cat : cat, auction : auction }, function( success ) {
				var prizes = $.parseJSON( success );
				var html = "";
				for (var p in prizes) {
						var image = "http://mashpia.com/file_view.php?id=" + prizes[p].prize_image_id;
						html += '<div id="product1">\
				<div class="product half">\
					<div class="swiper-container slider">\
						<div class="swiper-wrapper">\
							<div class="swiper-slide">\
								<img src=' + image + ' alt="" class="img1">\
							</div>\
							<div class="swiper-slide">\
								<img src=' + image + ' alt="" class="img1">\
							</div>\
						</div>\
					</div>\
					<div class="product-info">\
						<h5 class="m-0"><strong>' + prizes[p].prize_name + '</strong></h5>\
						<p class="m-0">' + prizes[p].prize_points + ' points per ticket</p>\
					</div>\
					<div align="center">\
						<input type="hidden" id="prizeImg" value="' + prizes[p].prize_image_id + '" />\
						<input type="hidden" id="prizePoints" value="' + prizes[p].prize_points + '" />\
							Number of Tickets: <input class="validate" id="qty" size="1" value="1"><br />\
						<a name="' + prizes[p].prize_name + '" id="' + prizes[p].prize_id + '" class="btn-floating btn-large waves-effect waves-light accent-color btn z-depth-1 cartBtn">\
						<i class="ion-ios-cart"></i>\
					</a></div>\
				</div>\
			</div>';
				} 
				$("#prizes").append(html);
				$("#spinner").empty();
			});
		}
	    
		$(function() {
			setPrizes();
		});

		$(document).on('click', '.cartBtn', function( e ) {
			e.preventDefault();
						
			var prize = parseInt($(this).attr('id'));
			var name = $(this).attr('name');
			var qty = parseInt($(this).parent().find('#qty').val());
			var points = parseInt($(this).parent().find('#prizePoints').val());
			var img = $(this).parent().find('#prizeImg').val();
			
			//check if user has enough points
			var left = parseInt($("#pointsLeft").text());
			if (left >= (points * qty)) {
				
				//if already in cart add to qty else add to cart
				var found = false;
				for (var i in cart) {
					if (cart[i].id == prize) {
						found = i;
						break;
					}
				}
				
				if (found !== false) {
					cart[found].qty += qty;
				} else {
					cart.push({
						'id'	: prize,
						'name' 	: name,
						'qty'	: qty, 
						'price'	: points, 
						'pic'	: img
					});
				}
				//Cookies.set('cart' + id, cart);
				Materialize.toast(qty + ' ' + name + ' added to cart', 1500);
				calcPoints();
				
			} else {
				alert('You do not have enough points to do this.');
				return;
			}
		});
		
		function initCart() {
			$.post('ajax/getTickets.php', { auction : auction, id : id }, function( success ) {
				var tickets = $.parseJSON( success );
				if (tickets.length) {
					for (var t in tickets) {
						var ticket = tickets[t];
						cart.push({
							'id' : parseInt(ticket.prize_id),
							'name' : ticket.prize_name,
							'qty' : parseInt(ticket.quantity),
							'price' : parseInt(ticket.prize_points),
							'pic' : ticket.prize_image_id
						});
					}
					//Cookies.set('cart' + id, cart);
					calcPoints();
				}
			});
		}
		
		function calcPoints() {
			var total = 0;
			var items = 0;
			for (var i in cart) {
				total += (cart[i].qty * cart[i].price);
				items += cart[i].qty;
			}
			$("#points").text(initPoints);
			if (initPoints < 1200) $("#desc").html("Please Note: Only points from this year are included - not from previous years<br />");
			$("#pointsLeft").text(initPoints - total);
			$(".cartNum").text(items);
		}
		
		function saveCart() {
			var auction = parseInt(Cookies.get('auction'));
			$.post('ajax/purchaseTickets.php', { 
				auction : auction, 
				user : id, 
				info : cart 
			}, function( success ) {
				if (success == 0) location.href = "checkout2.html?id=" + id;
			});
		}
	</script>
