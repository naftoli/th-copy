	<script src="js/js.cookie.js"></script>
	<script>
        document.addEventListener("DOMContentLoaded", function() {
			var admin = Cookies.get('admin');
			if (!admin) {
				$("#logged-out-footer").css({"display": "block"});
			} else {
				$("#logged-in-footer").css({"display": "block"});
			}
			
			if (Cookies.get('shliach') && admin) {
				var shliach = Cookies.get('shliach');
				if (shliach == 1) {
					$("#logged-in-footer").css({"display": "none"});
					$("#my-shliach-footer").css({"display": "block"});
					//$(".bottomNav").empty();
					//$(".bottomNav").append( html );
				}
			} else if (admin) {
				$.post('ajax/checkMyShliach.php', { admin : admin }, function( isShliach ) {
					Cookies.set('shliach', isShliach ? 1 : 0);
					if (isShliach > 0) {
						$("#logged-in-footer").css({"display": "none"});
						$("#my-shliach-footer").css({"display": "block"});
					}
				});
			}
			
			$.post('ajax/getBirthdays.php', function( success ) {
				var posts = $.parseJSON( success );
				var boys = posts.boys;
				var girls = posts.girls;
				var html = '';
				
				if (boys.length || girls.length) {
					html += '<div class="span12 wrap1">';
					html += '<div class="heDate">' + posts.date + '<br />' + new Date().toDateString() + '</div><div class="date"></div>';
					html += '<div class="mazalTov">!מזל טוב! שנת הצלחה</div>';
					html += '<div style="width : 90%; margin : 2% 5%;">';
					html += '<div style="float: left; width: 48%;">';
					html += '<div class="b-t-title"><span>Boys</span></div>';
					
					if (boys.length) {
						for (var p in boys) {
							html += '<div class="user"><div class="b-t-description">';
							html += '<span><span class="rank">' + boys[p]['rank'];
							html += '</span><br />' + boys[p]['post']['post_title'] + '</span>';
							html += '</div>';
							html += '<div class="school">' + boys[p]['meta']['school'] + '</div>';
							html += '<div style="font-size: 11px; color: #3155a1">Age: ' + boys[p]['meta']['age'] + '</div></div><br />';
						}
					}
					html += '</div>';
					
					html += '<div style="float: right; width: 48%;">';
					html += '<div class="b-t-title"><span>Girls</span></div>';
					if (girls.length) {
						for (var p in girls) {					
							html += '<div class="user"><div class="b-t-description">';
							html += '<span><span class="rank">' + girls[p]['rank'];
							html += '</span><br />' + girls[p]['post']['post_title'] + '</span>';
							html += '</div>';
							html += '<div class="school">' + girls[p]['meta']['school'] + '</div>';
							//html += '<div>' + girls[p]['meta']['user_id'] + '</div>';
							html += '<div style="font-size: 11px; color: #3155a1">Age: ' + girls[p]['meta']['age'] + '</div></div><br />';
						}
					}
					html += '</div></div></div><div style="clear: both"></div>';
				}
				
				$("#wpContent").append( html );
			});
		});
	</script>
