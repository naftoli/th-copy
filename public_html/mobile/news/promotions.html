	<script src="js/js.cookie.js"></script>
	<script>
        document.addEventListener("DOMContentLoaded", function(event) {
			var admin = Cookies.get('admin');
			if (!admin) {
				$("#logged-out-footer").css({"display": "block"});
			} else {
				$("#logged-in-footer").css({"display": "block"});
			}
			
			if (Cookies.get('shliach') && admin) {
				var shliach = Cookies.get('shliach');
				if (shliach == 1) {
					$("#logged-in-footer").css({"display": "none"});
					$("#my-shliach-footer").css({"display": "block"});
					//$(".bottomNav").empty();
					//$(".bottomNav").append( html );
				}
			} else if (admin) {
				$.post('ajax/checkMyShliach.php', { admin : admin }, function( isShliach ) {
					Cookies.set('shliach', isShliach ? 1 : 0);
					if (isShliach > 0) {
						$("#logged-in-footer").css({"display": "none"});
						$("#my-shliach-footer").css({"display": "block"});
					}
				});
			}
			
			$.post('ajax/getPromotions.php', function( success ) {
				var posts = $.parseJSON( success );
				var boys = posts.boys;
				var girls = posts.girls;
				var html = '';
				
				if (boys === undefined && girls === undefined) {
					html += '<div class="span12 wrap1">';
					html += '<div style="width : 90%; margin : 2% 5%;">';
					html += '<div class="heDate">' + posts.date + '<br />' + new Date().toDateString() + '</div><div class="date"></div>';
					html += '<div class="b-t-description">';
					html += '<span><br />There are no promotions today.<br /><br /></span>';
					html += '</div></div></div>';
				
				} else {
					html += '<div class="span12 wrap1">';
					html += '<div class="heDate">' + posts.date + '<br />' + new Date().toDateString() + '</div><div class="date"></div>';
					html += '<div class="mazalTov">!מזל טוב</div>';
					html += '<div style="width : 90%; margin : 2% 5%;">';
					html += '<div style="float: left; width: 48%;">';
					html += '<div class="b-t-title"><span>Boys</span></div>';
				
					if (boys !== undefined && boys.length) {
						for (var p in boys) {								
							html += '<div class="user"><div class="b-t-description">';
							html += '<span>' + boys[p]['name'] + '</span>';
							html += '</div><div class="school">' + boys[p]['school'] + '</div>';
							html += '<div style="color: #3155a1; font-size: 11px;"><span class="promoted">Promoted to:</span>' + boys[p]['rank'] + '</div></div><br />';
						}
					}
					html += '</div>';
					
					html += '<div style="float: right; width: 48%;">';
					html += '<div class="b-t-title"><span>Girls</span></div>';
					if (girls !== undefined && girls.length) {
						for (var p in girls) {					
							html += '<div class="user"><div class="b-t-description">';
							html += '<span>' + girls[p]['name'] + '</span>';
							html += '</div><div class="school">' + girls[p]['school'] + '</div>';
							html += '<div style="color: #3155a1; font-size: 11px;"><span class="promoted">Promoted to:</span>'+ girls[p]['rank'] + '</div></div><br />';
						}
					}
					html += '</div></div></div><div style="clear: both"></div>';
				}
				
				$("#wpContent").append( html );
			});
		});
	</script>
