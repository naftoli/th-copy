    <script>
document.addEventListener("DOMContentLoaded", function(event) {
    var admin = Cookies.get('admin');
    if (!admin) {
        $("#logged-out-footer").css({"display": "block"});
    } else {
        $("#logged-in-footer").css({"display": "block"});
    }
    
    if (Cookies.get('shliach') && admin) {
        var shliach = Cookies.get('shliach');
        if (shliach == 1) {
            $("#logged-in-footer").css({"display": "none"});
            $("#my-shliach-footer").css({"display": "block"});
            //$(".bottomNav").empty();
            //$(".bottomNav").append( html );
        }
    } else if (admin) {
        $.post('ajax/checkMyShliach.php', { admin : admin }, function( isShliach ) {
            Cookies.set('shliach', isShliach ? 1 : 0);
            if (isShliach > 0) {
                $("#logged-in-footer").css({"display": "none"});
                $("#my-shliach-footer").css({"display": "block"});
            }
        });
    }
/*
    $.post('ajax/getRaffles.php', function( success ) {
        var html = '';
        var raffles = $.parseJSON( success );
        html += '<select name="raffles">';
        for (var r in raffles) {
            html += '<option value="' + r + '">' + raffles[r] + '</option>';
        }
        html += '</select><br /><br />';
        html += '<button class="btn btn-success show">Show Winners</button>';
        
        //html = "<span style='font-size: 22px;'>Stay Tuned...</span>";
        $("#raffles").append( html );
        
        $(".show").click( function() {
            var id = $("#raffles select").val();
            window.location.href = 'winners.html?raffle=' + id;
        });
    });

    var url = location.toString();
    var pos = url.indexOf('='); 
    var id = url.substring( pos+1 );
*/
/****************************** LOAD RAFFLE WINNERS ******************************/

    $.getJSON("/raffles/shared/ajax/get_raffle_winners.php?v=2&latest=true", render_raffles); // render the latest raffle...
    $.getJSON("/raffles/shared/ajax/get_raffle_winners.php?v=2", render_raffles); // load up the rest

    function render_raffles(data) {
        var raffles = data;
        
        // define the template object that we will use to render
        var winner_renderer = function(winner, show_image){
            this.winner = winner;
            this.show_image = show_image;
        };
        winner_renderer.prototype.render = function(){
            var w = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
            var pic_src = w > 850 ? this.winner.prize_picture.full : this.winner.prize_picture.thumb ;
            
            var html = '<div class="user winner">';
            if(this.show_image) { html += '<div class="image" style="background-image: url(' + pic_src + ')" alt="picture of prize"></div>'; }
            html += '<div class="b-t-description"> ';
            html += '<span><span class="rank">' + this.winner.rank + '</span><br />' + this.winner.name + '</span> ';
            html += '</div><div> <span class="school">' + this.winner.school + '</span><br/>';
            html += '<span class="grade">Grade: ' + this.winner.grade + '</span></div> ';
            html += '<div style="font-size: 11px; color: #3155a1"> ';
            if(this.show_image) {html += 'Prize: ' + this.winner.prize_name;}
            html += '</div></div><br />';
            return html;
        };
        
        $("#loading-status").text("Rendering raffles...");
        
        var html = '<div class="span12 wrap1">'; // the initial content to render on the page
        
        // render each raffle
        for(var i = 0; i < raffles.length; i++){
            // get the raffle from the array
            var raffle = raffles[i];
            // console.log(raffle);
            var weekly = raffle.raffle_type == "weekly";
            // assemble the frame for the content
            html += '<div class="raffle">';
            html += i > 0 ? '<hr class="style-eight"/>' : '<div class="heDate">Raffle Winners</div>';
            html += '<div class="heDate">' + raffle.raffle_from + " - " + raffle.raffle_to + '</div><div class="date"></div>';
            if (weekly) {
                var prize = raffle.winners.boys[0] ? raffle.winners.boys[0] : raffle.winners.girls[0];
                if (prize !== undefined) {
                    var w = Math.max(document.documentElement.clientWidth, window.innerWidth || 0);
                    var pic_src = w > 850 ? prize.prize_picture.full : prize.prize_picture.thumb ;
                    html += '<div class="weekly-raffle"><p>Prize Won: ' + prize.prize_name + '</p><div class="image" style="background-image: url(\'' + encodeURI(pic_src) + '\')" alt="picture of prize"></div></div>';
                } else {
                    html += '<div class="weekly-raffle"><p>Prize Won: N/A</p></div>';
                }
            }
            html += '<div class="date"></div><div class="mazalTov">!מזל טוב</div>';
            html += '<div style="width : 90%; margin : 2% 5%;">';
            html += '<div style="float: left; width: 48%;">';
            html += '<div class="b-t-title"><span>Boys</span></div>';
            // render the boys
            for (var index = 0; index < raffle.winners.boys.length; index++) {
                html += new winner_renderer(raffle.winners.boys[index], !weekly).render();
            }
            // render the top for the girls
            html += '</div>';
            html += '<div style="float: right; width: 48%;">';
            html += '<div class="b-t-title"><span>Girls</span></div>';

            for (index = 0; index < raffle.winners.girls.length; index++) {
                html += new winner_renderer(raffle.winners.girls[index], !weekly).render();
            }
            
            // close all the divs
            html += '</div></div></div><div style="clear: both"></div>';
        }
        // empty the content and fill it with the new data
        if (raffles.length > 0) { // make sure we actually have data to put here
            html += '<div class="footer-spacing"></div></div>';
            $("#wpContent").empty();
            $("#wpContent").append( html );
        }
    }
});
