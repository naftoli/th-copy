    <body class="page-goals" id="main">
    	<div id="spinner"></div>
		<div id="password-protect">
			<h1>Please enter your password to unlock this feature</h1>
			<form id="password-protect-form">
				<div class="input-group">
					<span class="input-group-addon"><img src="/mobile/img_new/lock-color-gray-sm.png"/></span></span>
					<input id="password" type="password" class="form-control" placeholder="Password" required>
				</div>
				<div class="input-group">
					<label id="remember">
						<input type="checkbox">
						<span id="remember-check"/>
					</label>
					<span> Remember on this device</span>
				</div>
				<span class="btn btn-default" id="go-back">Go back</span>
				<input class="btn btn-default" type="submit" value="Submit"/>
			</form>
		</div>
    </body>

	<script>
        document.addEventListener("DOMContentLoaded", function(event) {
			$( function() {
				var url = location.toString();
				var pos = url.indexOf('id='); 
				var id = url.substring( pos+3 );
				var str = id.split("&")[0];
				var version = id.split("&")[1] ? "&" + id.split("&")[1] : "";
				
				var d = id.indexOf('&');
				if (d > 0) {
					id = id.substring( 0, d );
				}
				
                if (!Cookies.get('kiosk')) {
                    $.post('reg/ajax/checkAuth.php', { user_id : id, admin_id : Cookies.get('admin') }, function( success ) {
                        if (success === "0") {
                            window.location = "/mobile";
                        }
                    });
                } else {
					if (!Cookies.get('user')) {
						location.href = "/mobile/kiosk";
					}
				}
				
				var opts = {
					lines: 8, 		// The number of lines to draw
					length: 26, 	// The length of each line
					width: 12, 		// The line thickness
					radius: 26, 	// The radius of the inner circle
					scale: .75, 		// Scales overall size of the spinner
					corners: 1, 	// Corner roundness (0..1)
					color: '#888', 	// #rgb or #rrggbb or array of colors
					opacity: 0.25, 	// Opacity of the lines
					rotate: 0, 		// The rotation offset
					direction: 1, 	// 1: clockwise-1: counterclockwise
					speed: 1.1, 		// Rounds per second
					trail: 60, 		// Afterglow percentage
					fps: 20, 		// Frames per second when using setTimeout() as a fallback for CSS
					zIndex: 2e9, 	// The z-index (defaults to 2000000000)
					className: 'spinner', // The CSS class to assign to the spinner
					top: '50%', 	// Top position relative to parent
					left: '50%', 	// Left position relative to parent
					shadow: false, 	// Whether to render a shadow
					hwaccel: true, 	// Whether to use hardware acceleration
					position: 'absolute' // Element positioning
				};
				var target = document.getElementById('spinner');
				/*
				var p = 1;
				setTimeout( function() {
					$("#progress").circularloader({
						progressPercent: p++
					});
				}, 500);
				*/
				if (localStorage.getItem("remember_me")) {
					var spinner = new Spinner(opts).spin(target);
                    getGoalsPage();
                } else if(localStorage.getItem("check_pass")) {
				//} else {
					$("#password-protect").css({"display": "flex"});
					$("#go-back").click(function(){window.location="/mobile/missionsNew.html?id="+id;});
					$("#password-protect form").submit(function(event){
						event.preventDefault();
						var pwd = $("#password-protect #password").val();
						$.post("reg/ajax/checkPassword.php", {admin_id: Cookies.get('admin'), pwd: pwd}, function(data){
							if (data === "1") {
                                if ($("#remember input")[0].checked) {
									localStorage.setItem("remember_me", true);
								} // remember if they want us to not ask again
								// show the spinner
								$("#password-protect").css({"display": "none"});
								var target = document.getElementById('spinner');
								var spinner = new Spinner(opts).spin(target);
								// and get the goals page
								getGoalsPage();
                            } else { // incorrect password
								alert("Incorrect Password");
								$("#password-protect #password").val(""); // clear the password form
							}
						});
					});
				} else {
					var spinner = new Spinner(opts).spin(target);
					getGoalsPage();
				}
				// TODO, password protect this
				
				// function to get the goals page
				function getGoalsPage() {
					$.ajax({
						type : "GET",
						url: 'getGoalsPage.php?id=' + str + version, 
						xhrFields: {
							onprogress: function( e ) {
								if (e.lengthComputable) {
									console.log("Loaded " + Number( (e.loaded / e.total * 100)) + "%");
								}
								else {
									console.log("Length not computable.");
								}
							}
						},
						success: function( html ) {
							$("#main").empty();
							$("#main").append( html );
							$("#main").addClass("animated fadeIn");
							
							if (lang == 2) {
								$(".container").addClass('he');
								$(".container").attr('dir', 'rtl');
							}
							
							$("#missionsLink").attr('href', '/mobile/missionsNew.html?id=' + id);
							$("#rankLink").attr('href', '/mobile/reg/rank.html?id=' + id);
							$("#storeLink").attr('href', '/mobile/store/index.html?id=' + id);
							$("#goalsLink").parent().addClass('active');
                            
                            if (Cookies.get('kiosk') && Cookies.get('user')) {
                                // disable account menu item
                                $("#mainLink").attr('href', '');
                            }
				
							$(document).on('click', ".panel-heading", function() {
								var c = $(this).parent().attr('class');
								if (c.indexOf('open') > 0) {
									$(this).parent().removeClass('open');
									$(this).parent().find('.collapse').removeClass('in');
								} else {
									$(this).parent().addClass('open');
									$(this).parent().find('.collapse').addClass('in');
									$(this).parent().siblings().removeClass('open');
									$(this).parent().siblings().find('.collapse').removeClass('in');
								}
							});
							$.post('/mobile/reg/ajax/getPhoto.php', { user_id : id }, function( success ) {
								var info = $.parseJSON( success );
								var html = '<a href="/mobile/reg/medals/index.html?id=' + id +'">';
								if (info.mobile_pic) html += '<img id="userImg" src="https://mashpia.com/mobile/reg/' + info.mobile_pic + '">';
								else if (info.thumb) html += '<img id="userImg" src="https://mashpia.com/thumbs/' + info.thumb + '">';
								else if (info.photo) html += '<img id="userImg" src="https://mashpia.com/file_view.php?id=' + info.photo + '">';
								html += '</a>';
								$(".personalImg").append( html );
							});
						}
					});
                }
				/*
				$.get('getGoalsPage.php?id=' + str, function( html ) {
					$("#main").empty();
					$("#main").append( html );
					$(".panel").click( function() {
						var c = $(this).attr('class');
						if (c.indexOf('open') > 0) {
							$(this).removeClass('open');
							$(this).find('.collapse').removeClass('in');
						} else {
							$(this).addClass('open');
							$(this).find('.collapse').addClass('in');
						}
					});
					$.post('/mobile/reg/ajax/getPhoto.php', { user_id : id }, function( photo ) {
						if (photo) $(".personalImg").append( '<img id="userImg" src="../../../file_view.php?id=' + photo + '">' );
					});
				});
				*/
			});
		});
	</script>
