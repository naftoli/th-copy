<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="manifest" href="manifest.json">
        <link type="text/css" rel="stylesheet" href="https://unpkg.com/buefy/lib/buefy.min.css" />
        <link href="https://use.fontawesome.com/releases/v5.0.6/css/all.css" rel="stylesheet">
        <link href="style.css" rel="stylesheet">
    </head>
    
    <body>
        <div id="app">
            <section class="header">
                <div id="logout">
                    <i class="fas fa-sign-out-alt"></i> Log out
                </div>
                <img src="/chidon/IDcards/chidon_F.png" alt="logo" class="logo" />
                <div class="title">
                    Chidon Walking Groups
                </div>
            </section>
            
            <section id="user-info-box">
                <h2> Welcome <span id="user-name"></span></h2>
            </section>
            
            <section id="dropdown">
                <div class="select is-primary">
                    <select id="timeDropdown"></select>
                </div>
            </section>
            
            <section id="child-list">
                
                <label class="child">
                    <div class="box">
                        <input type="checkbox"/> <span class="checkbox"></span>
                        <span class="name"></span>
                        <div class="info"></div>
                        <div class="clearfix"></div>
                    </div>
                </label>
                
                <label class="child">
                    <div class="box">
                        <input type="checkbox"/> <span class="checkbox"></span>
                        <span class="name"></span>
                        <div class="info"></div>
                        <div class="clearfix"></div>
                    </div>
                </label>
                
            </section>
        </div>
    </body>
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script src="app.js"></script>
    <script>
        $(document).ready(function(){
            app.login();
            app.setupApp();
            
            $("#logout").click(app.logout);
        });
        register_service_worker();
    </script>
</html>
