<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>Untitled Document</title>
<style>
	.box {
		background: #feeed6;
		background: -moz-linear-gradient(top,  #feeed6 0%, #fee9cc 100%);
		background: -webkit-gradient(linear, left top, left bottom, color-stop(0%,#feeed6), color-stop(100%,#fee9cc));
		background: -webkit-linear-gradient(top,  #feeed6 0%,#fee9cc 100%);
		background: -o-linear-gradient(top,  #feeed6 0%,#fee9cc 100%);
		background: -ms-linear-gradient(top,  #feeed6 0%,#fee9cc 100%);
		background: linear-gradient(to bottom,  #feeed6 0%,#fee9cc 100%);
		filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#feeed6', endColorstr='#fee9cc',GradientType=0 );
		border-radius: 4px;
		box-shadow: 0 0 1px #fff, 0 4px 0 #f8dab4, 0 5px 6px rgba(0,0,0,.4);
		margin-bottom: 20px;
	}
	.box .box-header {
		background: #ffe3c0;
		background: -moz-linear-gradient(top,  #ffe3c0 0%, #f5d1a0 100%);
		background: -webkit-gradient(linear, left top, left bottom, color-stop(0%,#ffe3c0), color-stop(100%,#f5d1a0));
		background: -webkit-linear-gradient(top,  #ffe3c0 0%,#f5d1a0 100%);
		background: -o-linear-gradient(top,  #ffe3c0 0%,#f5d1a0 100%);
		background: -ms-linear-gradient(top,  #ffe3c0 0%,#f5d1a0 100%);
		background: linear-gradient(to bottom,  #ffe3c0 0%,#f5d1a0 100%);
		filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#ffe3c0', endColorstr='#f5d1a0',GradientType=0 );
		border-radius: 4px;
		padding: 15px 20px;
		box-shadow: 0 0 1px #fff, 0 4px 0 #f8dab4;
		margin-bottom: 4px;
		text-transform: uppercase;
		color: #ef3f47;
	}
	.box.open .box-header {
		background: #f69a8d;
		background: -moz-linear-gradient(top,  #f69a8d 0%, #f2645c 100%);
		background: -webkit-gradient(linear, left top, left bottom, color-stop(0%,#f69a8d), color-stop(100%,#f2645c));
		background: -webkit-linear-gradient(top,  #f69a8d 0%,#f2645c 100%);
		background: -o-linear-gradient(top,  #f69a8d 0%,#f2645c 100%);
		background: -ms-linear-gradient(top,  #f69a8d 0%,#f2645c 100%);
		background: linear-gradient(to bottom,  #f69a8d 0%,#f2645c 100%);
		filter: progid:DXImageTransform.Microsoft.gradient( startColorstr='#f69a8d', endColorstr='#f2645c',GradientType=0 );
		box-shadow: 0 0 1px #fff, 0 4px 0 #f5928e, 0 5px 6px rgba(0,0,0,.4);
		color: #ffe5c3;
	}
	.box.open .box-content {
		padding: 15px 20px;
	}
</style>
</head>

<body>
	<div class="box">
    	<div class="box-header">My Morning</div>
        <div class="box-content"></div>
    </div>
	<div class="box open">
    	<div class="box-header">My Tefilah</div>
        <div class="box-content">
        	<h3>Task Name</h3>
            <p>Task Detail</p>
        	<h3>Task Name</h3>
            <p>Task Detail</p>
        </div>
    </div>

</body>
</html>
