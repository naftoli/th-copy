<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf8" />
        <script src="jquery-1.8.3.js"></script>
        <script>
            var str = "i went to the store";
            var arr = str.split(" ");
            var newStr = '';
            var last = arr.length - 1;
            for (var a in arr) {
                var temp = arr[a];
                var s = temp[0].toUpperCase();
                newStr += s;
                var other = temp.substring(1);
                newStr += other;
                if (a < last) newStr += ' ';
            }
            alert( newStr );
        </script>
    </head>
    <body>
        
    </body>
</html>
